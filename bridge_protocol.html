<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GY-GY | BRIDGE PROTOCOL 1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --neon: rgba(212, 175, 55, 0.3); }
        
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; display: flex; flex-direction: column; 
        }

        /* ОБЯЗАТЕЛЬНЫЕ АТРИБУТЫ КЛУБА */
        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; }
        .ui-lang { position: fixed; top: 15px; left: 15px; z-index: 1000; font-size: 12px; border: 1px solid var(--gold); padding: 5px 10px; cursor: pointer; }
        .btn-back { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: none; border: 1px solid var(--gold); color: var(--gold); padding: 10px 30px; cursor: pointer; text-transform: uppercase; font-size: 14px; transition: 0.3s; z-index: 1000; }
        .btn-back:hover { background: var(--gold); color: #000; }

        /* ЭКРАН ПОГРУЖЕНИЯ */
        .bridge-container { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 20px; text-align: center; position: relative;
        }

        .quote-vibe { 
            font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; 
            margin-bottom: 40px; opacity: 0; transition: 2s; 
        }

        .matrix-box {
            width: 280px; padding: 20px; border: 1px solid var(--gold);
            background: rgba(212, 175, 55, 0.05); position: relative;
        }

        .status-line { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; height: 15px; }
        
        .progress-wrap { width: 100%; height: 2px; background: rgba(212, 175, 55, 0.2); margin: 15px 0; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }

        .access-btn { 
            display: none; width: 100%; padding: 15px; background: transparent; 
            border: 1px solid var(--gold); color: var(--gold); cursor: pointer;
            font-family: 'Share Tech Mono'; font-weight: bold; text-transform: uppercase;
            margin-top: 20px; animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="ui-lang" onclick="alert('Language Toggle')">RU / EN</div>
    <div class="ui-header-right">GY-GY</div>

    <div class="bridge-container">
        <div id="vibe" class="quote-vibe">«Синхронизация души и кода...»</div>
        
        <div class="matrix-box">
            <div id="status" class="status-line">Инициализация...</div>
            <div class="progress-wrap"><div id="bar" class="progress-bar"></div></div>
            <div id="id-display" style="font-size: 12px; opacity: 0.6;">CHECKING ID...</div>
            <button id="entry-btn" class="access-btn" onclick="location.href='verses.html'">ВОЙТИ В AI ROOM</button>
        </div>
    </div>

    <button class="btn-back" onclick="history.back()">ВЕРНУТЬСЯ В БАР</button>

    <script>
        // Эффект появления цитаты
        setTimeout(() => { document.getElementById('vibe').style.opacity = "1"; }, 500);

        // Симуляция входа в систему
        let p = 0;
        const steps = ["ЗАХВАТ ПОТОКА", "АНАЛИЗ ПЕРСОНЫ", "КВАНТОВЫЙ МОСТ", "ДОСТУП ОТКРЫТ"];
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');
        const btn = document.getElementById('entry-btn');

        const timer = setInterval(() => {
            p += Math.random() * 15;
            if (p >= 100) {
                p = 100;
                clearInterval(timer);
                status.innerText = "READY FOR SYNTHESIS";
                status.style.color = "#fff";
                btn.style.display = "block";
            }
            bar.style.width = p + "%";
            if (p < 95) status.innerText = steps[Math.floor(p / 25)];
        }, 300);
    </script>
</body>
</html>
