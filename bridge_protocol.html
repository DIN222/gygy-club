<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY | BAR & BRIDGE 016</title>
    <style>
        :root { --gold: #d4af37; --neon: #00f2ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

        /* --- ФОНОВЫЕ СЛОИ --- */
        .layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 4s ease-in-out; 
        }
        #horse-bg { z-index: 10; opacity: 1; }
        #server-bg { 
            z-index: 5; opacity: 0; 
            transform: scale(1.1); 
            transition: opacity 5s ease-in-out, transform 10s linear; 
        }

        /* --- ТВОИ КНОПКИ (Оставляем структуру, как ты просил) --- */
        .ui-container {
            position: absolute; z-index: 100; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 20px;
            transition: opacity 1s ease-out;
        }
        .nav-btn {
            background: rgba(0, 0, 0, 0.8); border: 2px solid var(--gold); color: var(--gold);
            padding: 15px 50px; font-size: 18px; cursor: pointer; letter-spacing: 3px;
            text-transform: uppercase; text-align: center; font-weight: bold; transition: 0.3s;
        }
        .nav-btn:hover { box-shadow: 0 0 20px var(--gold); background: var(--gold); color: #000; }
        .ai-btn { border-color: var(--neon); color: var(--neon); }
        .ai-btn:hover { box-shadow: 0 0 20px var(--neon); background: var(--neon); color: #000; }

        /* --- НЕВИДИМАЯ ДВЕРЬ (Триггер для перехода в verses.html) --- */
        #door-trigger {
            position: absolute; z-index: 150; top: 25%; left: 35%; width: 30%; height: 50%;
            cursor: pointer; display: none; /* Ждет своего часа */
        }

        /* Технические классы для анимации */
        .fade-out { opacity: 0 !important; pointer-events: none; }
        .fade-in { opacity: 1 !important; transform: scale(1) !important; }
    </style>
</head>
<body>

    <audio id="bar-sounds" loop src="bar_ambience.mp3"></audio>
    <audio id="bridge-ambient" loop src="bridge_ambient.mp3"></audio>

    <img src="horse_in_bar.jpg" id="horse-bg" class="layer">
    <img src="banana_server_room.jpg" id="server-bg" class="layer">

    <div class="ui-container" id="bar-interface">
        <div class="nav-btn" onclick="location.href='tables.html'">К СТОЛИКАМ</div>
        <div class="nav-btn" onclick="location.href='hall.html'">В ХОЛЛ</div>
        <div class="nav-btn ai-btn" onclick="runAiTransformation()">В АИ РУМ</div>
    </div>

    <div id="door-trigger" onclick="location.href='verses.html'"></div>

    <script>
        // Запуск атмосферы бара при входе
        window.addEventListener('mousedown', () => {
            const barSnd = document.getElementById('bar-sounds');
            if(barSnd.paused) barSnd.play().catch(() => {});
        }, { once: true });

        function runAiTransformation() {
            const horse = document.getElementById('horse-bg');
            const server = document.getElementById('server-bg');
            const ui = document.getElementById('bar-interface');
            const barSnd = document.getElementById('bar-sounds');
            const bridgeSnd = document.getElementById('bridge-ambient');
            const door = document.getElementById('door-trigger');

            // 1. Убираем кнопки и Коня (тают в пустоту)
            ui.classList.add('fade-out');
            horse.classList.add('fade-out');

            // 2. Микшируем звук: Бар тише, Серверная громче
            let fadeBar = setInterval(() => {
                if (barSnd.volume > 0.1) barSnd.volume -= 0.1;
                else { barSnd.pause(); clearInterval(fadeBar); }
            }, 200);

            bridgeSnd.volume = 0;
            bridgeSnd.play();
            let fadeBridge = setInterval(() => {
                if (bridgeSnd.volume < 0.7) bridgeSnd.volume += 0.05;
                else clearInterval(fadeBridge);
            }, 300);

            // 3. Проявляем Серверную из пустоты
            setTimeout(() => {
                server.classList.add('fade-in');
            }, 2000);

            // 4. Когда картинка стала четкой, активируем дверь
            setTimeout(() => {
                door.style.display = 'block';
                console.log("Дверь в AI ROOM активна. Жмите на центр!");
            }, 7500);
        }
    </script>
</body>
</html>
