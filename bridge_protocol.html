
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY | BRIDGE PROTOCOL v2.0</title>
    <style>
        :root { --gold: #d4af37; --neon: #00f2ff; --bg: #000; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg);
            font-family: 'Courier New', monospace; display: flex;
            justify-content: center; align-items: center; color: var(--gold);
        }

        /* --- ЗАДНИЙ ФОН (Новая сверхчеткая картинка) --- */
        .bg-image {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            /* ЭТА СТРОКА СПАСАЕТ ОТ МУТНОСТИ ПРИ РАСТЯГИВАНИИ */
            object-fit: cover; 
            filter: brightness(0.6) contrast(1.1); /* Делаем чуть мрачнее для атмосферы */
            z-index: 1;
        }

        /* --- ИНТЕРФЕЙС ПОВЕРХ КАРТИНКИ --- */
        .protocol-overlay {
            position: relative; z-index: 10;
            text-align: center; background: rgba(0,0,0,0.7);
            padding: 40px; border: 2px solid var(--gold);
            box-shadow: 0 0 30px rgba(212,175,55,0.4);
            cursor: pointer; transition: 0.3s;
        }
        .protocol-overlay:hover {
            box-shadow: 0 0 50px var(--neon);
            border-color: var(--neon);
        }

        .status { font-size: 12px; letter-spacing: 3px; color: var(--neon); text-transform: uppercase; }
        .title { font-size: 32px; font-weight: 900; margin: 15px 0; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .action { font-size: 16px; text-decoration: underline; }

        /* --- АНИМАЦИЯ ПРИ НАЖАТИИ --- */
        @keyframes warp-speed {
            0% { transform: scale(1); filter: blur(0px); opacity: 1; }
            100% { transform: scale(10); filter: blur(20px); opacity: 0; }
        }
        .warp { animation: warp-speed 1.5s ease-out forwards; }
    </style>
</head>
<body>

    <img src="bridge_gateway.jpg" alt="GY-GY GATEWAY" class="bg-image">

    <div class="protocol-overlay" onclick="startWarp()">
        <div class="status">:: STATUS: WAITING_FOR_UPLINK ::</div>
        <div class="title">START BRIDGE<br>PROTOCOL</div>
        <div class="status">v2.0 [ CLOUD_ENABLED ]</div>
    </div>

    <script>
        function startWarp() {
            // Находим картинку и интерфейс
            const img = document.querySelector('.bg-image');
            const overlay = document.querySelector('.protocol-overlay');
            
            // Запускаем анимацию прыжка
            img.classList.add('warp');
            overlay.classList.add('warp');

            // Звуковой эффект (если он есть в папке)
            // const audio = new Audio('jump.mp3'); audio.play();

            // Переход в Ядро через 1.5 секунды
            setTimeout(() => {
                location.href = 'ai_room_core_v8.html'; 
            }, 1500);
        }
    </script>
</body>
</html>
