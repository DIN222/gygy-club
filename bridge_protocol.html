

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | GATEWAY v1.7</title>
    <style>
        :root { --gold: #d4af37; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }

        /* 1. ЖЕСТКИЙ ФОН (Никаких слоев сверху, кроме UI) */
        .full-bg {
            position: absolute; inset: 0;
            background: url('banana_server_room.jpg') center center / cover no-repeat;
            z-index: 1;
            filter: brightness(0.5);
        }

        /* 2. СЛОЙ ИНТЕРФЕЙСА */
        .ui-wrapper {
            position: absolute; inset: 0;
            z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* ШАПКА */
        .nav-top {
            position: absolute; top: 0; width: 100%; padding: 30px 50px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-text { color: var(--gold); font-size: 26px; font-weight: 900; letter-spacing: 5px; }

        /* ЦЕНТРАЛЬНАЯ КНОПКА-НЕВИДИМКА (НА ВСЮ ДВЕРЬ) */
        .portal-gate {
            width: 300px; height: 400px;
            cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border: 1px solid rgba(212,175,55,0.1); /* Едва заметная рамка для теста */
            transition: 1s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .portal-gate:hover { border-color: var(--gold); background: rgba(212,175,55,0.05); }
        .portal-gate:hover .enter-btn { opacity: 1; transform: scale(1.1); }

        .enter-btn {
            color: #fff; font-size: 40px; font-weight: 900;
            letter-spacing: 15px; opacity: 0; transition: 0.5s;
            text-shadow: 0 0 20px var(--gold);
        }

        /* АНИМАЦИЯ ПРЫЖКА v1.7 */
        .jump-v7 { transform: scale(30) !important; opacity: 0 !important; }

        /* НИЖНЯЯ КНОПКА (ЕДИНСТВЕННАЯ) */
        .back-home {
            position: absolute; bottom: 40px;
            background: none; border: 1px solid var(--gold);
            color: var(--gold); padding: 10px 30px; cursor: pointer;
            text-transform: uppercase; font-size: 11px; letter-spacing: 3px;
        }

        /* ВСПЫШКА */
        #fx-flash { position: fixed; inset: 0; background: #fff; opacity: 0; z-index: 1000; pointer-events: none; }
        @keyframes flashEffect { 0% {opacity:0} 15% {opacity:1} 100% {opacity:0} }
    </style>
</head>
<body onclick="startSoundV7()">

    <div id="fx-flash"></div>
    <div class="full-bg"></div>

    <div class="ui-wrapper">
        <div class="nav-top">
            <div class="logo-text">GY-GY v1.7</div>
            <div style="color:var(--gold); border:1px solid; padding:5px 10px; font-size:10px;">SYSTEM: ONLINE</div>
        </div>

        <div class="portal-gate" onclick="goCoreV7()">
            <div class="enter-btn">ENTER</div>
            <div style="color:var(--gold); font-size:9px; margin-top:20px; opacity:0.5; letter-spacing:3px;">[ КЛИКНИ ПО ДВЕРИ ]</div>
        </div>

        <button class="back-home" onclick="location.href='index.html'">Назад в холл</button>
    </div>

    <audio id="bg-snd" loop>
        <source src="bridge_ambient.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-snd');
        let playing = false;

        function startSoundV7() {
            if (!playing) {
                audio.volume = 0.6;
                audio.play();
                playing = true;
            }
        }

        function goCoreV7() {
            document.getElementById('fx-flash').style.animation = "flashEffect 1s forwards";
            document.querySelector('.portal-gate').classList.add('jump-v7');
            audio.volume = 1.0;
            
            setTimeout(() => {
                window.location.href = 'ai_room_core_v8.html';
            }, 1000);
        }
    </script>
</body>
</html>
