<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY | THE TRANSITION 015</title>
    <style>
        :root { --gold: #d4af37; --neon: #00f2ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

        /* --- СЛОИ ВИЗУАЛА --- */
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 4s ease-in-out; }
        #horse-bg { z-index: 10; opacity: 1; }
        #server-bg { z-index: 5; opacity: 0; transform: scale(1.1); transition: opacity 5s ease-in-out, transform 10s linear; }

        /* --- ИНТЕРФЕЙС БАРА (КНОПКИ) --- */
        .ui-overlay {
            position: absolute; z-index: 20; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 20px;
            transition: opacity 1s ease-out;
        }
        .btn {
            background: rgba(0, 0, 0, 0.7); border: 2px solid var(--gold); color: var(--gold);
            padding: 15px 40px; font-size: 18px; cursor: pointer; letter-spacing: 3px;
            text-transform: uppercase; transition: 0.3s; text-align: center;
        }
        .btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }
        .btn.active-neon:hover { border-color: var(--neon); color: var(--neon); box-shadow: 0 0 20px var(--neon); }

        /* --- ЗОНА ДВЕРИ (ПОЯВИТСЯ В КОНЦЕ) --- */
        #door-trigger {
            position: absolute; z-index: 30; top: 30%; left: 35%; width: 30%; height: 50%;
            cursor: pointer; display: none; /* Скрыта до проявления серверной */
        }

        /* Состояния анимации */
        .hidden { opacity: 0 !important; pointer-events: none; }
        .visible { opacity: 1 !important; transform: scale(1) !important; }
    </style>
</head>
<body>

    <audio id="bar-sounds" loop src="bar_ambience.mp3"></audio> <audio id="bridge-ambient" loop src="bridge_ambient.mp3"></audio> <img src="horse_in_bar.jpg" id="horse-bg" class="layer">
    <img src="banana_server_room.jpg" id="server-bg" class="layer">

    <div class="ui-overlay" id="bar-ui">
        <div class="btn" onclick="alert('Barmen is busy')">DRINK</div>
        <div class="btn active-neon" onclick="startAiTransition()">AI ROOM</div>
        <div class="btn" onclick="history.back()">EXIT</div>
    </div>

    <div id="door-trigger" onclick="enterAiRoom()"></div>

    <script>
        // Запуск звуков бара при первом взаимодействии
        window.addEventListener('click', () => {
            const barAudio = document.getElementById('bar-sounds');
            if (barAudio.paused) barAudio.play();
        }, { once: true });

        function startAiTransition() {
            const ui = document.getElementById('bar-ui');
            const horse = document.getElementById('horse-bg');
            const server = document.getElementById('server-bg');
            const barAudio = document.getElementById('bar-sounds');
            const bridgeAudio = document.getElementById('bridge-ambient');
            const door = document.getElementById('door-trigger');

            // 1. Скрываем кнопки и Коня
            ui.classList.add('hidden');
            horse.classList.add('hidden');

            // 2. Плавно гасим звуки бара и зажигаем эмбиент серверной
            let fadeOutBar = setInterval(() => {
                if (barAudio.volume > 0.1) barAudio.volume -= 0.1;
                else { barAudio.pause(); clearInterval(fadeOutBar); }
            }, 200);

            bridgeAudio.volume = 0;
            bridgeAudio.play();
            let fadeInBridge = setInterval(() => {
                if (bridgeAudio.volume < 0.7) bridgeAudio.volume += 0.05;
                else clearInterval(fadeInBridge);
            }, 300);

            // 3. Проявляем серверную
            setTimeout(() => {
                server.classList.add('visible');
            }, 1500);

            // 4. Когда серверная стала четкой (через 6 сек), включаем триггер двери
            setTimeout(() => {
                door.style.display = 'block';
                console.log("Door is now active");
            }, 6500);
        }

        function enterAiRoom() {
            // Финальный переход в AI ROOM
            window.location.href = 'verses.html';
        }
    </script>
</body>
</html>
