
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | GATEWAY v1.9 [ORIGINAL RATIO]</title>
    <style>
        :root { --gold: #d4af37; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html { 
            width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: 'Courier New', monospace; 
        }

        /* [ФОН] v1.9: Центрируем оригинал без обрезки */
        .viewport {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #000; /* Черные поля по бокам, если экран широкий */
            z-index: 1;
        }

        .original-img {
            height: 100vh; /* Фото всегда по высоте экрана */
            width: auto;
            object-fit: contain;
            filter: brightness(0.7) contrast(1.1);
            transition: 1.5s ease-in-out;
        }

        /* [ИНТЕРФЕЙС] */
        .ui-container {
            position: absolute; inset: 0;
            z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        .header {
            position: absolute; top: 0; width: 100%; padding: 30px;
            display: flex; justify-content: space-between;
        }
        .logo { color: var(--gold); font-size: 22px; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 10px #000; }

        /* [АКТИВНАЯ ЗОНА] Накладываем точно на дверь на картинке */
        .portal-gate {
            width: 30vh; height: 50vh; /* Пропорции под дверь на фото */
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(212,175,55,0); /* Полная прозрачность */
            transition: 0.5s;
        }
        .portal-gate:hover { border: 1px solid rgba(212,175,55,0.3); background: rgba(212,175,55,0.05); }

        .enter-txt {
            color: #fff; font-size: 30px; font-weight: 900; letter-spacing: 15px;
            opacity: 0; transition: 0.4s; text-shadow: 0 0 20px var(--gold);
        }
        .portal-gate:hover .enter-txt { opacity: 1; }

        /* [КНОПКИ] */
        .btn-back {
            position: absolute; bottom: 30px;
            background: none; border: 1px solid var(--gold);
            color: var(--gold); padding: 10px 25px; cursor: pointer;
            font-size: 10px; letter-spacing: 2px;
        }

        /* ЭФФЕКТ ПРЫЖКА */
        .jump-v1-9 { transform: scale(15); opacity: 0; pointer-events: none; }

        #flash { position: fixed; inset: 0; background: #fff; opacity: 0; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body onclick="startSoundV19()">

    <div id="flash"></div>

    <div class="viewport">
        <img src="banana_server_room.jpg" class="original-img" id="gate-img">
    </div>

    <div class="ui-container">
        <div class="header">
            <div class="logo">GY-GY v1.9</div>
            <div style="color:var(--gold); border:1px solid; padding:5px 10px; font-size:10px;">CORE LINK: STANDBY</div>
        </div>

        <div class="portal-gate" onclick="doJump()">
            <div class="enter-txt">ENTER</div>
        </div>

        <button class="btn-back" onclick="location.href='index.html'">НАЗАД В ХОЛЛ</button>
    </div>

    <audio id="amb-snd" loop>
        <source src="bridge_ambient.mp3" type="audio/mpeg">
    </audio>

    <script>
        const snd = document.getElementById('amb-snd');
        let playing = false;

        function startSoundV19() {
            if (!playing) {
                snd.volume = 0.5;
                snd.play();
                playing = true;
            }
        }

        function doJump() {
            document.getElementById('flash').style.animation = "flashKey 1s forwards";
            document.getElementById('gate-img').classList.add('jump-v1-9');
            snd.volume = 1;
            setTimeout(() => { window.location.href = 'ai_room_core_v8.html'; }, 1000);
        }

        const styleSheet = document.createElement('style');
        styleSheet.innerHTML = `@keyframes flashKey { 0% {opacity:0} 15% {opacity:1} 100% {opacity:0} }`;
        document.head.appendChild(styleSheet);
    </script>
</body>
</html>
