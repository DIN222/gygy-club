
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | BRIDGE TO CORE v9</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
        }
        
        #server-bg { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; 
            opacity: 0; 
            transition: opacity 5s ease-in-out; 
        }

        /* Невидимый триггер на весь экран для перехода в Ядро */
        #core-gateway {
            position: absolute; z-index: 100; top: 0; left: 0; 
            width: 100%; height: 100%; cursor: pointer; display: none;
        }
    </style>
</head>
<body onload="initTransition()">

    <audio id="ambient" loop src="bridge_ambient.mp3"></audio>

    <img src="banana_server_room.jpg" id="server-bg">

    <div id="core-gateway" onclick="location.href='ai_room_core_v8.html'"></div>

    <script>
        function initTransition() {
            const bg = document.getElementById('server-bg');
            const audio = document.getElementById('ambient');
            const gateway = document.getElementById('core-gateway');

            // 1. Проявление Серверной из черного экрана (после Бара)
            setTimeout(() => {
                bg.style.opacity = "1";
                
                // Звук Моста
                audio.volume = 0;
                audio.play().catch(() => {});
                let v = 0;
                let fadeIn = setInterval(() => {
                    if (v < 0.6) { v += 0.05; audio.volume = v; }
                    else clearInterval(fadeIn);
                }, 300);
            }, 500);

            // 2. Активация перехода в Ядро v8 через 6-7 секунд
            setTimeout(() => {
                gateway.style.display = "block";
                console.log("Вход в AI ROOM CORE v8 готов.");
            }, 7000);
        }
    </script>
</body>
</html>
