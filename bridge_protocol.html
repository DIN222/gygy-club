
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | BRIDGE PROTOCOL 121</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        
        /* СЛОИ */
        .bg-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 4s ease-in-out; 
        }
        #horse { z-index: 10; opacity: 1; }
        #server { z-index: 5; opacity: 0; }

        /* ИМИТАЦИЯ КНОПОК ИЗ INDEX.HTML */
        #bar-ui {
            position: absolute; z-index: 100; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 15px;
            transition: opacity 2s ease-in-out;
        }

        .btn-gy {
            background: rgba(0,0,0,0.8); border: 2px solid #d4af37; color: #d4af37;
            padding: 15px 50px; cursor: pointer; font-size: 18px; font-weight: bold;
            text-align: center; letter-spacing: 2px; text-transform: uppercase;
        }
        #ai-btn-active { border-color: #00f2ff; color: #00f2ff; box-shadow: 0 0 15px #00f2ff; }

        /* НЕВИДИМАЯ ДВЕРЬ */
        #final-door {
            position: absolute; z-index: 200; top: 0; left: 0; width: 100%; height: 100%;
            cursor: pointer; display: none;
        }
    </style>
</head>
<body onload="autoStartTransition()">

    <audio id="snd-bridge" loop src="bridge_ambient.mp3"></audio>

    <img src="horse_in_bar.jpg" id="horse" class="bg-layer">
    <img src="banana_server_room.jpg" id="server" class="bg-layer">

    <div id="bar-ui">
        <div class="btn-gy">К СТОЛИКАМ</div>
        <div class="btn-gy">В ХОЛЛ</div>
        <div class="btn-gy" id="ai-btn-active">В АИ РУМ</div>
    </div>

    <div id="final-door" onclick="location.href='verses.html'"></div>

    <script>
        function autoStartTransition() {
            const horse = document.getElementById('horse');
            const server = document.getElementById('server');
            const ui = document.getElementById('bar-ui');
            const audio = document.getElementById('snd-bridge');
            const door = document.getElementById('final-door');

            // Небольшая пауза, чтобы пользователь понял, что он "в баре"
            setTimeout(() => {
                // 1. Убираем кнопки и Коня
                ui.style.opacity = '0';
                ui.style.pointerEvents = 'none';
                horse.style.opacity = '0';

                // 2. Звук серверной
                audio.volume = 0.5;
                audio.play().catch(() => console.log("Кликни для звука"));

                // 3. Проявляем серверную через 2 секунды из пустоты
                setTimeout(() => {
                    server.style.opacity = '1';
                }, 2000);

                // 4. Включаем невидимую дверь в конце
                setTimeout(() => {
                    door.style.display = 'block';
                }, 7000);
            }, 500); 
        }
    </script>
</body>
</html>
