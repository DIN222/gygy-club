
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY | AMBIENT CORE 11</title>
    <style>
        :root { --gold: #d4af37; --neon: #00f2ff; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Courier New', monospace;
        }

        /* --- СТАНДАРТНЫЕ АТРИБУТЫ КЛУБА --- */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 900; color: var(--gold); letter-spacing: 5px; }
        .back-btn { cursor: pointer; color: var(--neon); font-size: 12px; text-transform: uppercase; }

        /* --- ФОНОВАЯ КАРТИНКА --- */
        .bg-image {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: transform 1.5s ease-in, filter 1.5s;
        }

        /* --- НЕВИДИМЫЙ СКРЫТЫЙ ПЕРЕХОД --- */
        .invisible-gateway {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }

        /* Эффект гиперпрыжка */
        .warp { transform: scale(10); filter: blur(30px) brightness(3); opacity: 0; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="back-btn" onclick="history.back()">[ BACK ]</div>
        <div class="logo">GY-GY</div>
        <div style="width: 50px;"></div> </header>

    <img src="banana_server_room.jpg" alt="Server Core" class="bg-image" id="mainBg">

    <div class="invisible-gateway" onclick="activateCore()"></div>

    <audio id="ambient" loop src="bridge_ambient.mp3"></audio>

    <script>
        let isActivated = false;

        function activateCore() {
            const ambient = document.getElementById('ambient');
            const bg = document.getElementById('mainBg');

            if (!isActivated) {
                // 1. Включаем фоновый эмбиент при первом клике
                ambient.volume = 0.4;
                ambient.play().catch(e => console.log("Audio waiting for interaction"));
                
                // 2. Запускаем эффект перехода
                bg.classList.add('warp');

                // 3. Если есть звук прыжка — добавляем его
                const warpSound = new Audio('warp_drive.mp3');
                warpSound.play().catch(() => {});

                // 4. Переход в следующую комнату
                setTimeout(() => {
                    window.location.href = 'ai_room_core_v8.html';
                }, 1400);

                isActivated = true;
            }
        }
    </script>
</body>
</html>
