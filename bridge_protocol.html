<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | THE TRANSITION 018</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }

        /* СЛОИ ФОНА */
        .layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 4s ease-in-out; 
        }
        #horse-bg { z-index: 10; opacity: 1; }
        #server-bg { z-index: 5; opacity: 0; transition: opacity 5s ease-in-out; }

        /* ИНТЕРФЕЙС (ТВОИ КНОПКИ) */
        #bar-interface {
            position: absolute; z-index: 100; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 20px;
            transition: opacity 2s ease-in-out; /* Плавное исчезновение кнопок */
        }
        .nav-btn {
            background: rgba(0,0,0,0.8); border: 2px solid #d4af37; color: #d4af37;
            padding: 15px 50px; font-size: 18px; cursor: pointer; text-transform: uppercase;
            font-weight: bold; text-align: center;
        }
        .ai-btn { border-color: #00f2ff; color: #00f2ff; }

        /* ЗОНА ДВЕРИ (ФИНАЛ) */
        #door-trigger {
            position: absolute; z-index: 150; top: 0; left: 0; width: 100%; height: 100%;
            cursor: pointer; display: none;
        }

        /* КЛАССЫ ДЛЯ СКРЫТИЯ */
        .fade-out { opacity: 0 !important; pointer-events: none; }
        .fade-in { opacity: 1 !important; }
    </style>
</head>
<body>

    <audio id="bar-sounds" loop src="bar_ambience.mp3"></audio>
    <audio id="bridge-ambient" loop src="bridge_ambient.mp3"></audio>

    <img src="horse_in_bar.jpg" id="horse-bg" class="layer">
    <img src="banana_server_room.jpg" id="server-bg" class="layer">

    <div id="bar-interface">
        <div class="nav-btn" onclick="location.href='tables.html'">К СТОЛИКАМ</div>
        <div class="nav-btn" onclick="location.href='hall.html'">В ХОЛЛ</div>
        <div class="nav-btn ai-btn" onclick="startTransformation()">В АИ РУМ</div>
    </div>

    <div id="door-trigger" onclick="location.href='verses.html'"></div>

    <script>
        function startTransformation() {
            const horse = document.getElementById('horse-bg');
            const server = document.getElementById('server-bg');
            const ui = document.getElementById('bar-interface');
            const barSnd = document.getElementById('bar-sounds');
            const bridgeSnd = document.getElementById('bridge-ambient');
            const door = document.getElementById('door-trigger');

            // 1. ПРИНУДИТЕЛЬНО СКРЫВАЕМ КНОПКИ И КОНЯ
            ui.classList.add('fade-out');
            horse.classList.add('fade-out');

            // 2. ЗВУК: Бар затихает, Серверная нарастает
            if (!barSnd.paused) {
                let fadeBar = setInterval(() => {
                    if (barSnd.volume > 0.1) barSnd.volume -= 0.1;
                    else { barSnd.pause(); clearInterval(fadeBar); }
                }, 200);
            }

            bridgeSnd.volume = 0;
            bridgeSnd.play();
            let fadeBridge = setInterval(() => {
                if (bridgeSnd.volume < 0.9) bridgeSnd.volume += 0.05;
                else clearInterval(fadeBridge);
            }, 300);

            // 3. ПОЯВЛЕНИЕ СЕРВЕРНОЙ ИЗ ПУСТОТЫ (через 2.5 сек)
            setTimeout(() => {
                server.classList.add('fade-in');
            }, 2500);

            // 4. АКТИВАЦИЯ ДВЕРИ (когда картинка проявилась)
            setTimeout(() => {
                door.style.display = 'block';
                console.log("READY TO ENTER");
            }, 8000);
        }

        // Автозапуск шума бара (при первом клике)
        window.addEventListener('mousedown', () => {
            const snd = document.getElementById('bar-sounds');
            if(snd.paused) snd.play();
        }, {once: true});
    </script>
</body>
</html>
