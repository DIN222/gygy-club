<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY | BRIDGE PROTOCOL</title>
    <style>
        :root { --gold: #d4af37; --gold-dim: rgba(212, 175, 55, 0.3); }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .terminal { width: 90%; max-width: 600px; text-align: center; }
        .scan-line { width: 100%; height: 2px; background: var(--gold); opacity: 0.3; position: absolute; top: 0; animation: scan 3s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .status-text { font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
        .loading-bar { width: 100%; height: 4px; border: 1px solid var(--gold); position: relative; margin-bottom: 40px; }
        .progress { width: 0%; height: 100%; background: var(--gold); transition: width 0.4s; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
        .bridge-btn { 
            border: 1px solid var(--gold-dim); padding: 20px; color: var(--gold-dim); 
            text-transform: uppercase; cursor: pointer; transition: 0.3s; text-decoration: none;
        }
        .bridge-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        
        .version { position: fixed; bottom: 20px; font-size: 0.7rem; opacity: 0.4; }
    </style>
</head>
<body>

    <div class="scan-line"></div>

    <div class="terminal">
        <div class="status-text" id="status">Инициализация протокола...</div>
        <div class="loading-bar"><div class="progress" id="bar"></div></div>

        <div class="menu-grid" id="menu" style="display: none;">
            <a href="verses.html" class="bridge-btn">Генератор куплетов</a>
            <a href="clip.html" class="bridge-btn">Студия клипов</a>
            <a href="manifesto.html" class="bridge-btn">Манифест клуба</a>
            <div class="bridge-btn" onclick="history.back()">Вернуться в бар</div>
        </div>
    </div>

    <div class="version">CORE v.4.4.57 | ENCRYPTED LINK</div>

    <script>
        // Имитация подключения к нейросети при входе
        let p = 0;
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');
        const menu = document.getElementById('menu');

        const steps = ["Загрузка ключей...", "Проверка ID...", "Синхронизация с ядром...", "Доступ разрешен"];

        const interval = setInterval(() => {
            p += Math.random() * 25;
            if (p >= 100) {
                p = 100;
                clearInterval(interval);
                status.innerText = "LINK ESTABLISHED";
                menu.style.display = 'grid';
            }
            bar.style.width = p + "%";
            if(p < 90) status.innerText = steps[Math.floor(p/25)];
        }, 400);

        // Слушаем ответы от Оболочки (index.html)
        window.addEventListener('message', (event) => {
            if (event.data.type === 'GY_RESULT') {
                // Если мы на этой странице что-то генерируем, обрабатываем здесь
                console.log("Получены данные от ядра:", event.data.text);
            }
        });
    </script>
</body>
</html>
