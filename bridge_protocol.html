
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | CORE TRANSITION 119</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* СЛОИ */
        .layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 4s ease-in-out; 
        }
        #horse-bg { z-index: 10; opacity: 1; }
        #server-bg { z-index: 5; opacity: 0; transition: opacity 5s ease-in-out; }

        /* ИНТЕРФЕЙС */
        #bar-ui-box {
            position: absolute; z-index: 100; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 20px;
            transition: opacity 2s ease-in-out;
        }
        .btn {
            background: rgba(0,0,0,0.8); border: 2px solid #d4af37; color: #d4af37;
            padding: 15px 50px; font-size: 18px; cursor: pointer; text-transform: uppercase;
            font-weight: bold; text-align: center; letter-spacing: 2px;
        }
        .btn-ai { border-color: #00f2ff; color: #00f2ff; }

        /* ДВЕРЬ (ФИНАЛ) */
        #final-door {
            position: absolute; z-index: 150; top: 0; left: 0; width: 100%; height: 100%;
            cursor: pointer; display: none;
        }
    </style>
</head>
<body>

    <audio id="snd-bar" loop src="bar_ambience.mp3"></audio>
    <audio id="snd-bridge" loop src="bridge_ambient.mp3"></audio>

    <img src="horse_in_bar.jpg" id="horse-bg" class="layer">
    <img src="banana_server_room.jpg" id="server-bg" class="layer">

    <div id="bar-ui-box">
        <div class="btn" onclick="location.href='tables.html'">К СТОЛИКАМ</div>
        <div class="btn" onclick="location.href='hall.html'">В ХОЛЛ</div>
        <div class="btn btn-ai" onclick="startMegaTransition()">В АИ РУМ</div>
    </div>

    <div id="final-door" onclick="location.href='verses.html'"></div>

    <script>
        function startMegaTransition() {
            console.log("Протокол запущен!");

            const horse = document.getElementById('horse-bg');
            const server = document.getElementById('server-bg');
            const ui = document.getElementById('bar-ui-box');
            const sBar = document.getElementById('snd-bar');
            const sBridge = document.getElementById('snd-bridge');
            const door = document.getElementById('final-door');

            // 1. ЖЕСТКО СКРЫВАЕМ КНОПКИ И КОНЯ
            ui.style.opacity = '0';
            ui.style.pointerEvents = 'none';
            horse.style.opacity = '0';

            // 2. ЗВУКОВАЯ МАГИЯ
            if (!sBar.paused) {
                let volOut = setInterval(() => {
                    if (sBar.volume > 0.1) sBar.volume -= 0.1;
                    else { sBar.pause(); clearInterval(volOut); }
                }, 200);
            }

            sBridge.volume = 0;
            sBridge.play().catch(e => console.log("Sound error:", e));
            let volIn = setInterval(() => {
                if (sBridge.volume < 0.8) sBridge.volume += 0.1;
                else clearInterval(volIn);
            }, 300);

            // 3. ПРОЯВЛЯЕМ СЕРВЕРНУЮ ЧЕРЕЗ ПАУЗУ (Пустота)
            setTimeout(() => {
                console.log("Серверная проявляется...");
                server.style.opacity = '1';
            }, 2500);

            // 4. ВКЛЮЧАЕМ ДВЕРЬ
            setTimeout(() => {
                door.style.display = 'block';
                console.log("Вход в AI ROOM готов!");
            }, 8000);
        }

        // Фоновый звук бара по первому клику
        window.addEventListener('mousedown', () => {
            const sBar = document.getElementById('snd-bar');
            if(sBar.paused) sBar.play().catch(() => {});
        }, {once: true});
    </script>
</body>
</html>
