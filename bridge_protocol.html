<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | Bridge Protocol Final 1,6</title>
    <style>
        :root { --gold: #d4af37; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        /* ГЛАВНОЕ: ТВОЕ ФОТО СЕРВЕРНОЙ */
        .bridge-bg {
            position: fixed;
            inset: 0;
            /* Убедись, что файл лежит в той же папке */
            background: url('banana_server_room.jpg') center center / cover no-repeat;
            z-index: 1;
            /* Легкое затемнение, чтобы интерфейс читался */
            box-shadow: inset 0 0 200px #000;
        }

        /* ИНТЕРФЕЙС ПОВЕРХ ФОТО */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-ui {
            position: absolute; top: 0; width: 100%; padding: 25px;
            display: flex; justify-content: space-between; box-sizing: border-box;
        }
        .logo { color: var(--gold); font-size: 24px; font-weight: 900; letter-spacing: 5px; }

        /* НЕВИДИМЫЙ, НО КЛИКАБЕЛЬНЫЙ ШЛЮЗ (НА ДВЕРИ) */
        .ai-portal {
            width: 300px;
            height: 300px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .portal-label {
            color: var(--gold);
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 15px;
            opacity: 0;
            transition: 0.5s;
            text-shadow: 0 0 20px #000, 0 0 10px var(--gold);
        }

        .ai-portal:hover .portal-label {
            opacity: 1;
        }

        /* ЭФФЕКТ ПРЫЖКА (ПРОЛЕТ СКВОЗЬ ДВЕРЬ) */
        .jump-active {
            transform: scale(15) !important;
            opacity: 0 !important;
        }

        .btn-exit {
            position: absolute; bottom: 40px;
            background: none; border: 1px solid var(--gold);
            color: var(--gold); padding: 10px 20px; cursor: pointer;
            font-size: 10px; letter-spacing: 2px;
        }

        /* ВСПЫШКА */
        #flash {
            position: fixed; inset: 0; background: #fff; 
            opacity: 0; z-index: 100; pointer-events: none;
        }
        .flash-active { animation: fff 1s ease-out; }
        @keyframes fff { 0% {opacity:0} 10% {opacity:1} 100% {opacity:0} }
    </style>
</head>
<body onclick="startAmbiance()">

    <div id="flash"></div>
    <div class="bridge-bg"></div>

    <div class="ui-layer">
        <div class="header-ui">
            <div class="logo">GY-GY</div>
            <div style="color:var(--gold); border:1px solid; padding:5px;">RU</div>
        </div>

        <div class="ai-portal" onclick="jumpToCore()">
            <div class="portal-label">ENTER</div>
            <div style="color:var(--gold); font-size:10px; margin-top:10px; opacity:0.5;">[ ACCESS POINT ]</div>
        </div>

        <button class="btn-exit" onclick="location.href='index.html'">BACK TO REALITY</button>
    </div>

    <audio id="snd" loop>
        <source src="bridge_ambient.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('snd');
        let audioStarted = false;

        // Запуск музыки при первом клике в любом месте (защита браузера)
        function startAmbiance() {
            if (!audioStarted) {
                audio.volume = 0;
                audio.play();
                let v = 0;
                const fadeIn = setInterval(() => {
                    if (v < 0.6) { v += 0.05; audio.volume = v; }
                    else { clearInterval(fadeIn); }
                }, 100);
                audioStarted = true;
            }
        }

        function jumpToCore() {
            document.getElementById('flash').classList.add('flash-active');
            document.querySelector('.ai-portal').classList.add('jump-active');
            
            // Форсаж звука перед прыжком
            audio.volume = 1;

            setTimeout(() => {
                window.location.href = 'ai_room_core_v8.html';
            }, 1000);
        }

        window.onload = () => {
            document.getElementById('flash').classList.add('flash-active');
        };
    </script>
</body>
</html>
