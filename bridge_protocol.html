
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | Bridge Protocol1.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --gold: #d4af37; }
        body { 
            margin: 0; background: #000; color: var(--gold); 
            font-family: monospace; display: flex; 
            flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; overflow: hidden;
        }

        /* Эффект мерцания ламп */
        .glitch-overlay {
            position: fixed; inset: 0; background: #fff; 
            opacity: 0; z-index: 1000; pointer-events: none;
        }
        .flashing { animation: flashTrigger 1.5s ease-out; }
        @keyframes flashTrigger {
            0% { opacity: 0; } 10% { opacity: 0.8; } 20% { opacity: 0; }
            30% { opacity: 0.9; } 40% { opacity: 0; }
        }

        .bridge-bg {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('server_room.jpg') center/cover;
            filter: blur(10px); animation: clear 3s forwards; z-index: -1;
        }
        @keyframes clear { to { filter: blur(0px); } }

        .ai-portal {
            border: 2px solid var(--gold); padding: 50px;
            text-align: center; cursor: pointer; transition: 0.5s;
            background: rgba(0,0,0,0.9); box-shadow: 0 0 20px rgba(212,175,55,0.2);
        }
        .ai-portal:hover { transform: scale(1.05); box-shadow: 0 0 50px var(--gold); }
    </style>
</head>
<body>

    <div id="flash-layer" class="glitch-overlay"></div>
    <div class="bridge-bg"></div>

    <audio id="snd-server" loop>
        <source src="bridge_ambient.mp3" type="audio/mpeg">
    </audio>

    <div class="ai-portal" onclick="location.href='verses.html'">
        <div style="font-size:60px;">🧠</div>
        <div style="font-size:20px; margin-top:20px; letter-spacing:5px;">ENTER AI ROOM</div>
    </div>

    <button onclick="exitToReality()" style="margin-top:50px; background:none; border:1px solid #444; color:#444; cursor:pointer; padding:10px 20px;">EXIT TO REALITY</button>

    <script>
        window.onload = function() {
            // 1. Блымание светом
            document.getElementById('flash-layer').classList.add('flashing');
            
            // 2. Плавное нарастание гула серверной
            const snd = document.getElementById('snd-server');
            snd.volume = 0;
            snd.play().catch(e => console.log("Нужен клик для звука"));
            
            let v = 0;
            const fadeIn = setInterval(() => {
                if (v < 0.6) { v += 0.05; snd.volume = v; }
                else { clearInterval(fadeIn); }
            }, 200);
        };

        function exitToReality() {
            const snd = document.getElementById('snd-server');
            let v = snd.volume;
            const fadeOut = setInterval(() => {
                if (v > 0.05) { v -= 0.05; snd.volume = v; }
                else { clearInterval(fadeOut); location.href = 'index.html'; }
            }, 50);
        }
    </script>
</body>
</html>
