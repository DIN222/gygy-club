<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; --neon: rgba(138, 43, 226, 0.6); }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; }

        /* UI СЛОИ - СИСТЕМНЫЕ */
        #google_translate_element { position: fixed; top: 10px; left: 10px; z-index: 10000; }
        .ui-header-right { position: fixed; top: 15px; right: 20px; z-index: 10000; font-size: 24px; font-weight: bold; letter-spacing: 3px; pointer-events: none; }
        
        .ui-back-to-bar { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10001;
            background: rgba(0,0,0,0.9); border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 20px; cursor: pointer; display: none; text-transform: uppercase;
        }

        /* БАЗОВЫЙ БЛОК */
        .block { 
            position: absolute; inset: 0; display: none; flex-direction: column; 
            align-items: center; justify-content: center; opacity: 0; 
            transition: opacity 0.6s ease; z-index: 100; pointer-events: none;
        }
        .block.active { display: flex; opacity: 1; pointer-events: auto; z-index: 500; }

        /* ЭЛЕМЕНТЫ */
        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; text-align: center; max-width: 85%; margin-bottom: 25px; }
        .btn-gy { min-width: 260px; padding: 12px; background: none; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: bold; margin: 8px 0; font-family: inherit; }
        .btn-sleep { opacity: 0.2; pointer-events: none; }

        /* ДВЕРЬ - САМЫЙ НИЖНИЙ СЛОЙ ВХОДА */
        #main-door { width: 260px; cursor: pointer; transition: transform 2s ease, opacity 1.5s ease; z-index: 1000; pointer-events: auto; }

        /* КВАДРАТЫ РЕГИСТРАЦИИ */
        .box-final { width: 85px; height: 85px; border: 2px solid var(--gold); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        /* ХОЛЛ И КАРТОЧКА */
        .id-card-hall { width: 220px; padding: 15px; background: #F5F5DC; border-radius: 12px; color: #000; display: flex; flex-direction: column; align-items: center; border: 2px solid var(--gold); }
        .card-row { display: flex; gap: 10px; margin: 10px 0; }
        .card-row .box-final { border-color: #000; width: 75px; height: 75px; }

        /* ЛОКАЦИИ */
        #block-bar { justify-content: flex-end; }
        #block-tables { background: url('lounge.jpg') no-repeat center bottom / contain #000; }
        .lamp-zone { position: absolute; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; background: radial-gradient(circle, var(--neon) 0%, transparent 70%); border: 1px solid var(--violet); transform: translate(-50%, -50%); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-header-right">GY-GY</div>
    <button class="ui-back-to-bar" id="btn-global-back" onclick="portalTransition('block-bar')">Назад в бар</button>

    <audio id="snd-door" preload="auto"><source src="door_open.mp3"></audio>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3"></audio>
    <audio id="snd-khe" preload="auto"><source src="charlie_bar_fx.mp3"></audio>
    <audio id="snd-pour" preload="auto"><source src="pour_whisky.mp3"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" style="max-height: 40vh; margin-bottom: 20px;">
        <button class="btn-gy" onclick="portalTransition('block-identity')">ПОЛУЧИТЬ ID</button>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОХОДИТЕ В ХОЛЛ</button>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text">«Шампанского много не бывает»</div>
        <div id="id-label" style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">#ID-GEN</div>
        
        <div style="display: flex; gap: 15px; margin-bottom: 25px;">
            <div class="box-final" id="qr-box-reg"></div>
            <div class="box-final" id="avatar-box" style="cursor: pointer;" onclick="setAvatar()">
                <img id="ap" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-avatar" style="color:#000; font-size:10px; font-weight:900;">AVATAR</span>
            </div>
            <div class="box-final" style="position: relative;">
                <input type="file" onchange="preview(this)" style="position:absolute; inset:0; opacity:0; z-index:10; cursor:pointer;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-photo" style="color:#000; font-size:10px; font-weight:900;">ФОТО</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="swapButtons('btn-save', 'btn-pass')">СОХРАНИТЬ</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОЙТИ В ХОЛЛ</button>
    </div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity:0.4;"></div>
        <div class="id-card-hall" style="z-index: 10;">
            <div id="h-id" style="font-weight:900; margin-bottom:10px;">#ID</div>
            <div class="card-row">
                <div class="box-final"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="box-final" id="h-qr"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="border-color:#000; color:#000; min-width: 180px;" onclick="swapButtons('btn-confirm', 'btn-enter-bar')">ПОДТВЕРДИТЬ</button>
            <button id="btn-enter-bar" class="btn-gy btn-sleep" style="border-color:#000; color:#000; min-width: 180px;" onclick="portalTransition('block-bar')">ВХОД В БАР</button>
        </div>
    </div>

    <div id="block-bar" class="block">
        <div class="quote-text" style="position:absolute; top:10vh;">«Игого, сейчас начнем!»</div>
        <img src="horse_bar.png" style="height: 70vh; object-fit: contain;">
        <div style="margin-bottom: 5vh; display:flex; gap:10px;">
            <button class="btn-gy" style="min-width:140px;" onclick="portalTransition('block-tables')">СТОЛИКИ</button>
            <button class="btn-gy" style="min-width:140px;" onclick="portalTransition('block-hall')">В ХОЛЛ</button>
        </div>
    </div>

    <div id="block-tables" class="block">
        <div id="table-1" class="lamp-zone" style="bottom: 49%; left: 50%;"></div>
        <div id="table-2" class="lamp-zone" style="bottom: 22%; left: 35%;"></div>
    </div>

    <script>
        let currentID = "";

        function handleDoor() {
            const door = document.getElementById('main-door');
            document.getElementById('snd-door').play();
            
            door.style.transform = "scale(10)";
            door.style.opacity = "0";
            
            // Генерация данных
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            document.getElementById('id-label').innerText = currentID;
            document.getElementById('h-id').innerText = currentID;
            
            // QR коды
            const qrReg = document.getElementById('qr-box-reg');
            const qrHall = document.getElementById('h-qr');
            qrReg.innerHTML = ""; qrHall.innerHTML = "";
            new QRCode(qrReg, { text: currentID, width: 85, height: 85 });
            new QRCode(qrHall, { text: currentID, width: 75, height: 75 });

            setTimeout(() => {
                portalTransition('block-welcome');
                const amb = document.getElementById('snd-ambient');
                amb.volume = 0; amb.play(); fadeAudio(amb, 0.6, 2000);
            }, 1200);
        }

        function portalTransition(nextId) {
            const blocks = document.querySelectorAll('.block');
            const backBtn = document.getElementById('btn-global-back');
            
            blocks.forEach(b => {
                b.classList.remove('active');
                b.style.opacity = "0";
            });

            const next = document.getElementById(nextId);
            next.style.display = "flex";
            
            setTimeout(() => {
                next.classList.add('active');
                next.style.opacity = "1";
                
                // Кнопка назад в баре
                backBtn.style.display = (nextId === 'block-tables') ? 'block' : 'none';
                
                // Спец-звуки бара
                if(nextId === 'block-bar') {
                    setTimeout(() => document.getElementById('snd-khe').play(), 500);
                    setTimeout(() => document.getElementById('snd-pour').play(), 1500);
                }
            }, 50);
        }

        function setAvatar() {
            const seed = Math.floor(Math.random() * 9999);
            const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${seed}`;
            
            // Показываем аватар, гасим фото
            document.getElementById('ap').src = url;
            document.getElementById('ap').style.display = "block";
            document.getElementById('txt-avatar').style.display = "none";
            
            document.getElementById('pp').style.display = "none";
            document.getElementById('txt-photo').style.display = "block";
            
            document.getElementById('h-photo').src = url;
        }

        function preview(i) {
            if(i.files && i.files[0]) {
                const r = new FileReader();
                r.onload = (e) => {
                    document.getElementById('pp').src = e.target.result;
                    document.getElementById('pp').style.display = "block";
                    document.getElementById('txt-photo').style.display = "none";
                    
                    // Гасим аватар
                    document.getElementById('ap').style.display = "none";
                    document.getElementById('txt-avatar').style.display = "block";
                    
                    document.getElementById('h-photo').src = e.target.result;
                };
                r.readAsDataURL(i.files[0]);
            }
        }

        function fadeAudio(audio, target, duration) {
            const start = audio.volume;
            const startTime = Date.now();
            const timer = setInterval(() => {
                const progress = Math.min((Date.now() - startTime) / duration, 1);
                audio.volume = start + (target - start) * progress;
                if (progress === 1) clearInterval(timer);
            }, 50);
        }

        function swapButtons(a, b) {
            document.getElementById(a).classList.add('btn-sleep');
            document.getElementById(b).classList.remove('btn-sleep');
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
