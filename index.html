<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY Club - Entrance</title>
    <style>
        /* Глобальные стили: Золото на черном */
        body {
            background-color: #000;
            color: #D4AF37; /* Gold */
            font-family: 'Playfair Display', serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Универсальные компоненты (Надстройка) */
        .header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            z-index: 100;
        }

        .btn-back { cursor: pointer; font-size: 24px; }
        .logo-group { display: flex; align-items: center; gap: 15px; }
        .avatar-mini { 
            width: 40px; height: 40px; border: 1px solid #D4AF37; 
            background: #fff; border-radius: 5px; display: none; 
        }

        /* Зоны (Сцены) */
        .scene {
            flex-grow: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.5s ease-in-out;
        }

        .active-scene { display: flex; opacity: 1; }

        /* Кнопки */
        .btn-gold {
            border: 2px solid #D4AF37;
            background: transparent;
            color: #D4AF37;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-gold:disabled { opacity: 0.15; cursor: not-allowed; }

        /* Сетка регистрации */
        .reg-grid {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 20px;
            margin: 20px 0;
        }

        .reg-box {
            width: 150px; height: 150px;
            border: 2px solid #D4AF37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .bg-white { background-color: #fff; color: #000; }

        /* Подвал */
        .footer {
            padding: 10px;
            font-size: 12px;
            text-align: center;
            opacity: 0.6;
        }
        .office-trigger { cursor: pointer; } /* Та самая секретная точка */
    </style>
</head>
<body>

    <div class="header">
        <div id="nav-left">
            <span class="btn-back" onclick="goBack()">←</span>
            <span id="lang-panel" style="margin-left: 20px; border: 1px solid #D4AF37; padding: 2px 5px;">RU (Gold)</span>
        </div>
        <div class="logo-group">
            <div id="user-status" class="avatar-mini"></div>
            <div class="logo">GY-GY</div>
        </div>
    </div>

    <div id="scene-door" class="scene active-scene">
        <div onclick="openDoor()" style="cursor: pointer;">
            <img src="door-placeholder.png" alt="Золотая дверь" style="width: 200px;">
            <p>Нажми, чтобы войти</p>
        </div>
    </div>

    <div id="scene-reg" class="scene">
        <h3>РЕГИСТРАЦИЯ</h3>
        <div class="reg-grid">
            <div id="box-id" class="reg-box">ID: ...</div>
            <div id="box-qr" class="reg-box bg-white">QR Код</div>
            <div id="box-photo" class="reg-box bg-white" onclick="selectChoice('photo')">или ФОТО</div>
            <div id="box-avatar" class="reg-box bg-white" onclick="selectChoice('avatar')">или АВАТАР</div>
        </div>
        <button id="btn-save" class="btn-gold" onclick="saveData()">Сохранить</button>
        <button id="btn-to-hall" class="btn-gold" disabled onclick="toHall()">Пройти в Холл</button>
    </div>

    <div id="scene-bar" class="scene">
        <p class="slogan">ЛОШАДЬЮ ХОДИ!</p>
        <img src="bar-horse-placeholder.png" alt="Конь Бармен" style="max-height: 400px;">
        <div>
            <button class="btn-gold" onclick="connector('tables')">К столикам</button>
            <button class="btn-gold" onclick="connector('ai-room')">В AI Room</button>
        </div>
    </div>

    <div class="footer">
        info@gy-gy.club | Правила клуба | <span class="office-trigger" onclick="adminAccess()">.</span>
    </div>

    <script>
        // ЛОГИКА И КОННЕКТОРЫ
        let userHasData = false;

        function openDoor() {
            // Звук щелчка (заглушка)
            console.log("Connector: Door Clicked");
            transition('scene-door', 'scene-reg');
        }

        function selectChoice(type) {
            const photoBox = document.getElementById('box-photo');
            const avatarBox = document.getElementById('box-avatar');
            
            if(type === 'photo') {
                photoBox.innerHTML = "ФОТО ВЫБРАНО";
                avatarBox.innerHTML = "или АВАТАР";
            } else {
                avatarBox.innerHTML = "АВАТАР ВЫБРАН";
                photoBox.innerHTML = "или ФОТО";
            }
        }

        function saveData() {
            document.getElementById('btn-save').disabled = true;
            document.getElementById('btn-to-hall').disabled = false;
            userHasData = true;
            // Здесь фиксируется ID и QR в localStorage
            console.log("Connector: Data Saved to LocalStorage");
        }

        function toHall() {
            document.getElementById('user-status').style.display = 'block';
            transition('scene-reg', 'scene-bar');
            console.log("Sound: Bottle Open + Khehe");
        }

        function transition(from, to) {
            document.getElementById(from).classList.remove('active-scene');
            setTimeout(() => {
                document.getElementById(to).classList.add('active-scene');
            }, 500);
        }

        function adminAccess() {
            alert("Запрос к Офису: Введите ID Управления");
        }

        function connector(dest) {
            console.log("Office Connector: User moving to " + dest);
        }
    </script>
</body>
</html>
