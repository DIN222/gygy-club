<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v5.3.0 | Identity Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --neon: rgba(212, 175, 55, 0.8); }
        body { background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; margin: 0; }

        .ui-logo { position: fixed; top: 20px; width: 100%; text-align: center; font-size: 24px; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); z-index: 5000; }

        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; }
        .block.active { display: flex; }

        /* ИДЕНТИФИКАЦИЯ */
        .identity-grid { display: flex; gap: 10px; margin-bottom: 30px; }
        .box-gold { 
            width: 80px; height: 80px; 
            border: 2px solid var(--gold); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; background: rgba(212, 175, 55, 0.03);
            overflow: hidden;
            transition: 0.3s;
        }
        .box-gold img { width: 100%; height: 100%; object-fit: cover; }
        .box-gold span { font-size: 9px; font-weight: 900; color: var(--gold); text-align: center; pointer-events: none; }

        /* Состояние "Погашено" для контента внутри рамки */
        .content-hidden { display: none !important; }

        .btn-gy { min-width: 250px; padding: 15px; background: none; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; font-family: inherit; font-weight: 900; text-transform: uppercase; margin: 10px 0; transition: 0.3s; }
        #btn-go-bar { display: none; background: var(--gold); color: #000; }

        /* ХОЛЛ */
        .id-card-hall { 
            width: 290px; padding: 25px; background: #F5F5DC; border: 4px solid #3E2723; 
            color: #000; border-radius: 12px; text-align: center;
        }
    </style>
</head>
<body>

    <div class="ui-logo">GY-GY</div>

    <div id="block-entrance" class="block active">
        <img src="door_1.jpg" style="width:280px; cursor:pointer;" onclick="handleDoor()">
    </div>

    <div id="block-identity" class="block">
        <div class="identity-grid">
            <div class="box-gold">
                <span id="id-label">#ID</span>
                <img id="id-flag" src="https://flagcdn.com/w20/gb.png" style="width:20px; height:14px; margin-top:5px; object-fit:contain;">
            </div>
            
            <div class="box-gold" id="qr-reg"></div>
            
            <div class="box-gold" id="frame-photo" onclick="document.getElementById('file-in').click()" style="cursor:pointer;">
                <input type="file" id="file-in" onchange="usePhoto(this)" style="display:none;">
                <img id="pp" class="content-hidden">
                <span id="txt-p">PHOTO</span>
            </div>

            <div class="box-gold" id="frame-avatar" onclick="useAvatar()" style="cursor:pointer;">
                <img id="av" class="content-hidden">
                <span id="txt-a">AVATAR</span>
            </div>
        </div>

        <button id="btn-save" class="btn-gy" onclick="saveProfile()">SAVE PROFILE</button>
        <button id="btn-go-bar" class="btn-gy" onclick="portalTransition('block-hall')">PROCEED TO BAR</button>
    </div>

    <div id="block-hall" class="block">
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:15px; border-bottom: 1px solid #3E2723;">#ID-CARD</div>
            <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
                <div style="width:80px; height:80px; background:#fff; border:1px solid #3E2723; overflow:hidden;">
                    <img id="h-photo" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div id="h-qr" style="width:80px; height:80px; background:#fff; border:1px solid #3E2723;"></div>
            </div>
            <div style="font-weight:900; text-transform:uppercase;">Welcome to GY-GY</div>
        </div>
    </div>

    <script>
        let currentID = `#GY-${Math.floor(100+Math.random()*900)}-${Math.floor(1000+Math.random()*9000)}`;

        function handleDoor() {
            updateVisuals();
            portalTransition('block-identity');
        }

        function updateVisuals() {
            document.getElementById('id-label').innerText = currentID;
            document.getElementById('h-id').innerText = currentID;
            
            // Чистый золотой QR
            const qrContainer = document.getElementById('qr-reg');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: currentID, 
                width: 70, height: 70, 
                colorDark: "#d4af37", 
                colorLight: "rgba(0,0,0,0)" 
            });

            const hQr = document.getElementById('h-qr');
            hQr.innerHTML = "";
            new QRCode(hQr, { text: currentID, width: 80, height: 80, colorDark: "#000000" });
        }

        function usePhoto(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => {
                    // 1. Активируем Фото
                    const imgP = document.getElementById('pp');
                    imgP.src = e.target.result;
                    imgP.classList.remove('content-hidden');
                    document.getElementById('txt-p').classList.add('content-hidden');
                    document.getElementById('h-photo').src = e.target.result;

                    // 2. Гасим Аватар (рамка остается, контент исчезает)
                    document.getElementById('av').classList.add('content-hidden');
                    document.getElementById('txt-a').classList.remove('content-hidden');
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        function useAvatar() {
            const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
            // 1. Активируем Аватар
            const imgA = document.getElementById('av');
            imgA.src = url;
            imgA.classList.remove('content-hidden');
            document.getElementById('txt-a').classList.add('content-hidden');
            document.getElementById('h-photo').src = url;

            // 2. Гасим Фото (рамка остается, контент исчезает)
            document.getElementById('pp').classList.add('content-hidden');
            document.getElementById('txt-p').classList.remove('content-hidden');
        }

        function saveProfile() {
            document.getElementById('btn-save').style.display = "none";
            document.getElementById('btn-go-bar').style.display = "block";
        }

        function portalTransition(id) {
            document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
