
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v5.2.5 | Master Build</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --neon-glow: rgba(212, 175, 55, 0.6); }
        * { -webkit-tap-highlight-color: transparent !important; margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; }

        /* CONSTANT UI: TOP BAR & LANGUAGE */
        .ui-top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; display: flex; justify-content: center; align-items: center; z-index: 10000; pointer-events: none; }
        .ui-logo { font-size: 28px; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon-glow); pointer-events: auto; }
        
        .nav-btn-back { position: fixed; top: 20px; right: 20px; background: none; border: 1.5px solid var(--gold); color: var(--gold); padding: 8px 15px; cursor: pointer; z-index: 10001; transition: 0.3s; }
        .nav-hidden { opacity: 0; pointer-events: none; }

        /* LANGUAGE SELECTOR (TOP LEFT) */
        .lang-gateway { position: fixed; top: 20px; left: 20px; z-index: 20001; display: flex; flex-direction: column; align-items: flex-start; }
        .btn-main-lang { min-width: 100px; padding: 8px 12px; background: rgba(0,0,0,0.9); border: 1.5px solid var(--gold); color: var(--gold); font-family: 'Share Tech Mono'; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .lang-dropdown { position: absolute; top: 110%; left: 0; display: none; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #000; border: 1.5px solid var(--gold); padding: 10px; width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .lang-dropdown.open { display: grid; }
        .btn-sub-lang { background: none; border: 1px solid rgba(212, 175, 55, 0.2); color: var(--gold); padding: 8px 4px; font-size: 11px; cursor: pointer; }
        .lang-hint { margin-top: 5px; font-size: 9px; letter-spacing: 1px; color: var(--gold); opacity: 0.5; text-transform: uppercase; }

        /* BLOCKS */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.5s ease; }
        .block.active { display: flex; opacity: 1; pointer-events: auto; }

        /* VISUAL ELEMENTS */
        .neon-horse { max-height: 40vh; filter: drop-shadow(0 0 25px var(--neon-glow)); margin-bottom: 20px; }
        .welcome-title { font-size: 45px; font-weight: 900; letter-spacing: 10px; margin-bottom: 10px; text-shadow: 0 0 20px var(--gold); }
        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; text-align: center; max-width: 80%; margin-bottom: 30px; }
        
        .btn-row { display: flex; gap: 15px; }
        .btn-gy { min-width: 150px; padding: 15px; background: rgba(0,0,0,0.6); border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; font-family: 'Share Tech Mono'; transition: 0.3s; }
        .btn-gy:active { background: var(--gold); color: #000; }
        .btn-sleep { opacity: 0.2 !important; pointer-events: none !important; }

        /* IDENTITY & HALL */
        .reg-grid { display: flex; gap: 10px; margin-bottom: 25px; }
        .box-white { width: 85px; height: 85px; background: #FFF; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; overflow: hidden; color: #000; font-size: 10px; font-weight: 900; text-align: center; }
        .id-card-hall { width: 260px; padding: 25px; background: #F5F5DC; border: 3px solid #3E2723; color: #000; border-radius: 15px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

        #main-door { width: 300px; cursor: pointer; transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.2s; z-index: 100; }
    </style>
</head>
<body translate="no">

    <div class="lang-gateway">
        <button class="btn-main-lang" onclick="toggleLangMenu()">
            <span id="active-flag">🇬🇧</span> <span id="active-name">EN</span>
        </button>
        <div id="lang-list" class="lang-dropdown">
            <button class="btn-sub-lang" onclick="pickLang('ru', '🇷🇺')">RU</button>
            <button class="btn-sub-lang" onclick="pickLang('ua', '🇺🇦')">UA</button>
            <button class="btn-sub-lang" onclick="pickLang('pl', '🇵🇱')">PL</button>
            <button class="btn-sub-lang" onclick="pickLang('de', '🇩🇪')">DE</button>
            <button class="btn-sub-lang" onclick="pickLang('fr', '🇫🇷')">FR</button>
            <button class="btn-sub-lang" onclick="pickLang('it', '🇮🇹')">IT</button>
            <button class="btn-sub-lang" onclick="pickLang('es', '🇪🇸')">ES</button>
            <button class="btn-sub-lang" onclick="pickLang('cn', '🇨🇳')">CN</button>
            <button class="btn-sub-lang" onclick="pickLang('jp', '🇯🇵')">JP</button>
            <button class="btn-sub-lang" onclick="pickLang('ae', '🇦🇪')">AE</button>
            <button class="btn-sub-lang" onclick="pickLang('br', '🇧🇷')">BR</button>
        </div>
        <div class="lang-hint">↓ Choose Language</div>
    </div>

    <div class="ui-top-bar"><div class="ui-logo">GY-GY</div></div>
    <button id="btn-back" class="nav-btn-back nav-hidden" onclick="goBack()">BACK</button>

    <audio id="snd-door" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block">
        <img src="horse_welcome.png" class="neon-horse">
        <div class="welcome-title" data-i18n="welcome">WELCOME</div>
        <div class="quote-text" data-i18n="quote1">"Every joke has a grain of whiskey"</div>
        <div class="btn-row">
            <button class="btn-gy" onclick="portalTransition('block-identity')" data-i18n="btn_id">GET ID</button>
            <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')" data-i18n="btn_hall">TO HALL</button>
        </div>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text" style="font-size:18px;" data-i18n="quote2">"No such thing as too much champagne"</div>
        <div class="reg-grid">
            <div class="box-white" id="id-label">#ID</div>
            <div class="box-white" id="qr-reg"></div>
            <div class="box-white" onclick="document.getElementById('file-in').click()" style="cursor:pointer;">
                <input type="file" id="file-in" onchange="preview(this)" style="display:none;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-p" data-i18n="photo">PHOTO</span>
            </div>
            <div class="box-white" onclick="genAvatar()" style="cursor:pointer;">
                <img id="av" style="display:none; width:100%; height:100%;">
                <span id="txt-a" data-i18n="avatar">AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" style="min-width:260px;" onclick="saveProfile()" data-i18n="btn_save">SAVE PROFILE</button>
    </div>

    <div id="block-hall" class="block">
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; font-size:17px; margin-bottom:15px;">#ID</div>
            <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
                <div class="box-white"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="box-white" id="h-qr"></div>
            </div>
            <button class="btn-gy" style="color:#000; border-color:#3E2723; width:100%;" onclick="portalTransition('block-bar')" data-i18n="go_bar">ENTER BAR</button>
        </div>
    </div>

<script>
    const langData = {
        en: { welcome: "WELCOME", quote1: '"Every joke has a grain of whiskey"', quote2: '"No such thing as too much champagne"', btn_id: "GET ID", btn_hall: "TO HALL", btn_save: "SAVE PROFILE", photo: "PHOTO", avatar: "AVATAR", go_bar: "ENTER BAR" },
        ru: { welcome: "ДОБРО ПОЖАЛОВАТЬ", quote1: '"В каждой шутке есть доля виски"', quote2: '"Шампанского много не бывает"', btn_id: "ПОЛУЧИТЬ ID", btn_hall: "В ХОЛЛ", btn_save: "СОХРАНИТЬ", photo: "ФОТО", avatar: "АВАТАР", go_bar: "В БАР" },
        ua: { welcome: "ЛАСКАВО ПРОСИМО", quote1: '"У кожному жарті є доля віскі"', quote2: '"Шампанського багато не буває"', btn_id: "ОТРИМАТИ ID", btn_hall: "У ХОЛ", btn_save: "ЗБЕРЕГТИ", photo: "ФОТО", avatar: "АВАТАР", go_bar: "В БАР" },
        pl: { welcome: "WITAMY", quote1: '"W każdym żarcie jest ziarno whiskey"', quote2: '"Szampana nigdy za wiele"', btn_id: "POBIERZ ID", btn_hall: "DO HOLU", btn_save: "ZAPISZ", photo: "FOTO", avatar: "AWATAR", go_bar: "DO BARU" }
    };

    let currentLang = localStorage.getItem('gy_lang') || 'en';
    let currentFlag = localStorage.getItem('gy_flag') || '🇬🇧';
    let currentID = localStorage.getItem('gy_trace') || "";
    let historyStack = ['block-entrance'];

    function toggleLangMenu() { document.getElementById('lang-list').classList.toggle('open'); }

    function pickLang(lang, flag) {
        currentLang = lang; currentFlag = flag;
        localStorage.setItem('gy_lang', lang); localStorage.setItem('gy_flag', flag);
        document.getElementById('active-flag').innerText = flag;
        document.getElementById('active-name').innerText = lang.toUpperCase();
        toggleLangMenu();
        applyStrings();
        if(currentID) updateUI();
    }

    function applyStrings() {
        const s = langData[currentLang] || langData['en'];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if(s[key]) el.innerText = s[key];
        });
    }

    function handleDoor() {
        document.getElementById('snd-door').play();
        const door = document.getElementById('main-door');
        door.style.transform = "scale(6)"; door.style.opacity = "0";
        if(!currentID) {
            currentID = `#GY-${Math.floor(100 + Math.random()*900)}-${Math.floor(1000 + Math.random()*9000)}`;
            localStorage.setItem('gy_trace', currentID);
        }
        updateUI();
        setTimeout(() => { 
            portalTransition('block-welcome');
            document.getElementById('snd-ambient').volume = 0.4; document.getElementById('snd-ambient').play();
        }, 1500);
    }

    function updateUI() {
        const flag = localStorage.getItem('gy_flag') || "🇬🇧";
        document.getElementById('id-label').innerText = currentID;
        document.getElementById('h-id').innerHTML = `${currentID} <span style="font-size:20px">${flag}</span>`;
        setTimeout(() => {
            const q1 = document.getElementById('qr-reg'); const q2 = document.getElementById('h-qr');
            q1.innerHTML = ""; q2.innerHTML = "";
            new QRCode(q1, {text: currentID, width: 85, height: 85});
            new QRCode(q2, {text: currentID, width: 85, height: 85});
        }, 200);
    }

    function portalTransition(nextId) {
        const cur = document.querySelector('.block.active');
        const nxt = document.getElementById(nextId);
        cur.style.opacity = "0";
        setTimeout(() => {
            cur.classList.remove('active'); cur.style.display = "none";
            nxt.style.display = "flex";
            setTimeout(() => { nxt.classList.add('active'); nxt.style.opacity = "1"; updateNav(); }, 50);
        }, 500);
        historyStack.push(nextId);
    }

    function updateNav() {
        const back = document.getElementById('btn-back');
        const cur = document.querySelector('.block.active').id;
        cur === 'block-entrance' ? back.classList.add('nav-hidden') : back.classList.remove('nav-hidden');
    }

    function goBack() {
        if(historyStack.length > 1) {
            historyStack.pop();
            const prev = historyStack[historyStack.length - 1];
            if(prev === 'block-entrance') location.reload(); // Сброс двери
            else portalTransition(prev);
        }
    }

    function preview(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => {
                document.getElementById('pp').src = e.target.result; document.getElementById('pp').style.display = "block";
                document.getElementById('h-photo').src = e.target.result; document.getElementById('txt-p').style.display = "none";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function genAvatar() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('av').src = url; document.getElementById('av').style.display = "block";
        document.getElementById('h-photo').src = url; document.getElementById('txt-a').style.display = "none";
    }

    function saveProfile() {
        document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        portalTransition('block-hall');
    }

    window.onload = () => { 
        applyStrings(); 
        document.getElementById('active-flag').innerText = currentFlag;
        document.getElementById('active-name').innerText = currentLang.toUpperCase();
    };
</script>
</body>
</html>
