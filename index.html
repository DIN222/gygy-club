
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v6.0.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --neon: rgba(212, 175, 55, 0.8); }
        
        * { 
            -webkit-tap-highlight-color: transparent !important; 
            outline: none !important;
            box-sizing: border-box; 
            margin: 0; padding: 0; 
        }

        body { background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; touch-action: manipulation; }

        /* ИНТЕРФЕЙС ПОВЕРХ ВСЕГО */
        .ui-logo { position: fixed; top: 20px; width: 100%; text-align: center; font-size: 24px; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); z-index: 9000; font-weight: 900; pointer-events: none; }
        .lang-panel { position: fixed; top: 25px; right: 20px; z-index: 9000; font-size: 12px; font-weight: 900; color: var(--gold); cursor: pointer; }
        #nav-back { position: fixed; top: 20px; left: 20px; z-index: 9000; border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 10px; font-weight: 900; display: none; text-transform: uppercase; background: #000; cursor: pointer; }

        /* БЛОКИ КОНТЕНТА */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; opacity: 0; transition: opacity 0.4s; z-index: 100; pointer-events: none; }
        .block.active { display: flex; opacity: 1; pointer-events: all; }

        /* КНОПКИ БЕЗ СВЕЧЕНИЯ */
        .btn-skeleton { 
            min-width: 250px; height: 50px; border: 2px solid var(--gold) !important; 
            display: flex; align-items: center; justify-content: center;
            margin: 10px 0; background: transparent !important;
            color: var(--gold) !important; font-weight: 900; text-transform: uppercase;
            cursor: pointer; -webkit-user-select: none; user-select: none;
        }

        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 18px; text-align: center; max-width: 85%; line-height: 1.4; color: var(--gold); margin-bottom: 25px; }

        .hall-frame { border: 1px solid rgba(212, 175, 55, 0.3); width: 90%; max-width: 400px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .bar-zone { border-top: 2px solid var(--gold); width: 90%; max-width: 400px; padding-top: 25px; text-align: center; }
        .box-gold { width: 80px; height: 80px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="ui-logo">GY-GY</div>
    <div class="lang-panel">EN | RU</div>
    <div id="nav-back" onclick="goBack()">← BACK</div>

    <div id="block-entrance" class="block active" style="opacity: 1;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()" style="width: 280px; transition: 1.5s; cursor: pointer;">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">"Every joke has a grain of whiskey"</div>
        <div class="btn-skeleton" onclick="portalTransition('block-identity')">IDENTITY</div>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text">"No such thing as too much champagne"</div>
        <div style="display: flex; gap: 10px; margin-bottom: 30px;">
            <div id="qr-reg" class="box-gold"></div>
            <div class="box-gold" onclick="document.getElementById('file-in').click()" style="background: white; cursor: pointer;">
                <input type="file" id="file-in" style="display:none;" accept="image/*" onchange="previewPhoto(this)">
                <img id="pp" style="width:100%; height:100%; object-fit:cover; display:none;">
                <span id="pl" style="color:black; font-size:10px; font-weight:900;">PHOTO</span>
            </div>
        </div>
        <div id="action-btn" class="btn-skeleton" onclick="saveLogic()">SAVE PROFILE</div>
    </div>

    <div id="block-hall-bar" class="block">
        <div class="hall-frame">
            <div id="h-id" style="font-size: 16px; letter-spacing: 2px; color: white;">#GY-000-0000</div>
            <p style="font-size: 9px; margin-top: 5px;">STATUS: ELITE JOKER</p>
        </div>
        <div class="bar-zone">
            <div class="quote-text" style="font-size: 16px;">"Alcohol: because no great story started with a salad"</div>
            <div class="btn-skeleton" onclick="alert('🥃 Подано!')">ORDER WHISKEY</div>
            <div class="btn-skeleton" onclick="alert('Заходит скелет в бар...')">RANDOM JOKE</div>
        </div>
    </div>

    <script>
        let currentID = `#GY-${Math.floor(100+Math.random()*900)}-${Math.floor(1000+Math.random()*9000)}`;
        let historyStack = ['block-entrance'];
        let isSaved = false;

        function handleDoor() {
            const door = document.getElementById('main-door');
            door.style.transform = "scale(5)";
            door.style.opacity = "0";
            
            document.getElementById('h-id').innerText = currentID;
            const qrBox = document.getElementById('qr-reg');
            qrBox.innerHTML = "";
            new QRCode(qrBox, { text: currentID, width: 70, height: 70, colorDark: "#d4af37", colorLight: "rgba(0,0,0,0)" });
            
            setTimeout(() => portalTransition('block-welcome'), 1000);
        }

        function saveLogic() {
            if (!isSaved) {
                isSaved = true;
                document.getElementById('action-btn').innerText = "PROCEED TO THE HALL";
            } else {
                portalTransition('block-hall-bar');
            }
        }

        function previewPhoto(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => {
                    document.getElementById('pp').src = e.target.result;
                    document.getElementById('pp').style.display = "block";
                    document.getElementById('pl').style.display = "none";
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        function portalTransition(id) {
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
                setTimeout(() => { if(!b.classList.contains('active')) b.style.display = "none"; }, 400);
            });
            const next = document.getElementById(id);
            next.style.display = "flex";
            setTimeout(() => next.classList.add('active'), 50);
            
            historyStack.push(id);
            document.getElementById('nav-back').style.display = (id === 'block-entrance') ? 'none' : 'block';
        }

        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop(); // Текущий
                portalTransition(historyStack.pop()); // Предыдущий
            }
        }
    </script>
</body>
</html>
