
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club | THE ULTIMATE EDITION v4.4.80</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { 
            --gold: #d4af37; 
            --gold-glow: rgba(212, 175, 55, 0.5);
            --bg-dark: #0a0a0a;
        }

        /* --- СИСТЕМНЫЙ СЛОЙ (GOOGLE & RESET) --- */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100vh; 
            background: var(--bg-dark); color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; overflow: hidden; 
        }
        .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame, .skiptranslate > iframe { display: none !important; }
        body { top: 0px !important; }

        /* --- UI ЭЛЕМЕНТЫ (ЛОГО, ЯЗЫК) --- */
        #google_translate_element { 
            position: fixed; top: 20px; left: 20px; z-index: 99999; 
            background: rgba(0,0,0,0.85); border: 2px solid var(--gold); 
            padding: 8px; border-radius: 8px; box-shadow: 0 0 15px var(--gold-glow);
        }
        .lang-hint {
            position: fixed; top: 85px; left: 25px; z-index: 99999;
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
            animation: pulse 2s infinite; text-shadow: 0 0 5px #000;
        }
        .ui-logo { 
            position: fixed; top: 20px; right: 30px; z-index: 99999; 
            font-size: 28px; font-weight: 900; letter-spacing: 8px;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        /* --- ГЛАВНЫЕ БЛОКИ --- */
        .page-block { 
            position: absolute; inset: 0; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            background: var(--bg-dark); opacity: 0; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10; padding: 20px;
        }
        .page-block.active { display: flex; opacity: 1; }

        /* --- КНОПКИ --- */
        .btn-gy { 
            min-width: 280px; padding: 18px; background: rgba(20,20,20,0.8); 
            border: 2px solid var(--gold); color: var(--gold); 
            font-family: 'Share Tech Mono'; font-weight: 900; font-size: 16px;
            text-transform: uppercase; cursor: pointer; margin: 10px 0;
            transition: 0.3s; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }
        .btn-gy:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold-glow); }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; filter: grayscale(1); }

        /* --- ПЕРВАЯ СТРАНИЦА: ДВЕРЬ --- */
        .door-container { perspective: 1000px; cursor: pointer; }
        #main-door { 
            width: 280px; height: auto; border-radius: 5px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); transition: transform 0.1s;
        }
        .knock-shake { animation: shakeEffect 0.2s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeEffect { 
            10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-1deg); } 
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(2deg); }
        }

        /* --- РЕГИСТРАЦИЯ (РЕАКТОР) --- */
        .reactor-box {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            background: rgba(212, 175, 55, 0.1); padding: 25px;
            border: 1px solid var(--gold); border-radius: 15px; margin-bottom: 25px;
        }
        .slot { 
            width: 100px; height: 100px; background: #fff; border: 3px solid var(--gold);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; position: relative; color: #000;
        }
        .flag-display { font-size: 45px; line-height: 1; }
        .id-text { font-size: 10px; font-weight: bold; margin-bottom: 5px; }

        /* --- АНИМАЦИИ --- */
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.95); } }
        .quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: 26px; text-align: center; margin-bottom: 30px; line-height: 1.3; }

        /* --- ХОЛЛ И БАР --- */
        .hall-card { 
            background: #F5F5DC; color: #000; padding: 25px; border-radius: 15px;
            border: 4px solid var(--gold); box-shadow: 0 0 40px var(--gold-glow);
            display: flex; flex-direction: column; align-items: center;
        }
    </style>
</head>
<body class="notranslate" oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="lang-hint">← CHOOSE YOUR LANGUAGE</div>
    <div class="ui-logo">GY-GY</div>

    <audio id="snd-knock" preload="auto"><source src="knock.mp3" type="audio/mpeg"></audio>
    <audio id="snd-open" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="p-entrance" class="page-block active" style="opacity: 1;">
        <div class="door-container" onclick="handleKnock()">
            <img src="door_1.jpg" id="main-door" alt="The Door">
        </div>
        <div id="knock-label" style="margin-top: 30px; letter-spacing: 5px; font-size: 18px;">KNOCK 3 TIMES</div>
    </div>

    <div id="p-welcome" class="page-block">
        <div class="quote">«In every joke there is a drop of whiskey»</div>
        <img src="horse_welcome.png" style="max-height: 40vh; filter: drop-shadow(0 0 20px var(--gold-glow));">
        <button id="btn-to-hall" class="btn-gy btn-sleep" onclick="go('p-hall')">Proceed to Hall</button>
        <button class="btn-gy" onclick="go('p-reg')">Get Identity ID</button>
    </div>

    <div id="p-reg" class="page-block">
        <div class="quote" style="font-size: 20px;">SYSTEM IDENTIFICATION</div>
        <div class="reactor-box">
            <div class="slot">
                <span class="id-text">CITIZEN</span>
                <div id="ui-flag" class="flag-display">🇬🇧</div>
            </div>
            <div class="slot" id="ui-qr"></div>
            <div class="slot" style="cursor:pointer" onclick="document.getElementById('f-in').click()">
                <input type="file" id="f-in" hidden onchange="loadImg(this)">
                <img id="ui-pic" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="ui-pic-t" style="font-size:10px; font-weight:bold;">UPLOAD<br>PHOTO</span>
            </div>
            <div class="slot" style="cursor:pointer" onclick="genAv()">
                <img id="ui-av" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="ui-av-t" style="font-size:10px; font-weight:bold; text-align:center;">GENERATE<br>AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="unlock('btn-save','btn-pass')">SAVE & SYNC</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="go('p-hall')">ENTER HALL</button>
    </div>

    <div id="p-hall" class="page-block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity: 0.85; z-index:-1;"></div>
        <div class="hall-card">
            <div id="final-id" style="font-weight:900; margin-bottom:15px; letter-spacing:2px;">#GY-UNKNOWN</div>
            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <div class="slot" style="width:110px; height:110px;"><img id="final-pic" style="width:100%; height:100%; object-fit:cover;"></div>
                <div id="final-qr" class="slot" style="width:110px; height:110px;"></div>
            </div>
            <button id="btn-conf" class="btn-gy" style="border-color:#000; color:#000; min-width:200px;" onclick="unlock('btn-conf','btn-bar')">CONFIRM ID</button>
            <button id="btn-bar" class="btn-gy btn-sleep" style="border-color:#000; color:#000; min-width:200px;" onclick="go('p-bar')">GO TO BAR</button>
        </div>
    </div>

    <div id="p-bar" class="page-block" style="justify-content: flex-end;">
        <div class="quote" style="position:absolute; top:10vh;">«Igogo, the fun begins!»</div>
        <img src="horse_bar.png" style="height: 60vh; width: auto; object-fit: contain;">
        <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px;">
            <div style="display:flex; gap:10px;">
                <button class="btn-gy" style="flex:1; font-size:12px;" onclick="window.location.href='tables.html'">TABLES</button>
                <button class="btn-gy" style="flex:1; font-size:12px;" onclick="window.location.href='ai_room.html'">AI ROOM</button>
            </div>
            <button class="btn-gy" onclick="go('p-hall')">BACK TO HALL</button>
        </div>
    </div>

<script>
    let knockCount = 0;
    let userID = "";

    // 1. ИНИЦИАЛИЗАЦИЯ ЯЗЫКА (EN BY DEFAULT)
    (function setLang() {
        if (!document.cookie.includes('googtrans')) {
            document.cookie = "googtrans=/ru/en; path=/; domain=" + location.hostname;
        }
    })();

    // 2. ФУНКЦИЯ ФЛАГА
    function syncFlag() {
        const cookies = document.cookie.split('; ').find(r => r.startsWith('googtrans='));
        const lang = cookies ? cookies.split('/').pop() : 'en';
        const map = { 'en': '🇬🇧', 'ru': '🇷🇺', 'de': '🇩🇪', 'fr': '🇫🇷', 'es': '🇪🇸', 'zh-CN': '🇨🇳' };
        const flag = map[lang] || '🏳️';
        document.getElementById('ui-flag').innerText = flag;
    }

    // 3. ЛОГИКА СТУКА
    function handleKnock() {
        knockCount++;
        const d = document.getElementById('main-door');
        const l = document.getElementById('knock-label');
        const sk = document.getElementById('snd-knock');
        const so = document.getElementById('snd-open');
        const sa = document.getElementById('snd-ambient');

        d.classList.remove('knock-shake');
        void d.offsetWidth; 
        d.classList.add('knock-shake');

        if (knockCount < 3) {
            sk.currentTime = 0;
            sk.play().catch(()=>{});
            l.innerText = `KNOCK ${3 - knockCount} MORE TIMES`;
        } else {
            so.play().catch(()=>{});
            sa.volume = 0.2; sa.play().catch(()=>{});
            l.innerText = "WELCOME TO GY-GY";
            d.style.transition = "transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1s";
            d.style.transform = "scale(15) translateZ(500px)";
            d.style.opacity = "0";
            
            // Генерируем ID при входе
            if(!userID) {
                userID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
                updateUI();
            }
            setTimeout(() => go('p-welcome'), 1500);
        }
    }

    // 4. НАВИГАЦИЯ
    function go(id) {
        document.querySelectorAll('.page-block').forEach(b => {
            b.classList.remove('active');
            b.style.opacity = "0";
        });
        const next = document.getElementById(id);
        next.style.display = "flex";
        setTimeout(() => { next.classList.add('active'); next.style.opacity = "1"; }, 50);
        syncFlag();
    }

    // 5. РЕГИСТРАЦИЯ И ФОТО
    function updateUI() {
        document.getElementById('final-id').innerText = userID;
        const qrc = { text: userID, width: 100, height: 100, colorDark: "#000", colorLight: "#ffffff" };
        document.getElementById('ui-qr').innerHTML = "";
        new QRCode(document.getElementById("ui-qr"), qrc);
        document.getElementById('final-qr').innerHTML = "";
        new QRCode(document.getElementById("final-qr"), qrc);
    }

    function loadImg(input) {
        const r = new FileReader();
        r.onload = (e) => {
            const res = e.target.result;
            document.getElementById('ui-pic').src = res;
            document.getElementById('ui-pic').style.display = "block";
            document.getElementById('ui-pic-t').style.display = "none";
            document.getElementById('final-pic').src = res;
        };
        r.readAsDataURL(input.files[0]);
    }

    function genAv() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('ui-av').src = url;
        document.getElementById('ui-av').style.display = "block";
        document.getElementById('ui-av-t').style.display = "none";
        document.getElementById('final-pic').src = url;
    }

    function unlock(off, on) {
        document.getElementById(off).classList.add('btn-sleep');
        document.getElementById(on).classList.remove('btn-sleep');
    }

    // ИНИЦИАЛИЗАЦИЯ ВИДЖЕТА
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
        setTimeout(() => {
            const combo = document.querySelector('.goog-te-combo');
            if(combo) combo.addEventListener('change', () => setTimeout(syncFlag, 200));
        }, 1500);
    }

    window.onload = () => {
        const saved = localStorage.getItem('gy_trace');
        if(saved) {
            userID = saved;
            updateUI();
            document.getElementById('btn-to-hall').classList.remove('btn-sleep');
        }
    };
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
