<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY Club v6.1.0 | Final Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; }
        
        /* УБИВАЕМ ПОДСВЕТКУ САМЫМ ПРЯМЫМ СПОСОБОМ */
        * { 
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important; 
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            box-sizing: border-box;
        }

        body { background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* ИНТЕРФЕЙС - ВСЕГДА СВЕРХУ */
        .ui-logo { position: fixed; top: 20px; width: 100%; text-align: center; font-size: 24px; z-index: 9999; pointer-events: none; }
        .lang-panel { position: fixed; top: 25px; right: 20px; z-index: 9999; font-size: 12px; cursor: pointer; border: 1px solid var(--gold); padding: 5px; background: black; }
        #nav-back { position: fixed; top: 20px; left: 20px; z-index: 9999; border: 1px solid var(--gold); padding: 8px 12px; font-size: 10px; display: none; background: black; cursor: pointer; }

        /* БЛОКИ - ТЕПЕРЬ БЕЗ ХИТРЫХ pointer-events */
        .block { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; /* Скрыт полностью */
            flex-direction: column; align-items: center; justify-content: center; 
            background: #000; z-index: 10; padding: 20px;
        }
        
        /* Только активный блок существует для браузера */
        .block.active { display: flex; }

        .btn-skeleton { 
            min-width: 250px; height: 50px; border: 2px solid var(--gold); 
            display: flex; align-items: center; justify-content: center;
            margin: 10px 0; color: var(--gold); font-weight: 900; 
            text-transform: uppercase; cursor: pointer; background: transparent;
        }

        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 18px; text-align: center; color: var(--gold); margin-bottom: 25px; }

        .box-gold { width: 80px; height: 80px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="ui-logo">GY-GY</div>
    <div class="lang-panel">EN | RU</div>
    <div id="nav-back" onclick="goBack()">← BACK</div>

    <div id="block-entrance" class="block active">
        <img src="door_1.jpg" id="main-door" onclick="openDoor()" style="width: 280px; transition: 1.2s; cursor: pointer;">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">"Every joke has a grain of whiskey"</div>
        <div class="btn-skeleton" onclick="goTo('block-identity')">IDENTITY</div>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text">"No such thing as too much champagne"</div>
        <div style="display: flex; gap: 10px; margin-bottom: 30px;">
            <div id="qr-box" class="box-gold"></div>
            <div class="box-gold" onclick="document.getElementById('file-in').click()" style="background: white; cursor: pointer;">
                <input type="file" id="file-in" style="display:none;" accept="image/*" onchange="loadImg(this)">
                <img id="prev" style="width:100%; height:100%; object-fit:cover; display:none;">
                <span id="lab" style="color:black; font-size:10px; font-weight:900;">PHOTO</span>
            </div>
        </div>
        <div id="save-btn" class="btn-skeleton" onclick="handleSave()">SAVE PROFILE</div>
    </div>

    <div id="block-hall-bar" class="block">
        <div style="border: 1px solid var(--gold); padding: 20px; text-align: center; margin-bottom: 20px; width: 90%;">
            <div id="id-show" style="font-size: 16px; color: white;">#GY-000-0000</div>
            <p style="font-size: 9px; margin-top: 5px;">STATUS: ELITE JOKER</p>
        </div>
        <div style="border-top: 2px solid var(--gold); padding-top: 20px; text-align: center; width: 90%;">
            <div class="quote-text" style="font-size: 16px;">"Alcohol: because no great story started with a salad"</div>
            <div class="btn-skeleton" onclick="alert('🥃 Подано!')">ORDER WHISKEY</div>
            <div class="btn-skeleton" onclick="alert('Ха-ха!')">RANDOM JOKE</div>
        </div>
    </div>

    <script>
        let myID = `#GY-${Math.floor(100+Math.random()*900)}-${Math.floor(1000+Math.random()*9000)}`;
        let history = ['block-entrance'];
        let saved = false;

        function openDoor() {
            const d = document.getElementById('main-door');
            d.style.transform = "scale(5)";
            d.style.opacity = "0";
            
            // Сразу готовим данные для следующих этапов
            document.getElementById('id-show').innerText = myID;
            const q = document.getElementById('qr-box');
            q.innerHTML = "";
            new QRCode(q, { text: myID, width: 70, height: 70, colorDark: "#d4af37", colorLight: "rgba(0,0,0,0)" });
            
            setTimeout(() => goTo('block-welcome'), 800);
        }

        function goTo(id) {
            // Прячем ВСЕ блоки физически
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
            });
            // Показываем нужный
            const target = document.getElementById(id);
            target.classList.add('active');
            
            history.push(id);
            document.getElementById('nav-back').style.display = (id === 'block-entrance') ? 'none' : 'block';
        }

        function goBack() {
            if (history.length > 1) {
                history.pop(); // Убрали текущий
                const prevId = history.pop(); // Достали предыдущий
                goTo(prevId);
            }
        }

        function handleSave() {
            if (!saved) {
                saved = true;
                document.getElementById('save-btn').innerText = "PROCEED TO THE HALL";
            } else {
                goTo('block-hall-bar');
            }
        }

        function loadImg(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('prev').src = e.target.result;
                    document.getElementById('prev').style.display = "block";
                    document.getElementById('lab').style.display = "none";
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
