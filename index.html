<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club 7.8.1| Pro Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --black: #000; --paper: #F5F5DC; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; 
        }

        /* 1. Языковая панель */
        .lang-gateway { position: fixed; top: 15px; left: 15px; z-index: 1000; width: 160px; }
        .btn-main-lang { 
            width: 100%; padding: 8px; background: #000; border: 1.5px solid var(--gold); 
            color: var(--gold); cursor: pointer; display: flex; align-items: center; gap: 8px; 
        }
        .lang-dropdown { 
            display: none; flex-direction: column; background: #000; border: 1.5px solid var(--gold); 
            position: absolute; width: 100%; max-height: 300px; overflow-y: auto;
        }
        .lang-dropdown.open { display: flex; }
        .btn-sub-lang { 
            background: none; border: none; color: var(--gold); padding: 10px; 
            text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 12px;
        }
        .flag-icon { width: 20px; border: 0.5px solid var(--gold); }

        /* 2. Блоки (Сцены) */
        .block { 
            position: absolute; inset: 0; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            background: #000; opacity: 0; transition: opacity 0.5s ease;
        }
        .active { display: flex !important; opacity: 1; }

        .btn-gy { 
            min-width: 260px; padding: 15px; background: none; border: 2px solid var(--gold); 
            color: var(--gold); cursor: pointer; margin: 10px; font-family: inherit; font-weight: bold;
        }
        .btn-sleep { opacity: 0.3; pointer-events: none; }

        #main-door { width: 250px; cursor: pointer; transition: transform 1.5s, opacity 1s; }
        
        /* Карточка в Холле */
        .id-card { 
            background: var(--paper); color: #000; padding: 20px; border-radius: 10px; 
            display: flex; flex-direction: column; align-items: center; width: 240px;
        }
        .photo-box { 
            width: 80px; height: 80px; border: 2px solid #000; position: relative; 
            background: #ccc; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .mini-flag { position: absolute; bottom: 2px; right: 2px; width: 16px; border: 0.5px solid #000; }
        
        .rtl { direction: rtl; }
    </style>
</head>
<body>

    <div class="lang-gateway">
        <button class="btn-main-lang" onclick="document.getElementById('lang-list').classList.toggle('open')">
            <img id="cur-flag" src="https://flagcdn.com/w20/gb.png" class="flag-icon">
            <span id="cur-name">ENGLISH</span>
        </button>
        <div id="lang-list" class="lang-dropdown">
            <button class="btn-sub-lang" onclick="pickL('en','gb','ENGLISH')"><img src="https://flagcdn.com/w20/gb.png" class="flag-icon"> ENGLISH</button>
            <button class="btn-sub-lang" onclick="pickL('ru','ru','РУССКИЙ')"><img src="https://flagcdn.com/w20/ru.png" class="flag-icon"> РУССКИЙ</button>
            <button class="btn-sub-lang" onclick="pickL('ua','ua','УКРАЇНСЬКА')"><img src="https://flagcdn.com/w20/ua.png" class="flag-icon"> УКРАЇНСЬКА</button>
            <button class="btn-sub-lang" onclick="pickL('pl','pl','POLSKI')"><img src="https://flagcdn.com/w20/pl.png" class="flag-icon"> POLSKI</button>
            <button class="btn-sub-lang" onclick="pickL('ae','ae','العربية')"><img src="https://flagcdn.com/w20/ae.png" class="flag-icon"> العربية</button>
            </div>
    </div>

    <div id="scr-entry" class="block active">
        <img src="door_1.jpg" id="main-door" onclick="openDoor()" alt="Door">
    </div>

    <div id="scr-welcome" class="block">
        <h2 data-key="q_whiskey">«Every joke has a grain of whiskey»</h2>
        <button class="btn-gy" onclick="go('scr-id')" data-key="btn_get_id">GET ID TOKEN</button>
        <button id="btn-to-hall" class="btn-gy btn-sleep" onclick="go('scr-hall')" data-key="btn_to_hall">TO HALL</button>
    </div>

    <div id="scr-id" class="block">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <div class="photo-box" onclick="generateAvatar()" style="cursor:pointer;">
                <img id="user-photo" style="width:100%; height:100%; object-fit:cover; display:none;">
                <span id="photo-label" style="font-size:10px; color:#000;" data-key="label_avatar">AVATAR</span>
            </div>
            <div id="qr-reg" style="width:80px; height:80px; background:#fff;"></div>
        </div>
        <button class="btn-gy" onclick="saveUser()" data-key="btn_save">SAVE & CONFIRM</button>
    </div>

    <div id="scr-hall" class="block">
        <div class="id-card">
            <div id="display-id" style="font-weight:bold; margin-bottom:10px;">#ID</div>
            <div class="photo-box">
                <img id="hall-photo" style="width:100%; height:100%; object-fit:cover;">
                <img id="hall-flag" src="" class="mini-flag">
            </div>
            <div id="qr-hall" style="margin:10px; background:#fff;"></div>
            <button class="btn-gy" style="color:#000; border-color:#000; min-width:100%;" data-key="btn_enter">ENTER BAR</button>
        </div>
    </div>

<script>
    // 1. 12-ЯЗЫЧНЫЙ ФУНДАМЕНТ (Пример структуры под будущие переводы)
    const langData = {
        en: { flag: 'gb', name: 'ENGLISH', q_whiskey: "«Every joke has a grain of whiskey»", btn_get_id: "GET ID TOKEN", btn_to_hall: "PROCEED TO HALL", btn_save: "SAVE PROFILE", btn_enter: "ENTER BAR", label_avatar: "AVATAR" },
        ru: { flag: 'ru', name: 'РУССКИЙ', q_whiskey: "«В каждой шутке есть доля виски»", btn_get_id: "ПОЛУЧИТЬ ID", btn_to_hall: "ПРОЙТИ В ХОЛЛ", btn_save: "СОХРАНИТЬ", btn_enter: "ВХОД В БАР", label_avatar: "АВАТАР" },
        ua: { flag: 'ua', name: 'УКРАЇНСЬКА', q_whiskey: "«У кожному жарті є частка віскі»", btn_get_id: "ОТРИМАТИ ID", btn_to_hall: "У ХОЛ", btn_save: "ЗБЕРЕГТИ", btn_enter: "У БАР", label_avatar: "АВАТАР" },
        pl: { flag: 'pl', name: 'POLSKI', q_whiskey: "«W każdym żarcie jest ziarno whiskey»", btn_get_id: "POBIERZ ID", btn_to_hall: "DO HALLU", btn_save: "ZAPISZ", btn_enter: "WEJDŹ DO BARU", label_avatar: "AWATAR" },
        ae: { flag: 'ae', name: 'العربية', q_whiskey: "«كل نكتة فيها القليل من الويسكي»", btn_get_id: "الحصول على الهوية", btn_to_hall: "إلى القاعة", btn_save: "حفظ", btn_enter: "دخول البار", label_avatar: "الصورة" }
    };

    let currentL = 'en';
    let currentF = 'gb';

    // УСТОЙЧИВОСТЬ И СЕНСОР ЯЗЫКА
    window.onload = () => {
        // Проверяем сохраненные данные (Устойчивость)
        const saved = JSON.parse(localStorage.getItem('gy_user'));
        const prefLang = localStorage.getItem('gy_lang');

        // СЕНСОР ЯЗЫКА: Если язык не выбран вручную, берем язык системы
        const sysLang = navigator.language.split('-')[0];
        let targetLang = prefLang || (langData[sysLang] ? sysLang : 'en');
        
        pickL(targetLang, langData[targetLang].flag, langData[targetLang].name);

        if (saved) {
            applyUserData(saved);
            document.getElementById('btn-to-hall').classList.remove('btn-sleep');
        }
    };

    function pickL(l, f, n) {
        currentL = l;
        currentF = f;
        localStorage.setItem('gy_lang', l);
        
        document.getElementById('cur-flag').src = `https://flagcdn.com/w20/${f}.png`;
        document.getElementById('cur-name').innerText = n;
        document.getElementById('lang-list').classList.remove('open');
        document.body.className = (l === 'ae' ? 'rtl' : '');

        // ПЕРЕКЛЮЧЕНИЕ ТЕКСТОВ
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (langData[l][key]) el.innerText = langData[l][key];
        });
    }

    function openDoor() {
        const d = document.getElementById('main-door');
        d.style.transform = "scale(4) rotate(10deg)";
        d.style.opacity = "0";
        
        // Если юзер новый, создаем временный ID
        if (!localStorage.getItem('gy_user')) {
            const id = "GY-" + Math.floor(Math.random()*900 + 100);
            updateQR(id);
        }
        
        setTimeout(() => go('scr-welcome'), 1000);
    }

    function go(id) {
        document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
        const target = document.getElementById(id);
        if (target) target.classList.add('active');
    }

    function generateAvatar() {
        const seed = Math.random();
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${seed}`;
        const img = document.getElementById('user-photo');
        img.src = url;
        img.style.display = 'block';
        document.getElementById('photo-label').style.display = 'none';
        document.getElementById('hall-photo').src = url;
    }

    function updateQR(id) {
        document.getElementById('display-id').innerText = "#" + id;
        document.getElementById('qr-reg').innerHTML = "";
        document.getElementById('qr-hall').innerHTML = "";
        new QRCode(document.getElementById("qr-reg"), { text: id, width: 80, height: 80 });
        new QRCode(document.getElementById("qr-hall"), { text: id, width: 80, height: 80 });
    }

    function saveUser() {
        const userData = {
            id: document.getElementById('display-id').innerText,
            photo: document.getElementById('user-photo').src,
            lang: currentL,
            flag: currentF
        };
        localStorage.setItem('gy_user', JSON.stringify(userData));
        applyUserData(userData);
        go('scr-hall');
    }

    function applyUserData(data) {
        document.getElementById('display-id').innerText = data.id;
        document.getElementById('hall-photo').src = data.photo;
        // СВЯЗЬ ЯЗЫК = ФЛАГ: Берем флаг из сохраненных данных
        document.getElementById('hall-flag').src = `https://flagcdn.com/w20/${data.flag}.png`;
        updateQR(data.id.replace('#', ''));
    }
</script>

</body>
</html>
