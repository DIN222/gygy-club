<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.4.71 | STABLE REBUILD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --door-wood: #3E2723; }

        /* БЛОКИРОВКА ГУГЛ-МУСОРА */
        .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame, .skiptranslate > iframe { display: none !important; }
        body { top: 0px !important; margin: 0; background: #000; }

        /* ЯЗЫКОВАЯ ПАНЕЛЬ */
        #google_translate_element { 
            position: fixed; top: 15px; left: 15px; z-index: 1000005; 
            background: rgba(0,0,0,0.9); border: 1px solid var(--gold); 
            padding: 2px; border-radius: 4px;
        }
        .goog-te-gadget .goog-te-combo { 
            background: #000 !important; color: var(--gold) !important; 
            border: 1px solid var(--gold) !important; font-family: 'Share Tech Mono', monospace;
            font-size: 12px; outline: none;
        }

        /* ГЕОМЕТРИЯ */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; }

        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 1000000; font-size: 24px; letter-spacing: 5px; font-weight: bold; pointer-events: none; }
        
        /* ГЛАВНЫЙ СТЕК БЛОКОВ */
        .block { 
            position: absolute; inset: 0; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            background: #000; z-index: 10; opacity: 0; transition: opacity 0.5s ease-in-out; 
        }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; text-align: center; max-width: 85%; margin-bottom: 20px; line-height: 1.2; }

        .btn-gy { 
            min-width: 270px; padding: 14px; background: transparent; 
            border: 2px solid var(--gold); color: var(--gold); 
            cursor: pointer; text-transform: uppercase; font-weight: 900; 
            font-family: 'Share Tech Mono'; transition: 0.3s; margin: 6px 0;
        }
        .btn-sleep { opacity: 0.2 !important; pointer-events: none !important; }

        /* РЕАКТОР (ID КАРТА) - ЖЕСТКАЯ ЦЕНТРОВКА */
        .id-card-hall { 
            width: 230px; padding: 15px; border: 2px solid var(--gold); 
            background: #F5F5DC; border-radius: 12px; display: flex; 
            flex-direction: column; align-items: center; color: #000; 
            margin-top: 10px; box-shadow: 0 0 30px rgba(212,175,87,0.3);
            z-index: 100;
        }
        
        .box-final { width: 85px; height: 85px; border: 2px solid #000; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        #main-door { width: 280px; cursor: pointer; transition: transform 2s, opacity 1s; z-index: 9999; }
        
        .bar-ui-container { width: 100%; max-width: 360px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .bar-side-buttons { display: flex; justify-content: space-between; gap: 10px; }
        .bar-side-buttons button { flex: 1; font-size: 11px; }

        img { -webkit-user-drag: none; pointer-events: none; }
    </style>
</head>
<body class="notranslate" oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-header-right">GY-GY</div>

    <div id="block-entrance" class="block active" style="opacity: 1; display: flex;">
        <div style="opacity:0; position:absolute;">Добро пожаловать в клуб ГЫ-ГЫ</div>
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()" style="pointer-events: auto;">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" style="max-height: 40vh; margin-bottom: 20px;">
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОХОДИТЕ В ХОЛЛ</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')">ПОЛУЧИТЬ ID</button>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text">«Шампанского много не бывает»</div>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <div class="box-final" style="background:transparent; border-color:var(--gold); color:var(--gold); font-size:10px;" id="id-label">#ID</div>
            <div class="box-final" id="qr-box-reg" style="border-color:var(--gold);"></div>
            <div class="box-final" style="border-color:var(--gold); cursor:pointer; pointer-events:auto;" onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" onchange="preview(this)" style="display:none;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-photo" style="font-size:10px;">ФОТО</span>
            </div>
            <div class="box-final" style="border-color:var(--gold); cursor:pointer; pointer-events:auto;" onclick="generateAvatar()">
                <img id="avatar-img" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-avatar" style="font-size:10px; text-align:center;">GEN AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="swapButtons('btn-save', 'btn-pass')">СОХРАНИТЬ</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОЙТИ В ХОЛЛ</button>
    </div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity: 0.5; z-index:-1;"></div>
        <div style="font-family:'Playfair Display'; font-size:32px; font-weight:900;">GY-GY HALL</div>
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:10px; font-size:14px;">#ID</div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div class="box-final"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div id="h-qr" class="box-final"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; border-color:#000; color:#000; padding:10px;" onclick="swapButtons('btn-confirm', 'btn-enter-bar')">ПОДТВЕРДИТЬ</button>
            <button id="btn-enter-bar" class="btn-gy btn-sleep" style="min-width:100%; border-color:#000; color:#000; padding:10px;" onclick="portalTransition('block-bar')">ВХОД В БАР</button>
        </div>
    </div>

    <div id="block-bar" class="block" style="justify-content: flex-end;">
        <div class="quote-text" style="position:absolute; top:8vh;">«Игого, сейчас начнем!»</div>
        <img src="horse_bar.png" style="height: 70vh; width: auto; object-fit: contain;">
        <div class="bar-ui-container">
            <div class="bar-side-buttons">
                <button class="btn-gy" onclick="window.location.href='tables.html'">ЗА СТОЛИКИ</button>
                <button class="btn-gy" onclick="window.location.href='bridge_protocol.html'">В AI ROOM</button>
            </div>
            <button class="btn-gy" style="width:100%;" onclick="portalTransition('block-hall')">ВЕРНУТЬСЯ В ХОЛЛ</button>
        </div>
    </div>

<script>
    let currentID = "";

    function updateIDUI(id) {
        if(!id) return;
        document.getElementById('id-label').innerText = id;
        document.getElementById('h-id').innerText = id;
        const qrc = { text: id, width: 85, height: 85 };
        document.getElementById('qr-box-reg').innerHTML = "";
        new QRCode(document.getElementById("qr-box-reg"), qrc);
        document.getElementById('h-qr').innerHTML = "";
        new QRCode(document.getElementById("h-qr"), qrc);
    }

    function handleDoor() {
        document.getElementById('main-door').style.transform = "scale(10)";
        document.getElementById('main-door').style.opacity = "0";
        if (!currentID) currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
        localStorage.setItem('gy_trace', currentID);
        updateIDUI(currentID);
        setTimeout(() => { portalTransition('block-welcome'); }, 1200);
    }

    function portalTransition(nextId) {
        const current = document.querySelector('.block.active');
        if(current) current.style.opacity = "0";
        setTimeout(() => {
            if(current) { current.classList.remove('active'); current.style.display = "none"; }
            const next = document.getElementById(nextId);
            next.style.display = "flex";
            setTimeout(() => { next.classList.add('active'); next.style.opacity = "1"; }, 50);
        }, 500);
    }

    function preview(i) {
        const r = new FileReader();
        r.onload = (e) => {
            document.getElementById('pp').src = e.target.result;
            document.getElementById('pp').style.display = "block";
            document.getElementById('h-photo').src = e.target.result;
            document.getElementById('txt-photo').style.display = "none";
        };
        r.readAsDataURL(i.files[0]);
    }

    function generateAvatar() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('avatar-img').src = url;
        document.getElementById('avatar-img').style.display = "block";
        document.getElementById('h-photo').src = url;
        document.getElementById('txt-avatar').style.display = "none";
    }

    function swapButtons(a, s) {
        document.getElementById(a).classList.add('btn-sleep');
        document.getElementById(s).classList.remove('btn-sleep');
    }

    window.onload = () => {
        const saved = localStorage.getItem('gy_trace');
        if(saved) { 
            currentID = saved; 
            updateIDUI(saved); 
            document.getElementById('btn-w-hall').classList.remove('btn-sleep'); 
        }
    };

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
