<!DOCTYPE html>
<html lang="en" class="notranslate" google="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.5.60 | DYNAMIC FLAG</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; }
        * { -webkit-tap-highlight-color: transparent !important; outline: none !important; box-sizing: border-box; }
        
        font { background-color: transparent !important; box-shadow: none !important; position: relative !important; display: inline !important; }
        .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; border: none !important; }
        
        html, body { width: 100%; height: 100%; background: #000 !important; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin:0; }

        /* HEADER & LANG */
        #ui-top-bar { position: fixed; top: 15px; left: 15px; right: 25px; display: flex; justify-content: space-between; align-items: center; z-index: 1000001; }
        #google_translate_element { display: flex; align-items: center; gap: 8px; }
        .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame, .skiptranslate > iframe { display: none !important; }
        body { top: 0px !important; }
        
        .goog-te-gadget .goog-te-combo { 
            background: #000 !important; color: var(--gold) !important; 
            border: 1px solid var(--gold) !important; padding: 4px; border-radius: 4px; 
            font-family: 'Share Tech Mono'; font-size: 12px;
        }

        .lang-hint { position: fixed; top: 52px; left: 15px; z-index: 1000001; font-size: 11px; color: var(--gold); animation: blink 2s infinite; font-weight: bold; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .logo-gy { font-size: 24px; letter-spacing: 5px; font-weight: bold; color: var(--gold); }

        /* BLOCKS */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.8s; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        /* IDENTITY & DYNAMIC FLAG */
        .box-final { width: 85px; height: 85px; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; background: rgba(212,175,55,0.05) !important; overflow: hidden; position: relative; }
        
        .dynamic-flag { 
            position: absolute; bottom: 2px; right: 2px; font-size: 18px; 
            z-index: 20; filter: drop-shadow(0 0 3px #000); 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(1);
        }
        .flag-pop { transform: scale(1.5); }

        .btn-gy { min-width: 250px; padding: 10px; background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; margin: 5px 0; font-family: 'Share Tech Mono'; font-size: 13px; transition: 0.3s; }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; }
        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: var(--gold); text-align: center; max-width: 85%; margin-bottom: 15px; }
        .golden-glow-horse { max-height: 45vh; width: auto; filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.7)); margin-bottom: 5px; transform: scale(1.1); }
        .id-card-hall { position: absolute; top: 70%; left: 50%; transform: translate(-50%,-50%); width: 250px; padding: 15px; border: 2px solid var(--gold); background: #F5F5DC; border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; z-index: 30; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="ui-top-bar">
        <div id="google_translate_element"></div>
        <div class="logo-gy">GY-GY</div>
    </div>
    <div class="lang-hint" id="l-hint">↑<br>SELECT LANGUAGE</div>

    <audio id="snd-door" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1; display: flex;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()" style="width:280px; cursor:pointer; transition:2.5s cubic-bezier(0.4, 0, 0.2, 1);">
    </div>

    <div id="block-welcome" class="block" style="justify-content: flex-start; padding-top: 8vh;">
        <div class="quote-text">«In every joke there's a drop of whiskey»</div>
        <img src="horse_welcome.png" class="golden-glow-horse">
        <div style="font-family: 'Playfair Display'; font-size: 30px; font-weight: 900; letter-spacing: 10px; margin-bottom: 10px; font-style: italic;">WELCOME</div>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">HALLWAY</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')">GET CLUB ID</button>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text">«Never too much champagne»</div>
        <div style="display:flex; gap:10px; margin-bottom:25px;">
            <div class="box-final" id="id-label" style="font-size:10px; font-weight:bold;">#ID</div>
            <div class="box-final" id="qr-reg"></div>
            
            <div class="box-final" onclick="document.getElementById('file-in').click()" style="cursor:pointer;">
                <input type="file" id="file-in" onchange="preview(this)" style="display:none;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-ph" style="font-size:10px; font-weight:900;">PHOTO</span>
                <div class="dynamic-flag">🌐</div> </div>

            <div class="box-final" onclick="genAv()" style="cursor:pointer;">
                <img id="av-img" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-av" style="font-size:10px; font-weight:900;">AVATAR</span>
                <div class="dynamic-flag">🌐</div> </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="swapBtns('btn-save', 'btn-pass')">SAVE DATA</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">PROCEED TO HALL</button>
    </div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; z-index:15;"></div>
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:10px;">#ID</div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div class="box-final" style="border-color:#000;">
                    <img id="h-photo" style="width:100%; height:100%; object-fit:cover;">
                    <div class="dynamic-flag" style="bottom:0; right:0;">🌐</div>
                </div>
                <div class="box-final" id="h-qr" style="border-color:#000;"></div>
            </div>
            <button id="btn-conf" class="btn-gy" style="border-color:#000; color:#000;" onclick="swapBtns('btn-conf', 'btn-bar')">CONFIRM</button>
            <button id="btn-bar" class="btn-gy btn-sleep" style="border-color:#000; color:#000;" onclick="portalTransition('block-bar')">ENTER BAR</button>
        </div>
    </div>

    <div id="block-bar" class="block">
        <img src="horse_bar.png" style="height: 70vh;">
        <button class="btn-gy" onclick="window.location.href='tables.html'">TABLES</button>
    </div>

<script>
    // МАППИНГ ФЛАГОВ
    const flags = {
        'en': '🇬🇧', 'ru': '🇷🇺', 'uk': '🇺🇦', 'pl': '🇵🇱', 
        'fr': '🇫🇷', 'de': '🇩🇪', 'zh-CN': '🇨🇳', 'es': '🇪🇸', 'it': '🇮🇹', 'ja': '🇯🇵'
    };

    const langNames = {
        'ru': 'Russian', 'uk': 'Ukrainian', 'en': 'English', 'pl': 'Polish', 
        'fr': 'French', 'de': 'German', 'zh-CN': 'Chinese', 'es': 'Spanish', 'it': 'Italian'
    };

    function updateClubFlag(langCode) {
        const emoji = flags[langCode] || '🌐';
        const flagElements = document.querySelectorAll('.dynamic-flag');
        flagElements.forEach(el => {
            el.classList.add('flag-pop');
            setTimeout(() => {
                el.innerText = emoji;
                el.classList.remove('flag-pop');
            }, 300);
        });
    }

    function googleTranslateElementInit() { 
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,ru,uk,pl,fr,de,zh-CN,es,it,ja',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element'); 
        
        let check = setInterval(() => {
            const select = document.querySelector('.goog-te-combo');
            if(select) {
                // Перевод меню
                Array.from(select.options).forEach(opt => {
                    if(langNames[opt.value]) opt.text = langNames[opt.value];
                });

                // Слежка за сменой флага
                select.addEventListener('change', () => {
                    updateClubFlag(select.value);
                });
                
                // Инициализация текущего флага
                updateClubFlag(select.value);
                clearInterval(check);
            }
        }, 200);
    }

    // ТЕХНИЧЕСКАЯ ЧАСТЬ
    let currentID = localStorage.getItem('gy_trace') || "";
    function handleDoor() {
        document.getElementById('snd-door').play().catch(()=>{});
        document.getElementById('main-door').style.transform = "scale(12)";
        document.getElementById('main-door').style.opacity = "0";
        document.getElementById('l-hint').style.display = 'none';
        if (!currentID) {
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            localStorage.setItem('gy_trace', currentID);
        }
        updateUI(currentID);
        setTimeout(() => { portalTransition('block-welcome'); document.getElementById('snd-ambient').play(); }, 1500);
    }

    function updateUI(id) {
        document.getElementById('id-label').innerText = id;
        document.getElementById('h-id').innerText = id;
        [document.getElementById('qr-reg'), document.getElementById('h-qr')].forEach(el => {
            el.innerHTML = ""; new QRCode(el, { text: id, width: 85, height: 85 });
        });
    }

    function portalTransition(nextId) {
        const active = document.querySelector('.block.active');
        if(active) { active.style.opacity = "0"; active.style.pointerEvents = "none"; }
        setTimeout(() => {
            if(active) active.classList.remove('active');
            const n = document.getElementById(nextId);
            n.classList.add('active');
            setTimeout(() => { n.style.opacity = "1"; n.style.pointerEvents = "auto"; }, 50);
        }, 800);
    }

    function preview(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => { 
                document.getElementById('pp').src = e.target.result; document.getElementById('pp').style.display = "block";
                document.getElementById('h-photo').src = e.target.result; document.getElementById('txt-ph').style.display = "none";
                document.getElementById('av-img').style.display = "none";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function genAv() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('av-img').src = url; document.getElementById('av-img').style.display = "block";
        document.getElementById('h-photo').src = url; document.getElementById('txt-av').style.display = "none";
        document.getElementById('pp').style.display = "none";
    }

    function swapBtns(a, s) { document.getElementById(a).classList.add('btn-sleep'); document.getElementById(s).classList.remove('btn-sleep'); }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
