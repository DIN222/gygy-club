<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.6.3 | THE UNIVERSAL MONOLITH</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style id="GY-GY-CORE-STYLE">
        /* КОНСТИТУЦИЯ КЛУБА: АРХИТЕКТУРНЫЙ ЦЕМЕНТ */
        :root { --gold: #d4af37; --paper: #F5F5DC; --black: #000; --wood: #3E2723; }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; outline: none !important; -webkit-user-select: none; user-select: none; }
        
        html, body { 
            width: 100%; height: 100%; background: var(--black); 
            color: var(--gold); font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; position: fixed; margin: 0; 
        }

        /* ШРИФТОВАЯ ЗАЩИТА (ETALON) */
        .etalon-quote { 
            font-family: 'Playfair Display', serif !important; 
            font-style: italic !important; font-size: 26px; 
            text-align: center; max-width: 85%; margin-bottom: 20px; line-height: 1.2;
        }
        
        .etalon-welcome-title { 
            font-family: 'Playfair Display', serif !important; 
            font-weight: 900 !important; font-size: 42px; 
            letter-spacing: 5px; margin-bottom: 20px; text-transform: uppercase;
        }

        /* НАВИГАЦИОННЫЙ КАРКАС (GY-BACK) */
        .gy-back-btn { 
            min-width: 275px; padding: 10px; 
            border: 1px solid var(--gold); font-size: 10px; 
            background: rgba(0,0,0,0.6); color: var(--gold); 
            cursor: pointer; margin-top: 15px; text-transform: uppercase;
            font-family: 'Share Tech Mono', monospace; letter-spacing: 1px;
            transition: 0.2s;
        }
        .gy-back-btn:active { transform: scale(0.98); background: var(--gold); color: #000; }

        /* БЛОКИ И ПЕРЕХОДЫ */
        .block { 
            position: fixed; inset: 0; display: none; 
            flex-direction: column; align-items: center; 
            justify-content: center; z-index: 10; opacity: 0; 
            transition: opacity 0.6s ease; pointer-events: none; 
        }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        /* ЯЗЫКОВАЯ ПАНЕЛЬ + АНИМЕ СТРЕЛКА */
        .lang-gateway { position: fixed; top: 15px; left: 15px; z-index: 10000; width: 170px; }
        .btn-main-lang { width: 100%; padding: 10px; background: #000; border: 1.5px solid var(--gold); color: var(--gold); font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; }
        .lang-hint { font-size: 9px; margin-top: 5px; text-align: center; color: var(--gold); letter-spacing: 1px; }
        .anime-arrow { display: block; font-size: 18px; animation: bounce 1.2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); opacity: 0.5; } }

        .lang-dropdown { 
            display: none; flex-direction: column; background: #000; 
            border: 1.5px solid var(--gold); position: absolute; width: 100%; 
            max-height: 60vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .lang-dropdown.open { display: flex; }
        .btn-sub-lang { 
            background: none; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.1); 
            color: var(--gold); padding: 12px; cursor: pointer; display: flex; 
            align-items: center; gap: 10px; font-size: 11px; font-family: inherit;
        }

        /* КНОПКИ ДЕЙСТВИЯ */
        .btn-gy { min-width: 275px; padding: 14px; background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; margin: 8px 0; font-family: inherit; }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; }

        /* АВАТАРЫ И КАРТОЧКА */
        .box-final { width: 85px; height: 85px; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .box-white { background: #fff !important; color: #000; }
        .id-card-hall { width: 235px; padding: 22px; border: 2px solid var(--gold); background: var(--paper); border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; z-index: 30; margin-top: 8vh; }
        
        .bar-ui { position: absolute; bottom: 5vh; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 100; }
        .bar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 300px; margin-bottom: 10px; }
        .flag-icon { width: 20px; border: 0.5px solid var(--gold); }
        
        .rtl { direction: rtl; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="lang-gateway">
        <button class="btn-main-lang" onclick="document.getElementById('lang-list').classList.toggle('open')">
            <img id="cur-flag" src="https://flagcdn.com/w20/gb.png" class="flag-icon">
            <span id="cur-name">ENGLISH</span>
        </button>
        <div class="lang-hint">
            <span data-key="lang_hint">SELECT LANGUAGE</span>
            <b class="anime-arrow">↓</b>
        </div>
        <div id="lang-list" class="lang-dropdown">
            <button class="btn-sub-lang" onclick="pickL('en','gb','ENGLISH')"><img src="https://flagcdn.com/w20/gb.png" class="flag-icon"> ENGLISH</button>
            <button class="btn-sub-lang" onclick="pickL('ru','ru','РУССКИЙ')"><img src="https://flagcdn.com/w20/ru.png" class="flag-icon"> РУССКИЙ</button>
            <button class="btn-sub-lang" onclick="pickL('ua','ua','УКРАЇНСЬКА')"><img src="https://flagcdn.com/w20/ua.png" class="flag-icon"> УКРАЇНСЬКА</button>
            <button class="btn-sub-lang" onclick="pickL('pl','pl','POLSKI')"><img src="https://flagcdn.com/w20/pl.png" class="flag-icon"> POLSKI</button>
            <button class="btn-sub-lang" onclick="pickL('de','de','DEUTSCH')"><img src="https://flagcdn.com/w20/de.png" class="flag-icon"> DEUTSCH</button>
            <button class="btn-sub-lang" onclick="pickL('fr','fr','FRANÇAIS')"><img src="https://flagcdn.com/w20/fr.png" class="flag-icon"> FRANÇAIS</button>
            <button class="btn-sub-lang" onclick="pickL('it','it','ITALIANO')"><img src="https://flagcdn.com/w20/it.png" class="flag-icon"> ITALIANO</button>
            <button class="btn-sub-lang" onclick="pickL('es','es','ESPAÑOL')"><img src="https://flagcdn.com/w20/es.png" class="flag-icon"> ESPAÑOL</button>
            <button class="btn-sub-lang" onclick="pickL('cn','cn','中文')"><img src="https://flagcdn.com/w20/cn.png" class="flag-icon"> 中文</button>
            <button class="btn-sub-lang" onclick="pickL('jp','jp','日本語')"><img src="https://flagcdn.com/w20/jp.png" class="flag-icon"> 日本語</button>
            <button class="btn-sub-lang" onclick="pickL('ae','ae','العربية')"><img src="https://flagcdn.com/w20/ae.png" class="flag-icon"> العربية</button>
            <button class="btn-sub-lang" onclick="pickL('br','br','PORTUGUÊS')"><img src="https://flagcdn.com/w20/br.png" class="flag-icon"> PORTUGUÊS</button>
        </div>
    </div>
    <div style="position:fixed; top:18px; right:25px; font-size:24px; font-weight:bold; letter-spacing:5px; z-index:9000; color:var(--gold);">GY-GY</div>

    <audio id="snd-door"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity:1; display:flex;">
        <img src="door_1.jpg" id="main-door" style="width:280px; cursor:pointer; transition:2s cubic-bezier(0.4, 0, 0.2, 1);" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block">
        <div class="etalon-quote" data-key="q_whiskey">«Every joke has a grain of whiskey»</div>
        <img src="horse_welcome.png" style="max-height:38vh; margin-bottom:15px;">
        <div class="etalon-welcome-title">WELCOME</div>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')" data-key="btn_to_hall">PROCEED TO HALL</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')" data-key="btn_get_id">GET ID TOKEN</button>
    </div>

    <div id="block-identity" class="block">
        <div class="etalon-quote" data-key="q_champ">«No such thing as too much champagne»</div>
        <div style="display:flex; gap:12px; margin-bottom:25px;">
            <div class="box-final" id="id-label" style="font-size:10px; font-weight:900;">#ID</div>
            <div class="box-final" id="qr-reg"></div>
            <div class="box-final box-white" onclick="document.getElementById('f-in').click()" style="cursor:pointer;">
                <input type="file" id="f-in" onchange="pv(this)" style="display:none;">
                <img id="img-p" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="t-p" style="font-size:10px; font-weight:900; color:#000;" data-key="label_photo">PHOTO</span>
            </div>
            <div class="box-final box-white" onclick="genAv()" style="cursor:pointer;">
                <img id="img-a" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="t-a" style="font-size:10px; font-weight:900; color:#000; text-align:center;" data-key="label_avatar">GEN<br>AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="swapB('btn-save', 'btn-pass')" data-key="btn_save">SAVE PROFILE</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')" data-key="btn_to_hall">PROCEED TO HALL</button>
        <button class="gy-back-btn" onclick="portalTransition('block-welcome')" data-key="btn_back_welcome">← BACK TO WELCOME</button>
    </div>

    <div id="block-hall" class="block">
        <div id="hall-bg" style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity:0.5; z-index:1;"></div>
        <div style="position:relative; z-index:35; font-size:32px; font-weight:900; color:var(--wood); margin-top:-2vh;">«GY-GY HALL»</div>
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:12px; font-size:14px;">#ID-TOKEN</div>
            <div style="display:flex; gap:12px; margin-bottom:18px;">
                <div style="width:85px; height:85px; background:#fff; border:1px solid #000; overflow:hidden;"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div id="h-qr" style="width:85px; height:85px; background:#fff; border:1px solid #000;"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; color:#000; border-color:#000;" onclick="swapB('btn-confirm', 'btn-bar')" data-key="btn_confirm">CONFIRM</button>
            <button id="btn-bar" class="btn-gy btn-sleep" style="min-width:100%; color:#000; border-color:#000;" onclick="portalTransition('block-bar')" data-key="btn_enter">ENTER BAR</button>
        </div>
        <button class="gy-back-btn" style="z-index:40; background:#000;" onclick="portalTransition('block-welcome')" data-key="btn_back_welcome">← BACK TO WELCOME</button>
    </div>

    <div id="block-bar" class="block" style="justify-content: flex-end;">
        <div class="bar-ui">
            <div class="bar-grid">
                <button class="btn-gy" style="min-width:auto;" data-key="btn_tables">TABLES</button>
                <button class="btn-gy" style="min-width:auto;" data-key="btn_ai">AI ROOM</button>
            </div>
            <button class="btn-gy" onclick="portalTransition('block-hall')" data-key="btn_back_hall">← BACK TO HALL</button>
        </div>
        <img src="horse_bar.png" style="height:76vh; width:auto; object-fit:contain; margin-bottom:-10px;">
    </div>

    <script>
        const langData = {
            en: { lang_hint: "SELECT LANGUAGE", q_whiskey: "«Every joke has a grain of whiskey»", q_champ: "«No such thing as too much champagne»", btn_to_hall: "PROCEED TO HALL", btn_get_id: "GET ID TOKEN", btn_save: "SAVE PROFILE", btn_confirm: "CONFIRM", btn_enter: "ENTER BAR", label_photo: "PHOTO", label_avatar: "AVATAR", btn_back_welcome: "← BACK TO WELCOME", btn_back_hall: "← BACK TO HALL", btn_tables: "TABLES", btn_ai: "AI ROOM" },
            ru: { lang_hint: "ВЫБЕРИТЕ ЯЗЫК", q_whiskey: "«В каждой шутке есть доля виски»", q_champ: "«Шампанского много не бывает»", btn_to_hall: "ПРОЙТИ В ХОЛЛ", btn_get_id: "ПОЛУЧИТЬ ID", btn_save: "СОХРАНИТЬ", btn_confirm: "ПОДТВЕРДИТЬ", btn_enter: "ВХОД В БАР", label_photo: "ФОТО", label_avatar: "АВАТАР", btn_back_welcome: "← НАЗАД К ПРИВЕТСТВИЮ", btn_back_hall: "← ВЕРНУТЬСЯ В ХОЛЛ", btn_tables: "ЗА СТОЛИКИ", btn_ai: "В AI ROOM" },
            ua: { lang_hint: "ОБЕРІТЬ МОВУ", q_whiskey: "«У кожному жарті є частка віскі»", q_champ: "«Шампанського багато не буває»", btn_to_hall: "ПРОЙТИ ДО ХОЛУ", btn_get_id: "ОТРИМАТИ ID", btn_save: "ЗБЕРЕГТИ", btn_confirm: "ПІДТВЕРДИТЬ", btn_enter: "ВХІД ДО БАРУ", label_photo: "ФОТО", label_avatar: "АВАТАР", btn_back_welcome: "← НАЗАД ДО ПРИВІТАННЯ", btn_back_hall: "← ПОВЕРНУТИСЯ ДО ХОЛУ", btn_tables: "ЗА СТОЛИКИ", btn_ai: "В AI ROOM" },
            pl: { lang_hint: "WYBIERZ JĘZYK", q_whiskey: "«W każdym żarcie jest ziarno whisky»", q_champ: "«Szampana nigdy za wiele»", btn_to_hall: "DO HOLU", btn_get_id: "POBIERZ ID", btn_save: "ZAPISZ", btn_confirm: "POTWIERDŹ", btn_enter: "WEJDŹ DO BARU", label_photo: "FOTO", label_avatar: "AWATAR", btn_back_welcome: "← POWRÓT", btn_back_hall: "← DO HOLU", btn_tables: "STOLIKI", btn_ai: "AI ROOM" },
            de: { lang_hint: "SPRACHE WÄHLEN", q_whiskey: "«Jeder Witz hat einen Kern Whiskey»", q_champ: "«Champagner geht immer»", btn_to_hall: "ZUR HALLE", btn_get_id: "ID ERHALTEN", btn_save: "SPEICHERN", btn_confirm: "BESTÄTIGEN", btn_enter: "ZUR BAR", label_photo: "FOTO", label_avatar: "AVATAR", btn_back_welcome: "← ZURÜCK", btn_back_hall: "← ZUR HALLE", btn_tables: "TISCHE", btn_ai: "AI RAUM" },
            fr: { lang_hint: "CHOISIR LA LANGUE", q_whiskey: "«Chaque blague a un fond de whiskey»", q_champ: "«Jamais trop de champagne»", btn_to_hall: "VERS LE HALL", btn_get_id: "OBTENIR ID", btn_save: "ENREGISTRER", btn_confirm: "CONFIRMER", btn_enter: "ENTRER AU BAR", label_photo: "PHOTO", label_avatar: "AVATAR", btn_back_welcome: "← RETOUR", btn_back_hall: "← VERS LE HALL", btn_tables: "TABLES", btn_ai: "SALLE AI" },
            it: { lang_hint: "SCEGLI LINGUA", q_whiskey: "«Ogni scherzo ha un fondo di whiskey»", q_champ: "«Mai troppo champagne»", btn_to_hall: "AL SALONE", btn_get_id: "OTTIENI ID", btn_save: "SALVA", btn_confirm: "CONFERMA", btn_enter: "ENTRA AL BAR", label_photo: "FOTO", label_avatar: "AVATAR", btn_back_welcome: "← INDIETRO", btn_back_hall: "← AL SALONE", btn_tables: "TAVOLI", btn_ai: "SALA AI" },
            es: { lang_hint: "ELEGIR IDIOMA", q_whiskey: "«Cada broma tiene un poco de whiskey»", q_champ: "«Nunca es suficiente champán»", btn_to_hall: "AL VESTÍBULO", btn_get_id: "OBTENER ID", btn_save: "GUARDAR", btn_confirm: "CONFIRMAR", btn_enter: "ENTRAR AL BAR", label_photo: "FOTO", label_avatar: "AVATAR", btn_back_welcome: "← VOLVER", btn_back_hall: "← AL VESTÍBULO", btn_tables: "MESAS", btn_ai: "SALA AI" },
            cn: { lang_hint: "选择语言", q_whiskey: "«每个笑话都有一点威士忌»", q_champ: "«香槟永远不嫌多»", btn_to_hall: "前往大厅", btn_get_id: "获取ID", btn_save: "保存", btn_confirm: "确认", btn_enter: "进入酒吧", label_photo: "照片", label_avatar: "头像", btn_back_welcome: "← 返回", btn_back_hall: "← 返回大厅", btn_tables: "桌子", btn_ai: "AI室" },
            jp: { lang_hint: "言語を選択", q_whiskey: "«すべてのジョークにはウィスキーが含まれている»", q_champ: "«シャンパンはいくらあっても足りない»", btn_to_hall: "ホールへ", btn_get_id: "IDを取得", btn_save: "保存", btn_confirm: "確認", btn_enter: "バーに入る", label_photo: "写真", label_avatar: "アバター", btn_back_welcome: "← 戻る", btn_back_hall: "← ホールに戻る", btn_tables: "テーブル", btn_ai: "AIルーム" },
            ae: { lang_hint: "اختر اللغة", q_whiskey: "«كل نكتة فيها ذرة من الويسكي»", q_champ: "«الشمبانيا لا تكفي أبدا»", btn_to_hall: "المضي قدما إلى القاعة", btn_get_id: "احصل على معرف", btn_save: "حفظ", btn_confirm: "تأكيد", btn_enter: "ادخل إلى البار", label_photo: "صورة", label_avatar: "الصورة الرمزية", btn_back_welcome: "← العودة", btn_back_hall: "← القاعة", btn_tables: "طاولات", btn_ai: "غرفة الذكاء الاصطناعي" },
            br: { lang_hint: "ESCOLHER IDIOMA", q_whiskey: "«Toda piada tem um fundo de uísque»", q_champ: "«Champanhe nunca é demais»", btn_to_hall: "IR PARA O HALL", btn_get_id: "OBTER ID", btn_save: "SALVAR", btn_confirm: "CONFIRMAR", btn_enter: "ENTRAR NO BAR", label_photo: "FOTO", label_avatar: "AVATAR", btn_back_welcome: "← VOLTAR", btn_back_hall: "← PARA O HALL", btn_tables: "MESAS", btn_ai: "SALA AI" }
        };

        let currentID = localStorage.getItem('gy_trace') || "";

        function pickL(l, f, n) {
            document.getElementById('cur-flag').src = `https://flagcdn.com/w20/${f}.png`;
            document.getElementById('cur-name').innerText = n;
            document.body.classList.toggle('rtl', l === 'ae');
            document.querySelectorAll('[data-key]').forEach(el => {
                const k = el.getAttribute('data-key');
                el.innerText = langData[l] ? (langData[l][k] || langData['en'][k]) : (langData['en'][k]);
            });
            document.getElementById('lang-list').classList.remove('open');
        }

        function handleDoor() {
            document.getElementById('snd-door').play();
            const d = document.getElementById('main-door');
            d.style.transform = "scale(5)"; d.style.opacity = "0";
            if(!currentID) currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            localStorage.setItem('gy_trace', currentID);
            updateUI();
            setTimeout(() => { 
                portalTransition('block-welcome'); 
                document.getElementById('snd-ambient').play();
            }, 1800);
        }

        function updateUI() {
            document.getElementById('id-label').innerText = currentID;
            document.getElementById('h-id').innerText = currentID;
            const q1 = document.getElementById('qr-reg'), q2 = document.getElementById('h-qr');
            q1.innerHTML = ""; q2.innerHTML = "";
            new QRCode(q1, {text: currentID, width: 85, height: 85});
            new QRCode(q2, {text: currentID, width: 85, height: 85});
        }

        function portalTransition(id) {
            const cur = document.querySelector('.block.active');
            if(cur) { cur.style.opacity = "0"; setTimeout(() => { cur.classList.remove('active'); cur.style.display="none"; }, 500); }
            setTimeout(() => {
                const n = document.getElementById(id); n.style.display="flex";
                setTimeout(() => { n.classList.add('active'); n.style.opacity="1"; }, 50);
            }, 550);
        }

        function pv(i) {
            if(i.files && i.files[0]) {
                const r = new FileReader();
                r.onload = (e) => {
                    document.getElementById('img-p').src = e.target.result; document.getElementById('img-p').style.display="block";
                    document.getElementById('h-photo').src = e.target.result; document.getElementById('t-p').style.display="none";
                };
                r.readAsDataURL(i.files[0]);
            }
        }

        function genAv() {
            const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
            document.getElementById('img-a').src = url; document.getElementById('img-a').style.display="block";
            document.getElementById('h-photo').src = url; document.getElementById('t-a').style.display="none";
        }

        function swapB(a, b) {
            document.getElementById(a).classList.add('btn-sleep');
            document.getElementById(b).classList.remove('btn-sleep');
            if(a === 'btn-save') document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        }

        window.onload = () => { if(currentID) { updateUI(); document.getElementById('btn-w-hall').classList.remove('btn-sleep'); } }
    </script>
</body>
</html>
