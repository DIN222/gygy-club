
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club | PRO EDITION v4.4.81</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.5); --bg-dark: #0a0a0a; }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; background: var(--bg-dark); color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; }
        
        /* СКРЫВАЕМ МУСОР GOOGLE */
        .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame, .skiptranslate > iframe { display: none !important; }
        body { top: 0px !important; }

        /* UI ЯЗЫК И ЛОГО */
        #google_translate_element { 
            position: fixed; top: 20px; left: 20px; z-index: 99999; 
            background: rgba(0,0,0,0.9); border: 2px solid var(--gold); 
            padding: 5px; border-radius: 6px; box-shadow: 0 0 15px var(--gold-glow);
        }
        .lang-hint {
            position: fixed; top: 85px; left: 25px; z-index: 99999;
            font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
            animation: pulse 2s infinite; color: var(--gold);
        }
        .ui-logo { position: fixed; top: 20px; right: 30px; z-index: 99999; font-size: 28px; font-weight: 900; letter-spacing: 8px; }

        /* СТРУКТУРА БЛОКОВ */
        .page-block { 
            position: absolute; inset: 0; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            background: var(--bg-dark); opacity: 0; transition: opacity 0.8s ease;
            z-index: 10; padding: 20px;
        }
        .page-block.active { display: flex; opacity: 1; }

        /* КНОПКИ */
        .btn-gy { 
            min-width: 280px; padding: 18px; background: rgba(20,20,20,0.8); border: 2px solid var(--gold); 
            color: var(--gold); font-family: 'Share Tech Mono'; font-weight: 900; font-size: 16px;
            text-transform: uppercase; cursor: pointer; margin: 10px 0; transition: 0.3s;
        }
        .btn-gy:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold-glow); }
        .btn-sleep { opacity: 0.2 !important; pointer-events: none !important; }

        /* ДВЕРЬ (БЕЗ СТУКА) */
        #main-door { width: 280px; cursor: pointer; transition: transform 2.5s ease, opacity 1s; z-index: 9999; }

        /* РЕАКТОР / IDENTITY */
        .reactor-box { display: grid; grid-template-columns: repeat(2, 2fr); gap: 15px; background: rgba(212, 175, 55, 0.05); padding: 20px; border: 1px solid var(--gold); border-radius: 12px; }
        .slot { width: 100px; height: 100px; background: #fff; border: 2px solid var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; color: #000; position: relative; }
        .flag-display { font-size: 45px; }

        .quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: 26px; text-align: center; margin-bottom: 30px; line-height: 1.3; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="notranslate" oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="lang-hint">← SELECT LANGUAGE</div>
    <div class="ui-logo">GY-GY</div>

    <audio id="snd-open" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="p-entrance" class="page-block active" style="opacity: 1;">
        <img src="door_1.jpg" id="main-door" onclick="openDoor()">
        <p style="margin-top: 30px; letter-spacing: 4px; font-size: 14px;">ENTER THE CLUB</p>
    </div>

    <div id="p-welcome" class="page-block">
        <div class="quote">«In every joke there is a drop of whiskey»</div>
        <img src="horse_welcome.png" style="max-height: 40vh; margin-bottom: 20px;">
        <button id="btn-to-hall" class="btn-gy btn-sleep" onclick="go('p-hall')">Proceed to Hall</button>
        <button class="btn-gy" onclick="go('p-reg')">Register Identity</button>
    </div>

    <div id="p-reg" class="page-block">
        <div class="quote" style="font-size: 20px;">ID GENERATOR</div>
        <div class="reactor-box">
            <div class="slot">
                <span style="font-size:10px; font-weight:900;">CITIZEN</span>
                <div id="ui-flag" class="flag-display">🇬🇧</div>
            </div>
            <div class="slot" id="ui-qr"></div>
            <div class="slot" style="cursor:pointer" onclick="document.getElementById('f-in').click()">
                <input type="file" id="f-in" hidden onchange="loadImg(this)">
                <img id="ui-pic" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="ui-pic-t" style="font-size:9px; font-weight:900; text-align:center;">PHOTO</span>
            </div>
            <div class="slot" style="cursor:pointer" onclick="genAv()">
                <img id="ui-av" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="ui-av-t" style="font-size:9px; font-weight:900; text-align:center;">AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="unlock('btn-save','btn-pass')">Save ID</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="go('p-hall')">To the Hall</button>
    </div>

    <div id="p-hall" class="page-block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity: 0.8; z-index:-1;"></div>
        <div style="background:#F5F5DC; padding:20px; border-radius:15px; border:3px solid var(--gold); display:flex; flex-direction:column; align-items:center; color:#000;">
            <div id="final-id" style="font-weight:900; margin-bottom:15px; letter-spacing:1px;">#GY-ID</div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div class="slot"><img id="final-pic" style="width:100%; height:100%; object-fit:cover;"></div>
                <div id="final-qr" class="slot"></div>
            </div>
            <button id="btn-conf" class="btn-gy" style="border-color:#000; color:#000; min-width:200px;" onclick="unlock('btn-conf','btn-bar')">Confirm</button>
            <button id="btn-bar" class="btn-gy btn-sleep" style="border-color:#000; color:#000; min-width:200px;" onclick="go('p-bar')">Enter Bar</button>
        </div>
    </div>

    <div id="p-bar" class="page-block" style="justify-content: flex-end;">
        <img src="horse_bar.png" style="height: 60vh; width: auto; object-fit: contain;">
        <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px;">
            <div style="display:flex; gap:8px;">
                <button class="btn-gy" style="flex:1; font-size:11px;" onclick="location.href='tables.html'">TABLES</button>
                <button class="btn-gy" style="flex:1; font-size:11px;" onclick="location.href='ai.html'">AI ROOM</button>
            </div>
            <button class="btn-gy" onclick="go('p-hall')">BACK</button>
        </div>
    </div>

<script>
    let userID = "";

    // 1. АВТО-АНГЛИЙСКИЙ
    (function initLang() {
        if (!document.cookie.includes('googtrans')) {
            document.cookie = "googtrans=/ru/en; path=/";
        }
    })();

    function syncFlag() {
        const cookies = document.cookie.split('; ').find(r => r.startsWith('googtrans='));
        const lang = cookies ? cookies.split('/').pop() : 'en';
        const map = { 'en': '🇬🇧', 'ru': '🇷🇺', 'de': '🇩🇪', 'fr': '🇫🇷', 'es': '🇪🇸', 'zh-CN': '🇨🇳' };
        document.getElementById('ui-flag').innerText = map[lang] || '🏳️';
    }

    // 2. ОТКРЫТИЕ ДВЕРИ (БЕЗ СТУКА)
    function openDoor() {
        const so = document.getElementById('snd-open');
        const sa = document.getElementById('snd-ambient');
        const d = document.getElementById('main-door');
        
        so.play().catch(()=>{});
        sa.volume = 0.2; sa.play().catch(()=>{});
        
        d.style.transform = "scale(15)";
        d.style.opacity = "0";
        
        if(!userID) {
            userID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            updateUI();
        }
        setTimeout(() => go('p-welcome'), 1200);
    }

    function go(id) {
        document.querySelectorAll('.page-block').forEach(b => { b.classList.remove('active'); b.style.opacity = "0"; });
        const next = document.getElementById(id);
        next.style.display = "flex";
        setTimeout(() => { next.classList.add('active'); next.style.opacity = "1"; }, 50);
        syncFlag();
    }

    function updateUI() {
        document.getElementById('final-id').innerText = userID;
        const qrc = { text: userID, width: 100, height: 100 };
        document.getElementById('ui-qr').innerHTML = "";
        new QRCode(document.getElementById("ui-qr"), qrc);
        document.getElementById('final-qr').innerHTML = "";
        new QRCode(document.getElementById("final-qr"), qrc);
    }

    function loadImg(input) {
        const r = new FileReader();
        r.onload = (e) => {
            const res = e.target.result;
            document.getElementById('ui-pic').src = res;
            document.getElementById('ui-pic').style.display = "block";
            document.getElementById('ui-pic-t').style.display = "none";
            document.getElementById('final-pic').src = res;
        };
        r.readAsDataURL(input.files[0]);
    }

    function genAv() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('ui-av').src = url;
        document.getElementById('ui-av').style.display = "block";
        document.getElementById('ui-av-t').style.display = "none";
        document.getElementById('final-pic').src = url;
    }

    function unlock(off, on) {
        document.getElementById(off).classList.add('btn-sleep');
        document.getElementById(on).classList.remove('btn-sleep');
    }

    // 3. ИНИЦИАЛИЗАЦИЯ ВИДЖЕТА (СПИСОК ЯЗЫКОВ НА АНГЛИЙСКОМ)
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ru',
            // 'layout' устанавливает интерфейс виджета
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');

        // Переключение списка языков на английский интерфейс происходит через cookie 'googtrans'
        // и параметры самого виджета.
        setTimeout(() => {
            const combo = document.querySelector('.goog-te-combo');
            if(combo) combo.addEventListener('change', () => setTimeout(syncFlag, 200));
        }, 1500);
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
