<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v5.0.6 | REBORN</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&family=Inter:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --door-wood: #3E2723; }
        
        * { -webkit-tap-highlight-color: transparent !important; -webkit-user-select: none !important; user-select: none !important; outline: none !important; }
        a, button, input { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; pointer-events: none; }

        html, body { width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin:0; }
        
        #google_translate_element { position: fixed; top: 15px; left: 15px; z-index: 1000001; }
        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 1000000; font-size: 24px; letter-spacing: 5px; font-weight: bold; }

        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.6s ease; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 26px; text-align: center; max-width: 85%; line-height: 1.3; margin-bottom: 25px; }

        .btn-gy { min-width: 270px; padding: 14px; background: transparent; border: 1px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; margin: 8px 0; font-family: 'Share Tech Mono'; transition: 0.3s; }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; }

        .bar-ui-container { position: absolute; bottom: 6vh; left: 50%; transform: translateX(-50%); width: 100%; max-width: 360px; z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .bar-side-buttons { width: 100%; display: flex; justify-content: space-between; margin-bottom: 12px; }
        .bar-side-buttons button { min-width: 145px; background: rgba(0,0,0,0.7); }

        .id-card-hall { width: 240px; padding: 20px; border: 1px solid var(--gold); background: #F5F5DC; border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; z-index: 30; }
        .box-final { width: 85px; height: 85px; border: 1px solid #000; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        #main-door { width: 280px; cursor: pointer; transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s; z-index: 9999; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-header-right">GY-GY</div>

    <audio id="snd-door"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1; display: flex;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()">
        <div style="margin-top:20px; letter-spacing:3px;">OPEN THE DOOR</div>
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" style="max-height: 45vh; margin-bottom: 10px;">
        <div style="font-family:'Playfair Display'; font-size:38px; font-weight:700; letter-spacing:10px; margin-bottom:15px;">WELCOME</div>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">В ХОЛЛ</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')">ПОЛУЧИТЬ ID</button>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text" style="font-size:20px;">«Шампанского много не бывает»</div>
        <div style="display:flex; gap:10px; margin-bottom:25px;">
            <div class="box-final" style="background:transparent; border-color:var(--gold); color:var(--gold); font-size:10px;" id="id-label">#ID</div>
            <div class="box-final" id="qr-box-reg" style="border-color:var(--gold);"></div>
            <div class="box-final" style="border-color:var(--gold); cursor:pointer;" onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" onchange="preview(this)" style="display:none;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-photo" style="color:var(--gold); font-size:10px; font-weight:900;">ФОТО</span>
            </div>
            <div class="box-final" style="border-color:var(--gold); cursor:pointer;" onclick="generateAvatar()">
                <img id="avatar-img" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-avatar" style="color:var(--gold); font-size:10px; font-weight:900; text-align:center;">AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="swapButtons('btn-save', 'btn-pass')">СОХРАНИТЬ</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОЙТИ В ХОЛЛ</button>
    </div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity:0.3;"></div>
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:10px;">#ID</div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div class="box-final"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="box-final" id="h-qr"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; border-color:#000; color:#000;" onclick="swapButtons('btn-confirm', 'btn-enter-bar')">ПОДТВЕРДИТЬ</button>
            <button id="btn-enter-bar" class="btn-gy btn-sleep" style="min-width:100%; border-color:#000; color:#000;" onclick="portalTransition('block-bar')">ВХОД В БАР</button>
        </div>
    </div>

    <div id="block-bar" class="block">
        <div class="bar-ui-container">
            <div class="bar-side-buttons">
                <button class="btn-gy" onclick="portalTransition('block-tables')">СТОЛИКИ</button>
                <button class="btn-gy" onclick="location.href='server.html'">AI ROOM</button>
            </div>
            <button class="btn-gy" style="width:100%;" onclick="portalTransition('block-hall')">В ХОЛЛ</button>
        </div>
        <img src="horse_bar.png" style="height: 75vh; width: auto; object-fit: contain;">
    </div>

<script>
    let currentID = "";

    function syncLangWire() {
        let savedLang = localStorage.getItem('gy_session_lang');
        const googData = document.cookie.split('; ').find(row => row.startsWith('googtrans='));
        if (googData) {
            let activeLang = googData.split('/').pop().toUpperCase();
            localStorage.setItem('gy_session_lang', activeLang);
            return activeLang;
        } else if (savedLang) {
            document.cookie = `googtrans=/ru/${savedLang.toLowerCase()}; path=/;`;
            return savedLang;
        }
        return "";
    }

    window.onload = () => {
        syncLangWire();
        const savedID = localStorage.getItem('gy_trace');
        if (savedID) {
            currentID = savedID;
            updateIDUI(currentID);
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        }
    };

    function updateIDUI(id) {
        document.getElementById('id-label').innerText = id;
        document.getElementById('h-id').innerText = id;
        document.getElementById('qr-box-reg').innerHTML = "";
        new QRCode(document.getElementById("qr-box-reg"), { text: id, width: 85, height: 85 });
        document.getElementById('h-qr').innerHTML = "";
        new QRCode(document.getElementById("h-qr"), { text: id, width: 85, height: 85 });
    }

    function handleDoor() {
        const d = document.getElementById('main-door');
        const snd = document.getElementById('snd-door');
        if(snd) snd.play();
        d.style.transform = "scale(8)"; d.style.opacity = "0";
        if (!currentID) {
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            localStorage.setItem('gy_trace', currentID);
        }
        updateIDUI(currentID);
        setTimeout(() => { 
            portalTransition('block-welcome'); 
            const a = document.getElementById('snd-ambient'); if(a) a.play();
        }, 1500);
    }

    function portalTransition(nextId) {
        if (nextId === 'block-tables') { window.location.href = 'tables.html'; return; }
        const current = document.querySelector('.block.active');
        if(current) { current.style.opacity = "0"; current.classList.remove('active'); setTimeout(()=>current.style.display="none", 600); }
        const next = document.getElementById(nextId);
        setTimeout(() => { 
            next.style.display = "flex"; 
            setTimeout(() => { next.classList.add('active'); next.style.opacity = "1"; }, 50);
        }, 600);
    }

    function preview(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => { 
                const img = e.target.result;
                document.getElementById('pp').src = img; document.getElementById('pp').style.display = "block";
                document.getElementById('h-photo').src = img; document.getElementById('txt-photo').style.display = "none";
                document.getElementById('avatar-img').style.display = "none";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function generateAvatar() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('pp').style.display = "none";
        document.getElementById('avatar-img').src = url; document.getElementById('avatar-img').style.display = "block";
        document.getElementById('h-photo').src = url; document.getElementById('txt-avatar').style.display = "none";
    }

    function swapButtons(a, s) { 
        document.getElementById(a).classList.add('btn-sleep'); 
        document.getElementById(s).classList.remove('btn-sleep'); 
    }

    function googleTranslateElementInit() { 
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element'); 
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
