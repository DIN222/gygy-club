<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v7.8.1 | PROFESSIONAL TOOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --black: #000; --paper: #F5F5DC; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        
        html, body { 
            width: 100%; height: 100%; background: #000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; overflow: hidden; margin: 0; 
        }

        /* ЯЗЫКОВАЯ ПАНЕЛЬ */
        .lang-gateway { position: fixed; top: 15px; left: 15px; z-index: 10000; width: 170px; }
        .btn-main-lang { 
            width: 100%; padding: 10px; background: #000; border: 1.5px solid var(--gold); 
            color: var(--gold); cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; 
        }
        .lang-hint { font-size: 9px; margin-top: 5px; text-align: center; color: var(--gold); letter-spacing: 1px; }
        .anime-arrow { display: block; font-size: 18px; animation: bounce 1.2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); opacity: 0.5; } }

        .lang-dropdown { 
            display: none; flex-direction: column; background: #000; border: 1.5px solid var(--gold); 
            position: absolute; width: 100%; max-height: 60vh; overflow-y: auto; 
        }
        .lang-dropdown.open { display: flex; }
        .btn-sub-lang { 
            background: none; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.1); 
            color: var(--gold); padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 11px; 
        }
        .flag-icon { width: 20px; border: 0.5px solid var(--gold); }

        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 1000; font-size: 24px; font-weight: bold; }

        /* СЦЕНЫ */
        .block { 
            position: fixed; inset: 0; display: none; flex-direction: column; 
            align-items: center; justify-content: center; background: #000; 
            z-index: 10; opacity: 0; transition: opacity 0.8s ease; 
        }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .quote-text { 
            font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; 
            text-align: center; max-width: 85%; margin-bottom: 25px; 
        }

        .btn-gy { 
            min-width: 275px; padding: 14px; background: transparent; border: 2px solid var(--gold); 
            color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; 
            margin: 8px 0; font-family: inherit; transition: 0.3s; 
        }
        .btn-sleep { opacity: 0.2; pointer-events: none; }

        /* КАРТОЧКА ЮЗЕРА */
        .id-card-hall { 
            width: 240px; padding: 20px; border: 2px solid var(--gold); background: var(--paper); 
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; 
        }
        .box-final { 
            width: 85px; height: 85px; border: 2px solid #000; display: flex; 
            align-items: center; justify-content: center; overflow: hidden; position: relative; 
        }
        .user-flag-tag { 
            position: absolute; bottom: 2px; right: 2px; width: 18px; 
            border: 0.5px solid #000; z-index: 5; 
        }
        
        #main-door { width: 280px; cursor: pointer; transition: 2.5s; }
        .rtl { direction: rtl; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="lang-gateway">
        <button class="btn-main-lang" id="main-lang-trigger" onclick="document.getElementById('lang-list').classList.toggle('open')">
            <img id="cur-flag" src="https://flagcdn.com/w20/gb.png" class="flag-icon">
            <span id="cur-name">ENGLISH</span>
        </button>
        <div class="lang-hint">
            <b class="anime-arrow">↑</b><br>
            <span data-key="lang_hint">SELECT LANGUAGE</span>
        </div>
        <div id="lang-list" class="lang-dropdown">
            <button class="btn-sub-lang" onclick="pickL('en','gb','ENGLISH')"><img src="https://flagcdn.com/w20/gb.png" class="flag-icon"> ENGLISH</button>
            <button class="btn-sub-lang" onclick="pickL('ru','ru','РУССКИЙ')"><img src="https://flagcdn.com/w20/ru.png" class="flag-icon"> РУССКИЙ</button>
            <button class="btn-sub-lang" onclick="pickL('ua','ua','УКРАЇНСЬКА')"><img src="https://flagcdn.com/w20/ua.png" class="flag-icon"> УКРАЇНСЬКА</button>
            <button class="btn-sub-lang" onclick="pickL('pl','pl','POLSKI')"><img src="https://flagcdn.com/w20/pl.png" class="flag-icon"> POLSKI</button>
            <button class="btn-sub-lang" onclick="pickL('de','de','DEUTSCH')"><img src="https://flagcdn.com/w20/de.png" class="flag-icon"> DEUTSCH</button>
            <button class="btn-sub-lang" onclick="pickL('fr','fr','FRANÇAIS')"><img src="https://flagcdn.com/w20/fr.png" class="flag-icon"> FRANÇAIS</button>
            <button class="btn-sub-lang" onclick="pickL('it','it','ITALIANO')"><img src="https://flagcdn.com/w20/it.png" class="flag-icon"> ITALIANO</button>
            <button class="btn-sub-lang" onclick="pickL('es','es','ESPAÑOL')"><img src="https://flagcdn.com/w20/es.png" class="flag-icon"> ESPAÑOL</button>
            <button class="btn-sub-lang" onclick="pickL('cn','cn','中文')"><img src="https://flagcdn.com/w20/cn.png" class="flag-icon"> 中文</button>
            <button class="btn-sub-lang" onclick="pickL('jp','jp','日本語')"><img src="https://flagcdn.com/w20/jp.png" class="flag-icon"> 日本語</button>
            <button class="btn-sub-lang" onclick="pickL('ae','ae','العربية')"><img src="https://flagcdn.com/w20/ae.png" class="flag-icon"> العربية</button>
            <button class="btn-sub-lang" onclick="pickL('br','br','PORTUGUÊS')"><img src="https://flagcdn.com/w20/br.png" class="flag-icon"> PORTUGUÊS</button>
        </div>
    </div>

    <div class="ui-header-right">GY-GY</div>

    <div id="block-entrance" class="block active">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()" alt="Entrance">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text" data-key="q_whiskey">«Every joke has a grain of whiskey»</div>
        <img src="horse_welcome.png" style="max-height: 40vh; margin-bottom: 20px;">
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')" data-key="btn_to_hall">PROCEED TO HALL</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')" data-key="btn_get_id">GET ID TOKEN</button>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text" data-key="q_champ">«No such thing as too much champagne»</div>
        <div style="display:flex; gap:10px; margin-bottom:25px;">
            <div class="box-final" id="id-label" style="border-color:var(--gold); font-size:10px;">#ID</div>
            <div class="box-final" id="qr-box-reg" style="border-color:var(--gold);"></div>
            <div class="box-final" style="border-color:var(--gold); cursor:pointer;" onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" onchange="preview(this)" style="display:none;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-photo" style="font-size:10px;" data-key="label_photo">PHOTO</span>
            </div>
            <div class="box-final" style="border-color:var(--gold); cursor:pointer;" onclick="generateAvatar()">
                <img id="avatar-img" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-avatar" style="font-size:10px; text-align:center;" data-key="label_avatar">GEN<br>AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="saveUserData()" data-key="btn_save">SAVE PROFILE</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')" data-key="btn_to_hall">PROCEED TO HALL</button>
    </div>

    <div id="block-hall" class="block">
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:10px; font-size:14px;">#ID</div>
            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <div class="box-final">
                    <img id="h-photo" style="width:100%; height:100%; object-fit:cover;">
                    <img id="h-flag" src="" class="user-flag-tag">
                </div>
                <div class="box-final" id="h-qr"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; color:#000; border-color:#000;" onclick="confirmAndEnter()" data-key="btn_confirm">CONFIRM</button>
            <button id="btn-enter-bar" class="btn-gy btn-sleep" style="min-width:100%; color:#000; border-color:#000;" onclick="portalTransition('block-bar')" data-key="btn_enter">ENTER BAR</button>
        </div>
    </div>

    <div id="block-bar" class="block">
        <img src="horse_bar.png" style="height: 60vh; margin-bottom: -20px;">
        <div style="display:flex; gap:10px;">
            <button class="btn-gy" style="min-width:140px;" data-key="btn_tables">TABLES</button>
            <button class="btn-gy" style="min-width:140px;" data-key="btn_ai">AI ROOM</button>
        </div>
    </div>

<script>
    const langData = {
        en: { flag: 'gb', name: 'ENGLISH', lang_hint: "SELECT LANGUAGE", q_whiskey: "«Every joke has a grain of whiskey»", btn_to_hall: "PROCEED TO HALL", btn_get_id: "GET ID", btn_save: "SAVE", btn_confirm: "CONFIRM", btn_enter: "ENTER BAR", label_photo: "PHOTO", label_avatar: "AVATAR", btn_tables: "TABLES", btn_ai: "AI ROOM" },
        ru: { flag: 'ru', name: 'РУССКИЙ', lang_hint: "ВЫБЕРИТЕ ЯЗЫК", q_whiskey: "«В каждой шутке есть доля виски»", btn_to_hall: "В ХОЛЛ", btn_get_id: "ПОЛУЧИТЬ ID", btn_save: "СОХРАНИТЬ", btn_confirm: "ПОДТВЕРДИТЬ", btn_enter: "В БАР", label_photo: "ФОТО", label_avatar: "АВАТАР", btn_tables: "СТОЛИКИ", btn_ai: "AI ROOM" }
    };

    let currentLang = 'en';
    let currentFlag = 'gb';
    let userTrace = null;

    window.onload = () => {
        // Чистим старый мусор, если он мешает
        try {
            const raw = localStorage.getItem('gy_trace');
            if (raw && raw.startsWith('{')) userTrace = JSON.parse(raw);
        } catch(e) { console.warn("Old storage cleared"); localStorage.removeItem('gy_trace'); }

        // Авто-язык
        const sysLang = navigator.language.split('-')[0];
        applyLang(langData[sysLang] ? sysLang : 'en');
        
        if (userTrace) {
            updateIDUI(userTrace.id);
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        }
    };

    function applyLang(l) {
        currentLang = l;
        const data = langData[l] || langData['en'];
        currentFlag = data.flag;
        document.getElementById('cur-flag').src = `https://flagcdn.com/w20/${data.flag}.png`;
        document.getElementById('cur-name').innerText = data.name;
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            el.innerText = data[key] || key;
        });
    }

    function handleDoor() {
        const door = document.getElementById('main-door');
        door.style.transform = "scale(5)";
        door.style.opacity = "0";
        
        // Генерим ID если его нет
        if (!userTrace) {
            const newID = `#GY-${Math.floor(100+Math.random()*899)}`;
            userTrace = { id: newID, flag: currentFlag };
            updateIDUI(newID);
        }
        
        // ПЕРЕХОД (с защитой от зависания)
        setTimeout(() => {
            portalTransition('block-welcome');
        }, 1000);
    }

    function updateIDUI(id) {
        document.getElementById('id-label').innerText = id;
        document.getElementById('h-id').innerText = id;
        // Защита: если библиотека QRCode не загрузилась, сайт не упадет
        if (typeof QRCode !== "undefined") {
            const qrC = document.getElementById("qr-box-reg");
            qrC.innerHTML = "";
            new QRCode(qrC, { text: id, width: 85, height: 85 });
            const qrH = document.getElementById("h-qr");
            qrH.innerHTML = "";
            new QRCode(qrH, { text: id, width: 85, height: 85 });
        }
    }

    function portalTransition(nextId) {
        const cur = document.querySelector('.block.active');
        if (cur) {
            cur.style.opacity = "0";
            setTimeout(() => {
                cur.classList.remove('active');
                cur.style.display = "none";
                
                const next = document.getElementById(nextId);
                if (next) {
                    next.style.display = "flex";
                    // Маленькая задержка для инициализации opacity
                    setTimeout(() => {
                        next.classList.add('active');
                        next.style.opacity = "1";
                    }, 50);
                }
            }, 600);
        }
    }

    function pickL(l, f, n) {
        applyLang(l);
        document.getElementById('lang-list').classList.remove('open');
    }
</script>
</body>
</html>
