<!DOCTYPE html>
<html lang="en" class="notranslate" google="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.8.9 | RECONSTRUCTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --glow: rgba(212, 175, 55, 0.8); }
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; outline: none; }
        html, body { width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin:0; }
        
        #google_translate_element { position: fixed; top: 15px; left: 15px; z-index: 1000001; }
        .goog-te-gadget .goog-te-combo { background: #000 !important; color: var(--gold) !important; border: 2px solid var(--gold) !important; padding: 6px; border-radius: 4px; font-family: 'Share Tech Mono'; font-size: 12px; width: 190px; }
        .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame, .skiptranslate > iframe { display: none !important; }
        body { top: 0px !important; }

        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 1000001; font-size: 26px; letter-spacing: 6px; font-weight: bold; color: var(--gold); text-shadow: 0 0 15px var(--glow); }

        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.6s ease; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto !important; }
        
        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; color: var(--gold); text-align: center; max-width: 85%; margin-bottom: 10px; text-shadow: 0 0 10px var(--glow); z-index: 50; }
        
        .btn-gy { background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; font-family: 'Share Tech Mono'; transition: 0.3s; box-shadow: 0 0 8px var(--glow); position: relative; z-index: 100; }
        .btn-gy:active { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; box-shadow: none !important; }

        .welcome-btn-container { display: flex; gap: 10px; justify-content: center; width: 95%; margin-top: 5px; }
        .btn-welcome-mini { min-width: 140px; padding: 10px 5px; font-size: 11px; }

        .horse-welcome-img { max-height: 55vh; width: auto; filter: drop-shadow(0 0 35px var(--glow)); margin-bottom: 5px; z-index: 40; }
        .horse-bar-img { height: 70vh; width: auto; object-fit: contain; filter: drop-shadow(0 0 30px var(--glow)); margin-bottom: 18vh; }
        
        .bar-ui-container { position: absolute; bottom: 3vh; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 1000; }
        .bar-row { display: flex; gap: 10px; margin-bottom: 10px; width: 90%; justify-content: center; }

        .id-card-hall { position: absolute; top: 65%; left: 50%; transform: translate(-50%,-50%); width: 260px; padding: 20px; border: 2px solid var(--gold); background: #F5F5DC; border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; z-index: 30; box-shadow: 0 0 30px var(--gold); }
        .box-final { width: 90px; height: 90px; border: 2px solid #000; background: #FFF !important; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-header-right">GY-GY</div>

    <audio id="snd-door"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>
    <audio id="snd-khe"><source src="charlie_bar_fx.mp3" type="audio/mpeg"></audio>
    <audio id="snd-pour"><source src="pour_whisky.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()" style="width:280px; cursor:pointer;" alt="ENTER">
    </div>

    <div id="block-welcome" class="block" style="justify-content: flex-start; padding-top: 3vh;">
        <div class="quote-text">"Every joke has a grain of whiskey"</div>
        <img src="horse_welcome.png" class="horse-welcome-img">
        <div style="font-family: 'Playfair Display'; font-size: 26px; font-weight: 900; letter-spacing: 8px; margin-bottom: 5px; text-transform: uppercase;">WELCOME</div>
        <div class="welcome-btn-container">
            <button id="btn-w-hall" class="btn-gy btn-welcome-mini btn-sleep" onclick="portalTransition('block-hall')">TO HALL</button>
            <button class="btn-gy btn-welcome-mini" onclick="portalTransition('block-identity')">GET ID</button>
        </div>
    </div>

    <div id="block-identity" class="block">
        <div style="display:flex; gap:10px; margin-bottom:25px;">
            <div class="box-final" id="id-label" style="font-size:10px; color:#000; font-weight:bold;">#ID</div>
            <div class="box-final" id="qr-box-reg"></div>
            <div class="box-final" onclick="document.getElementById('file-input').click()" style="cursor:pointer;">
                <input type="file" id="file-input" onchange="preview(this)" style="display:none;" accept="image/*">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-photo" style="color:#000; font-size:10px; font-weight:bold;">PHOTO</span>
            </div>
            <div class="box-final" onclick="generateAvatar()" style="cursor:pointer;">
                <img id="avatar-img" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-avatar" style="color:#000; font-size:10px; font-weight:bold;">AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" style="min-width:270px; padding:14px;" onclick="saveReg()">SAVE DATA</button>
        <button id="btn-pass" class="btn-gy btn-sleep" style="min-width:270px; padding:14px;" onclick="portalTransition('block-hall')">ENTER THE HALL</button>
    </div>

    <div id="block-hall" class="block">
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; font-size:14px; margin-bottom:12px;">#ID</div>
            <div style="display:flex; gap:15px; margin-bottom:12px;">
                <div class="box-final"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="box-final" id="h-qr"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; border-color:#000; color:#000; padding:14px;" onclick="swapButtons('btn-confirm', 'btn-enter-bar')">CONFIRM</button>
            <button id="btn-enter-bar" class="btn-gy btn-sleep" style="min-width:100%; border-color:#000; color:#000; padding:14px;" onclick="portalTransition('block-bar')">ENTER THE BAR</button>
        </div>
    </div>

    <div id="block-bar" class="block" style="justify-content: flex-end;">
        <img src="horse_bar.png" class="horse-bar-img">
        <div class="bar-ui-container">
            <div class="bar-row">
                <button class="btn-gy" style="flex:1; max-width:150px; padding:10px; font-size:11px;" onclick="window.location.href='bridge_protocol.html'">AI SERVER</button>
                <button class="btn-gy" style="flex:1; max-width:150px; padding:10px; font-size:11px;" onclick="window.location.href='tables.html'">TABLES</button>
            </div>
            <button class="btn-gy" style="min-width:310px; padding:10px; font-size:12px;" onclick="portalTransition('block-hall')">BACK TO HALL</button>
        </div>
    </div>

<script>
    let currentID = "";
    const langMap = {
        'en': '🇬🇧 English', 'ru': '🇷🇺 Russian', 'uk': '🇺🇦 Ukrainian', 'pl': '🇵🇱 Polish',
        'fr': '🇫🇷 French', 'de': '🇩🇪 German', 'es': '🇪🇸 Spanish', 'it': '🇮🇹 Italian',
        'zh-CN': '🇨🇳 Chinese', 'ja': '🇯🇵 Japanese', 'ko': '🇰🇷 Korean', 'tr': '🇹🇷 Turkish'
    };

    function applyLang() {
        const sel = document.querySelector('.goog-te-combo');
        if (sel) {
            Array.from(sel.options).forEach(o => {
                if (langMap[o.value]) o.text = langMap[o.value];
                else if (o.value === "") o.text = "🌐 Select Language";
            });
        }
    }

    // Advanced observer for language list
    const obs = new MutationObserver(() => applyLang());
    obs.observe(document.documentElement, { childList: true, subtree: true });
    setInterval(applyLang, 500);

    function googleTranslateElementInit() { 
        new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element'); 
    }

    window.onload = () => {
        const saved = localStorage.getItem('gy_trace');
        if (saved) { currentID = saved; updateIDUI(saved); document.getElementById('btn-w-hall').classList.remove('btn-sleep'); }
    };

    function updateIDUI(id) {
        document.getElementById('id-label').innerText = id;
        document.getElementById('h-id').innerText = id;
        document.getElementById('qr-box-reg').innerHTML = "";
        new QRCode(document.getElementById("qr-box-reg"), { text: id, width: 90, height: 90 });
        document.getElementById('h-qr').innerHTML = "";
        new QRCode(document.getElementById("h-qr"), { text: id, width: 90, height: 90 });
    }

    function handleDoor() {
        document.getElementById('snd-door').play().catch(()=>{});
        if (!currentID) {
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            localStorage.setItem('gy_trace', currentID);
        }
        updateIDUI(currentID);
        portalTransition('block-welcome');
        setTimeout(() => { document.getElementById('snd-ambient').play().catch(()=>{}); }, 1000);
    }

    function portalTransition(nextId) {
        const cur = document.querySelector('.block.active');
        if(cur) cur.style.opacity = "0";
        setTimeout(() => {
            if(cur) cur.classList.remove('active');
            const nxt = document.getElementById(nextId);
            if(nxt) { 
                nxt.classList.add('active'); 
                setTimeout(() => nxt.style.opacity = "1", 50);
                if(nextId === 'block-bar') {
                    setTimeout(() => document.getElementById('snd-khe').play().catch(()=>{}), 500);
                    setTimeout(() => document.getElementById('snd-pour').play().catch(()=>{}), 1500);
                }
            }
        }, 600);
    }

    function preview(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => { 
                document.getElementById('avatar-img').style.display = "none";
                document.getElementById('pp').src = e.target.result; document.getElementById('pp').style.display = "block";
                document.getElementById('h-photo').src = e.target.result; 
                document.getElementById('txt-photo').style.display = "none";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function generateAvatar() {
        document.getElementById('pp').style.display = "none";
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('avatar-img').src = url; 
        document.getElementById('avatar-img').style.display = "block";
        document.getElementById('h-photo').src = url; 
        document.getElementById('txt-avatar').style.display = "none";
        document.getElementById('txt-photo').style.display = "none";
    }

    function saveReg() {
        swapButtons('btn-save', 'btn-pass');
        document.getElementById('btn-w-hall').classList.remove('btn-sleep');
    }

    function swapButtons(a, s) { 
        document.getElementById(a).classList.add('btn-sleep'); 
        document.getElementById(s).classList.remove('btn-sleep'); 
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
