<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v5.2.9 | STABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --neon: rgba(212, 175, 55, 0.8); }
        * { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; }

        /* --- СЕКЦИЯ 1: ЗАМОРОЖЕНО (UI & TOP BAR) --- */
        .ui-top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; display: flex; justify-content: center; align-items: center; z-index: 5000; pointer-events: none; }
        .ui-logo { font-size: 24px; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); pointer-events: auto; }
        .lang-gateway { position: fixed; top: 20px; left: 20px; z-index: 7000; }
        .btn-main-lang { min-width: 130px; padding: 10px; background: #000; border: 1.5px solid var(--gold); color: var(--gold); cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 900; font-family: inherit; }
        .lang-dropdown { position: absolute; top: 100%; left: 0; display: none; flex-direction: column; background: #000; border: 1.5px solid var(--gold); width: 180px; max-height: 70vh; overflow-y: auto; }
        .lang-dropdown.open { display: flex; }
        .btn-sub-lang { background: none; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.1); color: var(--gold); padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 12px; font-family: inherit; }
        
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; opacity: 0; transition: opacity 0.5s; z-index: 10; }
        .block.active { display: flex; opacity: 1; }

        /* --- СЕКЦИЯ 2: РАБОЧАЯ (IDENTITY & GRID) --- */
        .identity-grid { display: flex; gap: 15px; margin-bottom: 30px; }
        .box-gold { 
            width: 80px; height: 80px; 
            border: 2px solid var(--gold); 
            background: rgba(255, 255, 255, 0.03);
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .box-gold span { font-size: 9px; font-weight: 900; text-transform: uppercase; }
        
        /* Состояния выбора */
        .state-off { opacity: 0.15; filter: grayscale(1) blur(1px); transform: scale(0.9); pointer-events: none; }
        .state-on { border-width: 3px; box-shadow: 0 0 20px var(--neon); background: rgba(212, 175, 55, 0.15); transform: scale(1.05); }

        .btn-gy { min-width: 250px; padding: 15px; background: none; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; font-family: inherit; font-weight: 900; text-transform: uppercase; margin: 10px 0; }
        .btn-sleep { opacity: 0.2; pointer-events: none; }

        /* ХОЛЛ */
        .id-card-hall { 
            width: 300px; padding: 25px; background: #F5F5DC; border: 5px solid #3E2723; 
            color: #000; border-radius: 12px; text-align: center; box-shadow: 0 20px 50px #000;
        }
    </style>
</head>
<body>

    <div class="ui-top-bar"><div class="ui-logo">GY-GY</div></div>

    <div id="block-entrance" class="block active" style="opacity:1">
        <img src="door_1.jpg" id="main-door" style="width:280px; cursor:pointer;" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block">
        <img src="horse_welcome.png" style="max-height:30vh; margin-bottom:20px;">
        <div style="display:flex; gap:10px;">
            <button class="btn-gy" style="min-width:140px;" onclick="portalTransition('block-identity')">IDENTITY</button>
            <button id="btn-w-hall" class="btn-gy btn-sleep" style="min-width:140px;" onclick="portalTransition('block-hall')">TO HALL</button>
        </div>
    </div>

    <div id="block-identity" class="block">
        <div class="identity-grid">
            <div class="box-gold" id="box-id">
                <span id="id-label">#ID</span>
                <img id="id-flag" src="https://flagcdn.com/w20/gb.png" style="width:20px; margin-top:5px;">
            </div>
            <div class="box-gold" id="qr-reg"></div>
            
            <div class="box-gold" id="box-photo" onclick="document.getElementById('file-in').click()">
                <input type="file" id="file-in" onchange="usePhoto(this)" style="display:none;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-p">PHOTO</span>
            </div>

            <div class="box-gold" id="box-avatar" onclick="useAvatar()">
                <img id="av" style="display:none; width:100%; height:100%;">
                <span id="txt-a">AVATAR</span>
            </div>
        </div>
        <button class="btn-gy" onclick="saveProfile()">SAVE PROFILE</button>
    </div>

    <div id="block-hall" class="block">
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:15px; font-size:18px;">#ID-CARD</div>
            <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
                <div style="width:80px; height:80px; background:#fff; border:1px solid #3E2723;"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div id="h-qr" style="width:80px; height:80px; background:#fff; border:1px solid #3E2723;"></div>
            </div>
            <button class="btn-gy" style="color:#3E2723; border-color:#3E2723; width:100%;">ENTER BAR</button>
        </div>
    </div>

    <script>
        let currentID = `#GY-${Math.floor(100+Math.random()*900)}-${Math.floor(1000+Math.random()*9000)}`;

        function handleDoor() {
            document.getElementById('main-door').style.transform = "scale(5)";
            document.getElementById('main-door').style.opacity = "0";
            updateVisuals();
            setTimeout(() => portalTransition('block-welcome'), 1000);
        }

        function updateVisuals() {
            document.getElementById('id-label').innerText = currentID;
            document.getElementById('h-id').innerText = currentID;
            new QRCode(document.getElementById('qr-reg'), {text: currentID, width: 60, height: 60, colorDark: "#d4af37", colorLight: "transparent"});
            new QRCode(document.getElementById('h-qr'), {text: currentID, width: 80, height: 80});
        }

        // ЛОГИКА ВЫБОРА: Одно включаем, второе гасим
        function usePhoto(input) {
            if(input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => {
                    document.getElementById('pp').src = e.target.result;
                    document.getElementById('pp').style.display = "block";
                    document.getElementById('h-photo').src = e.target.result;
                    document.getElementById('txt-p').style.display = "none";
                    
                    document.getElementById('box-photo').className = "box-gold state-on";
                    document.getElementById('box-avatar').className = "box-gold state-off";
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        function useAvatar() {
            const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
            document.getElementById('av').src = url;
            document.getElementById('av').style.display = "block";
            document.getElementById('h-photo').src = url;
            document.getElementById('txt-a').style.display = "none";

            document.getElementById('box-avatar').className = "box-gold state-on";
            document.getElementById('box-photo').className = "box-gold state-off";
        }

        function saveProfile() {
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
            portalTransition('block-hall');
        }

        function portalTransition(id) {
            document.querySelectorAll('.block').forEach(b => { b.classList.remove('active'); b.style.display="none"; });
            const next = document.getElementById(id);
            next.style.display = "flex";
            setTimeout(() => next.classList.add('active'), 50);
        }
    </script>
</body>
</html>
