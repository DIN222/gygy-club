<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.4.63 | AUDIO RESTORED</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&family=Inter:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; --neon-glow: rgba(212, 175, 55, 0.4); }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin:0; }
        
        #google_translate_element { position: fixed; top: 10px; left: 10px; z-index: 1000001; }
        .ui-header-right { position: fixed; top: 15px; right: 20px; z-index: 1000000; font-size: 20px; letter-spacing: 3px; font-weight: bold; }
        
        .ui-back-to-bar { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000005;
            background: rgba(0,0,0,0.8); border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 20px; cursor: pointer; display: none; text-transform: uppercase;
        }

        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: var(--gold); text-align: center; max-width: 85%; margin-bottom: 15px; }
        .welcome-img { max-height: 35vh; width: auto; margin-bottom: 10px; }
        
        .btn-gy { min-width: 260px; padding: 12px; background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; margin: 5px 0; font-family: 'Share Tech Mono'; transition: 0.4s; pointer-events: auto !important; }
        .btn-gy:hover { box-shadow: 0 0 15px var(--neon-glow); }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; }

        .id-card-hall { position: absolute; top: 65%; left: 50%; transform: translate(-50%,-50%); width: 220px; padding: 15px; border: 2px solid var(--gold); background: #F5F5DC; border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; z-index: 30; }
        .box-final { width: 80px; height: 80px; border: 1px solid #000; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        #main-door { width: 250px; cursor: pointer; transition: transform 2s, opacity 1.5s; z-index: 9999; }
        
        #block-tables { background: url('lounge.jpg') no-repeat center bottom / contain #000; }
        .lamp-zone { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, var(--neon-glow) 0%, transparent 70%); border: 1px solid var(--violet); box-shadow: 0 0 15px var(--neon-glow); transform: translate(-50%, -50%); cursor: pointer; }

        .bar-ui-overlay { 
            position: absolute; bottom: 8vh; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 380px; z-index: 1000; pointer-events: none; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .bar-row { width: 100%; display: flex; justify-content: space-between; padding: 0 10px; pointer-events: none; }
        .bar-row .btn-gy { min-width: 160px; background: rgba(0,0,0,0.6); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-header-right">GY-GY</div>
    <button class="ui-back-to-bar" id="btn-global-back" onclick="portalTransition('block-bar')">Назад в бар</button>

    <audio id="snd-door" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3" type="audio/mpeg"></audio>
    <audio id="snd-khe" preload="auto"><source src="charlie_bar_fx.mp3" type="audio/mpeg"></audio>
    <audio id="snd-pour" preload="auto"><source src="pour_whisky.mp3" type="audio/mpeg"></audio>
    <audio id="snd-server" loop preload="auto"><source src="server_room_hum.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block" style="justify-content: flex-start; padding-top: 8vh;">
        <div class="quote-text">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" class="welcome-img">
        <div style="font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; letter-spacing: 8px; margin-bottom: 10px; font-style: italic;">WELCOME</div>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОХОДИТЕ В ХОЛЛ</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')">ПОЛУЧИТЬ ID</button>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text">«Шампанского много не бывает»</div>
        <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-bottom:20px;">
            <div class="box-final" style="background:transparent; border-color:var(--gold); color:var(--gold); font-size:10px;" id="id-label">#ID</div>
            <div class="box-final" id="qr-box-reg" style="border-color:var(--gold);"></div>
            <div class="box-final" style="border-color:var(--gold); position:relative; cursor:pointer;">
                <input type="file" accept="image/*" onchange="preview(this)" style="position:absolute; inset:0; opacity:0; z-index: 10;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-photo" style="color:#000; font-size:10px; font-weight:900;">ФОТО</span>
            </div>
            <div class="box-final" onclick="generateAvatar()" style="border-color:var(--gold); cursor:pointer;">
                <img id="av" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-avatar" style="color:#000; font-size:10px; font-weight:900;">АВАТАР</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="finalizeReg()">СОХРАНИТЬ</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОЙТИ В ХОЛЛ</button>
    </div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; z-index:15;"></div>
        <div style="position:absolute; top: 10%; width: 100%; text-align: center; color: #3E2723; font-size: 32px; font-weight: 900; font-style: italic; font-family: 'Playfair Display', serif; z-index: 25;">«Всё будет GY-GY»</div>
        
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; font-size:14px; margin-bottom:10px;">#ID</div>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <div class="box-final"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="box-final" id="h-qr"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; border-color:#000; color:#000;" onclick="swapButtons('btn-confirm', 'btn-enter-bar')">ПОДТВЕРДИТЬ</button>
            <button id="btn-enter-bar" class="btn-gy btn-sleep" style="min-width:100%; border-color:#000; color:#000; display:none;" onclick="portalTransition('block-bar')">ВХОД В БАР</button>
        </div>
    </div>

    <div id="block-bar" class="block" style="padding:0; justify-content: flex-end;">
        <div class="bar-ui-overlay">
            <div class="bar-row">
                <button class="btn-gy" onclick="portalTransition('block-tables')">СТОЛИКИ</button>
                <button class="btn-gy" onclick="deepDive()">AI ROOM</button>
            </div>
            <div style="margin-top: 10px; pointer-events: none;">
                <button class="btn-gy" style="min-width: 220px; background: rgba(0,0,0,0.6);" onclick="portalTransition('block-hall')">В ХОЛЛ</button>
            </div>
        </div>
        <img src="horse_bar.png" style="height: 80vh; width: auto; object-fit: contain; margin-bottom: -5px; position: relative; z-index: 5;">
    </div>

    <div id="block-tables" class="block">
        <div class="lamp-zone" style="bottom: 50%; left: 50%;"></div>
        <div class="lamp-zone" style="bottom: 25%; left: 35%;"></div>
    </div>

    <script>
        let currentID = "";
        let finalImageData = "";

        function portalTransition(nextId) {
            const current = document.querySelector('.block.active');
            const backBtn = document.getElementById('btn-global-back');
            const amb = document.getElementById('snd-ambient');

            if(current) { current.style.opacity = "0"; current.style.pointerEvents = "none"; }
            
            backBtn.style.display = (nextId === 'block-tables') ? "block" : "none";
            setTimeout(() => { if(nextId === 'block-tables') backBtn.style.opacity = "1"; }, 100);

            setTimeout(() => {
                if(current) { current.classList.remove('active'); current.style.display = "none"; }
                const next = document.getElementById(nextId);
                next.style.display = "flex";
                
                if(nextId === 'block-identity') {
                    document.getElementById('qr-box-reg').innerHTML = "";
                    new QRCode(document.getElementById("qr-box-reg"), { text: currentID, width: 80, height: 80 });
                }

                setTimeout(() => { 
                    next.classList.add('active'); 
                    next.style.opacity = "1";
                    next.style.pointerEvents = "auto";
                    
                    if (nextId === 'block-bar') {
                        fadeAudio(amb, 0.8, 1000);
                        // Эффекты присутствия Чарли
                        setTimeout(() => document.getElementById('snd-khe').play(), 600);
                        setTimeout(() => document.getElementById('snd-pour').play(), 2500);
                    }
                    if (nextId === 'block-tables') fadeAudio(amb, 0.2, 1000);
                    if (nextId === 'block-hall') fadeAudio(amb, 0.3, 1000);
                }, 50);
            }, 800);
        }

        function handleDoor() {
            // Принудительная активация аудио-контекста для всех звуков бара
            const amb = document.getElementById('snd-ambient');
            const khe = document.getElementById('snd-khe');
            const pour = document.getElementById('snd-pour');
            
            [amb, khe, pour].forEach(s => { 
                s.play().then(() => s.pause()).catch(() => {}); 
                s.volume = 0;
            });

            document.getElementById('snd-door').play().catch(()=>{});
            const d = document.getElementById('main-door');
            d.style.transform = "scale(5)"; d.style.opacity = "0";
            
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            document.getElementById('id-label').innerText = currentID;
            
            setTimeout(() => { 
                portalTransition('block-welcome'); 
                amb.play().catch(()=>{});
                fadeAudio(amb, 0.3, 3000);
            }, 1500);
        }

        function deepDive() {
            const amb = document.getElementById('snd-ambient');
            const srv = document.getElementById('snd-server');
            fadeAudio(amb, 0, 1200);
            
            document.body.style.transition = "opacity 1.5s, filter 1.5s";
            document.body.style.opacity = "0";
            document.body.style.filter = "blur(10px)";
            
            srv.volume = 0; srv.play().catch(()=>{});
            fadeAudio(srv, 0.6, 2000);
            setTimeout(() => { window.location.href = 'bridge_protocol.html'; }, 1500);
        }

        function fadeAudio(audio, target, duration) {
            if(!audio) return;
            clearInterval(audio.fader);
            const start = audio.volume; const startTime = Date.now();
            audio.fader = setInterval(() => {
                const progress = Math.min((Date.now() - startTime) / duration, 1);
                audio.volume = start + (target - start) * progress;
                if (progress === 1) clearInterval(audio.fader);
            }, 50);
        }

        function preview(i) {
            if(i.files && i.files[0]) {
                const r = new FileReader();
                r.onload = (e) => { 
                    document.getElementById('pp').src = e.target.result; document.getElementById('pp').style.display = "block";
                    document.getElementById('txt-photo').style.display = "none";
                    finalImageData = e.target.result;
                };
                r.readAsDataURL(i.files[0]);
            }
        }

        function generateAvatar() {
            const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}&backgroundColor=d4af37`;
            document.getElementById('av').src = url; document.getElementById('av').style.display = "block";
            document.getElementById('txt-avatar').style.display = "none";
            finalImageData = url;
        }

        function finalizeReg() {
            document.getElementById('h-id').innerText = currentID;
            document.getElementById('h-photo').src = finalImageData || "";
            document.getElementById('h-qr').innerHTML = document.getElementById('qr-box-reg').innerHTML;
            swapButtons('btn-save', 'btn-pass');
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        }

        function swapButtons(a, s) { 
            document.getElementById(a).style.display = 'none';
            document.getElementById(s).classList.remove('btn-sleep');
            if(s === 'btn-enter-bar') document.getElementById(s).style.display = 'block';
        }

        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element'); 
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
