<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.4.64 | STABLE SCENE 1&2</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&family=Inter:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --door-wood: #3E2723; --violet: #8A2BE2; }
        
        * { -webkit-tap-highlight-color: transparent !important; -webkit-touch-callout: none !important; -webkit-user-select: none !important; user-select: none !important; outline: none !important; }
        a, button, input { -webkit-appearance: none; outline: none !important; pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; pointer-events: none; border: none !important; }

        html, body { width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin:0; }
        
        /* [ФИКС: ПОВОРОТ СТРЕЛКИ НА 180 ГРАДУСОВ] */
        .goog-te-gadget-icon { transform: rotate(180deg) !important; -webkit-transform: rotate(180deg) !important; }
        
        /* Исчезновение панели после выбора */
        .hide-goog { display: none !important; visibility: hidden !important; }
        body { top: 0 !important; }

        #google_translate_element { position: fixed; top: 15px; left: 15px; z-index: 1000001; pointer-events: auto; }
        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 1000000; font-size: 24px; letter-spacing: 5px; font-weight: bold; color: var(--gold); pointer-events: none; }
        
        /* [ФИКС: КНОПКА ВОЗВРАТА В НИЖНЕМ ЛЕВОМ УГЛУ] */
        .ui-back-to-bar { 
            position: fixed; bottom: 30px; left: 25px; z-index: 1000005;
            background: rgba(0,0,0,0.85); border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 18px; cursor: pointer; font-family: 'Share Tech Mono'; 
            font-size: 12px; text-transform: uppercase; border-radius: 4px; opacity: 1; display: block;
        }

        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.8s ease-in-out; pointer-events: none; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; color: var(--gold); text-align: center; max-width: 85%; line-height: 1.3; margin-bottom: 25px; letter-spacing: 1px; }

        /* [ФИКС: ПОДСВЕТКА КОНЯ] */
        .horse-glow {
            max-height: 42vh; width: auto; margin-bottom: 0px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
            animation: horse-pulse 2.5s infinite alternate ease-in-out;
        }
        @keyframes horse-pulse {
            from { filter: drop-shadow(0 0 8px var(--gold)); }
            to { filter: drop-shadow(0 0 25px var(--gold)); }
        }

        /* [ФИКС: УМЕНЬШЕННЫЕ КНОПКИ В РЯД] */
        .welcome-btns-row { display: flex; gap: 10px; justify-content: center; width: 90%; max-width: 400px; margin-top: 15px; }
        .btn-gy-sm { 
            flex: 1; padding: 12px 5px; background: transparent; border: 1.5px solid var(--gold); 
            color: var(--gold); font-size: 10px; font-family: 'Share Tech Mono'; 
            text-transform: uppercase; font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; }

        #main-door { width: 280px; cursor: pointer; transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 2s; z-index: 9999; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-header-right">GY-GY</div>

    <audio id="snd-door" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1; display: flex; pointer-events: auto;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block" style="justify-content: flex-start; padding-top: 5vh;">
        <div class="quote-text">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" class="horse-glow">
        <div style="font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; letter-spacing: 10px; margin-bottom: 15px; color: var(--gold); text-transform: uppercase; font-style: italic;">WELCOME</div>
        
        <div class="welcome-btns-row">
            <button id="btn-w-hall" class="btn-gy-sm btn-sleep" onclick="portalTransition('block-hall')">В ХОЛЛ</button>
            <button class="btn-gy-sm" onclick="portalTransition('block-identity')">ПОЛУЧИТЬ ID</button>
        </div>

        <button class="ui-back-to-bar" onclick="location.reload()">← ВЫХОД</button>
    </div>

    <script>
    let currentID = "";

    // Наблюдатель за Google Translate — скрывает панель после выбора языка
    const observer = new MutationObserver(() => {
        const banner = document.querySelector('.goog-te-banner-frame');
        if (banner) {
            banner.classList.add('hide-goog');
            document.body.style.top = '0';
        }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });

    window.onload = () => {
        const savedID = localStorage.getItem('gy_trace');
        if (savedID) {
            currentID = savedID;
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        }
    };

    function handleDoor() {
        const d = document.getElementById('main-door');
        const snd = document.getElementById('snd-door');
        if(snd) snd.play();
        
        d.style.transform = "scale(5)"; 
        d.style.opacity = "0";
        d.style.pointerEvents = "none";

        if (!currentID) {
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            localStorage.setItem('gy_trace', currentID);
        }

        setTimeout(() => { 
            portalTransition('block-welcome'); 
            const a = document.getElementById('snd-ambient'); 
            if(a) { a.volume = 0; a.play(); fadeAudio(a, 1, 2000); }
        }, 1800);
    }

    function portalTransition(nextId) {
        const current = document.querySelector('.block.active');
        if(current) { current.style.opacity = "0"; current.style.pointerEvents = "none"; }

        setTimeout(() => {
            if(current) { current.classList.remove('active'); current.style.display = "none"; }
            const next = document.getElementById(nextId);
            if(!next) return;
            next.style.display = "flex";
            setTimeout(() => { 
                next.classList.add('active'); 
                next.style.opacity = "1";
                next.style.pointerEvents = "auto";
            }, 50);
        }, 800);
    }

    function fadeAudio(audio, target, duration) {
        const start = audio.volume; 
        const startTime = Date.now();
        const interval = setInterval(() => {
            const progress = Math.min((Date.now() - startTime) / duration, 1);
            audio.volume = start + (target - start) * progress;
            if (progress === 1) clearInterval(interval);
        }, 50);
    }

    function googleTranslateElementInit() { 
        new google.translate.TranslateElement({
            pageLanguage: 'ru', 
            includedLanguages: 'en,de,fr,it,es,zh-CN,ja,ar,hi,pt,tr,ru',
            autoDisplay: false
        }, 'google_translate_element'); 
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
