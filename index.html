<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.4.65 | FULL RESTORATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&family=Inter:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; --neon-glow: rgba(212, 175, 55, 0.4); --bg-dark: #000; }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        html, body { width: 100%; height: 100%; background: var(--bg-dark); color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin: 0; padding: 0; }
        
        #google_translate_element { position: fixed; top: 12px; left: 12px; z-index: 1000001; }
        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 1000000; font-size: 22px; letter-spacing: 4px; font-weight: bold; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        
        .ui-back-to-bar { 
            position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%); z-index: 1000005;
            background: rgba(0,0,0,0.9); border: 2px solid var(--gold); color: var(--gold);
            padding: 12px 28px; cursor: pointer; display: none; text-transform: uppercase;
            font-family: 'Share Tech Mono'; font-weight: 900; letter-spacing: 2px; transition: 0.4s; opacity: 0;
        }

        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; color: var(--gold); text-align: center; max-width: 80%; margin-bottom: 20px; line-height: 1.4; }
        
        .btn-gy { min-width: 280px; padding: 15px; background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; margin: 10px 0; font-family: 'Share Tech Mono'; transition: 0.3s all; letter-spacing: 1px; }
        .btn-gy:active { transform: scale(0.96); background: var(--gold); color: #000; }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; filter: grayscale(1); }

        /* REGISTRATION GRID 2x2 */
        .reg-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
        .box-final { width: 90px; height: 90px; border: 2px solid var(--gold); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .box-id-label { background: transparent; color: var(--gold); font-size: 11px; font-weight: 900; text-align: center; padding: 5px; }

        .id-card-hall { position: absolute; top: 68%; left: 50%; transform: translate(-50%,-50%); width: 240px; padding: 20px; border: 3px solid var(--gold); background: #F5F5DC; border-radius: 15px; display: flex; flex-direction: column; align-items: center; color: #000; z-index: 30; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        
        #main-door { width: 280px; cursor: pointer; transition: transform 2.5s ease-in, opacity 1.8s ease-out; z-index: 9999; filter: drop-shadow(0 0 20px rgba(212,175,55,0.2)); }
        
        .bar-ui-overlay { position: absolute; bottom: 7vh; left: 50%; transform: translateX(-50%); width: 100%; max-width: 400px; z-index: 1000; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .bar-row { width: 100%; display: flex; justify-content: space-around; padding: 0 15px; pointer-events: none; }
        .bar-row .btn-gy { min-width: 150px; background: rgba(0,0,0,0.7); font-size: 13px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-header-right">GY-GY Club</div>
    <button class="ui-back-to-bar" id="btn-global-back" onclick="portalTransition('block-bar')">Вернуться в бар</button>

    <audio id="snd-door" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3" type="audio/mpeg"></audio>
    <audio id="snd-khe" preload="auto"><source src="charlie_bar_fx.mp3" type="audio/mpeg"></audio>
    <audio id="snd-pour" preload="auto"><source src="pour_whisky.mp3" type="audio/mpeg"></audio>
    <audio id="snd-server" loop preload="auto"><source src="server_room_hum.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" style="max-height: 38vh; margin-bottom: 15px; filter: drop-shadow(0 0 15px var(--gold));">
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОХОДИТЕ В ХОЛЛ</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')">ПОЛУЧИТЬ ID</button>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text">«Шампанского много не бывает»</div>
        <div class="reg-container">
            <div class="box-final box-id-label" id="id-label">#ГЕНЕРАЦИЯ...</div>
            <div class="box-final" id="qr-box-reg"></div>
            <div class="box-final" style="cursor:pointer;">
                <input type="file" accept="image/*" onchange="preview(this)" style="position:absolute; inset:0; opacity:0; z-index: 10; cursor:pointer;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-photo" style="color:#000; font-size:11px; font-weight:900;">ЗАГРУЗИТЬ</span>
            </div>
            <div class="box-final" onclick="generateAvatar()" style="cursor:pointer;">
                <img id="av" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-avatar" style="color:#000; font-size:11px; font-weight:900;">АВАТАР</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="finalizeReg()">СОХРАНИТЬ ДАННЫЕ</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">К ВЕРИФИКАЦИИ</button>
    </div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; z-index:15; filter: brightness(0.7);"></div>
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; font-size:16px; margin-bottom:12px; letter-spacing:1px;">#GY-000-0000</div>
            <div style="display:flex; gap:12px; margin-bottom:15px;">
                <div class="box-final" style="border-color:#000; width:85px; height:85px;"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="box-final" id="h-qr" style="border-color:#000; width:85px; height:85px;"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; border-color:#000; color:#000;" onclick="swapButtons('btn-confirm', 'btn-enter-bar')">ПОДТВЕРДИТЬ</button>
            <button id="btn-enter-bar" class="btn-gy btn-sleep" style="min-width:100%; border-color:#000; color:#000; display:none;" onclick="portalTransition('block-bar')">ВОЙТИ В БАР</button>
        </div>
    </div>

    <div id="block-bar" class="block" style="padding:0; justify-content: flex-end;">
        <div class="bar-ui-overlay">
            <div class="bar-row">
                <button class="btn-gy" onclick="portalTransition('block-tables')">СТОЛИКИ</button>
                <button class="btn-gy" onclick="deepDive()">AI ROOM</button>
            </div>
            <div style="margin-top: 15px; pointer-events: none;">
                <button class="btn-gy" style="min-width: 250px; background: rgba(0,0,0,0.8);" onclick="portalTransition('block-hall')">ВЕРНУТЬСЯ В ХОЛЛ</button>
            </div>
        </div>
        <img src="horse_bar.png" style="height: 75vh; width: auto; object-fit: contain; z-index: 5;">
    </div>

    <div id="block-tables" class="block" style="background: url('lounge.jpg') no-repeat center bottom / contain #000;">
        <div class="lamp-zone" style="position: absolute; width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle, var(--neon-glow) 0%, transparent 75%); border: 1px solid var(--violet); bottom: 48%; left: 52%; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 20px var(--violet);"></div>
    </div>

    <script>
        let currentID = ""; 
        let finalImageData = "";
        const snd = {
            door: document.getElementById('snd-door'),
            amb: document.getElementById('snd-ambient'),
            khe: document.getElementById('snd-khe'),
            pour: document.getElementById('snd-pour'),
            srv: document.getElementById('snd-server')
        };

        function portalTransition(nextId) {
            const current = document.querySelector('.block.active');
            const backBtn = document.getElementById('btn-global-back');
            
            if(current) { current.style.opacity = "0"; current.style.pointerEvents = "none"; }
            
            backBtn.style.display = (nextId === 'block-tables') ? "block" : "none";
            setTimeout(() => { if(nextId === 'block-tables') backBtn.style.opacity = "1"; }, 100);

            setTimeout(() => {
                if(current) { current.classList.remove('active'); current.style.display = "none"; }
                const next = document.getElementById(nextId);
                next.style.display = "flex";
                
                if(nextId === 'block-identity' && !currentID) {
                    generateNewID();
                }

                setTimeout(() => { 
                    next.classList.add('active'); 
                    next.style.opacity = "1";
                    next.style.pointerEvents = "auto";
                    
                    if (nextId === 'block-bar') {
                        fadeAudio(snd.amb, 0.7, 1200);
                        setTimeout(() => snd.khe.play(), 800);
                        setTimeout(() => snd.pour.play(), 3000);
                    }
                    if (nextId === 'block-tables') fadeAudio(snd.amb, 0.2, 1000);
                    if (nextId === 'block-hall') fadeAudio(snd.amb, 0.3, 1000);
                }, 50);
            }, 850);
        }

        function handleDoor() {
            // Принудительный запуск звука двери
            snd.door.volume = 1;
            snd.door.play().catch(e => console.log("Unlock required"));

            // Прогрев аудио-движка для бара
            [snd.amb, snd.khe, snd.pour].forEach(s => {
                s.play().then(() => { s.pause(); s.volume = 0; }).catch(() => {});
            });

            const d = document.getElementById('main-door');
            d.style.transform = "scale(6) rotate(5deg)"; 
            d.style.opacity = "0";
            
            generateNewID();
            
            setTimeout(() => { 
                portalTransition('block-welcome'); 
                snd.amb.play().catch(()=>{});
                fadeAudio(snd.amb, 0.3, 3500);
            }, 1600);
        }

        function generateNewID() {
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            document.getElementById('id-label').innerText = currentID;
            const qrBox = document.getElementById("qr-box-reg");
            qrBox.innerHTML = "";
            new QRCode(qrBox, { text: currentID, width: 90, height: 90, colorDark: "#000", colorLight: "#fff" });
        }

        function preview(i) {
            if(i.files && i.files[0]) {
                const r = new FileReader();
                r.onload = (e) => { 
                    document.getElementById('pp').src = e.target.result; 
                    document.getElementById('pp').style.display = "block";
                    document.getElementById('txt-photo').style.display = "none";
                    finalImageData = e.target.result;
                };
                r.readAsDataURL(i.files[0]);
            }
        }

        function generateAvatar() {
            const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}&backgroundColor=d4af37`;
            const avImg = document.getElementById('av');
            avImg.src = url; 
            avImg.style.display = "block";
            document.getElementById('txt-avatar').style.display = "none";
            finalImageData = url;
        }

        function finalizeReg() {
            if(!finalImageData) { alert("Выберите фото или аватар!"); return; }
            document.getElementById('h-id').innerText = currentID;
            document.getElementById('h-photo').src = finalImageData;
            document.getElementById('h-qr').innerHTML = document.getElementById('qr-box-reg').innerHTML;
            swapButtons('btn-save', 'btn-pass');
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        }

        function swapButtons(a, s) { 
            document.getElementById(a).style.display = 'none';
            const target = document.getElementById(s);
            target.classList.remove('btn-sleep');
            if(s === 'btn-enter-bar') target.style.display = 'block';
        }

        function fadeAudio(audio, target, duration) {
            if(!audio) return;
            clearInterval(audio.fader);
            const start = audio.volume; 
            const startTime = Date.now();
            audio.fader = setInterval(() => {
                const progress = Math.min((Date.now() - startTime) / duration, 1);
                audio.volume = start + (target - start) * progress;
                if (progress === 1) clearInterval(audio.fader);
            }, 50);
        }

        function deepDive() {
            fadeAudio(snd.amb, 0, 1000);
            document.body.style.transition = "all 1.8s";
            document.body.style.opacity = "0"; 
            document.body.style.filter = "blur(20px) brightness(0)";
            snd.srv.volume = 0; 
            snd.srv.play().catch(()=>{});
            fadeAudio(snd.srv, 0.5, 2500);
            setTimeout(() => { window.location.href = 'bridge_protocol.html'; }, 2000);
        }

        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({pageLanguage: 'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element'); 
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
