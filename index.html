<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v5.0.8 | STANDARDIZED</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&family=Inter:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --door-wood: #3E2723; }
        * { -webkit-tap-highlight-color: transparent !important; -webkit-user-select: none !important; user-select: none !important; outline: none !important; }
        html, body { width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin:0; }

        /* СТАНДАРТНАЯ ПАНЕЛЬ: ЛОГО И НАВИГАЦИЯ */
        .ui-top-bar { 
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; z-index: 1000000; box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .ui-logo { font-size: 24px; font-weight: 900; letter-spacing: 3px; color: var(--gold); }
        .ui-nav-controls { display: flex; gap: 20px; }
        .nav-btn { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 5px 15px; cursor: pointer; font-family: 'Share Tech Mono'; font-size: 18px; border-radius: 4px; transition: 0.3s; }
        .nav-btn:active { background: var(--gold); color: #000; }
        .nav-hidden { opacity: 0; pointer-events: none; }

        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 26px; text-align: center; max-width: 85%; margin-bottom: 30px; }
        .btn-gy { min-width: 270px; padding: 14px; background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; margin: 8px 0; font-family: 'Share Tech Mono'; }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; }

        .id-card-hall { width: 220px; padding: 15px; border: 2px solid var(--gold); background: #F5F5DC; border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; }
        .box-final { width: 85px; height: 85px; border: 1px solid #000; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #main-door { width: 280px; cursor: pointer; transition: 2s; z-index: 9999; }
    </style>
</head>
<body>

    <div class="ui-top-bar">
        <button id="btn-back" class="nav-btn nav-hidden" onclick="goBack()">←</button>
        <div class="ui-logo">GY-GY</div>
        <button id="btn-forward" class="nav-btn nav-hidden" onclick="goForward()">→</button>
    </div>

    <div id="google_translate_element" style="position:fixed; bottom:10px; left:10px; z-index:1000;"></div>

    <audio id="snd-door" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" style="max-height: 40vh; margin-bottom: 20px;">
        <button class="btn-gy" onclick="portalTransition('block-identity')">ПОЛУЧИТЬ ID</button>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">В ХОЛЛ</button>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text">«Шампанского много не бывает»</div>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <div class="box-final" id="qr-box-reg"></div>
            <div class="box-final" onclick="document.getElementById('file-input').click()" style="cursor:pointer;">
                <input type="file" id="file-input" onchange="preview(this)" style="display:none;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-photo" style="font-size:10px;">ФОТО</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="swapButtons('btn-save', 'btn-pass')">СОХРАНИТЬ</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">ПРОЙТИ В ХОЛЛ</button>
    </div>

    <div id="block-hall" class="block">
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:10px;">#ID</div>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <div class="box-final"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="box-final" id="h-qr"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; border-color:#000; color:#000;" onclick="swapButtons('btn-confirm', 'btn-enter-bar')">ПОДТВЕРДИТЬ</button>
            <button id="btn-enter-bar" class="btn-gy btn-sleep" style="min-width:100%; border-color:#000; color:#000;" onclick="portalTransition('block-bar')">ВХОД В БАР</button>
        </div>
    </div>

    <div id="block-bar" class="block">
        <div class="quote-text">«Игого, сейчас начнем!»</div>
        <img src="horse_bar.png" style="height: 60vh;">
        <button class="btn-gy" onclick="window.location.href='tables.html'">ЗА СТОЛИКИ</button>
    </div>

<script>
    let currentID = "";
    let historyStack = ['block-entrance'];

    // ПРАВИЛО ПРЕДЫДУЩЕГО УРОВНЯ (НАЗАД / ВПЕРЕД)
    function updateNavUI(currentId) {
        const back = document.getElementById('btn-back');
        const forward = document.getElementById('btn-forward');
        
        // Кнопка назад видна везде, кроме самого входа
        if (currentId !== 'block-entrance') {
            back.classList.remove('nav-hidden');
        } else {
            back.classList.add('nav-hidden');
        }
    }

    function goBack() {
        if (historyStack.length > 1) {
            historyStack.pop(); // Удаляем текущий
            const prev = historyStack[historyStack.length - 1];
            portalTransition(prev, true);
        }
    }

    function goForward() {
        // Логика "Вперед" обычно контекстная, но мы можем заложить переход к следующему логическому блоку
        console.log("Вперед нажато");
    }

    function portalTransition(nextId, isBack = false) {
        const current = document.querySelector('.block.active');
        if (current) {
            current.style.opacity = "0";
            setTimeout(() => {
                current.classList.remove('active');
                current.style.display = "none";
                
                const next = document.getElementById(nextId);
                next.style.display = "flex";
                setTimeout(() => {
                    next.classList.add('active');
                    next.style.opacity = "1";
                    if (!isBack) historyStack.push(nextId);
                    updateNavUI(nextId);
                }, 50);
            }, 600);
        }
    }

    function handleDoor() {
        const snd = document.getElementById('snd-door');
        const amb = document.getElementById('snd-ambient');
        // Прогрев звука
        [snd, amb].forEach(s => { if(s){s.play(); s.pause();}});
        
        if(snd) snd.play();
        document.getElementById('main-door').style.transform = "scale(5)";
        document.getElementById('main-door').style.opacity = "0";

        if (!currentID) currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
        localStorage.setItem('gy_trace', currentID);
        
        updateIDUI(currentID);
        setTimeout(() => { 
            portalTransition('block-welcome'); 
            if(amb) { amb.volume = 0; amb.play(); fadeAudio(amb, 1, 2000); }
        }, 1500);
    }

    function updateIDUI(id) {
        setTimeout(() => {
            const qrReg = document.getElementById('qr-box-reg');
            const qrHall = document.getElementById('h-qr');
            document.getElementById('h-id').innerText = id;
            if(qrReg) { qrReg.innerHTML = ""; new QRCode(qrReg, {text: id, width: 85, height: 85}); }
            if(qrHall) { qrHall.innerHTML = ""; new QRCode(qrHall, {text: id, width: 75, height: 75}); }
        }, 100);
    }

    function preview(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => { 
                document.getElementById('pp').src = e.target.result; 
                document.getElementById('pp').style.display = "block";
                document.getElementById('h-photo').src = e.target.result; 
                document.getElementById('txt-photo').style.display = "none";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function swapButtons(a, s) { 
        if (a === 'btn-save' && !document.getElementById('pp').src && !document.getElementById('h-photo').src) {
            alert("Лицо предъявите!"); return;
        }
        document.getElementById(a).classList.add('btn-sleep'); 
        document.getElementById(s).classList.remove('btn-sleep'); 
    }

    function fadeAudio(audio, target, duration) {
        let start = audio.volume;
        let startTime = Date.now();
        let interval = setInterval(() => {
            let progress = Math.min((Date.now() - startTime) / duration, 1);
            audio.volume = start + (target - start) * progress;
            if (progress === 1) clearInterval(interval);
        }, 50);
    }

    function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element'); }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
