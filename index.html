
<!DOCTYPE html>
<html lang="en" class="notranslate" google="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.9.0 | EMERGENCY FIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --glow: rgba(212, 175, 55, 0.8); }
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; outline: none; }
        html, body { width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; margin:0; padding:0; overflow: hidden; }
        
        /* UI ELEMENTS */
        #google_translate_element { position: fixed; top: 15px; left: 15px; z-index: 999999; }
        .goog-te-gadget .goog-te-combo { background: #000 !important; color: var(--gold) !important; border: 2px solid var(--gold) !important; padding: 5px; border-radius: 4px; font-size: 12px; }
        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 999999; font-size: 26px; font-weight: bold; text-shadow: 0 0 15px var(--glow); }

        /* ENGINE */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; opacity: 0; transition: opacity 0.5s ease; z-index: 10; }
        .block.active { display: flex !important; opacity: 1; }
        
        /* CONTENT */
        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 18px; margin-bottom: 10px; text-align: center; width: 85%; }
        .btn-gy { background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; font-family: 'Share Tech Mono'; padding: 12px; transition: 0.3s; box-shadow: 0 0 8px var(--glow); z-index: 100; }
        .btn-gy:active { background: var(--gold); color: #000; }
        .btn-sleep { opacity: 0.2; pointer-events: none; }

        /* HORSE & BUTTONS */
        .horse-welcome-img { max-height: 50vh; filter: drop-shadow(0 0 30px var(--glow)); margin: 10px 0; }
        .welcome-row { display: flex; gap: 10px; }
        .btn-mini { min-width: 130px; font-size: 11px; }

        .id-card-hall { width: 260px; padding: 15px; border: 2px solid var(--gold); background: #F5F5DC; border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; }
        .box-final { width: 85px; height: 85px; border: 2px solid #000; background: #FFF; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        
        /* BAR LAYOUT */
        .bar-ui { position: absolute; bottom: 5vh; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        .bar-row { display: flex; gap: 10px; }
    </style>
</head>
<body onclick="initAudio()">

    <div id="google_translate_element"></div>
    <div class="ui-header-right">GY-GY</div>

    <audio id="snd-door"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1; z-index: 999;">
        <img src="door_1.jpg" id="main-door" onclick="openDoor()" style="width:280px; cursor:pointer; filter: drop-shadow(0 0 20px var(--glow));" alt="ENTER">
        <div style="margin-top: 20px; font-size: 12px; letter-spacing: 4px;">CLICK DOOR TO ENTER</div>
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">"Every joke has a grain of whiskey"</div>
        <img src="horse_welcome.png" class="horse-welcome-img">
        <div style="font-size: 24px; font-weight: 900; letter-spacing: 5px; margin-bottom: 15px;">WELCOME</div>
        <div class="welcome-row">
            <button id="btn-w-hall" class="btn-gy btn-mini btn-sleep" onclick="go('block-hall')">TO HALL</button>
            <button class="btn-gy btn-mini" onclick="go('block-identity')">GET ID</button>
        </div>
    </div>

    <div id="block-identity" class="block">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <div class="box-final" id="id-label" style="font-size:9px; color:#000; font-weight:bold;">#ID</div>
            <div class="box-final" id="qr-reg"></div>
            <div class="box-final" onclick="document.getElementById('f-in').click()" style="cursor:pointer;">
                <input type="file" id="f-in" onchange="preview(this)" style="display:none;" accept="image/*">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="t-ph" style="color:#000; font-size:10px; font-weight:bold;">PHOTO</span>
            </div>
            <div class="box-final" onclick="genAvatar()" style="cursor:pointer;">
                <img id="av-img" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="t-av" style="color:#000; font-size:10px; font-weight:bold;">AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" style="width:270px;" onclick="save()">SAVE DATA</button>
        <button id="btn-pass" class="btn-gy btn-sleep" style="width:270px; margin-top:10px;" onclick="go('block-hall')">PROCEED</button>
    </div>

    <div id="block-hall" class="block">
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:10px;">#ID</div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div class="box-final"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="box-final" id="h-qr"></div>
            </div>
            <button class="btn-gy" style="width:100%; border-color:#000; color:#000;" onclick="go('block-bar')">ENTER BAR</button>
        </div>
    </div>

    <div id="block-bar" class="block" style="justify-content: flex-end; padding-bottom: 20vh;">
        <img src="horse_bar.png" style="height:60vh; filter: drop-shadow(0 0 30px var(--glow));">
        <div class="bar-ui">
            <div class="bar-row">
                <button class="btn-gy btn-mini" onclick="location.href='server.html'">AI SERVER</button>
                <button class="btn-gy btn-mini" onclick="location.href='tables.html'">TABLES</button>
            </div>
            <button class="btn-gy" style="width:270px;" onclick="go('block-hall')">BACK TO HALL</button>
        </div>
    </div>

<script>
    let currentID = "";
    let audioInited = false;

    // AUDIO UNLOCK
    function initAudio() {
        if(!audioInited) {
            document.getElementById('snd-door').play().then(r => {
                document.getElementById('snd-door').pause();
                document.getElementById('snd-door').currentTime = 0;
            }).catch(e => {});
            audioInited = true;
        }
    }

    // LANGUAGE STABILIZER
    const langMap = {
        'en': '🇬🇧 English', 'ru': '🇷🇺 Russian', 'uk': '🇺🇦 Ukrainian', 'pl': '🇵🇱 Polish',
        'fr': '🇫🇷 French', 'de': '🇩🇪 German', 'es': '🇪🇸 Spanish', 'it': '🇮🇹 Italian'
    };

    function fixLangs() {
        const sel = document.querySelector('.goog-te-combo');
        if (sel) {
            Array.from(sel.options).forEach(o => {
                if (langMap[o.value]) o.text = langMap[o.value];
                else if (o.value === "") o.text = "🌐 Select Language";
            });
        }
    }
    setInterval(fixLangs, 500);

    function googleTranslateElementInit() { 
        new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element'); 
    }

    // CORE LOGIC
    function openDoor() {
        document.getElementById('snd-door').play().catch(()=>{});
        const d = document.getElementById('main-door');
        d.style.transition = "2s";
        d.style.transform = "scale(10)";
        d.style.opacity = "0";
        
        if(!currentID) {
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            localStorage.setItem('gy_trace', currentID);
        }
        updateID(currentID);
        setTimeout(() => { 
            go('block-welcome');
            document.getElementById('snd-ambient').play().catch(()=>{});
        }, 1000);
    }

    function go(id) {
        document.querySelectorAll('.block').forEach(b => {
            b.classList.remove('active');
            b.style.opacity = "0";
        });
        const nxt = document.getElementById(id);
        nxt.classList.add('active');
        setTimeout(() => nxt.style.opacity = "1", 50);
    }

    function updateID(id) {
        document.getElementById('id-label').innerText = id;
        document.getElementById('h-id').innerText = id;
        document.getElementById('qr-reg').innerHTML = "";
        new QRCode(document.getElementById("qr-reg"), { text: id, width: 85, height: 85 });
        document.getElementById('h-qr').innerHTML = "";
        new QRCode(document.getElementById("h-qr"), { text: id, width: 85, height: 85 });
    }

    function save() {
        document.getElementById('btn-save').classList.add('btn-sleep');
        document.getElementById('btn-pass').classList.remove('btn-sleep');
        document.getElementById('btn-w-hall').classList.remove('btn-sleep');
    }

    function preview(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => {
                document.getElementById('av-img').style.display = "none";
                document.getElementById('pp').src = e.target.result;
                document.getElementById('pp').style.display = "block";
                document.getElementById('h-photo').src = e.target.result;
                document.getElementById('t-ph').style.display = "none";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function genAvatar() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('pp').style.display = "none";
        document.getElementById('av-img').src = url;
        document.getElementById('av-img').style.display = "block";
        document.getElementById('h-photo').src = url;
        document.getElementById('t-av').style.display = "none";
        document.getElementById('t-ph').style.display = "none";
    }

    window.onload = () => {
        const saved = localStorage.getItem('gy_trace');
        if(saved) {
            currentID = saved;
            updateID(saved);
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        }
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
