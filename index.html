<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v5.1.0 | CAPSULE ARCHITECTURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; --bg: #000; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; margin: 0; position: fixed; }
        
        /* UI CORE */
        #google_translate_element { position: fixed; top: 15px; left: 15px; z-index: 10001; }
        .ui-brand { position: fixed; top: 18px; right: 25px; z-index: 10000; font-size: 22px; font-weight: 900; letter-spacing: 4px; }
        .btn-global-back { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10005; background: rgba(0,0,0,0.9); border: 2px solid var(--gold); color: var(--gold); padding: 12px 25px; cursor: pointer; display: none; text-transform: uppercase; font-weight: 900; opacity: 0; transition: 0.4s; }

        /* CAPSULE BLOCKS */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; opacity: 0; transition: opacity 0.7s ease; pointer-events: none; z-index: 10; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        /* REGISTRATION GRID 2x2 */
        .id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .cell { width: 90px; height: 90px; border: 2px solid var(--gold); background: #fff; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .cell-id { background: transparent; color: var(--gold); font-size: 10px; font-weight: 900; text-align: center; }

        .btn-gy { min-width: 270px; padding: 15px; background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; margin: 8px 0; font-family: 'Share Tech Mono'; transition: 0.3s; }
        .btn-gy:active { background: var(--gold); color: #000; }
        .btn-sleep { opacity: 0.2 !important; pointer-events: none !important; }

        #main-door { width: 260px; cursor: pointer; transition: 2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999; }
        .quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; text-align: center; padding: 0 25px; margin-bottom: 20px; }
        
        /* HALL CARD */
        .card-hall { width: 240px; padding: 20px; background: #F5F5DC; border: 3px solid var(--gold); border-radius: 15px; color: #000; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-brand">GY-GY</div>
    <button class="btn-global-back" id="master-back" onclick="GY_Nav.go('block-bar')">BACK TO BAR</button>

    <div id="audio-vault" style="display:none;">
        <audio id="snd-door"><source src="door_open.mp3" type="audio/mpeg"></audio>
        <audio id="snd-amb" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>
        <audio id="snd-khe"><source src="charlie_bar_fx.mp3" type="audio/mpeg"></audio>
        <audio id="snd-pour"><source src="pour_whisky.mp3" type="audio/mpeg"></audio>
    </div>

    <div id="block-entrance" class="block active" style="opacity:1;">
        <img src="door_1.jpg" id="main-door" onclick="GY_Core.start()">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" style="height: 35vh; margin-bottom: 15px;">
        <button id="w-hall-btn" class="btn-gy btn-sleep" onclick="GY_Nav.go('block-hall')">В ХОЛЛ</button>
        <button class="btn-gy" onclick="GY_Nav.go('block-reg')">ID КАРТА</button>
    </div>

    <div id="block-reg" class="block">
        <div class="quote" style="font-size: 18px;">«Шампанского много не бывает»</div>
        <div class="id-grid">
            <div class="cell cell-id" id="reg-id-display">#ID...</div>
            <div class="cell" id="reg-qr-wrap"></div>
            <div class="cell">
                <input type="file" accept="image/*" onchange="GY_Identity.upload(this)" style="position:absolute; inset:0; opacity:0; z-index:5; cursor:pointer;">
                <img id="reg-img-user" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="reg-img-label" style="color:#000; font-size:10px; font-weight:900;">PHOTO</span>
            </div>
            <div class="cell" onclick="GY_Identity.genAvatar()" style="cursor:pointer;">
                <img id="reg-img-av" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="reg-av-label" style="color:#000; font-size:10px; font-weight:900;">AVATAR</span>
            </div>
        </div>
        <button id="reg-save-btn" class="btn-gy" onclick="GY_Identity.save()">СОХРАНИТЬ</button>
        <button id="reg-next-btn" class="btn-gy btn-sleep" onclick="GY_Nav.go('block-hall')">ДАЛЕЕ</button>
    </div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity:0.5;"></div>
        <div class="card-hall" style="z-index:20;">
            <div id="hall-id-text" style="font-weight:900; margin-bottom:12px;">#ID-WAITING</div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <div class="cell" style="border-color:#000; width:80px; height:80px;"><img id="hall-user-img" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="cell" id="hall-qr-img" style="border-color:#000; width:80px; height:80px;"></div>
            </div>
            <button id="hall-verify" class="btn-gy" style="min-width:100%; border-color:#000; color:#000;" onclick="GY_Identity.verify()">ВЕРИФИКАЦИЯ</button>
            <button id="hall-enter" class="btn-gy btn-sleep" style="min-width:100%; border-color:#000; color:#000; display:none;" onclick="GY_Nav.go('block-bar')">В БАР</button>
        </div>
    </div>

    <div id="block-bar" class="block" style="justify-content: flex-end;">
        <div style="margin-bottom: 5vh; z-index:100; display:flex; flex-direction:column; gap:10px;">
            <div style="display:flex; gap:10px;">
                <button class="btn-gy" style="min-width:130px; background:rgba(0,0,0,0.7);" onclick="GY_Nav.go('block-tables')">СТОЛИКИ</button>
                <button class="btn-gy" style="min-width:130px; background:rgba(0,0,0,0.7);" onclick="GY_Core.deepDive()">AI ROOM</button>
            </div>
            <button class="btn-gy" style="background:rgba(0,0,0,0.7);" onclick="GY_Nav.go('block-hall')">В ХОЛЛ</button>
        </div>
        <img src="horse_bar.png" style="height: 75vh; position:relative; z-index:5;">
    </div>

    <div id="block-tables" class="block" style="background:url('lounge.jpg') center bottom/contain no-repeat;"></div>

    <script>
    /**
     * MODULE: AUDIO CONTROLLER
     * Герметичное управление звуком
     */
    const GY_Audio = {
        pool: {},
        init() {
            this.pool.door = document.getElementById('snd-door');
            this.pool.amb = document.getElementById('snd-amb');
            this.pool.khe = document.getElementById('snd-khe');
            this.pool.pour = document.getElementById('snd-pour');
        },
        play(key, volume = 1) {
            if(this.pool[key]) {
                this.pool[key].volume = volume;
                this.pool[key].play().catch(() => console.warn(`Audio ${key} blocked`));
            }
        },
        fade(key, target, duration) {
            const s = this.pool[key];
            if(!s) return;
            clearInterval(s.fader);
            let start = s.volume;
            let startTime = Date.now();
            s.fader = setInterval(() => {
                let p = Math.min((Date.now() - startTime) / duration, 1);
                s.volume = start + (target - start) * p;
                if(p === 1) clearInterval(s.fader);
            }, 50);
        },
        unlock() {
            Object.values(this.pool).forEach(s => { s.play(); s.pause(); s.volume = 0; });
        }
    };

    /**
     * MODULE: IDENTITY CONTROLLER
     * Управление данными пользователя
     */
    const GY_Identity = {
        id: "",
        pic: "",
        generate() {
            this.id = `#GY-${Math.floor(100+Math.random()*899)}-2026`;
            document.getElementById('reg-id-display').innerText = this.id;
            const wrap = document.getElementById('reg-qr-wrap');
            wrap.innerHTML = "";
            new QRCode(wrap, { text: this.id, width: 90, height: 90 });
        },
        upload(input) {
            if (input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = (e) => {
                    const img = document.getElementById('reg-img-user');
                    img.src = e.target.result; img.style.display = 'block';
                    document.getElementById('reg-img-label').style.display = 'none';
                    this.pic = e.target.result;
                };
                r.readAsDataURL(input.files[0]);
            }
        },
        genAvatar() {
            const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
            const img = document.getElementById('reg-img-av');
            img.src = url; img.style.display = 'block';
            document.getElementById('reg-av-label').style.display = 'none';
            this.pic = url;
        },
        save() {
            if(!this.pic) return alert("Photo or Avatar required!");
            document.getElementById('hall-id-text').innerText = this.id;
            document.getElementById('hall-user-img').src = this.pic;
            document.getElementById('hall-qr-img').innerHTML = document.getElementById('reg-qr-wrap').innerHTML;
            document.getElementById('reg-save-btn').style.display = 'none';
            document.getElementById('reg-next-btn').classList.remove('btn-sleep');
            document.getElementById('w-hall-btn').classList.remove('btn-sleep');
        },
        verify() {
            document.getElementById('hall-verify').style.display = 'none';
            const enter = document.getElementById('hall-enter');
            enter.style.display = 'block';
            enter.classList.remove('btn-sleep');
        }
    };

    /**
     * MODULE: NAVIGATION
     * Переключения между сценами
     */
    const GY_Nav = {
        go(targetId) {
            const cur = document.querySelector('.block.active');
            const masterBack = document.getElementById('master-back');
            
            if(cur) { cur.style.opacity = 0; cur.style.pointerEvents = 'none'; }
            
            masterBack.style.display = (targetId === 'block-tables') ? 'block' : 'none';
            setTimeout(() => { if(targetId === 'block-tables') masterBack.style.opacity = 1; }, 100);

            setTimeout(() => {
                if(cur) cur.classList.remove('active');
                const next = document.getElementById(targetId);
                next.style.display = 'flex';
                setTimeout(() => {
                    next.classList.add('active'); next.style.opacity = 1; next.style.pointerEvents = 'auto';
                    this.onBlockEnter(targetId);
                }, 50);
            }, 650);
        },
        onBlockEnter(id) {
            if(id === 'block-bar') {
                GY_Audio.fade('amb', 0.8, 1000);
                setTimeout(() => GY_Audio.play('khe'), 600);
                setTimeout(() => GY_Audio.play('pour'), 2800);
            }
            if(id === 'block-hall') GY_Audio.fade('amb', 0.3, 800);
            if(id === 'block-tables') GY_Audio.fade('amb', 0.15, 800);
        }
    };

    /**
     * MODULE: CORE ENGINE
     * Главная логика запуска
     */
    const GY_Core = {
        start() {
            GY_Audio.init();
            GY_Audio.unlock(); // Важно для Safari
            GY_Audio.play('door');
            
            const door = document.getElementById('main-door');
            door.style.transform = "scale(8) rotate(10deg)";
            door.style.opacity = "0";

            GY_Identity.generate();

            setTimeout(() => {
                GY_Nav.go('block-welcome');
                GY_Audio.play('amb', 0);
                GY_Audio.fade('amb', 0.3, 3000);
            }, 1500);
        },
        deepDive() {
            GY_Audio.fade('amb', 0, 1000);
            document.body.style.transition = "2s";
            document.body.style.filter = "blur(30px) brightness(0)";
            setTimeout(() => window.location.href = 'bridge_protocol.html', 1800);
        }
    };

    function googleTranslateElementInit() { new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element'); }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
