<!DOCTYPE html>
<html lang="en" class="notranslate" google="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.9.8 | FORCED TRANSLATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --glow: rgba(212, 175, 55, 0.4); }
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; outline: none; }
        
        html, body { 
            width: 100%; height: 100%; background: #000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; margin: 0; 
            overflow: hidden !important; position: fixed;
        }
        
        /* LANGUAGE AREA - REFIXED */
        .custom-lang-wrapper { position: fixed; top: 15px; left: 15px; z-index: 1000000; }
        .lang-select-custom { 
            background: #000; color: var(--gold); border: 2px solid var(--gold);
            padding: 10px; font-family: 'Share Tech Mono'; font-size: 16px;
            border-radius: 4px; cursor: pointer; width: 230px;
        }
        .lang-hint { font-size: 11px; text-align: center; margin-top: 5px; animation: blink 2s infinite; font-weight: bold; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Hidden Original UI */
        #google_translate_element { visibility: hidden; position: absolute; top: -100px; }

        .ui-logo { position: fixed; top: 18px; right: 25px; z-index: 1000000; font-size: 32px; font-weight: bold; letter-spacing: 6px; }

        /* ENGINE - STABLE LAYERS */
        .block { 
            position: fixed; inset: 0; display: none; flex-direction: column; 
            align-items: center; justify-content: center; background: #000; 
            opacity: 0; transition: opacity 0.6s ease;
        }
        .block.active { display: flex !important; opacity: 1; z-index: 500; }
        #block-hall.active { z-index: 600; } /* Hall Always Top */

        /* DOOR ANIMATION */
        #main-door { width: 280px; cursor: pointer; transition: transform 2.5s ease-in, opacity 1.5s ease; }
        .door-open { transform: scale(15); opacity: 0; pointer-events: none; }

        /* STYLES */
        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; text-align: center; max-width: 85%; margin-bottom: 20px; }
        .welcome-title { font-family: 'Playfair Display'; font-size: 45px; font-weight: 900; letter-spacing: 10px; margin-bottom: 20px; text-transform: uppercase; }
        .horse-img { max-height: 52vh; filter: drop-shadow(0 0 30px var(--glow)); margin-bottom: 20px; }

        .btn-gy { 
            background: transparent; border: 2px solid var(--gold); color: var(--gold); 
            cursor: pointer; text-transform: uppercase; font-weight: 900; font-family: 'Share Tech Mono'; 
            padding: 16px; min-width: 150px; font-size: 13px;
        }
        .btn-gy:active { background: var(--gold); color: #000; }
        .btn-sleep { opacity: 0.1 !important; pointer-events: none !important; }

        /* HALL CARD */
        .id-card-hall { 
            width: 320px; padding: 30px; border: 2px solid var(--gold); background: #F5F5DC; 
            border-radius: 15px; display: flex; flex-direction: column; align-items: center; color: #000; 
        }
        .box-final { width: 105px; height: 105px; border: 2px solid #000; background: #FFF !important; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        /* GOOGLE CLEANUP */
        .skiptranslate, .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

    <div class="custom-lang-wrapper">
        <select class="lang-select-custom" onchange="forceTranslate(this.value)">
            <option value="">🌐 Language</option>
            <option value="en">🇬🇧 English</option>
            <option value="ru">🇷🇺 Russian</option>
            <option value="uk">🇺🇦 Ukrainian</option>
            <option value="pl">🇵🇱 Polish</option>
            <option value="de">🇩🇪 German</option>
            <option value="fr">🇫🇷 French</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="it">🇮🇹 Italian</option>
        </select>
        <div class="lang-hint">↑ SELECT LANGUAGE</div>
    </div>

    <div id="google_translate_element"></div>
    <div class="ui-logo">GY-GY</div>

    <audio id="snd-door"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active">
        <img src="door_1.jpg" id="main-door" onclick="handleEntrance()">
        <div style="margin-top:25px; letter-spacing:4px;">CLICK TO ENTER</div>
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">"Every joke has a grain of whiskey"</div>
        <img src="horse_welcome.png" class="horse-img">
        <div class="welcome-title">WELCOME</div>
        <div style="display:flex; gap:15px;">
            <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portal('block-hall')">TO HALL</button>
            <button class="btn-gy" onclick="portal('block-identity')">GET ID</button>
        </div>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text" style="font-size: 18px;">Identification is the soul of the club</div>
        <div class="welcome-title" style="font-size: 26px; letter-spacing:4px;">MEMBERSHIP</div>
        <div style="display:flex; gap:10px; margin-bottom:40px;">
            <div class="box-final" style="background:#000!important; color:var(--gold); border-color:var(--gold); font-size:11px; font-weight:bold; text-align:center;" id="id-label">#ID</div>
            <div class="box-final" id="qr-reg" style="border-color:var(--gold);"></div>
            <div class="box-final" style="border-color:var(--gold); cursor:pointer;" onclick="document.getElementById('file-in').click()">
                <input type="file" id="file-in" onchange="preview(this)" style="display:none;" accept="image/*">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-ph" style="color:#000; font-size:11px; font-weight:bold;">PHOTO</span>
            </div>
            <div class="box-final" style="border-color:var(--gold); cursor:pointer;" onclick="genAvatar()">
                <img id="av-img" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-av" style="color:#000; font-size:11px; font-weight:bold;">AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" style="width: 310px;" onclick="saveData()">SAVE IDENTITY</button>
        <button id="btn-pass" class="btn-gy btn-sleep" style="width: 310px; margin-top: 15px;" onclick="portal('block-hall')">ENTER THE HALL</button>
    </div>

    <div id="block-hall" class="block">
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; font-size:18px; margin-bottom:15px;">#ID-TOKEN</div>
            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <div class="box-final" style="border: 3px solid #000;">
                    <img id="h-photo" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="box-final" id="h-qr" style="border: 3px solid #000;"></div>
            </div>
            <button class="btn-gy" style="width:100%; border-color:#000; color:#000;" onclick="portal('block-bar')">TO THE BAR</button>
        </div>
    </div>

    <div id="block-bar" class="block">
        <img src="horse_bar.png" style="height:65vh; margin-bottom: 2vh;">
        <div style="display:flex; flex-direction:column; gap:12px; align-items:center;">
            <div style="display:flex; gap:15px;">
                <button class="btn-gy" style="min-width:145px; font-size:11px;" onclick="location.href='server.html'">SERVER AI</button>
                <button class="btn-gy" style="min-width:145px; font-size:11px;" onclick="location.href='tables.html'">TABLES</button>
            </div>
            <button class="btn-gy" style="width:305px;" onclick="portal('block-hall')">BACK TO HALL</button>
        </div>
    </div>

<script>
    let currentID = "";

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
    }

    // ФОРСИРОВАННЫЙ ПЕРЕВОД
    function forceTranslate(lang) {
        const frame = document.querySelector('.goog-te-combo');
        if (frame) {
            frame.value = lang;
            frame.dispatchEvent(new Event('change'));
        }
    }

    function handleEntrance() {
        document.getElementById('snd-door').play().catch(()=>{});
        document.getElementById('main-door').classList.add('door-open');
        
        if (!currentID) {
            currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
            localStorage.setItem('gy_trace', currentID);
        }
        updateAll(currentID);
        
        setTimeout(() => { 
            portal('block-welcome'); 
            document.getElementById('snd-ambient').play().catch(()=>{});
        }, 1500);
    }

    function portal(id) {
        document.querySelectorAll('.block').forEach(b => {
            b.classList.remove('active');
            setTimeout(() => { if(!b.classList.contains('active')) b.style.display='none'; }, 600);
        });
        const target = document.getElementById(id);
        target.style.display = 'flex';
        setTimeout(() => target.classList.add('active'), 10);
    }

    function updateAll(id) {
        document.getElementById('id-label').innerText = id;
        document.getElementById('h-id').innerText = id;
        ['qr-reg', 'h-qr'].forEach(cid => {
            const el = document.getElementById(cid);
            el.innerHTML = "";
            new QRCode(el, { text: id, width: 105, height: 105 });
        });
    }

    function saveData() {
        document.getElementById('btn-save').classList.add('btn-sleep');
        document.getElementById('btn-pass').classList.remove('btn-sleep');
        document.getElementById('btn-w-hall').classList.remove('btn-sleep');
    }

    function preview(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => {
                const img = e.target.result;
                document.getElementById('av-img').style.display = "none";
                document.getElementById('pp').src = img;
                document.getElementById('pp').style.display = "block";
                document.getElementById('h-photo').src = img;
                document.getElementById('txt-ph').style.display = "none";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function genAvatar() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('pp').style.display = "none";
        document.getElementById('av-img').src = url;
        document.getElementById('av-img').style.display = "block";
        document.getElementById('h-photo').src = url;
        document.getElementById('txt-av').style.display = "none";
        document.getElementById('txt-ph').style.display = "none";
    }

    window.onload = () => {
        const saved = localStorage.getItem('gy_trace');
        if(saved) {
            currentID = saved;
            updateAll(saved);
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        }
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
