<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.5.4 | THE ABSOLUTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --paper: #F5F5DC; --wood: #3E2723; }
        * { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        body { background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; position: fixed; width: 100%; }

        /* UI ELEMENTS */
        .ui-header-right { position: fixed; top: 18px; right: 25px; z-index: 5000; font-size: 24px; letter-spacing: 5px; font-weight: bold; }
        
        /* LANGUAGE GATEWAY */
        .lang-gateway { position: fixed; top: 15px; left: 15px; z-index: 7000; width: 160px; }
        .btn-main-lang { width: 100%; padding: 10px; background: rgba(0,0,0,0.9); border: 1.5px solid var(--gold); color: var(--gold); cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; font-weight: 900; }
        .lang-dropdown { position: absolute; top: 100%; left: 0; display: none; flex-direction: column; background: #000; border: 1.5px solid var(--gold); width: 190px; max-height: 70vh; overflow-y: auto; }
        .lang-dropdown.open { display: flex; }
        .btn-sub-lang { background: none; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.1); color: var(--gold); padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 11px; font-family: inherit; text-align: left; }
        .flag-icon { width: 20px; height: 13px; object-fit: cover; border: 0.5px solid var(--gold); }

        /* BLOCKS */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        /* BOXES & BUTTONS */
        .box-final { width: 85px; height: 85px; border: 2px solid var(--gold); background: transparent; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .box-final img { width: 100%; height: 100%; object-fit: cover; }
        .btn-gy { min-width: 270px; padding: 14px; background: transparent; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 900; margin: 8px 0; font-family: inherit; transition: 0.3s; }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; }

        /* HALL ID CARD */
        .id-card-hall { width: 230px; padding: 20px; border: 2px solid var(--gold); background: var(--paper); border-radius: 12px; display: flex; flex-direction: column; align-items: center; color: #000; box-shadow: 0 0 30px rgba(212,175,55,0.2); z-index: 20; }
        .hall-box { width: 85px; height: 85px; border: 2px solid var(--wood); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        #hall-bg { position: absolute; inset: 0; background: url('hall_bg_jpg.jpg') center/cover; opacity: 0.4; z-index: 15; }
        .rtl { direction: rtl; text-align: right; }
    </style>
</head>
<body>

    <div class="lang-gateway">
        <button class="btn-main-lang" onclick="toggleLangMenu()">
            <img id="cur-flag" src="https://flagcdn.com/w20/gb.png" class="flag-icon">
            <span id="cur-name">ENGLISH</span>
        </button>
        <div id="lang-list" class="lang-dropdown">
            <button class="btn-sub-lang" onclick="pickL('en','gb','ENGLISH')"><img src="https://flagcdn.com/w20/gb.png" class="flag-icon"> ENGLISH</button>
            <button class="btn-sub-lang" onclick="pickL('ru','ru','РУССКИЙ')"><img src="https://flagcdn.com/w20/ru.png" class="flag-icon"> РУССКИЙ</button>
            <button class="btn-sub-lang" onclick="pickL('ua','ua','УКРАЇНСЬКА')"><img src="https://flagcdn.com/w20/ua.png" class="flag-icon"> УКРАЇНСЬКА</button>
            <button class="btn-sub-lang" onclick="pickL('pl','pl','POLSKI')"><img src="https://flagcdn.com/w20/pl.png" class="flag-icon"> POLSKI</button>
            <button class="btn-sub-lang" onclick="pickL('de','de','DEUTSCH')"><img src="https://flagcdn.com/w20/de.png" class="flag-icon"> DEUTSCH</button>
            <button class="btn-sub-lang" onclick="pickL('fr','fr','FRANÇAIS')"><img src="https://flagcdn.com/w20/fr.png" class="flag-icon"> FRANÇAIS</button>
            <button class="btn-sub-lang" onclick="pickL('it','it','ITALIANO')"><img src="https://flagcdn.com/w20/it.png" class="flag-icon"> ITALIANO</button>
            <button class="btn-sub-lang" onclick="pickL('es','es','ESPAÑOL')"><img src="https://flagcdn.com/w20/es.png" class="flag-icon"> ESPAÑOL</button>
            <button class="btn-sub-lang" onclick="pickL('cn','cn','中文')"><img src="https://flagcdn.com/w20/cn.png" class="flag-icon"> 中文</button>
            <button class="btn-sub-lang" onclick="pickL('jp','jp','日本語')"><img src="https://flagcdn.com/w20/jp.png" class="flag-icon"> 日本語</button>
            <button class="btn-sub-lang" onclick="pickL('ae','ae','العربية')"><img src="https://flagcdn.com/w20/ae.png" class="flag-icon"> العربية</button>
            <button class="btn-sub-lang" onclick="pickL('br','br','PORTUGUÊS')"><img src="https://flagcdn.com/w20/br.png" class="flag-icon"> PORTUGUÊS</button>
        </div>
    </div>

    <div class="ui-header-right">GY-GY</div>

    <audio id="snd-door"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop><source src="bar_ambient.mp3" type="audio/mpeg"></audio>
    <audio id="snd-khe"><source src="charlie_bar_fx.mp3" type="audio/mpeg"></audio>
    <audio id="snd-pour"><source src="pour_whisky.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1; display: flex;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()" style="width:280px; cursor:pointer; transition: 2s cubic-bezier(0.4, 0, 0.2, 1);">
    </div>

    <div id="block-welcome" class="block">
        <div data-key="q_whiskey" style="font-family:'Playfair Display'; font-style:italic; font-size:24px; margin-bottom:20px; text-align:center;">«Every joke has a grain of whiskey»</div>
        <img src="horse_welcome.png" style="max-height:45vh; margin-bottom:20px;">
        <div style="font-size:38px; font-weight:900; letter-spacing:10px; margin-bottom:20px;">WELCOME</div>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')" data-key="btn_to_hall">PROCEED TO HALL</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')" data-key="btn_get_id">GET ID TOKEN</button>
    </div>

    <div id="block-identity" class="block">
        <div data-key="q_champ" style="font-style:italic; margin-bottom:30px; font-size:20px;">«No such thing as too much champagne»</div>
        <div style="display:flex; gap:12px; margin-bottom:30px;">
            <div class="box-final" id="id-label" style="font-size:10px; font-weight:900;">#ID</div>
            <div class="box-final" id="qr-reg"></div>
            <div class="box-final" onclick="document.getElementById('f-in').click()" style="cursor:pointer;">
                <input type="file" id="f-in" onchange="pv(this)" style="display:none;">
                <img id="img-p" style="display:none;">
                <span id="t-p" style="font-size:10px;" data-key="label_photo">PHOTO</span>
            </div>
            <div class="box-final" onclick="genAv()" style="cursor:pointer;">
                <img id="img-a" style="display:none;">
                <span id="t-a" style="font-size:10px;" data-key="label_avatar">AVATAR</span>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="swapB('btn-save', 'btn-pass')" data-key="btn_save">SAVE PROFILE</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')" data-key="btn_to_hall">PROCEED TO HALL</button>
    </div>

    <div id="block-hall" class="block">
        <div id="hall-bg"></div>
        <div class="id-card-hall">
            <div id="h-id" style="font-weight:900; margin-bottom:12px; font-size:14px;">#ID-TOKEN</div>
            <div style="display:flex; gap:12px; margin-bottom:18px;">
                <div class="hall-box"><img id="h-photo" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="hall-box" id="h-qr"></div>
            </div>
            <button id="btn-confirm" class="btn-gy" style="min-width:100%; color:var(--wood); border-color:var(--wood);" onclick="swapB('btn-confirm', 'btn-bar')" data-key="btn_confirm">CONFIRM</button>
            <button id="btn-bar" class="btn-gy btn-sleep" style="min-width:100%; color:var(--wood); border-color:var(--wood);" onclick="portalTransition('block-bar')" data-key="btn_enter">ENTER BAR</button>
        </div>
    </div>

    <div id="block-bar" class="block">
        <div style="font-size:32px; margin-bottom:20px;">GY-GY BAR v4.5.4</div>
        <img src="horse_bar.png" style="max-height:55vh; margin-bottom:20px;">
        <button class="btn-gy" onclick="portalTransition('block-hall')" data-key="btn_back">BACK TO HALL</button>
    </div>

<script>
    const langData = {
        en: { q_whiskey: "«Every joke has a grain of whiskey»", q_champ: "«No such thing as too much champagne»", btn_to_hall: "PROCEED TO HALL", btn_get_id: "GET ID TOKEN", btn_save: "SAVE PROFILE", btn_confirm: "CONFIRM", btn_enter: "ENTER BAR", label_photo: "PHOTO", label_avatar: "AVATAR", btn_back: "BACK TO HALL" },
        ru: { q_whiskey: "«В каждой шутке есть доля виски»", q_champ: "«Шампанского много не бывает»", btn_to_hall: "ПРОЙТИ В ХОЛЛ", btn_get_id: "ПОЛУЧИТЬ ID", btn_save: "СОХРАНИТЬ", btn_confirm: "ПОДТВЕРДИТЬ", btn_enter: "ВХОД В БАР", label_photo: "ФОТО", label_avatar: "АВАТАР", btn_back: "В ХОЛЛ" },
        ua: { q_whiskey: "«У кожному жарті є доля віскі»", q_champ: "«Шампанського багато не буває»", btn_to_hall: "ПРОЙТИ ДО ХОЛУ", btn_get_id: "ОТРИМАТИ ID", btn_save: "ЗБЕРЕГТИ", btn_confirm: "ПІДТВЕРДИТИ", btn_enter: "ВХІД У БАР", label_photo: "ФОТО", label_avatar: "АВАТАР", btn_back: "У ХОЛ" },
        pl: { q_whiskey: "«W każdym żarcie jest kropla whisky»", q_champ: "«Szampana nigdy za wiele»", btn_to_hall: "WEJDŹ DO HOLU", btn_get_id: "POBIERZ ID", btn_save: "ZAPISZ", btn_confirm: "POTWIERDŹ", btn_enter: "WEJDŹ DO BARU", label_photo: "ZDJĘCIE", label_avatar: "AWATAR", btn_back: "DO HOLU" },
        de: { q_whiskey: "«Jeder Witz hat ein Körnchen Whiskey»", q_champ: "«Es gibt nicht zu viel Champagner»", btn_to_hall: "WEITER ZUR HALLE", btn_get_id: "ID ERHALTEN", btn_save: "SPEICHERN", btn_confirm: "BESTÄTIGEN", btn_enter: "BAR BETRETEN", label_photo: "FOTO", label_avatar: "AVATAR", btn_back: "ZUR HALLE" },
        fr: { q_whiskey: "«Chaque blague contient un grain de whisky»", q_champ: "«Le champagne n'est jamais de trop»", btn_to_hall: "ACCÉDER AU HALL", btn_get_id: "OBTENIR ID", btn_save: "ENREGISTRER", btn_confirm: "CONFIRMER", btn_enter: "ENTRER AU BAR", label_photo: "PHOTO", label_avatar: "AVATAR", btn_back: "AU HALL" },
        it: { q_whiskey: "«Ogni scherzo ha un pizzico di whiskey»", q_champ: "«Lo champagne non è mai troppo»", btn_to_hall: "VAI ALL'ATRIO", btn_get_id: "OTTIENI ID", btn_save: "SALVA", btn_confirm: "CONFERMA", btn_enter: "ENTRA NEL BAR", label_photo: "FOTO", label_avatar: "AVATAR", btn_back: "ALL'ATRIO" },
        es: { q_whiskey: "«Cada broma tiene un toque de whiskey»", q_champ: "«Nunca hay demasiado champán»", btn_to_hall: "IR AL VESTÍBULO", btn_get_id: "OBTENER ID", btn_save: "GUARDAR", btn_confirm: "CONFIRMAR", btn_enter: "ENTRAR AL BAR", label_photo: "FOTO", label_avatar: "AVATAR", btn_back: "AL VESTÍBULO" },
        cn: { q_whiskey: "“每个笑话都有一粒威士忌”", q_champ: "“香槟永远不嫌多”", btn_to_hall: "前往大厅", btn_get_id: "获取身份卡", btn_save: "保存", btn_confirm: "确认", btn_enter: "进入酒吧", label_photo: "照片", label_avatar: "头像", btn_back: "回到大厅" },
        jp: { q_whiskey: "「ジョークには必ずウイスキーが隠れている」", q_champ: "「シャンパンに多すぎるということはない」", btn_to_hall: "ホールへ進む", btn_get_id: "IDを取得", btn_save: "保存", btn_confirm: "確認", btn_enter: "バーに入る", label_photo: "写真", label_avatar: "アバター", btn_back: "ホールに戻る" },
        ae: { q_whiskey: "«كل نكتة فيها قطرة من الويسكي»", q_champ: "«لا يوجد شيء اسمه الكثير من الشمبانيا»", btn_to_hall: "اذهب إلى القاعة", btn_get_id: "احصل على الهوية", btn_save: "حفظ", btn_confirm: "تأكيد", btn_enter: "ادخل الحانة", label_photo: "صورة", label_avatar: "أفاتار", btn_back: "العودة للقاعة" },
        br: { q_whiskey: "«Toda piada tem um toque de uísque»", q_champ: "«Champanhe nunca é demais»", btn_to_hall: "IR PARA O HALL", btn_get_id: "OBTER ID", btn_save: "SALVAR", btn_confirm: "CONFIRMAR", btn_enter: "ENTRAR NO BAR", label_photo: "FOTO", label_avatar: "AVATAR", btn_back: "VOLTAR AO HALL" }
    };

    let currentID = localStorage.getItem('gy_trace') || "";

    function toggleLangMenu() { document.getElementById('lang-list').classList.toggle('open'); }

    function pickL(lang, flag, name) {
        document.getElementById('cur-flag').src = `https://flagcdn.com/w20/${flag}.png`;
        document.getElementById('cur-name').innerText = name;
        applyLang(lang);
        toggleLangMenu();
    }

    function applyLang(lang) {
        document.body.classList.toggle('rtl', lang === 'ae');
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            el.innerText = (langData[lang] && langData[lang][key]) ? langData[lang][key] : langData['en'][key];
        });
    }

    function handleDoor() {
        document.getElementById('snd-door').play();
        const d = document.getElementById('main-door');
        d.style.transform = "scale(8)"; d.style.opacity = "0";
        if(!currentID) currentID = `#GY-${Math.floor(100+Math.random()*899)}-${Math.floor(1000+Math.random()*8999)}`;
        localStorage.setItem('gy_trace', currentID);
        updateUI();
        setTimeout(() => { 
            portalTransition('block-welcome'); 
            const amb = document.getElementById('snd-ambient');
            amb.volume = 0; amb.play(); fadeAudio(amb, 1, 2000);
        }, 1800);
    }

    function updateUI() {
        document.getElementById('id-label').innerText = currentID;
        document.getElementById('h-id').innerText = currentID;
        const q1 = document.getElementById('qr-reg'), q2 = document.getElementById('h-qr');
        q1.innerHTML = ""; q2.innerHTML = "";
        new QRCode(q1, {text: currentID, width: 85, height: 85});
        new QRCode(q2, {text: currentID, width: 85, height: 85});
    }

    function portalTransition(id) {
        const cur = document.querySelector('.block.active');
        if(cur) { cur.style.opacity = "0"; setTimeout(() => { cur.classList.remove('active'); cur.style.display = "none"; }, 700); }
        setTimeout(() => {
            const next = document.getElementById(id);
            next.style.display = "flex";
            setTimeout(() => { 
                next.classList.add('active'); next.style.opacity = "1"; 
                if(id === 'block-bar') {
                    setTimeout(() => document.getElementById('snd-khe').play(), 600);
                    setTimeout(() => document.getElementById('snd-pour').play(), 1800);
                }
            }, 50);
        }, 750);
    }

    function fadeAudio(audio, target, duration) {
        const start = audio.volume;
        const startTime = Date.now();
        const interval = setInterval(() => {
            const progress = Math.min((Date.now() - startTime) / duration, 1);
            audio.volume = start + (target - start) * progress;
            if (progress === 1) clearInterval(interval);
        }, 50);
    }

    function pv(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => {
                document.getElementById('img-p').src = e.target.result; document.getElementById('img-p').style.display="block";
                document.getElementById('h-photo').src = e.target.result; document.getElementById('t-p').style.display="none";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function genAv() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('img-a').src = url; document.getElementById('img-a').style.display="block";
        document.getElementById('h-photo').src = url; document.getElementById('t-a').style.display="none";
    }

    function swapB(a, b) {
        document.getElementById(a).classList.add('btn-sleep');
        document.getElementById(b).classList.remove('btn-sleep');
        if(a === 'btn-save') {
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
            document.getElementById('btn-pass').classList.remove('btn-sleep');
        }
    }

    window.onload = () => { if(currentID) { updateUI(); document.getElementById('btn-w-hall').classList.remove('btn-sleep'); } }
</script>
</body>
</html>
