<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="version" content="7.7.1">
    <title>GY-GY Club v7.7.1</title>
    <style>
        body {
            background-color: #000;
            color: #D4AF37; 
            font-family: 'Playfair Display', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header { display: flex; justify-content: space-between; padding: 20px; z-index: 100; }
        .logo-group { display: flex; align-items: center; gap: 15px; }
        .avatar-mini { width: 40px; height: 40px; border: 1px solid #D4AF37; background: #fff; display: none; }

        .scene {
            flex-grow: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.6s ease-in-out;
        }
        .active-scene { display: flex; opacity: 1; }

        .btn-gold {
            border: 2px solid #D4AF37;
            background: transparent;
            color: #D4AF37;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }
        .btn-gold:disabled { opacity: 0.15; cursor: not-allowed; }

        .reg-grid { display: grid; grid-template-columns: repeat(4, 150px); gap: 20px; margin: 20px 0; }
        .reg-box { width: 150px; height: 150px; border: 2px solid #D4AF37; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .bg-white { background-color: #fff; color: #000; }

        .footer { padding: 10px; font-size: 12px; text-align: center; opacity: 0.6; margin-top: auto; }
        .ver-tag { position: fixed; bottom: 5px; left: 5px; font-size: 10px; opacity: 0.3; }
    </style>
</head>
<body>

    <div class="header">
        <div id="nav-left">
            <span class="btn-back" style="cursor:pointer;" onclick="goBack()">←</span>
            <span style="margin-left:20px; border:1px solid #D4AF37; padding:2px 5px;">RU</span>
        </div>
        <div class="logo-group">
            <div id="user-status" class="avatar-mini"></div>
            <div class="logo" style="font-weight:bold; font-size:24px;">GY-GY</div>
        </div>
    </div>

    <div id="scene-door" class="scene active-scene">
        <div onclick="openDoor()" style="cursor:pointer;">
            <img src="assets/door.png" alt="Golden Door" style="width:200px;">
            <p>CLICK TO ENTER</p>
        </div>
    </div>

    <div id="scene-welcome" class="scene">
        <img src="assets/horse-welcome.png" alt="Horse Guard" style="max-height:350px;">
        <p style="font-style:italic;">"Welcome to the territory of humor..."</p>
        <button class="btn-gold" onclick="checkUser()">CONTINUE</button>
    </div>

    <div id="scene-reg" class="scene">
        <h3>REGISTRATION</h3>
        <div class="reg-grid">
            <div id="box-id" class="reg-box">ID: ...</div>
            <div id="box-qr" class="reg-box bg-white">QR CODE</div>
            <div id="box-photo" class="reg-box bg-white" onclick="selectChoice('photo')">или ФОТО</div>
            <div id="box-avatar" class="reg-box bg-white" onclick="selectChoice('avatar')">или АВАТАР</div>
        </div>
        <button id="btn-save" class="btn-gold" onclick="saveData()">SAVE</button>
        <button id="btn-to-hall" class="btn-gold" disabled onclick="toHall()">GO TO HALL</button>
    </div>

    <div id="scene-bar" class="scene">
        <p style="font-style:italic;">"ЛОШАДЬЮ ХОДИ!"</p>
        <img src="assets/bar-horse.png" alt="Bar Horse" style="max-height:350px;">
        <div>
            <button class="btn-gold" onclick="console.log('To Tables')">К СТОЛИКАМ</button>
            <button class="btn-gold" onclick="console.log('To AI Room')">В AI ROOM</button>
        </div>
    </div>

    <div class="footer">
        info@gy-gy.club | Club Rules | <span onclick="alert('Office Access Requested')" style="cursor:pointer;">.</span>
    </div>

    <div class="ver-tag">v7.7.1</div>

    <script>
        let currentScene = 'scene-door';
        let isRegistered = false; // Заглушка: меняется на true после регистрации

        function transition(to) {
            document.getElementById(currentScene).classList.remove('active-scene');
            setTimeout(() => {
                document.getElementById(to).classList.add('active-scene');
                currentScene = to;
            }, 600); // Плавное затухание/нарастание
        }

        function openDoor() {
            console.log("Sound: Door Click & Creak");
            transition('scene-welcome');
        }

        function checkUser() {
            // Коннектор: проверка cookies/ID
            if (isRegistered) {
                transition('scene-bar'); // Старый гость сразу в Бар
            } else {
                transition('scene-reg'); // Новый — на регистрацию
            }
        }

        function selectChoice(type) {
            const p = document.getElementById('box-photo');
            const a = document.getElementById('box-avatar');
            if(type === 'photo') { p.innerText = "SELECTED"; a.innerText = "или АВАТАР"; }
            else { a.innerText = "SELECTED"; p.innerText = "или ФОТО"; }
        }

        function saveData() {
            document.getElementById('btn-save').disabled = true;
            document.getElementById('btn-to-hall').disabled = false;
            isRegistered = true;
        }

        function toHall() {
            document.getElementById('user-status').style.display = 'block';
            console.log("Sound: Khehe + Bottle Open");
            transition('scene-bar');
        }

        function goBack() {
            // Логика возврата на один уровень назад
            if (currentScene === 'scene-welcome') transition('scene-door');
            else if (currentScene === 'scene-reg') transition('scene-welcome');
            else if (currentScene === 'scene-bar') transition('scene-reg');
        }
    </script>
</body>
</html>
