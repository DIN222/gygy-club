<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v5.2.8 | Identity & Hall Ready</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --neon: rgba(212, 175, 55, 0.8); }
        * { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; }

        /* CONSTANT UI */
        .ui-top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; display: flex; justify-content: center; align-items: center; z-index: 5000; pointer-events: none; }
        .ui-logo { font-size: 24px; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); pointer-events: auto; }
        
        /* LANGUAGE SELECTOR */
        .lang-gateway { position: fixed; top: 20px; left: 20px; z-index: 7000; }
        .btn-main-lang { min-width: 130px; padding: 10px; background: #000; border: 1.5px solid var(--gold); color: var(--gold); cursor: pointer; display: flex; align-items: center; gap: 10px; font-family: inherit; font-weight: 900; }
        .lang-dropdown { position: absolute; top: 100%; left: 0; display: none; flex-direction: column; background: #000; border: 1.5px solid var(--gold); width: 180px; max-height: 70vh; overflow-y: auto; }
        .lang-dropdown.open { display: flex; }
        .btn-sub-lang { background: none; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.1); color: var(--gold); padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 12px; font-family: inherit; }
        .flag-icon { width: 20px; height: 14px; object-fit: cover; }

        /* BLOCKS */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; opacity: 0; transition: opacity 0.5s; z-index: 10; }
        .block.active { display: flex; opacity: 1; }

        /* ELEMENTS */
        #main-door { width: 280px; cursor: pointer; transition: 2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
        .neon-horse { max-height: 30vh; filter: drop-shadow(0 0 20px var(--neon)); margin: 15px 0; }
        .quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 18px; text-align: center; max-width: 85%; line-height: 1.4; color: var(--gold); margin-bottom: 25px; }
        
        .btn-gy { min-width: 250px; padding: 15px; background: none; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; font-family: inherit; font-weight: 900; text-transform: uppercase; margin: 10px 0; transition: 0.3s; }
        .btn-sleep { opacity: 0.2; pointer-events: none; }
        .btn-gy:active { background: var(--gold); color: #000; }

        /* [ПРАВКА: КВАДРАТЫ В ЗОЛОТОЙ РАМКЕ] */
        .identity-grid { display: flex; gap: 10px; margin-bottom: 30px; }
        .box-gold { 
            width: 85px; height: 85px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid var(--gold); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            overflow: hidden; position: relative; transition: 0.3s;
        }
        .box-gold span { font-size: 9px; font-weight: 900; text-align: center; color: var(--gold); }
        .box-selected { box-shadow: 0 0 15px var(--gold); background: rgba(212, 175, 55, 0.2); }

        /* HALL DESIGN */
        #block-hall { background: radial-gradient(circle at center, #2c1e14 0%, #000 100%); }
        .hall-scene { text-align: center; }
        .id-card-hall { 
            width: 280px; padding: 20px; background: #F5F5DC; 
            border: 4px solid #3E2723; color: #000; border-radius: 15px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: rotateX(10deg);
        }
    </style>
</head>
<body translate="no">

    <div class="lang-gateway">
        <button class="btn-main-lang" onclick="toggleLangMenu()">
            <img id="active-flag-img" src="https://flagcdn.com/w20/gb.png" class="flag-icon">
            <span id="active-name">ENGLISH</span>
        </button>
        <div id="lang-list" class="lang-dropdown">
            <button class="btn-sub-lang" onclick="pickLang('en', 'gb', 'ENGLISH')"><img src="https://flagcdn.com/w20/gb.png" class="flag-icon"> ENGLISH</button>
            <button class="btn-sub-lang" onclick="pickLang('ru', 'ru', 'РУССКИЙ')"><img src="https://flagcdn.com/w20/ru.png" class="flag-icon"> РУССКИЙ</button>
            </div>
    </div>

    <div class="ui-top-bar"><div class="ui-logo">GY-GY</div></div>

    <audio id="snd-door" preload="auto"><source src="door_open.mp3" type="audio/mpeg"></audio>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="block-entrance" class="block active" style="opacity: 1;">
        <img src="door_1.jpg" id="main-door" onclick="handleDoor()">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text" data-i18n="quote1">"Every joke has a grain of whiskey"</div>
        <img src="horse_welcome.png" class="neon-horse">
        <div style="font-size: 34px; font-weight: 900; letter-spacing: 8px; margin-bottom: 20px;" data-i18n="welcome">WELCOME</div>
        <div style="display:flex; gap:10px;">
            <button class="btn-gy" style="min-width:140px;" onclick="portalTransition('block-identity')" data-i18n="btn_id">IDENTITY</button>
            <button id="btn-w-hall" class="btn-gy btn-sleep" style="min-width:140px;" onclick="portalTransition('block-hall')" data-i18n="btn_hall">TO HALL</button>
        </div>
    </div>

    <div id="block-identity" class="block">
        <div class="quote-text" data-i18n="quote2">"No such thing as too much champagne"</div>
        
        <div class="identity-grid">
            <div class="box-gold" id="box-id">
                <span id="id-label">#ID</span>
                <img id="id-flag" src="" style="width:25px; margin-top:5px; border:1px solid var(--gold);">
            </div>
            
            <div class="box-gold" id="qr-reg"></div>
            
            <div class="box-gold" id="box-photo" onclick="document.getElementById('file-in').click()" style="cursor:pointer;">
                <input type="file" id="file-in" onchange="preview(this)" style="display:none;">
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                <span id="txt-p" data-i18n="photo">PHOTO</span>
            </div>

            <div class="box-gold" id="box-avatar" onclick="genAvatar()" style="cursor:pointer;">
                <img id="av" style="display:none; width:100%; height:100%;">
                <span id="txt-a" data-i18n="avatar">AVATAR</span>
            </div>
        </div>

        <button class="btn-gy" onclick="saveProfile()" data-i18n="btn_save">SAVE PROFILE</button>
        <button id="btn-go-hall-direct" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')" data-i18n="btn_hall">GO TO HALL</button>
    </div>

    <div id="block-hall" class="block">
        <div class="hall-scene">
            <div class="quote-text" style="color:var(--gold); font-size:24px;">GY-GY HALL</div>
            <div class="id-card-hall">
                <div id="h-id" style="font-weight:900; font-size:14px; margin-bottom:15px; border-bottom:1px solid #3E2723; padding-bottom:5px;">#ID-CARD</div>
                <div style="display:flex; gap:10px; justify-content:center; margin-bottom:15px;">
                    <div style="width:80px; height:80px; background:#fff; border:1px solid #000; overflow:hidden;">
                        <img id="h-photo" style="width:100%; height:100%; object-fit:cover;">
                    </div>
                    <div id="h-qr" style="width:80px; height:80px; background:#fff; border:1px solid #000;"></div>
                </div>
                <button class="btn-gy" style="color:#3E2723; border-color:#3E2723; min-width:100%;" onclick="portalTransition('block-bar')" data-i18n="go_bar">ENTER BAR</button>
            </div>
        </div>
    </div>

    <div id="block-bar" class="block">
        <div class="welcome-title">BAR IS OPEN</div>
    </div>

<script>
    const langData = {
        en: { welcome: "WELCOME", quote1: '"Every joke has a grain of whiskey"', quote2: '"No such thing as too much champagne"', btn_id: "IDENTITY", btn_hall: "TO HALL", btn_save: "SAVE PROFILE", photo: "PHOTO", avatar: "AVATAR", go_bar: "ENTER BAR" },
        ru: { welcome: "ДОБРО ПОЖАЛОВАТЬ", quote1: '"В каждой шутке есть доля виски"', quote2: '"Шампанского много не бывает"', btn_id: "РЕГИСТРАЦИЯ", btn_hall: "В ХОЛЛ", btn_save: "СОХРАНИТЬ", photo: "ФОТО", avatar: "АВАТАР", go_bar: "В БАР" }
    };

    let currentLang = localStorage.getItem('gy_lang') || 'en';
    let currentFlag = localStorage.getItem('gy_flag_code') || 'gb';
    let currentID = localStorage.getItem('gy_trace') || "";

    function toggleLangMenu() { document.getElementById('lang-list').classList.toggle('open'); }

    function pickLang(lang, flag, name) {
        currentLang = lang; currentFlag = flag;
        localStorage.setItem('gy_lang', lang); localStorage.setItem('gy_flag_code', flag);
        document.getElementById('active-flag-img').src = `https://flagcdn.com/w20/${flag}.png`;
        document.getElementById('active-name').innerText = name;
        toggleLangMenu();
        applyStrings();
        updateIDVisuals();
    }

    function applyStrings() {
        const s = langData[currentLang] || langData['en'];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.innerText = s[el.getAttribute('data-i18n')];
        });
    }

    function handleDoor() {
        document.getElementById('snd-door').play();
        const door = document.getElementById('main-door');
        door.style.transform = "scale(8)"; door.style.opacity = "0";
        if(!currentID) {
            currentID = `#GY-${Math.floor(100 + Math.random()*900)}-${Math.floor(1000 + Math.random()*9000)}`;
            localStorage.setItem('gy_trace', currentID);
        }
        updateIDVisuals();
        setTimeout(() => {
            portalTransition('block-welcome');
            document.getElementById('snd-ambient').play();
        }, 1200);
    }

    function updateIDVisuals() {
        document.getElementById('id-label').innerText = currentID;
        document.getElementById('id-flag').src = `https://flagcdn.com/w20/${currentFlag}.png`;
        document.getElementById('h-id').innerText = currentID + " VIP";
        
        const qrEl = document.getElementById('qr-reg');
        const hQrEl = document.getElementById('h-qr');
        qrEl.innerHTML = ""; hQrEl.innerHTML = "";
        new QRCode(qrEl, {text: currentID, width: 80, height: 80, colorDark: "#d4af37", colorLight: "transparent"});
        new QRCode(hQrEl, {text: currentID, width: 80, height: 80});
    }

    function preview(i) {
        if(i.files && i.files[0]) {
            const r = new FileReader();
            r.onload = (e) => {
                document.getElementById('pp').src = e.target.result;
                document.getElementById('pp').style.display = "block";
                document.getElementById('h-photo').src = e.target.result;
                document.getElementById('txt-p').style.display = "none";
                document.getElementById('box-photo').classList.add('box-selected');
                document.getElementById('box-avatar').classList.remove('box-selected');
                document.getElementById('av').style.display = "none";
                document.getElementById('txt-a').style.display = "block";
            };
            r.readAsDataURL(i.files[0]);
        }
    }

    function genAvatar() {
        const url = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${Math.random()}`;
        document.getElementById('av').src = url;
        document.getElementById('av').style.display = "block";
        document.getElementById('h-photo').src = url;
        document.getElementById('txt-a').style.display = "none";
        document.getElementById('box-avatar').classList.add('box-selected');
        document.getElementById('box-photo').classList.remove('box-selected');
        document.getElementById('pp').style.display = "none";
        document.getElementById('txt-p').style.display = "block";
    }

    function saveProfile() {
        document.getElementById('btn-w-hall').classList.remove('btn-sleep');
        document.getElementById('btn-go-hall-direct').classList.remove('btn-sleep');
        alert("PROFILE SAVED!");
    }

    function portalTransition(nextId) {
        const cur = document.querySelector('.block.active');
        const nxt = document.getElementById(nextId);
        if(cur) { cur.style.opacity = "0"; setTimeout(() => { cur.classList.remove('active'); cur.style.display="none"; }, 500); }
        setTimeout(() => {
            nxt.style.display = "flex";
            setTimeout(() => { nxt.classList.add('active'); nxt.style.opacity = "1"; }, 50);
        }, 550);
    }

    window.onload = () => { applyStrings(); updateIDVisuals(); };
</script>
</body>
</html>
