<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | BOX v1.0.0</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; overflow: hidden; }

        /* 🔒 ПОСТОЯННЫЙ ЭЛЕМЕНТ: HEADER */
        header { 
            height: 70px; 
            display: flex; 
            align-items: center; 
            border-bottom: var(--border); 
            background: #111; 
            padding: 0 10px; 
            gap: 15px; 
            z-index: 1000; 
        }

        /* 🔒 РЫЧАГ УПРАВЛЕНИЯ: КНОПКА ВОЗВРАТА */
        .nav-back { 
            width: 40px; 
            height: 40px; 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: var(--gold); 
            font-size: 1.2rem; 
            font-weight: bold;
            transition: 0.2s;
        }
        .nav-back:hover { background: var(--gold); color: #000; }

        /* 🔒 ПОСТОЯННЫЙ ЭЛЕМЕНТ: ЛОГОТИП */
        .logo-gy { font-size: 1.1rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; margin-left: auto; }
        
        /* 🔒 ПОСТОЯННЫЙ ЭЛЕМЕНТ: ЯЗЫКОВАЯ ПАНЕЛЬ */
        #google_translate_element { margin-left: 5px; }

        .content { padding: 20px; text-align: center; }
        h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #222; padding-bottom: 15px; margin-top: 10px; }
        .box-placeholder { margin-top: 100px; opacity: 0.2; font-style: italic; letter-spacing: 1px; }
    </style>
</head>
<body>

<header>
    <div class="nav-back" onclick="window.history.back();" title="Предыдущая страница">❮</div>
    
    <div id="google_translate_element"></div>
    
    <div class="logo-gy">GY-GY</div>
</header>

<div class="content">
    <h1>Сборник (BOX)</h1>
    <div class="box-placeholder">Объекты не зафиксированы...</div>
</div>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
    }
</script>

</body>
</html>
