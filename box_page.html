<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | BOX v002 🔒</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER: ПОСТОЯННЫЕ АТРИБУТЫ 🔒 */
        header { 
            height: 70px; 
            display: flex; 
            align-items: center; 
            border-bottom: var(--border); 
            background: #000; 
            padding: 0 10px; 
            gap: 15px; 
            z-index: 1000; 
            flex-shrink: 0;
        }

        .nav-back { 
            width: 40px; 
            height: 40px; 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: var(--gold); 
            font-size: 1.2rem; 
            font-weight: bold;
            transition: 0.2s;
        }
        /* Эстетика v33.5.32: Без заливки, только контур 🔒 */
        .nav-back:hover { box-shadow: 0 0 10px var(--gold); }

        .logo-gy { font-size: 1.1rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; margin-left: auto; }
        #google_translate_element { transform: scale(0.8); transform-origin: left center; }

        /* CONTENT: СПИСОК ОБЪЕКТОВ 🔒 */
        .content { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #222; padding-bottom: 15px; margin: 0; text-align: center; }
        
        .box-item { 
            border: 1px solid #333; 
            padding: 15px; 
            position: relative; 
            border-radius: 4px; 
            transition: 0.3s;
            background: rgba(255,215,0,0.01);
        }
        .box-item:hover { border-color: var(--gold); }

        .meta { 
            font-size: 0.7rem; 
            opacity: 0.5; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            text-transform: uppercase; 
            border-bottom: 1px solid #222; 
            padding-bottom: 5px; 
            color: var(--gold);
        }
        .v-text { white-space: pre-wrap; line-height: 1.5; font-size: 1.1rem; color: #fff; text-align: right; }
        
        .item-ctrl { 
            margin-top: 15px; 
            display: flex; 
            gap: 15px; 
            justify-content: flex-end; 
        }
        .btn-mini { 
            font-size: 0.65rem; 
            border: 1px solid #444; 
            padding: 4px 8px; 
            cursor: pointer; 
            color: #888; 
            text-transform: uppercase; 
            transition: 0.2s;
        }
        .btn-mini:hover { border-color: var(--gold); color: var(--gold); }

        .empty-msg { margin-top: 100px; opacity: 0.2; font-style: italic; letter-spacing: 1px; text-align: center; }

        /* FOOTER ДЛЯ ОЧИСТКИ 🔒 */
        footer { height: 50px; border-top: 1px solid #222; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .clear-all { font-size: 0.6rem; color: #ff4444; cursor: pointer; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        .clear-all:hover { opacity: 1; }
    </style>
</head>
<body>

<header>
    <div class="nav-back" onclick="window.location.href='verses.html'" title="Назад на стену">❮</div>
    <div id="google_translate_element"></div>
    <div class="logo-gy">GY-GY</div>
</header>

<div class="content" id="boxContainer">
    <h1>Сборник (BOX)</h1>
    </div>

<footer>
    <div class="clear-all" onclick="clearFullBox()">🗑 Полная очистка хранилища</div>
</footer>

<script>
    /* 🔒 ЛОГИКА ЗАГРУЗКИ ХРАНИЛИЩА */
    function renderBox() {
        const container = document.getElementById('boxContainer');
        const rawData = localStorage.getItem('gy_box');
        const data = JSON.parse(rawData || '[]');

        if (data.length === 0) {
            container.innerHTML = '<h1>Сборник (BOX)</h1><div class="empty-msg">Объекты не зафиксированы...</div>';
            return;
        }

        // Рисуем заголовок и список (новые сверху)
        let html = '<h1>Сборник (BOX)</h1>';
        
        data.slice().reverse().forEach((item, index) => {
            // Вычисляем реальный индекс в массиве для удаления
            const realIndex = data.length - 1 - index;
            
            html += `
                <div class="box-item">
                    <div class="meta">
                        <span>${item.style || 'Объект'}</span>
                        <span>${item.timestamp || ''}</span>
                    </div>
                    <div class="v-text">${item.text}</div>
                    <div class="item-ctrl">
                        <div class="btn-mini" onclick="copyBoxText(\`${item.text.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">📋 Копировать</div>
                        <div class="btn-mini" onclick="deleteBoxItem(${realIndex})" style="color:#ff4444; border-color:rgba(255,68,68,0.3)">❌ Удалить</div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }

    function copyBoxText(txt) {
        navigator.clipboard.writeText(txt).then(() => {
            alert("Текст скопирован!");
        });
    }

    function deleteBoxItem(index) {
        if (!confirm("Удалить этот объект из BOX?")) return;
        let data = JSON.parse(localStorage.getItem('gy_box') || '[]');
        data.splice(index, 1);
        localStorage.setItem('gy_box', JSON.stringify(data));
        renderBox();
    }

    function clearFullBox() {
        if (!confirm("ВНИМАНИЕ: Это удалит ВСЕ сохраненные куплеты навсегда. Продолжить?")) return;
        localStorage.removeItem('gy_box');
        renderBox();
    }

    // Инициализация 🔒
    window.onload = renderBox;
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
    }
</script>

</body>
</html>
