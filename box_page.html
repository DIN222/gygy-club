<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | BOX</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; overflow-x: hidden; }
        
        /* HEADER */
        header { height: 60px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; position: sticky; top: 0; z-index: 100; }
        .back-btn { text-decoration: none; color: var(--gold); font-weight: 900; font-size: 1.2rem; margin-right: 20px; }
        .title { font-weight: 900; letter-spacing: 2px; flex-grow: 1; text-align: center; }

        /* LIST */
        #boxList { padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        .card { border: 1px solid #333; padding: 15px; background: #0a0a0a; position: relative; transition: border-color 0.3s; }
        .card:hover { border-color: var(--gold); }
        
        /* META INSIDE CARD */
        .card-meta { display: flex; justify-content: space-between; font-size: 0.7rem; opacity: 0.5; margin-bottom: 10px; text-transform: uppercase; }
        .card-text { line-height: 1.5; font-size: 1rem; color: #fff; margin-bottom: 15px; white-space: pre-wrap; }

        /* CARD ACTIONS */
        .card-btns { display: flex; gap: 10px; border-top: 1px solid #222; padding-top: 10px; }
        .c-btn { background: none; border: 1px solid #444; color: var(--gold); font-size: 0.65rem; padding: 5px 10px; cursor: pointer; text-transform: uppercase; }
        .c-btn:hover { background: var(--gold); color: #000; }
        .btn-del { border-color: #600; color: #f44; }

        /* EMPTY STATE */
        .empty { text-align: center; margin-top: 100px; opacity: 0.5; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">❮</a>
    <div class="title">BOX / СБОРНИК</div>
    <div style="width: 30px;"></div> </header>

<div id="boxList">
    </div>

<script>
    // Загрузка данных
    function loadBox() {
        const list = document.getElementById('boxList');
        const items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        
        if (items.length === 0) {
            list.innerHTML = '<div class="empty">Здесь пока пусто...<br>Зарифмуй что-нибудь в CORE!</div>';
            return;
        }

        // Рендерим от новых к старым
        list.innerHTML = items.reverse().map((item, index) => `
            <div class="card">
                <div class="card-meta">
                    <span>${item.mode || 'ЮМОР'}</span>
                    <span>${item.date || ''}</span>
                </div>
                <div class="card-text">${item.text}</div>
                <div class="card-btns">
                    <button class="c-btn" onclick="copyCard(${index})">КОПИРОВАТЬ</button>
                    <button class="c-btn btn-del" onclick="deleteCard(${index})">УДАЛИТЬ</button>
                </div>
            </div>
        `).join('');
    }

    // Копирование конкретной карточки
    function copyCard(idx) {
        const items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        const realIdx = items.length - 1 - idx; // инверсия из-за reverse()
        navigator.clipboard.writeText(items[realIdx].text);
        alert("Текст в буфере!");
    }

    // Удаление карточки
    function deleteCard(idx) {
        if (!confirm("Удалить этот шедевр?")) return;
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        const realIdx = items.length - 1 - idx;
        items.splice(realIdx, 1);
        localStorage.setItem('gygy_box', JSON.stringify(items));
        loadBox();
    }

    window.onload = loadBox;
</script>

</body>
</html>
