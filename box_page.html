<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | BOX v0.0.3 🔒</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER: ПОСТОЯННЫЕ АТРИБУТЫ + СТРЕЛКА В КЛИП 🔒 */
        header { height: 70px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 10px; gap: 15px; z-index: 1000; flex-shrink: 0; }
        .nav-fix { width: 40px; height: 40px; border: var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        .nav-fix:hover { box-shadow: 0 0 10px var(--gold); }
        .logo-gy { font-size: 1.1rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; margin-left: auto; margin-right: 10px; }
        #google_translate_element { transform: scale(0.8); transform-origin: left center; }

        /* CONTENT 🔒 */
        .content { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 1rem; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #222; padding-bottom: 15px; margin: 0; text-align: center; }
        
        .box-item { border: 1px solid #333; padding: 15px; border-radius: 4px; background: rgba(255,215,0,0.01); transition: 0.3s; }
        .box-item:hover { border-color: var(--gold); }
        .meta { font-size: 0.7rem; opacity: 0.5; margin-bottom: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .v-text { white-space: pre-wrap; line-height: 1.5; font-size: 1.1rem; color: #fff; text-align: right; }
        
        .item-ctrl { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }
        .btn-mini { font-size: 0.6rem; border: 1px solid #444; padding: 5px 10px; cursor: pointer; color: #888; text-transform: uppercase; }
        .btn-mini:hover { border-color: var(--gold); color: var(--gold); }
        .btn-clip { border-color: var(--gold); color: var(--gold); font-weight: bold; }

        .empty-msg { margin-top: 100px; opacity: 0.2; font-style: italic; text-align: center; }
        footer { height: 40px; display: flex; align-items: center; justify-content: center; opacity: 0.4; font-size: 0.6rem; }
    </style>
</head>
<body>

<header>
    <div class="nav-fix" onclick="window.location.href='verses.html'" title="На Стену">❮</div>
    <div id="google_translate_element"></div>
    <div class="logo-gy">GY-GY</div>
    <div class="nav-fix" onclick="window.location.href='clip.html'" title="В Клип">❯</div>
</header>

<div class="content" id="boxContainer">
    <h1>Сборник (BOX)</h1>
</div>

<footer>
    <span onclick="if(confirm('Очистить всё?')) {localStorage.removeItem('gy_box'); renderBox();}" style="cursor:pointer">🗑 ОЧИСТИТЬ ХРАНИЛИЩЕ</span>
</footer>

<script>
    function renderBox() {
        const container = document.getElementById('boxContainer');
        const data = JSON.parse(localStorage.getItem('gy_box') || '[]');
        container.innerHTML = '<h1>Сборник (BOX)</h1>';

        if (data.length === 0) {
            container.innerHTML += '<div class="empty-msg">Объекты не зафиксированы...</div>';
            return;
        }

        data.slice().reverse().forEach((item, index) => {
            const realIndex = data.length - 1 - index;
            const div = document.createElement('div');
            div.className = 'box-item';
            div.innerHTML = `
                <div class="meta"><span>${item.style || 'Объект'}</span><span>${item.timestamp || ''}</span></div>
                <div class="v-text">${item.text}</div>
                <div class="item-ctrl">
                    <div class="btn-mini btn-clip" onclick="sendToClip(\`${item.text.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">🎬 В КЛИП</div>
                    <div class="btn-mini" onclick="copyBoxText(\`${item.text.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">📋 КОПИРОВАТЬ</div>
                    <div class="btn-mini" onclick="deleteBoxItem(${realIndex})" style="color:#ff4444">❌ УДАЛИТЬ</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // 🚀 НОВАЯ ФУНКЦИЯ: Переброс текста в Клип
    function sendToClip(txt) {
        localStorage.setItem('last_verse', txt);
        window.location.href = 'clip.html';
    }

    function copyBoxText(txt) {
        navigator.clipboard.writeText(txt).then(() => alert("Скопировано!"));
    }

    function deleteBoxItem(index) {
        if (!confirm("Удалить?")) return;
        let data = JSON.parse(localStorage.getItem('gy_box') || '[]');
        data.splice(index, 1);
        localStorage.setItem('gy_box', JSON.stringify(data));
        renderBox();
    }

    window.onload = renderBox;
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'ru'},'google_translate_element');}</script>
</body>
</html>
