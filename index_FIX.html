<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY CLUB v5.1.18 | index_FIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; --bg: #000; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        html, body { width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; margin: 0; position: fixed; }
        
        .ui-brand { position: fixed; top: 18px; right: 25px; z-index: 10000; font-size: 22px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
        #google_translate_element { position: fixed; top: 15px; left: 15px; z-index: 10001; }
        
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; z-index: 10; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .cell { width: 95px; height: 95px; border: 2px solid var(--gold); background: #fff; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 0 15px rgba(212,175,55,0.2); }
       .cell-id { 
    background: transparent; 
    color: var(--gold); 
    font-size: 11px; 
    font-weight: 900; 
    text-align: center; 
    border: 2px solid var(--gold) !important; /* Сплошная линия вместо пунктира */
    display: flex;
    align-items: center;
    justify-content: center;
}
  .btn-gy {
    padding: 8px 18px;
    font-size: 13px;
    background: transparent !important;
    color: var(--gold);
    border: 1px solid var(--gold);
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    box-shadow: none !important;
    animation: none !important;
}
.btn-gy:hover {
    color: white;
    border-color: white;
    background: transparent !important;
}
        .btn-sleep {
            opacity: 0.2;
            filter: grayscale(1);
            pointer-events: none;
        }
        #main-door { width: 260px; cursor: pointer; transition: 2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999; filter: drop-shadow(0 0 20px rgba(212,175,55,0.3)); }
        .quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; text-align: center; padding: 0 30px; margin-bottom: 25px; line-height: 1.3; }
        
        .card-hall { width: 250px; padding: 25px; background: #F5F5DC; border: 4px solid var(--gold); border-radius: 20px; color: #000; display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .btn-back { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10005; background: rgba(0,0,0,0.9); border: 2px solid var(--gold); color: var(--gold); padding: 12px 30px; cursor: pointer; display: none; text-transform: uppercase; font-weight: 900; opacity: 0; transition: 0.5s; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-brand">GY-GY CLUB</div>
    <button class="btn-back" id="master-back" onclick="GY_Nav.go('block-bar')">НАЗАД В БАР</button>

    <div style="display:none;">
        <audio id="s-door" preload="auto"><source src="door_open.mp3"></audio>
        <audio id="s-amb" loop preload="auto"><source src="bar_ambient.mp3"></audio>
        <audio id="s-khe" preload="auto"><source src="charlie_bar_fx.mp3"></audio>
        <audio id="s-pour" preload="auto"><source src="pour_whisky.mp3"></audio>
    </div>

    <div id="block-entrance" class="block active" style="opacity:1;">
        <img src="door_1.jpg" id="main-door" onclick="GY_Core.initEngine()">
    </div>
<div id="block-welcome" class="block">
    <div class="quote">«В каждой шутке есть доля виски»</div>
    <img src="horse_welcome.png" style="height: 38vh; margin-bottom: 15px;">
    <h1 style="font-family: 'Playfair Display'; color: var(--gold); font-size: 42px; margin: 10px 0; letter-spacing: 8px; text-shadow: 0 0 15px rgba(212,175,55,0.4);">WELCOME</h1>
    <div style="display:flex; gap:15px; margin-top: 15px;">
        <button id="btn-to-hall-wait" class="btn-gy btn-sleep" onclick="GY_Nav.go('block-hall')">В ХОЛЛ</button>
        <button class="btn-gy" onclick="GY_Nav.go('block-reg')">РЕГИСТРАЦИЯ</button>
    </div>
</div>
<div id="block-reg" class="block" style="display:none; flex-direction:column; align-items:center;">
    <div style="width:160px; height:160px; border:1px solid var(--gold); margin-bottom:20px; overflow:hidden; background: rgba(212,175,55,0.05); display:flex; align-items:center; justify-content:center;">
        <img id="reg-avatar-main" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
        <span id="pic-hint" style="color:var(--gold); opacity:0.5; font-size:10px;">НЕТ ФОТО</span>
    </div>

    <div style="display:flex; gap:15px; margin-bottom:30px;">
        <button class="btn-gy" onclick="GY_Identity.uploadPhoto()">ФОТО</button>
        <button class="btn-gy" onclick="GY_Identity.setAvatar()">АВАТАР</button>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:15px;">
        <div class="cell-id" id="reg-id-val" style="min-width:180px; padding:10px; border:2px solid var(--gold); font-family:'Share Tech Mono'; color:var(--gold); text-align:center;">
            #GY-WAIT-2026
        </div>
        <div id="reg-qr-wrap" style="padding:5px; background:white; border:2px solid var(--gold); width:105px; height:105px;">
            </div>
    </div>

    <button class="btn-gy" style="margin-top:40px; font-size:10px; border-color:rgba(212,175,55,0.3);" onclick="GY_Nav.go('block-welcome')">НАЗАД</button>
</div>
    
        <button id="reg-btn-save" class="btn-gy" onclick="GY_Identity.finalize()">СОХРАНИТЬ ДАННЫЕ</button>
        <button id="reg-btn-next" class="btn-gy btn-sleep" onclick="GY_Nav.go('block-hall')">ПЕРЕЙТИ В ХОЛЛ</button>
    </div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity:0.4;"></div>
        <div class="card-hall" style="z-index:20;">
            <div id="hall-id-display" style="font-weight:900; margin-bottom:15px; letter-spacing:1px;">#ID-CHECK</div>
            <div style="display:flex; gap:12px; margin-bottom:20px;">
                <div class="cell" style="border-color:#000; width:85px; height:85px;"><img id="hall-pic" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="cell" id="hall-qr" style="border-color:#000; width:85px; height:85px;"></div>
            </div>
            <button id="hall-btn-confirm" class="btn-gy" style="min-width:100%; border-color:#000; color:#000;" onclick="GY_Identity.verify()">ВЕРИФИКАЦИЯ</button>
            <button id="hall-btn-enter" class="btn-gy btn-sleep" style="min-width:100%; border-color:#000; color:#000; display:none;" onclick="GY_Nav.go('block-bar')">ВОЙТИ В БАР</button>
        </div>
    </div>

    <div id="block-bar" class="block" style="justify-content: flex-end;">
        <div style="margin-bottom: 6vh; z-index:100; display:flex; flex-direction:column; gap:12px;">
            <div style="display:flex; gap:10px;">
                <button class="btn-gy" style="min-width:140px; background:rgba(0,0,0,0.8);" onclick="GY_Nav.go('block-tables')">СТОЛИКИ</button>
                <button class="btn-gy" style="min-width:140px; background:rgba(0,0,0,0.8);" onclick="GY_Core.deepDive()">AI ROOM</button>
            </div>
            <button class="btn-gy" style="background:rgba(0,0,0,0.8); min-width:290px;" onclick="GY_Nav.go('block-hall')">ВЫЙТИ В ХОЛЛ</button>
        </div>
        <img src="horse_bar.png" style="height: 78vh; position:relative; z-index:5;">
    </div>

    <div id="block-tables" class="block" style="background:url('lounge.jpg') center bottom/contain no-repeat;"></div>

    <script>
// 1. БЛОК ЯЗЫКА (ЗАЩИЩЕННЫЙ СТЫК)
function googleTranslateElementInit() { 
    new google.translate.TranslateElement({
        pageLanguage: 'ru', 
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'google_translate_element'); 
}

// 2. ЭТАЛОН РЕГИСТРАЦИИ (ЗАПРЕТ НА ИЗМЕНЕНИЕ СТРУКТУРЫ)
const REG_TEMPLATE = `
    <div style="display: grid; grid-template-columns: 140px 140px; gap: 20px; margin-bottom: 25px;">
        <div class="reg-sq" style="width:140px; height:140px; border:1px solid var(--gold); position:relative;">
            <img id="reg-avatar-main" style="width:100%; height:100%; object-fit:cover; display:none;">
            <span id="pic-hint" style="color:var(--gold); opacity:0.4; font-size:9px; position:absolute; top:45%; left:25%;">PHOTO ZONE</span>
            <button class="btn-gy" style="position:absolute; bottom:-12px; left:25%; font-size:8px; padding:2px 5px;" onclick="GY_Identity.uploadPhoto()">ФОТО</button>
        </div>
        <div class="reg-sq" style="width:140px; height:140px; border:1px solid var(--gold); position:relative;">
            <img id="reg-avatar-alt" style="width:100%; height:100%; object-fit:cover; display:none;">
            <span id="alt-hint" style="color:var(--gold); opacity:0.4; font-size:9px; position:absolute; top:45%; left:25%;">AVATAR ZONE</span>
            <button class="btn-gy" style="position:absolute; bottom:-12px; left:25%; font-size:8px; padding:2px 5px;" onclick="GY_Identity.setAvatar()">АВАТАР</button>
        </div>
        <div class="reg-sq" style="width:140px; height:140px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; padding:5px;">
            <div id="reg-id-val" style="font-family:'Share Tech Mono'; color:var(--gold); font-size:11px; text-align:center;">#GY-WAIT-2026</div>
        </div>
        <div class="reg-sq" id="reg-qr-wrap" style="width:140px; height:140px; border:1px solid var(--gold); background:white; padding:5px; box-sizing:border-box;"></div>
    </div>
    <div style="display:flex; gap:15px; margin-top:20px;">
        <button id="btn-save-reg" class="btn-gy" onclick="GY_Identity.saveIdentity()">СОХРАНИТЬ</button>
        <button class="btn-gy" onclick="GY_Nav.go('block-welcome')">ОТМЕНА</button>
    </div>
`;

const GY_Identity = {
    id: "",
    create() {
        this.id = `#GY-${Math.floor(100 + Math.random() * 899)}-2026`;
        const el = document.getElementById('reg-id-val');
        if (el) el.innerText = this.id;
        const qr = document.getElementById('reg-qr-wrap');
        if (qr && typeof QRCode !== 'undefined') { 
            qr.innerHTML = ""; new QRCode(qr, { text: this.id, width: 130, height: 130 }); 
        }
    },
    uploadPhoto() {
        const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = ev => { 
                const img = document.getElementById('reg-avatar-main');
                if(img) { img.src = ev.target.result; img.style.display = "block"; document.getElementById('pic-hint').style.display = "none"; }
            };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    },
    setAvatar() {
        const seed = Math.random().toString(36).substring(7);
        const img = document.getElementById('reg-avatar-alt');
        if(img) { img.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}`; img.style.display = "block"; document.getElementById('alt-hint').style.display = "none"; }
    },
    saveIdentity() {
        const btn = document.getElementById('btn-save-reg');
        btn.innerText = "СОХРАНЕНО ✓"; btn.style.color = "#00ff00";
        setTimeout(() => { GY_Nav.go('block-welcome'); this.unlockHall(); }, 800);
    },
    unlockHall() {
        const hBtn = document.getElementById('btn-to-hall-wait');
        if(hBtn) { hBtn.classList.remove('btn-sleep'); hBtn.style.opacity = "1"; hBtn.style.pointerEvents = "auto"; }
    }
};

const GY_Nav = {
    go(to) {
        document.querySelectorAll('.block').forEach(b => { b.style.display = 'none'; b.classList.remove('active'); });
        const next = document.getElementById(to);
        if (next) {
            if (to === 'block-reg') next.innerHTML = REG_TEMPLATE; // ВОССТАНОВЛЕНИЕ ЭТАЛОНА ПРИ КАЖДОМ ВХОДЕ
            next.style.display = 'flex';
            setTimeout(() => { next.classList.add('active'); next.style.opacity = "1"; if(to === 'block-reg') GY_Identity.create(); }, 50);
        }
    }
};

const GY_Core = {
    initEngine() {
        new Audio('door_open.mp3').play().catch(() => {});
        window.clubAmb = new Audio('bar_ambient.mp3');
        window.clubAmb.loop = true; window.clubAmb.volume = 0.4;
        window.clubAmb.play().catch(() => {});
        const door = document.getElementById('main-door');
        if(door) { door.style.transform = "scale(12)"; door.style.opacity = "0"; }
        setTimeout(() => { GY_Nav.go('block-welcome'); }, 1200);
    }
};

// СТЫКОВКА ВСЕХ СИСТЕМ
window.onload = () => {
    googleTranslateElementInit(); // Возвращаем язык
    const d = document.getElementById('main-door');
    if (d) d.onclick = () => GY_Core.initEngine();
};

// ЗАМОРОЗКА ОБЪЕКТОВ (ЗАПРЕТ НА ПРАВКИ)
Object.freeze(REG_TEMPLATE);
Object.freeze(GY_Core);
    </script>
    
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
