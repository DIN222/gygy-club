<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY  v5.1.23 | index_FIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Карточка в Холле */
        .hall-card {
            border: 1px solid var(--gold);
            background: rgba(212, 175, 55, 0.05);
            padding: 20px;
            text-align: center;
            color: var(--gold);
        }
        
        /* Выпадающее меню */
        .gy-dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background: #000;
            border: 1px solid var(--gold);
            min-width: 120px;
            z-index: 100;
        }
        .dropdown-content a {
            color: var(--gold);
            padding: 10px;
            text-decoration: none;
            display: block;
            font-size: 12px;
        }
        .dropdown-content a:hover {
            background: var(--gold);
            color: #000;
        }
        .gy-dropdown:hover .dropdown-content {
            display: block;
        }
        :root { --gold: #d4af37; --violet: #8A2BE2; --bg: #000; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        html, body { width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; margin: 0; position: fixed; }
        
        .ui-brand { position: fixed; top: 18px; right: 25px; z-index: 10000; font-size: 22px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
        #google_translate_element { position: fixed; top: 15px; left: 15px; z-index: 10001; }
        
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; z-index: 10; }
        .block.active { display: flex !important; opacity: 1; pointer-events: auto; }

        .id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .cell { width: 95px; height: 95px; border: 2px solid var(--gold); background: #fff; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: 0 0 15px rgba(212,175,55,0.2); }
       .cell-id { 
    background: transparent; 
    color: var(--gold); 
    font-size: 11px; 
    font-weight: 900; 
    text-align: center; 
    border: 2px solid var(--gold) !important; /* Сплошная линия вместо пунктира */
    display: flex;
    align-items: center;
    justify-content: center;
}
  .btn-gy {
    padding: 8px 18px;
    font-size: 13px;
    background: transparent !important;
    color: var(--gold);
    border: 1px solid var(--gold);
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    box-shadow: none !important;
    animation: none !important;
}
.btn-gy:hover {
    color: white;
    border-color: white;
    background: transparent !important;
}
        .btn-sleep {
            opacity: 0.2;
            filter: grayscale(1);
            pointer-events: none;
        }
        #main-door { width: 260px; cursor: pointer; transition: 2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999; filter: drop-shadow(0 0 20px rgba(212,175,55,0.3)); }
        .quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; text-align: center; padding: 0 30px; margin-bottom: 25px; line-height: 1.3; }
        
        .card-hall { width: 250px; padding: 25px; background: #F5F5DC; border: 4px solid var(--gold); border-radius: 20px; color: #000; display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .btn-back { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10005; background: rgba(0,0,0,0.9); border: 2px solid var(--gold); color: var(--gold); padding: 12px 30px; cursor: pointer; display: none; text-transform: uppercase; font-weight: 900; opacity: 0; transition: 0.5s; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="google_translate_element"></div>
    <div class="ui-brand">GY-GY CLUB</div>
    <button class="btn-back" id="master-back" onclick="GY_Nav.go('block-bar')">НАЗАД В БАР</button>

    <div style="display:none;">
        <audio id="s-door" preload="auto"><source src="door_open.mp3"></audio>
        <audio id="s-amb" loop preload="auto"><source src="bar_ambient.mp3"></audio>
    </div>

    <div id="block-entrance" class="block active" style="opacity:1;">
        <img src="door_1.jpg" id="main-door" onclick="GY_Core.initEngine()">
    </div>

    <div id="block-welcome" class="block">
        <div class="quote">«В каждой шутке есть доля виски»</div>
        <img src="horse_welcome.png" style="height: 38vh; margin-bottom: 15px;">
        <h1 style="font-family: 'Playfair Display'; color: var(--gold); font-size: 42px; margin: 10px 0; letter-spacing: 8px;">WELCOME</h1>
        <div style="display:flex; gap:15px; margin-top: 15px;">
            <button id="btn-to-hall-wait" class="btn-gy btn-sleep" onclick="GY_Nav.go('block-hall')">В ХОЛЛ</button>
            <button class="btn-gy" onclick="GY_Nav.go('block-reg')">РЕГИСТРАЦИЯ</button>
        </div>
    </div>

    <div id="block-reg" class="block"></div>

    <div id="block-hall" class="block">
        <div style="position:absolute; inset:0; background:url('hall_bg_jpg.jpg') center/cover; opacity:0.4;"></div>
        <div class="card-hall" style="z-index:20; background: #F5F5DC; border: 4px solid var(--gold); padding: 20px; color: #000; text-align: center;">
            <div id="hall-id-display" style="font-weight:900; margin-bottom:15px;">#ID-CHECK</div>
            <div style="display:flex; gap:12px; margin-bottom:20px;">
                <div class="cell" style="width:85px; height:85px; border:1px solid #000;"><img id="hall-pic" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="cell" id="hall-qr" style="width:85px; height:85px; border:1px solid #000;"></div>
            </div>
            <button id="hall-btn-confirm" class="btn-gy" style="border-color:#000; color:#000;" onclick="GY_Identity.verify()">ВЕРИФИКАЦИЯ</button>
        </div>
    </div>

    <div id="block-bar" class="block" style="justify-content: flex-end;">
        <img src="horse_bar.png" style="height: 78vh; position:relative; z-index:5;">
    </div>

    <script>
function googleTranslateElementInit() { 
    new google.translate.TranslateElement({pageLanguage: 'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element'); 
}

const REG_TEMPLATE = `
    <div style="display: grid; grid-template-columns: 140px 140px; gap: 20px; margin-bottom: 25px;">
        <div style="width:140px; height:140px; border:1px solid var(--gold); position:relative; background:#FFF; display:flex; align-items:center; justify-content:center;">
            <img id="reg-avatar-main" style="width:100%; height:100%; object-fit:cover; display:none;">
            <span id="pic-hint" style="color:#000; opacity:0.3; font-size:10px; text-align:center;">PHOTO<br>ZONE</span>
            <button class="btn-gy" style="position:absolute; bottom:-12px; font-size:8px; padding:2px 6px;" onclick="GY_Identity.uploadPhoto()">ФОТО</button>
        </div>
        <div style="width:140px; height:140px; border:1px solid var(--gold); position:relative; background:#FFF; display:flex; align-items:center; justify-content:center;">
            <img id="reg-avatar-alt" style="width:100%; height:100%; object-fit:cover; display:none;">
            <span id="alt-hint" style="color:#000; opacity:0.3; font-size:10px; text-align:center;">AVATAR<br>ZONE</span>
            <button class="btn-gy" style="position:absolute; bottom:-12px; font-size:8px; padding:2px 6px;" onclick="GY_Identity.setAvatar()">АВАТАР</button>
        </div>
        <div style="width:140px; height:140px; border:1px solid var(--gold); display:flex; align-items:center; justify-content:center; padding:10px;">
            <div id="reg-id-val" style="color:var(--gold); font-size:11px; text-align:center;">#GY-WAIT-2026</div>
        </div>
        <div id="reg-qr-wrap" style="width:140px; height:140px; border:1px solid var(--gold); background:white; padding:10px; box-sizing:border-box;"></div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:15px;">
        <button id="btn-save-reg" class="btn-gy" onclick="GY_Identity.saveIdentity()">ПОДТВЕРДИТЬ</button>
        <button class="btn-gy" style="opacity:0.5;" onclick="GY_Nav.go('block-welcome')">НАЗАД</button>
    </div>
`;

const GY_Identity = {
    id: "",
    pic: "",
    create() {
        this.id = `#GY-${Math.floor(100 + Math.random() * 899)}-2026`;
        document.getElementById('reg-id-val').innerText = this.id;
        const qr = document.getElementById('reg-qr-wrap');
        if (qr && typeof QRCode !== 'undefined') { 
            qr.innerHTML = ""; new QRCode(qr, { text: this.id, width: 120, height: 120 }); 
        }
    },
    uploadPhoto() {
        const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = ev => { 
                this.pic = ev.target.result;
                const img = document.getElementById('reg-avatar-main');
                img.src = this.pic; img.style.display = "block";
                document.getElementById('pic-hint').style.display = "none";
            };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    },
    setAvatar() {
        const seed = Math.random().toString(36).substring(7);
        this.pic = `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}`;
        const img = document.getElementById('reg-avatar-alt');
        img.src = this.pic; img.style.display = "block";
        document.getElementById('alt-hint').style.display = "none";
    },
    saveIdentity() {
        const btn = document.getElementById('btn-save-reg');
        btn.innerText = "ПОДТВЕРЖДЕНО";
        // Перенос данных в Холл
        document.getElementById('hall-id-display').innerText = this.id;
        document.getElementById('hall-pic').src = this.pic;
        setTimeout(() => { GY_Nav.go('block-hall'); }, 800);
    },
    verify() {
        const btn = document.getElementById('hall-btn-confirm');
        btn.innerText = "ВЕРИФИЦИРОВАНО";
        setTimeout(() => { GY_Nav.go('block-bar'); }, 1000);
    }
};

const GY_Nav = {
    go(to) {
        document.querySelectorAll('.block').forEach(b => { b.style.display = 'none'; b.classList.remove('active'); });
        const next = document.getElementById(to);
        if (next) {
            if (to === 'block-reg') next.innerHTML = REG_TEMPLATE;
            if (to === 'block-hall') this.injectMenu(next);
            next.style.display = 'flex';
            setTimeout(() => { 
                next.classList.add('active'); 
                if(to === 'block-reg') GY_Identity.create(); 
            }, 50);
        }
    },
    injectMenu(container) {
        if (!container.querySelector('.gy-dropdown')) {
            const menu = `<div class="gy-dropdown"><button class="btn-gy">МЕНЮ ▼</button>
            <div class="dropdown-content"><a href="#" onclick="GY_Nav.go('block-hall')">ХОЛЛ</a>
            <a href="#" onclick="GY_Nav.go('block-atelier')">АТЕЛЬЕ</a></div></div>`;
            container.insertAdjacentHTML('afterbegin', menu);
        }
    }
};

const GY_Core = {
    initEngine() {
        document.getElementById('s-door').play();
        document.getElementById('s-amb').play();
        const door = document.getElementById('main-door');
        door.style.transform = "scale(12)"; door.style.opacity = "0";
        setTimeout(() => { GY_Nav.go('block-welcome'); }, 1200);
    }
};

window.onload = () => { googleTranslateElementInit(); };
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
