
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY Club | Tables v1.4.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: 'Share Tech Mono', monospace; overflow: hidden; }

        #google_translate_element { position: fixed; top: 15px; left: 15px; z-index: 6000; }
        
        .ui-back-to-bar { 
            position: fixed; top: 65px; left: 15px; z-index: 6000;
            background: rgba(0,0,0,0.8); border: 1px solid var(--gold); color: var(--gold);
            padding: 8px 15px; cursor: pointer; font-family: 'Share Tech Mono', monospace; 
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .ui-back-to-bar:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }

        #ui-logo { position: fixed; top: 15px; right: 25px; z-index: 5000; color: var(--gold); font-size: 24px; font-weight: bold; letter-spacing: 5px; pointer-events: none; }

        /* СЛОИ */
        #entry-layer { 
            position: fixed; inset: 0; background: #000; 
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 2000; transition: opacity 1s; 
        }

        #hall-layer { 
            width: 100vw; height: 100vh; 
            background: url('lounge.jpg') no-repeat center bottom / contain #000; 
            position: relative; display: none; opacity: 0; transition: opacity 1.2s; 
        }

        /* ЛАМПЫ */
        .lamp-zone { 
            position: absolute; width: 42px; height: 42px; border-radius: 50%; 
            cursor: pointer; z-index: 100; 
            background: radial-gradient(circle, var(--neon-glow) 0%, transparent 75%); 
            border: 1px solid var(--violet); 
            box-shadow: 0 0 18px var(--neon-glow);
            transition: 0.4s; transform: translate(-50%, -50%); 
        }
        .lamp-zone:hover { transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 35px var(--violet); }

        /* КООРДИНАТЫ */
        #table-1 { bottom: 49.2%; left: 49.9%; } 
        #table-2 { bottom: 22.1%; left: 35.7%; } 
        #table-3 { bottom: 33.1%; left: 43.1%; } 
        #table-4 { bottom: 36.1%; left: 44.5%; } 
        #table-5 { bottom: 35.7%; left: 56.2%; } 
        #table-6 { bottom: 21.9%; left: 63.8%; } 
        #mic-zone { bottom: 32.4%; left: 58.3%; border-width: 2px; }

        #hud { position: fixed; top: 110px; left: 15px; z-index: 1500; display: none; }
        .user-mini { width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--gold); object-fit: cover; }

        .reg-btn { background: #000; border: 2px solid var(--gold); color: var(--gold); padding: 18px 45px; cursor: pointer; margin-top: 20px; font-family: inherit; letter-spacing: 2px; }
    </style>
</head>
<body>
    <audio id="snd-ambient" loop preload="auto"><source src="bar_ambient.mp3" type="audio/mpeg"></audio>

    <div id="google_translate_element"></div>
    <button class="ui-back-to-bar" onclick="window.location.href='index.html'">← В БАР</button>
    <div id="ui-logo">GY-GY</div>

    <div id="entry-layer">
        <div style="border: 1px solid var(--gold); padding: 40px; text-align: center; background: #050505;">
            <p id="charlie-msg" style="color: #fff;">Чарли: "Выбирай столик, здесь все свои."</p>
            <button class="reg-btn" onclick="Core.register()">К СТОЛАМ</button>
        </div>
    </div>

    <div id="hall-layer">
        <div id="hud"><img id="user-avatar" class="user-mini" src=""></div>
        
        <div id="table-1" class="lamp-zone" title="РИСК" onclick="Core.transitionToTable('risk.html')"></div>
        <div id="table-2" class="lamp-zone" title="ДУЭЛЬ ЦИТАТ" onclick="Core.transitionToTable('battle.html')"></div>
        <div id="table-3" class="lamp-zone" title="АНОНИМНЫЙ ЧАТ" onclick="Core.transitionToTable('roulette.html')"></div>
        <div id="table-4" class="lamp-zone" title="ПЕРЕВОДЧИК" onclick="Core.transitionToTable('translator.html')"></div>
        <div id="table-5" class="lamp-zone" title="ДУЭЛЬ КОМПЛИМЕНТОВ" onclick="Core.transitionToTable('compliments.html')"></div>
        <div id="table-6" class="lamp-zone" title="ИИ ТЕНЬ" onclick="Core.transitionToTable('ai_shadow.html')"></div>
        <div id="mic-zone" class="lamp-zone" title="ОТКРЫТЫЙ МИКРОФОН" onclick="Core.transitionToTable('open_mic.html')"></div>
    </div>

    <script>
        const Core = {
            register() {
                const id = localStorage.getItem('gy_trace') || 'GY-' + Math.random().toString(36).substr(2, 6).toUpperCase();
                localStorage.setItem('gy_trace', id);
                this.enter();
            },

            enter(instant = false) {
                const amb = document.getElementById('snd-ambient');
                const entry = document.getElementById('entry-layer');
                const hall = document.getElementById('hall-layer');

                amb.volume = 0;
                amb.play().catch(() => {});
                
                if (instant) {
                    entry.style.display = 'none';
                    hall.style.display = 'block';
                    hall.style.opacity = '1';
                    document.getElementById('hud').style.display = 'block';
                    this.fadeAudio(amb, 0.6, 500);
                } else {
                    entry.style.opacity = '0';
                    setTimeout(() => {
                        entry.style.display = 'none';
                        hall.style.display = 'block';
                        setTimeout(() => { 
                            hall.style.opacity = '1'; 
                            document.getElementById('hud').style.display = 'block';
                        }, 50);
                    }, 1000);
                    this.fadeAudio(amb, 0.6, 2000);
                }
                document.getElementById('user-avatar').src = localStorage.getItem('gy_avatar_data') || '';
            },

            transitionToTable(url) {
                const amb = document.getElementById('snd-ambient');
                this.fadeAudio(amb, 0, 800);
                document.body.style.transition = "opacity 0.8s, filter 0.8s";
                document.body.style.opacity = "0";
                document.body.style.filter = "blur(10px) brightness(0)";
                setTimeout(() => { window.location.href = url; }, 800);
            },

            fadeAudio(audio, target, duration) {
                const start = audio.volume;
                const startTime = Date.now();
                const interval = setInterval(() => {
                    const progress = Math.min((Date.now() - startTime) / duration, 1);
                    audio.volume = start + (target - start) * progress;
                    if (progress === 1) clearInterval(interval);
                }, 50);
            }
        };

        window.onload = () => { 
            if(localStorage.getItem('gy_trace')) {
                Core.enter(true); 
            } else {
                document.getElementById('entry-layer').style.display = 'flex';
            }
        };

        function googleTranslateElementInit() { 
            new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element'); 
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
