<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY REAKTOR V3.1 MODIFIED</title>
    <style>
        :root { --gold-glow: rgba(212, 175, 55, 0.4); }
        
        body { 
            margin: 0; padding: 0; 
            background: #000; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden;
        }

        /* ОСНОВНОЙ КОРПУС С ПОДЛОЖКОЙ JPG */
        #pult-container {
            width: 1024px; 
            height: 1024px;
            background: url('reactor_bg.jpg') no-repeat center center;
            background-size: contain;
            position: relative;
            box-shadow: 0 0 100px #000 inset, 0 50px 100px rgba(0,0,0,0.9);
        }

        /* ЦЕНТРАЛЬНЫЙ ЭКРАН (ОСЦИЛЛОГРАФ) */
        .oscilloscope-screen {
            position: absolute;
            top: 145px; left: 260px;
            width: 505px; height: 505px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 5;
            background: transparent;
        }

        /* ИНТЕРАКТИВНЫЕ ЗОНЫ (РЫЧАГИ 3+3) */
        .knob-zone {
            position: absolute;
            width: 120px; height: 120px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
        }
        .knob-zone:hover { box-shadow: 0 0 15px var(--gold-glow); }

        /* Координаты левых кнопок */
        #knob-style   { top: 125px; left: 65px; }
        #knob-era     { top: 335px; left: 65px; }
        #knob-culture { top: 545px; left: 65px; }

        /* Координаты правых кнопок */
        #knob-medium  { top: 125px; left: 835px; }
        #knob-mood    { top: 335px; left: 835px; }
        #knob-density { top: 545px; left: 835px; }

        /* СЕРВИСНЫЕ КНОПКИ (НИЖНИЙ РЯД) */
        .service-btn {
            position: absolute;
            width: 150px; height: 100px;
            cursor: pointer;
            opacity: 0; /* Делаем невидимыми, чтобы работала только картинка */
            z-index: 10;
        }
        .service-btn:active { opacity: 0.2; background: #fff; }

        #btn-delete   { bottom: 50px; left: 60px; }
        #btn-save     { bottom: 50px; left: 280px; }
        #btn-send     { bottom: 50px; left: 500px; }
        #btn-atelier  { bottom: 50px; left: 780px; width: 180px; height: 180px; border-radius: 50%; }

        /* ТЕЛЕТАЙП (ЛОГ-ОКНО) */
        #log-window {
            position: absolute;
            top: 685px; left: 295px;
            width: 435px; height: 105px;
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            overflow: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="pult-container">
    <div class="oscilloscope-screen" id="main-display"></div>

    <div id="knob-style" class="knob-zone" onclick="changeParam('style')"></div>
    <div id="knob-era" class="knob-zone" onclick="changeParam('era')"></div>
    <div id="knob-culture" class="knob-zone" onclick="changeParam('culture')"></div>
    
    <div id="knob-medium" class="knob-zone" onclick="changeParam('medium')"></div>
    <div id="knob-mood" class="knob-zone" onclick="changeParam('mood')"></div>
    <div id="knob-density" class="knob-zone" onclick="changeParam('density')"></div>

    <div id="log-window">
        SYSTEM READY...<br>
        SEKTOR RU ACTIVE<br>
        AWAITING DISPATCH...
    </div>

    <div id="btn-delete" class="service-btn" onclick="cmd('DELETE')"></div>
    <div id="btn-save" class="service-btn" onclick="cmd('SAVE')"></div>
    <div id="btn-send" class="service-btn" onclick="cmd('SEND')"></div>
    <div id="btn-atelier" class="service-btn" onclick="cmd('ATELIER')"></div>
</div>

<script>
    function changeParam(p) {
        console.log("Параметр " + p + " изменен.");
        document.getElementById('log-window').innerHTML += "<br>> ADJ: " + p.toUpperCase();
    }

    function cmd(action) {
        alert("ЧАРЛИ: ВЫПОЛНЯЮ " + action);
    }
</script>

</body>
</html>
