
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY STUDIO - REACTOR CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --black: #0a0a0a; }
        
        body { 
            background: var(--black); 
            color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            margin: 0; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh; 
        }

        header { 
            display: grid; grid-template-columns: 1fr auto 1fr; 
            align-items: center; padding: 10px 20px; 
            border-bottom: 2px solid var(--gold); background: #000; 
            z-index: 10;
        }

        .header-left { display: flex; gap: 15px; }
        
        .ui-box { 
            height: 45px; border: 1px solid var(--gold); 
            display: flex; align-items: center; justify-content: center; 
            padding: 0 20px; color: var(--gold); cursor: pointer; 
            font-weight: bold; text-decoration: none; transition: 0.3s;
        }
        .ui-box:hover { background: rgba(255,215,0,0.2); box-shadow: 0 0 15px var(--gold); }
        
        .logo { font-size: 28px; letter-spacing: 8px; text-shadow: 0 0 10px var(--gold); }

        main { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            overflow: hidden;
            position: relative;
        }
        
        .pult-frame-wrapper {
            position: absolute;
            width: 1024px; 
            height: 1024px;
            top: 50%;
            left: 50%;
            /* Еще более агрессивное сжатие: вычитаем 250px и ставим макс масштаб 0.6 */
            transform: translate(-50%, -50%) scale(min(0.6, calc((100vh - 250px) / 1024))); 
            transform-origin: center center;
            border: 5px solid #222;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        iframe { 
            width: 1024px; 
            height: 1024px; 
            border: none; 
            display: block;
        }

        footer { 
            padding: 15px; border-top: 2px solid var(--gold); 
            text-align: center; font-size: 12px; opacity: 0.6;
            background: #000; z-index: 10;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="index.html" class="ui-box">« НАЗАД</a>
        <div class="ui-box" style="border-color: #444; color: #666;">RU / EN</div>
    </div>
    <div class="logo">GY-GY</div>
    <div class="header-right" style="text-align: right;">
        <div class="ui-box" style="display: inline-flex;">STUDIO V.3.6.1</div>
    </div>
</header>

<main>
    <div class="pult-frame-wrapper">
        <iframe src="pult_reactor_v31.html"></iframe>
    </div>
</main>

<footer>
    © 2026 GY-GY CLUB | INDUSTRIAL GENERATION UNIT | VEO-READY
</footer>

</body>
</html>
