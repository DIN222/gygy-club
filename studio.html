

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY STUDIO - SURGICAL FIX 03</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --black: #0a0a0a; }
        * { box-sizing: border-box; }

        body { 
            background: var(--black); 
            color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            margin: 0; padding: 0;
            overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh; 
        }

        header { 
            display: grid; grid-template-columns: 1fr auto 1fr; 
            align-items: center; padding: 10px 20px; 
            border-bottom: 2px solid var(--gold); background: #000; 
            flex-shrink: 0; height: 70px; z-index: 10;
        }

        .header-left { display: flex; gap: 15px; }
        .ui-box { 
            height: 40px; border: 1px solid var(--gold); 
            display: flex; align-items: center; justify-content: center; 
            padding: 0 20px; color: var(--gold); cursor: pointer; 
            font-weight: bold; text-decoration: none; font-size: 14px;
        }

        .logo { font-size: 24px; letter-spacing: 6px; text-shadow: 0 0 10px var(--gold); }

        main { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            overflow: hidden;
            padding: 0; /* Убираем падинги, чтобы не мешали */
        }

        /* КОНТЕЙНЕР, КОТОРЫЙ ЗАДАЕТ ФИЗИЧЕСКИЙ РАЗМЕР */
        .pult-container {
            width: 70vh; /* Ровно 70% от высоты экрана */
            height: 70vh;
            max-width: 95vw; /* Чтобы не вылез по ширине */
            max-height: 95vw;
            position: relative;
            border: 10px solid #1a1a1a;
            box-shadow: 0 0 100px #000;
            background: #000;
        }

        /* САМА ОБОЛОЧКА IFRAME */
        .iframe-wrapper {
            width: 1024px;
            height: 1024px;
            position: absolute;
            top: 0;
            left: 0;
            /* Высчитываем масштаб как отношение контейнера к 1024 */
            transform: scale(calc(70vh / 1024));
            /* КРИТИЧЕСКИЙ ПАРАМЕТР: масштабируем из левого верхнего угла */
            transform-origin: 0 0; 
        }

        iframe { 
            width: 1024px; 
            height: 1024px; 
            border: none;
            display: block;
        }

        footer { 
            height: 50px; border-top: 2px solid var(--gold); 
            text-align: center; font-size: 11px; opacity: 0.5;
            background: #000; flex-shrink: 0; line-height: 50px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="index.html" class="ui-box">« НАЗАД</a>
        <div class="ui-box" style="border-color: #333; color: #555;">RU</div>
    </div>
    <div class="logo">GY-GY</div>
    <div class="header-right" style="text-align: right;">
        <div class="ui-box" style="display: inline-flex; border-color: #444;">V.3.6.6</div>
    </div>
</header>

<main>
    <div class="pult-container">
        <div class="iframe-wrapper">
            <iframe src="pult_reactor_v31.html"></iframe>
        </div>
    </div>
</main>

<footer>
    © 2026 GY-GY CLUB | INDUSTRIAL GENERATION UNIT
</footer>

</body>
</html>
