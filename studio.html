
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY STUDIO - REACTOR CORE 001</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; 
            --black: #0a0a0a; 
        }
        
        /* ГЛОБАЛЬНЫЕ НАСТРОЙКИ */
        * { box-sizing: border-box; }

        body { 
            background: var(--black); 
            color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            margin: 0; 
            padding: 0;
            overflow: hidden; /* Запрещаем скролл всей страницы */
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* ШАПКА */
        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 10px 20px; 
            border-bottom: 2px solid var(--gold); 
            background: #000; 
            z-index: 10;
            flex-shrink: 0;
        }

        .header-left { display: flex; gap: 15px; }
        
        .ui-box { 
            height: 45px; 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 20px; 
            color: var(--gold); 
            cursor: pointer; 
            font-weight: bold; 
            text-decoration: none; 
            transition: 0.3s;
            background: transparent;
        }
        .ui-box:hover { 
            background: rgba(255,215,0,0.2); 
            box-shadow: 0 0 15px var(--gold); 
        }
        
        .logo { font-size: 28px; letter-spacing: 8px; text-shadow: 0 0 10px var(--gold); }

        /* ЦЕНТРАЛЬНЫЙ ОТСЕК С ЖЕСТКИМ ЦЕНТРИРОВАНИЕМ */
        main { 
            flex: 1; 
            display: grid; 
            place-items: center; /* Центрирует и по вертикали, и по горизонтали */
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            overflow: hidden;
            position: relative;
        }
        
        /* КОНТЕЙНЕР РЕАКТОРА */
        .pult-frame-wrapper {
            width: 1024px; 
            height: 1024px;
            /* Авто-масштаб: подстраивается под высоту экрана минус шапка/футер */
            transform: scale(min(0.6, calc((100vh - 200px) / 1024))); 
            transform-origin: center center;
            border: 5px solid #222;
            box-shadow: 0 0 100px rgba(0,0,0,1);
            background: #000;
            display: block;
        }

        iframe { 
            width: 1024px; 
            height: 1024px; 
            border: none; 
            display: block;
        }

        /* ФУТЕР */
        footer { 
            padding: 15px; 
            border-top: 2px solid var(--gold); 
            text-align: center; 
            font-size: 12px; 
            opacity: 0.6;
            background: #000; 
            z-index: 10;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="index.html" class="ui-box">« НАЗАД</a>
        <div class="ui-box" style="border-color: #444; color: #666;">RU / EN</div>
    </div>
    <div class="logo">GY-GY</div>
    <div class="header-right" style="text-align: right;">
        <div class="ui-box" style="display: inline-flex;">STUDIO V.3.6.2</div>
    </div>
</header>

<main>
    <div class="pult-frame-wrapper">
        <iframe src="pult_reactor_v31.html"></iframe>
    </div>
</main>

<footer>
    © 2026 GY-GY CLUB | INDUSTRIAL GENERATION UNIT | VEO-READY
</footer>

</body>
</html>
