
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY STUDIO - REACTOR CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffd700; 
            --black: #0a0a0a; 
        }
        
        * { box-sizing: border-box; }

        body { 
            background: var(--black); 
            color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 10px 20px; 
            border-bottom: 2px solid var(--gold); 
            background: #000; 
            z-index: 10;
            flex-shrink: 0;
            height: 70px;
        }

        .header-left { display: flex; gap: 15px; }
        
        .ui-box { 
            height: 40px; 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 15px; 
            color: var(--gold); 
            cursor: pointer; 
            font-weight: bold; 
            text-decoration: none; 
            transition: 0.3s;
            font-size: 14px;
        }
        .ui-box:hover { 
            background: rgba(255,215,0,0.2); 
            box-shadow: 0 0 15px var(--gold); 
        }
        
        .logo { font-size: 24px; letter-spacing: 6px; text-shadow: 0 0 10px var(--gold); }

        main { 
            flex: 1; 
            display: grid; 
            place-items: center; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            overflow: hidden;
            padding: 20px;
        }
        
        /* КОНТЕЙНЕР С ЖЕСТКИМ ОГРАНИЧЕНИЕМ ГАБАРИТОВ */
        .pult-frame-wrapper {
            position: relative;
            /* Базовый размер пульта */
            width: 1024px; 
            height: 1024px;
            
            /* ЖЕСТКИЙ РЫЧАГ: Пульт не может быть больше 70% высоты окна */
            --dynamic-scale: calc((100vh - 200px) / 1024);
            transform: scale(min(0.7, var(--dynamic-scale))); 
            
            transform-origin: center center;
            border: 10px solid #1a1a1a;
            box-shadow: 0 0 80px rgba(0,0,0,1);
            background: #000;
            flex-shrink: 0;
        }

        iframe { 
            width: 1024px; 
            height: 1024px; 
            border: none; 
            display: block;
        }

        footer { 
            padding: 10px; 
            border-top: 2px solid var(--gold); 
            text-align: center; 
            font-size: 11px; 
            opacity: 0.5;
            background: #000; 
            z-index: 10;
            flex-shrink: 0;
            height: 50px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="index.html" class="ui-box">« НАЗАД</a>
        <div class="ui-box" style="border-color: #333; color: #555;">RU</div>
    </div>
    <div class="logo">GY-GY</div>
    <div class="header-right" style="text-align: right;">
        <div class="ui-box" style="display: inline-flex; border-color: #444;">V.3.6.3</div>
    </div>
</header>

<main>
    <div class="pult-frame-wrapper">
        <iframe src="pult_reactor_v31.html"></iframe>
    </div>
</main>

<footer>
    © 2026 GY-GY CLUB | INDUSTRIAL GENERATION UNIT | VEO-READY
</footer>

</body>
</html>
