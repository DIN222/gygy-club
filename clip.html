<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | PURE GOLD v33.5.45 🔒</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; }
        
        /* HEADER: ТОЛЬКО ЗОЛОТО 🔒 */
        header { height: 65px; display: flex; align-items: center; border-bottom: 1px solid var(--gold); background: #000; padding: 0 10px; gap: 10px; z-index: 1000; flex-shrink: 0; }
        .nav-btn { width: 40px; height: 40px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-size: 1.2rem; flex-shrink: 0; }
        .logo-gy { font-size: 1rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; padding: 0 10px; border-right: 1px solid #333; flex-shrink: 0; }

        .scroll-tools { display: flex; align-items: center; gap: 10px; overflow-x: auto; flex-grow: 1; scrollbar-width: none; }
        .scroll-tools::-webkit-scrollbar { display: none; }

        /* КНОПКИ БЕЗ ПОДСВЕТКИ 🔒 */
        .t-btn { height: 40px; padding: 0 15px; border: 1px solid var(--gold); background: #000; color: var(--gold); font-size: 0.65rem; text-transform: uppercase; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .t-btn:active { background: #111; }

        /* ТЕРРИТОРИЯ КЛУБА (ВИДЕО-ЗОНА) 🔒 */
        #stage { flex-grow: 1; position: relative; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        #vCanvas { 
            position: absolute; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0; transition: opacity 2s ease-in-out; z-index: 1; 
        }

        .overlay { position: relative; z-index: 10; width: 85%; pointer-events: none; }
        .v-text { 
            width: 100%; height: 200px; background: transparent; border: none; 
            color: #fff; font-size: 2rem; text-align: center; outline: none; 
            resize: none; font-family: inherit; pointer-events: auto;
            text-shadow: 2px 2px 10px #000;
        }

        /* ГЛАВНАЯ КНОПКА (НИЖНЯЯ) 🔒 */
        footer { padding: 15px; background: #000; z-index: 100; border-top: 1px solid #111; }
        .run-btn { 
            width: 100%; height: 60px; border: 1px solid var(--gold); 
            background: #000; color: var(--gold); font-weight: 900; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 3px; 
        }

        .pop-menu { display: none; position: absolute; background: #000; border: 1px solid var(--gold); z-index: 10000; width: 220px; top: 65px; left: 100px; }
        .m-item { padding: 15px; border-bottom: 1px solid #111; cursor: pointer; font-size: 0.8rem; color: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.href='verses.html'">❮</div>
    <div class="logo-gy">GY-GY 😂</div>
    <div class="scroll-tools">
        <button class="t-btn" onclick="toggleM('musicMenu', event)">🎹 <span id="curMusic">ЖАНР</span></button>
        <button class="t-btn" onclick="saveToBox()">📦 В BOX</button>
        <button class="t-btn" onclick="location.href='music_box.html'">🎵 ФОНО</button>
        <button class="t-btn" onclick="downloadAsFile()">📥 ФАЙЛ</button>
    </div>
    <div class="nav-btn" onclick="location.href='box_page.html'">❯</div>
</header>

<main id="stage">
    <video id="vCanvas" loop muted playsinline preload="auto">
        <source id="vSource" src="" type="video/mp4">
    </video>
    
    <div class="overlay">
        <textarea id="clipText" class="v-text" placeholder="Пиши хит, Шеф..."></textarea>
    </div>
</main>

<footer>
    <button class="run-btn" id="genBtn" onclick="runClip()">🔥 ЗАПУСТИТЬ КЛИП</button>
</footer>

<div id="musicMenu" class="pop-menu">
    <div class="m-item" onclick="setM('LO-FI', 'https://v.ftn.su/lofi.mp4')">🎹 LO-FI</div>
    <div class="m-item" onclick="setM('ROCK', 'https://v.ftn.su/rock.mp4')">🎸 ROCK</div>
    <div class="m-item" onclick="setM('RAP', 'https://v.ftn.su/rap.mp4')">🎤 RAP</div>
    <div class="m-item" onclick="setM('BLUES', 'https://v.ftn.su/blues.mp4')">🎷 BLUES</div>
</div>

<script>
    let currentV = "https://v.ftn.su/lofi.mp4"; // Дефолтный поток

    window.onload = () => {
        const last = localStorage.getItem('last_verse');
        if (last) document.getElementById('clipText').value = last;
    };

    function toggleM(id, e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById(id);
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function setM(name, url) {
        document.getElementById('curMusic').innerText = name;
        currentV = url;
        document.getElementById('musicMenu').style.display = 'none';
        runClip(); // Сразу переключаем атмосферу
    }

    async function runClip() {
        const v = document.getElementById('vCanvas');
        const s = document.getElementById('vSource');
        const btn = document.getElementById('genBtn');
        
        btn.innerText = "🌀 ВХОД В ТРАНС...";
        
        // Магия проявления
        v.style.opacity = "0";
        setTimeout(() => {
            s.src = currentV;
            v.load();
            v.play().then(() => {
                v.style.opacity = "0.5"; // Золотая середина прозрачности
                btn.innerText = "КЛИП В ЭФИРЕ 😂";
            }).catch(e => {
                btn.innerText = "ОШИБКА ПОТОКА ❌";
                console.log("Видео-сервер клуба отдыхает.");
            });
        }, 500);

        setTimeout(() => { btn.innerText = "🔥 ЗАПУСТИТЬ КЛИП"; }, 3000);
    }

    function saveToBox() { alert("Схоронил! 🔒"); }
    function downloadAsFile() { /* Скачивание текста */ }
    window.onclick = () => document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
</script>
</body>
</html>
