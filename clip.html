<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | CLIP GENERATOR</title>
    <script src="music_core.js"></script>
    <style>
        :root { --gold: #ffd700; }
        body { background: #000; color: var(--gold); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #display { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        #text-layer { z-index: 10; font-size: 2.5rem; text-align: center; padding: 20px; text-shadow: 0 0 20px var(--gold); }
        
        /* Визуализация пульсации */
        #visualizer { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a00 0%, #000 100%); z-index: 1; }

        footer { height: 100px; border-top: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; gap: 20px; }
        .btn { padding: 15px 30px; border: 2px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; font-weight: 900; letter-spacing: 2px; }
        .btn:hover { background: var(--gold); color: #000; }
    </style>
</head>
<body>

<main id="display">
    <div id="visualizer"></div>
    <div id="text-layer">ЖДУ ТЕКСТ ИЗ ВЕРСИЙ...</div>
</main>

<footer>
    <button class="btn" onclick="startShow()">🎸 ЗАПУСТИТЬ РОК</button>
    <button class="btn" onclick="location.href='verses.html'">❮ К ТЕКСТАМ</button>
</footer>

<script>
    // 1. Пытаемся достать текст, который гость выбрал в verses.html
    const savedText = localStorage.getItem('selectedVerse') || "В Клубе GY-GY тишина... Пока что.";
    document.getElementById('text-layer').innerText = savedText;

    function startShow() {
        // Инициализируем наш музыкальный движок
        GY_MUSIC.init();
        
        // Запускаем цикл (ритм)
        let beat = 0;
        setInterval(() => {
            // Каждые 4 удара - мощный аккорд
            if (beat % 4 === 0) {
                GY_MUSIC.playRock("1054321"); // Сюда потом вставим реальный ID гостя
                animateBackground();
            }
            beat++;
        }, 500);
        
        document.querySelector('.btn').innerText = "🤘 ИГРАЕТ РОК";
    }

    function animateBackground() {
        const v = document.getElementById('visualizer');
        v.style.backgroundColor = "#332a00";
        setTimeout(() => { v.style.backgroundColor = "#000"; }, 100);
    }
</script>
</body>
</html>
