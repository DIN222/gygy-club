
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY CLUB | CLIP STUDIO v.1.0</title>
    <style>
        :root { --gold: #ffd700; --black: #000; --h-unit: 42px; }
        body { background: var(--black); color: var(--gold); font-family: monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* HEADER STRUCTURE */
        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 10px 20px; 
            border-bottom: 1px solid var(--gold);
        }
        .header-left { display: flex; gap: 15px; align-items: center; }
        .header-right { display: flex; justify-content: flex-end; }

        /* UI ELEMENTS */
        .ui-box { 
            height: var(--h-unit); 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 15px; 
            background: transparent; 
            color: var(--gold); 
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .ui-box:hover { background: rgba(255, 215, 0, 0.1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        
        .arrow { font-size: 24px; width: 60px; font-weight: bold; }
        .avatar { width: var(--h-unit); padding: 0; font-size: 10px; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 6px; }

        /* MAIN STUDIO AREA (СТЕНА) */
        #studio-mirror { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 40px;
            background: radial-gradient(circle, #0a0a0a 0%, #000 80%);
        }

        /* ПРИНЯТЫЙ ТЕКСТ (КУПЛЕТ) */
        #received-verse {
            border: 1px double var(--gold);
            padding: 30px;
            max-width: 500px;
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            color: #fff;
            background: rgba(0,0,0,0.5);
            white-space: pre-line;
            margin-bottom: 20px;
        }

        /* FOOTER (УПРАВЛЕНИЕ КЛИПОМ) */
        footer { padding: 20px; border-top: 1px solid #222; background: var(--black); }
        .control-row { display: flex; gap: 15px; max-width: 1000px; margin: 0 auto; }
        .btn-action { flex: 1; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="ui-box arrow" onclick="location.href='verses.html'">⟵</button>
        <div class="ui-box" style="border:none">RU/EN</div>
        <div class="ui-box avatar">ID:01</div>
        <div class="ui-box" style="cursor:default">STUDIO MODE</div>
    </div>
    
    <div class="logo">GY-GY</div>
    
    <div class="header-right">
        <button class="ui-box arrow" onclick="location.href='techpark.html'">⟶</button>
    </div>
</header>

<main id="studio-mirror">
    <div id="received-verse">Ожидание передачи данных из verses.html...</div>
    <div style="font-size: 10px; color: #444;">[ ВИЗУАЛЬНЫЙ РЕНДЕР ОБЪЕКТА ]</div>
</main>

<footer>
    <div class="control-row">
        <button class="ui-box btn-action" onclick="alert('💾 Сохранено на диск')">SAVE TO PC</button>
        <button class="ui-box btn-action" onclick="alert('✈️ Отправлено в Telegram')">SEND TO TG</button>
        <button class="ui-box btn-action" onclick="alert('⭐ Добавлено в Хит-Парад')">HIT PARADE</button>
        <button class="ui-box btn-action" style="border-color: #555; color: #555;" onclick="alert('📦 В Clip-Box')">CLIP-BOX</button>
    </div>
</footer>

<script>
    // При загрузке страницы проверяем, прилетел ли текст из verses.html
    window.onload = function() {
        const verse = localStorage.getItem('currentVerse');
        if (verse) {
            document.getElementById('received-verse').innerText = verse;
        }
    };
</script>

</body>
</html>
