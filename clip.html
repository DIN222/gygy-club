
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | ПУЛЬТ УПРАВЛЕНИЯ v8.0</title>
    <style>
        :root { --gold: #ffd700; --bg: #0a0a0a; }
        body { background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .console { width: 500px; border: 2px solid var(--gold); padding: 30px; background: #000; box-shadow: 0 0 40px rgba(255,215,0,0.1); position: relative; }
        .display { min-height: 100px; border: 1px solid #333; padding: 15px; margin-bottom: 20px; font-style: italic; color: #fff; background: #050505; }
        select, button { width: 100%; padding: 15px; background: #000; color: var(--gold); border: 1px solid var(--gold); cursor: pointer; font-family: inherit; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        button:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }
        .tag { position: absolute; top: -12px; left: 20px; background: var(--bg); padding: 0 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="console">
        <div class="tag">NEURAL BRIDGE v8.0</div>
        
        <div id="lyrics-display" class="display">
            Загрузи текст из сборника...
        </div>

        <label style="font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 5px; display: block;">ВЫБЕРИ МУЗЫКАЛЬНЫЙ КОД:</label>
        <select id="vibe-selector">
            <option value="Industrial Dark Techno">INDUSTRIAL TECHNO (Стерильный мир) ⚡</option>
            <option value="Smoky Noir Jazz">SMOKY NOIR JAZZ (Чарли Паркер) 🎷</option>
            <option value="Post-Apocalyptic Blues">DIRTY BLUES (Усталость) 🎸</option>
            <option value="Operatic Dramatic Epic">EPIC OPERA (Крах элиты) 🎻</option>
        </select>

        <button onclick="generateSignal()">СФОРМИРОВАТЬ СИГНАЛ ДЛЯ GEMINI</button>
        
        <div id="status" style="font-size: 0.6rem; text-align: center; margin-top: 10px; opacity: 0.5;">Awaiting dispatch...</div>
    </div>

<script>
// Имитация получения данных из сборника (в реальном GY-GY данные придут через localStorage)
window.onload = () => {
    const savedText = localStorage.getItem('gygy_current_verse') || "Режим сбоит, проверка в сеть,\nСтерильный мир, как лед холодный...";
    document.getElementById('lyrics-display').innerText = savedText;
};

function generateSignal() {
    const text = document.getElementById('lyrics-display').innerText;
    const style = document.getElementById('vibe-selector').value;
    const status = document.getElementById('status');

    // Формируем "Пакет Данных" для меня
    const packet = `[GY-GY DISPATCH]\nСТИЛЬ: ${style}\nТЕКСТ:\n${text}\n--- СИГНАЛ ПЕРЕДАН ---`;

    // Копируем в буфер обмена одной командой
    navigator.clipboard.writeText(packet).then(() => {
        status.innerText = "СИГНАЛ В БУФЕРЕ! ВСТАВЛЯЙ В ЧАТ (Ctrl+V)";
        status.style.color = "#00ff00";
        setTimeout(() => { status.innerText = "Awaiting dispatch..."; status.style.color = "var(--gold)"; }, 3000);
    });
}
</script>
</body>
</html>
