<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CLUB EDITION v33.5.44 🔒</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* HEADER 🔒 */
        header { height: 60px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 10px; gap: 10px; z-index: 1000; }
        .nav-btn { width: 35px; height: 35px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; }
        .logo-gy { font-size: 0.9rem; font-weight: 900; letter-spacing: 2px; flex-shrink: 0; }
        
        .scroll-tools { display: flex; align-items: center; gap: 8px; overflow-x: auto; flex-grow: 1; scrollbar-width: none; }
        .scroll-tools::-webkit-scrollbar { display: none; }
        .t-btn { height: 35px; padding: 0 12px; border: 1px solid #333; background: #000; color: #fff; font-size: 0.6rem; text-transform: uppercase; cursor: pointer; white-space: nowrap; }

        /* VIDEO STAGE (ТЕРРИТОРИЯ КЛУБА) 🔒 */
        #stage { 
            flex-grow: 1; 
            position: relative; 
            background: #050505; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
        }

        #bgVideo {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4; /* Чтобы текст читался */
            display: none;
        }

        .content-overlay {
            position: relative;
            z-index: 10;
            width: 90%;
            text-align: center;
        }

        .v-text { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 1.8rem; 
            text-align: center; 
            outline: none; 
            resize: none; 
            font-family: inherit;
            text-shadow: 0 0 15px rgba(0,0,0,1), 0 0 5px var(--gold);
        }

        /* КНОПКА ПУСКА ДЛЯ ГОСТЯ 🔒 */
        footer { padding: 10px; background: #000; }
        .run-btn { 
            width: 100%; 
            height: 55px; 
            border: 2px solid var(--gold); 
            background: transparent; 
            color: var(--gold); 
            font-weight: 900; 
            cursor: pointer; 
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255,215,0,0.2);
        }
        .run-btn:hover { background: var(--gold); color: #000; }

        .pop-menu { display: none; position: absolute; background: #000; border: var(--border); z-index: 10000; width: 200px; top: 60px; left: 80px; }
        .m-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.href='verses.html'">❮</div>
    <div class="logo-gy">GY-GY 😂</div>
    <div class="scroll-tools">
        <button class="t-btn" onclick="toggleM('musicMenu', event)">🎹 <span id="curMusic">LO-FI</span></button>
        <button class="t-btn" onclick="saveToBox()">📦 В ЗАНАЧКУ</button>
        <button class="t-btn" onclick="location.href='music_box.html'">🎵 ФОНОТЕКА</button>
    </div>
    <div class="nav-btn" onclick="location.href='box_page.html'">❯</div>
</header>

<main id="stage">
    <video id="bgVideo" loop muted playsinline></video>
    
    <div class="content-overlay">
        <textarea id="clipText" class="v-text" placeholder="Пиши хит здесь..."></textarea>
    </div>
</main>

<footer>
    <button class="run-btn" id="genBtn" onclick="generateClipForGuest()">🔥 ЗАПУСТИТЬ КЛИП СЕЙЧАС</button>
</footer>

<div id="musicMenu" class="pop-menu">
    <div class="m-item" onclick="setMusic('LO-FI', 'https://assets.mixkit.co/videos/preview/mixkit-starry-night-sky-over-a-calm-lake-4384-large.mp4')">🎹 LO-FI</div>
    <div class="m-item" onclick="setMusic('ROCK', 'https://assets.mixkit.co/videos/preview/mixkit-concert-stage-with-crowd-and-lights-34563-large.mp4')">🎸 ROCK</div>
    <div class="m-item" onclick="setMusic('RAP', 'https://assets.mixkit.co/videos/preview/mixkit-city-traffic-at-night-with-car-lights-3158-large.mp4')">🎤 RAP</div>
</div>

<script>
    let videoUrl = 'https://assets.mixkit.co/videos/preview/mixkit-starry-night-sky-over-a-calm-lake-4384-large.mp4';

    window.onload = () => {
        const last = localStorage.getItem('last_verse');
        if (last) document.getElementById('clipText').value = last;
    };

    function toggleM(id, e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById(id);
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function setMusic(name, url) {
        document.getElementById('curMusic').innerText = name;
        videoUrl = url;
        document.getElementById('musicMenu').style.display = 'none';
        generateClipForGuest(); // Сразу переключаем фон
    }

    function generateClipForGuest() {
        const video = document.getElementById('bgVideo');
        const btn = document.getElementById('genBtn');
        const text = document.getElementById('clipText').value;

        if (!text) { alert("Шеф, гостю нужен текст!"); return; }

        btn.innerText = "🎬 МОНТАЖ В ПРОЦЕССЕ...";
        btn.disabled = true;

        // Имитируем "подгрузку из нейросети" 🔒
        setTimeout(() => {
            video.src = videoUrl;
            video.style.display = 'block';
            video.play();
            
            btn.innerText = "КЛИП ГОТОВ! РЖЁМ 😂";
            btn.disabled = false;
            
            // Добавим немного вибрации для эффекта
            document.getElementById('stage').style.boxShadow = "inset 0 0 100px var(--gold)";
        }, 1500);
    }

    function saveToBox() {
        alert("Заныкано в закрома Клуба! 🔒");
    }

    window.onclick = () => document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
</script>
</body>
</html>
