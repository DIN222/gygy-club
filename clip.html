
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | V4.0.0 HIGH-FIDELITY</title>
    <style>
        body { background: #0b0b0b; color: #ffd700; font-family: 'Courier New', serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .monitor { border: 2px solid #ffd700; padding: 30px; text-align: center; background: #000; box-shadow: 0 0 50px rgba(255,215,0,0.1); }
        .loading-bar { width: 0%; height: 5px; background: #ffd700; margin-top: 10px; transition: 0.3s; }
        .btn { margin-top: 20px; padding: 15px 40px; border: 1px solid #ffd700; background: none; color: #ffd700; cursor: pointer; font-weight: bold; visibility: hidden; }
    </style>
</head>
<body>

    <div class="monitor">
        <h1 id="status">ЗАГРУЗКА ЖИВОГО ЗВУКА...</h1>
        <div id="progress" class="loading-bar"></div>
        <button id="startBtn" class="btn" onclick="startOrchestra()">🎸 ПУСТИТЬ ЖИВОЙ ДЖАЗ</button>
    </div>

<script>
const GY_SAMPLES = {
    ctx: new (window.AudioContext || window.webkitAudioContext)(),
    buffers: {},
    // Ссылки на качественные сэмплы (GitHub репозитории аудио-библиотек)
    sources: {
        kick: 'https://raw.githubusercontent.com/the-maldridge/claps-and-kicks/master/kicks/kick1.wav',
        snare: 'https://raw.githubusercontent.com/the-maldridge/claps-and-kicks/master/snares/snare1.wav',
        bass: 'https://teropa.info/music-mouse-js/samples/bass.mp3',
        sax: 'https://raw.githubusercontent.com/mra73/GarageBand-Samples/master/Sax%20Alto/Sax%20Alto_01.wav'
    },

    async loadAll() {
        let loaded = 0;
        const keys = Object.keys(this.sources);
        
        for (let key of keys) {
            const response = await fetch(this.sources[key]);
            const arrayBuffer = await response.arrayBuffer();
            this.buffers[key] = await this.ctx.decodeAudioData(arrayBuffer);
            loaded++;
            document.getElementById('progress').style.width = (loaded / keys.length * 100) + '%';
        }
        
        document.getElementById('status').innerText = "ОРКЕСТР ГОТОВ";
        document.getElementById('startBtn').style.visibility = 'visible';
    },

    play(name, time, vol = 0.5) {
        const source = this.ctx.createBufferSource();
        source.buffer = this.buffers[name];
        const gain = this.ctx.createGain();
        gain.gain.value = vol;
        source.connect(gain);
        gain.connect(this.ctx.destination);
        source.start(time);
    }
};

// Запускаем загрузку сразу
GY_SAMPLES.loadAll();

let engine;
function startOrchestra() {
    GY_SAMPLES.ctx.resume();
    if (engine) clearInterval(engine);
    
    let step = 0;
    engine = setInterval(() => {
        const t = GY_SAMPLES.ctx.currentTime;
        
        // Марковский ритм-блок
        if (step % 2 === 0) GY_SAMPLES.play('kick', t, 0.8);
        if (step % 4 === 2) GY_SAMPLES.play('snare', t, 0.4);
        
        // Случайные вставки баса и саксофона (Марков v3 внутри)
        if (Math.random() > 0.6) GY_SAMPLES.play('bass', t, 0.6);
        if (Math.random() > 0.8) GY_SAMPLES.play('sax', t, 0.3);

        step++;
    }, 400); // Темп
    
    document.getElementById('startBtn').innerText = "🔊 ИГРАЕТ LIVE";
}
</script>
</body>
</html>
