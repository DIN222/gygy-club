<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | MOVIE v33.5.51 🔒</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; }
        header { height: 60px; display: flex; align-items: center; border-bottom: 1px solid var(--gold); background: #000; padding: 0 10px; gap: 10px; z-index: 1000; }
        .nav-btn { width: 35px; height: 35px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; }
        .logo-gy { font-size: 0.9rem; font-weight: 900; letter-spacing: 2px; padding: 0 10px; border-right: 1px solid #222; }
        .scroll-tools { display: flex; align-items: center; gap: 8px; overflow-x: auto; flex-grow: 1; scrollbar-width: none; }
        .t-btn { height: 35px; padding: 0 12px; border: 1px solid var(--gold); background: #000; color: var(--gold); font-size: 0.6rem; text-transform: uppercase; cursor: pointer; white-space: nowrap; }

        #stage { flex-grow: 1; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; transition: background 0.5s; }
        
        /* ЭФФЕКТ ВСПЫШЕК 🔒 */
        .flash { position: absolute; width: 100%; height: 100%; background: var(--gold); opacity: 0; pointer-events: none; z-index: 5; }
        .particle { position: absolute; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 1; }

        .overlay { position: relative; z-index: 10; width: 90%; transition: transform 0.1s ease-out; }
        .v-text { width: 100%; min-height: 150px; background: transparent; border: none; color: #fff; font-size: 2.2rem; text-align: center; outline: none; resize: none; font-family: inherit; text-shadow: 0 0 30px #000; }

        footer { padding: 15px; background: #000; border-top: 1px solid #111; z-index: 100; }
        .run-btn { width: 100%; height: 55px; border: 1px solid var(--gold); background: #000; color: var(--gold); font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 3px; }
        .pop-menu { display: none; position: absolute; background: #000; border: 1px solid var(--gold); z-index: 10000; width: 200px; top: 60px; left: 50px; }
        .m-item { padding: 12px; border-bottom: 1px solid #111; cursor: pointer; font-size: 0.7rem; color: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.href='verses.html'">❮</div>
    <div class="logo-gy">GY-GY 😂</div>
    <div class="scroll-tools">
        <button class="t-btn" onclick="toggleM('musicMenu', event)">🎹 <span id="curStyle">TECHNO</span></button>
        <button class="t-btn" onclick="saveToBox()">📦 В BOX</button>
    </div>
    <div class="nav-btn" onclick="location.href='box_page.html'">❯</div>
</header>

<main id="stage">
    <div class="flash" id="vFlash"></div>
    <div class="overlay" id="vOverlay">
        <textarea id="clipText" class="v-text" placeholder="Текст твоего фильма..."></textarea>
    </div>
</main>

<footer>
    <button class="run-btn" id="genBtn" onclick="startMovie()">🎬 СМОТРЕТЬ КЛИП</button>
</footer>

<div id="musicMenu" class="pop-menu">
    <div class="m-item" onclick="setS('LO-FI', 85, 100)">🌌 LO-FI (Slow)</div>
    <div class="m-item" onclick="setS('CLUB', 128, 60)">⚡ CLUB (Fast)</div>
    <div class="m-item" onclick="setS('TRAP', 140, 150)">👟 TRAP (Hard)</div>
</div>

<script>
    let audioCtx = null, isPlaying = false, bpm = 128, beat = 0, kFreq = 60;

    function toggleM(id, e) { if (e) e.stopPropagation(); const m = document.getElementById(id); m.style.display = (m.style.display==='block')?'none':'block'; }
    function setS(n, b, f) { document.getElementById('curStyle').innerText = n; bpm = b; kFreq = f; }

    function playNote(f, type, vol, len, t) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        if(type==='sine') o.frequency.exponentialRampToValueAtTime(0.01, t + len);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + len);
    }

    function visualHit(power) {
        const ov = document.getElementById('vOverlay');
        const fl = document.getElementById('vFlash');
        ov.style.transform = `scale(${1 + power})`;
        setTimeout(() => ov.style.transform = 'scale(1)', 100);
        if(power > 0.1) {
            fl.style.opacity = "0.2";
            setTimeout(() => fl.style.opacity = "0", 150);
        }
        // Частицы
        const p = document.createElement('div'); p.className = 'particle';
        p.style.width = p.style.height = (power*100)+'px';
        p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*100+'%';
        document.getElementById('stage').appendChild(p);
        p.animate([{transform:'scale(0)', opacity:1}, {transform:'scale(10)', opacity:0}], 800);
        setTimeout(()=>p.remove(), 800);
    }

    function runEngine() {
        if(!isPlaying) return;
        const t = audioCtx.currentTime;
        
        // СТРУКТУРА КЛИПА 🔒
        playNote(kFreq, 'sine', 0.8, 0.4, t); // Базовый удар
        visualHit(0.05);

        if(beat % 2 === 1) { // Малый барабан
            playNote(400, 'triangle', 0.3, 0.2, t);
            visualHit(0.15);
        }

        if(beat % 8 >= 4) { // Развитие: добавляем мелодию ("Вокал")
            const scale = [220, 261, 329, 392];
            playNote(scale[beat % 4], 'sawtooth', 0.05, 0.6, t);
        }

        beat++;
        setTimeout(runEngine, (60/bpm)*1000);
    }

    function startMovie() {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(isPlaying) { isPlaying = false; document.getElementById('genBtn').innerText = "🎬 СМОТРЕТЬ КЛИП"; }
        else { 
            isPlaying = true; beat = 0; 
            document.getElementById('genBtn').innerText = "⏸ СТОП МАШИНА 😂";
            runEngine(); 
        }
    }
</script>
</body>
</html>
