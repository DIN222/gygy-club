<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | INTERNAL v33.5.46 🔒</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; }
        
        /* HEADER 🔒 */
        header { height: 65px; display: flex; align-items: center; border-bottom: 1px solid var(--gold); background: #000; padding: 0 10px; gap: 10px; z-index: 1000; flex-shrink: 0; }
        .nav-btn { width: 40px; height: 40px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-size: 1.2rem; font-weight: bold; }
        .logo-gy { font-size: 1rem; font-weight: 900; letter-spacing: 2px; padding: 0 10px; border-right: 1px solid #222; }

        .scroll-tools { display: flex; align-items: center; gap: 10px; overflow-x: auto; flex-grow: 1; scrollbar-width: none; }
        .scroll-tools::-webkit-scrollbar { display: none; }
        .t-btn { height: 40px; padding: 0 15px; border: 1px solid var(--gold); background: #000; color: var(--gold); font-size: 0.65rem; text-transform: uppercase; cursor: pointer; white-space: nowrap; }

        /* ВНУТРЕННИЙ ВИЗУАЛЬНЫЙ ДВИЖОК 🔒 */
        #stage { 
            flex-grow: 1; position: relative; background: #000; overflow: hidden; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }

        /* Генерируемый фон (вместо видео-файла) */
        #visualEngine {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a00 0%, #000 70%);
            opacity: 0; transition: opacity 1.5s ease; z-index: 1;
        }

        /* Эффект частиц/шума */
        .stars {
            position: absolute; width: 2px; height: 2px; background: var(--gold);
            border-radius: 50%; opacity: 0.5; animation: fly 3s linear infinite;
        }
        @keyframes fly {
            from { transform: translateZ(0) scale(1); opacity: 1; }
            to { transform: translateZ(1000px) scale(5); opacity: 0; }
        }

        .overlay { position: relative; z-index: 10; width: 90%; text-align: center; }
        .v-text { 
            width: 100%; min-height: 250px; background: transparent; border: none; 
            color: #fff; font-size: 1.8rem; text-align: center; outline: none; 
            resize: none; font-family: inherit; text-shadow: 0 0 15px #000;
        }

        footer { padding: 15px; background: #000; z-index: 100; border-top: 1px solid #111; }
        .run-btn { 
            width: 100%; height: 60px; border: 1px solid var(--gold); 
            background: #000; color: var(--gold); font-weight: 900; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 3px; 
        }

        .pop-menu { display: none; position: absolute; background: #000; border: 1px solid var(--gold); z-index: 10000; width: 220px; top: 65px; left: 100px; }
        .m-item { padding: 15px; border-bottom: 1px solid #111; cursor: pointer; font-size: 0.8rem; color: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.href='verses.html'">❮</div>
    <div class="logo-gy">GY-GY 😂</div>
    <div class="scroll-tools">
        <button class="t-btn" onclick="toggleM('musicMenu', event)">🎹 <span id="curMusic">LO-FI</span></button>
        <button class="t-btn" onclick="saveToBox()">📦 В BOX</button>
        <button class="t-btn" onclick="location.href='music_box.html'">🎵 ФОНО</button>
        <button class="t-btn" onclick="downloadAsFile()">📥 ФАЙЛ</button>
    </div>
    <div class="nav-btn" onclick="location.href='box_page.html'">❯</div>
</header>

<main id="stage">
    <div id="visualEngine"></div>
    
    <div class="overlay">
        <textarea id="clipText" class="v-text" placeholder="Текст хита Клуба..."></textarea>
    </div>
</main>

<footer>
    <button class="run-btn" id="genBtn" onclick="activateEngine()">🔥 ЗАПУСТИТЬ КЛИП</button>
</footer>

<div id="musicMenu" class="pop-menu">
    <div class="m-item" onclick="setMode('LO-FI')">🎹 LO-FI CHILL</div>
    <div class="m-item" onclick="setMode('ROCK')">🎸 HARD ROCK</div>
    <div class="m-item" onclick="setMode('RAP')">🎤 STREET RAP</div>
    <div class="m-item" onclick="setMode('TECHNO')">⚡ TECHNO BEAT</div>
</div>

<script>
    window.onload = () => {
        const last = localStorage.getItem('last_verse');
        if (last) document.getElementById('clipText').value = last;
    };

    function toggleM(id, e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById(id);
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function setMode(name) {
        document.getElementById('curMusic').innerText = name;
        document.getElementById('musicMenu').style.display = 'none';
        activateEngine();
    }

    function activateEngine() {
        const engine = document.getElementById('visualEngine');
        const btn = document.getElementById('genBtn');
        
        btn.innerText = "🌀 СИНХРОНИЗАЦИЯ...";
        engine.innerHTML = ''; // Очистка
        engine.style.opacity = "1";

        // Генерация золотых частиц в реальном времени
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'stars';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            engine.appendChild(star);
        }

        setTimeout(() => {
            btn.innerText = "КЛИП В ЭФИРЕ 😂";
        }, 1000);

        setTimeout(() => {
            btn.innerText = "🔥 ЗАПУСТИТЬ КЛИП";
        }, 4000);
    }

    function saveToBox() { alert("Схоронил в заначку! 🔒"); }
    function downloadAsFile() { /* Скачивание */ }
    window.onclick = () => document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
</script>
</body>
</html>
