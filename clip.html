
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | КЛИП-АВТОМАТ v10.0</title>
    <style>
        :root { --gold: #ffd700; --dark: #050505; }
        body { background: #000; color: var(--gold); font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .terminal { border: 3px double var(--gold); padding: 40px; width: 500px; text-align: center; background: var(--dark); box-shadow: 0 0 80px rgba(255,215,0,0.1); border-radius: 15px; position: relative; transition: 1s; }
        
        #word-vault { min-height: 120px; border: 1px solid #222; padding: 20px; margin: 20px 0; font-style: italic; font-size: 1.1rem; line-height: 1.5; color: #fff; background: rgba(255,215,0,0.02); transition: 0.5s; }
        
        .genre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-style { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 15px; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.3s; }
        .btn-style:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }
        
        #loader { display: none; margin: 20px 0; font-size: 0.8rem; letter-spacing: 3px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        audio { width: 100%; margin-top: 20px; filter: invert(1); display: none; }
    </style>
</head>
<body>

    <div class="terminal" id="main-terminal">
        <div style="font-size: 0.6rem; letter-spacing: 5px; opacity: 0.5; margin-bottom: 10px;">SYSTEM: CONNECTED TO LOCALHOST:3000</div>
        <h2 id="status-title">ОЖИДАНИЕ ТЕКСТА ИЗ BOX...</h2>
        
        <div id="word-vault">...пусто...</div>

        <div id="interface">
            <div class="genre-grid">
                <button class="btn-style" onclick="startGeneration('Dark Jazz Noir')">ДЖАЗ-НУАР 🎷</button>
                <button class="btn-style" onclick="startGeneration('Industrial Techno')">ИНДАСТРИАЛ ⚡</button>
                <button class="btn-style" onclick="startGeneration('Hard Rock Blues')">ХАРД-РОК 🎸</button>
                <button class="btn-style" onclick="startGeneration('Ambient Dream')">ЭМБИЕНТ 🌌</button>
            </div>
        </div>

        <div id="loader">ГЕНЕРАЦИЯ АУДИО-ПОТОКА...</div>
        <audio id="player" controls></audio>
    </div>

<script>
// 1. Принимаем слова из BOX через общую память браузера
window.onload = () => {
    const incoming = localStorage.getItem('gygy_transfer');
    if (incoming) {
        document.getElementById('word-vault').innerText = incoming;
        document.getElementById('status-title').innerText = "ТЕКСТ ГОТОВ К ОБРАБОТКЕ";
    }
};

// 2. ФУНКЦИЯ "АВТОМАТ" — Отправляет запрос на твой server.js
async function startGeneration(genre) {
    const text = document.getElementById('word-vault').innerText;
    const loader = document.getElementById('loader');
    const ui = document.getElementById('interface');
    const title = document.getElementById('status-title');

    // Визуальный переход
    ui.style.display = 'none';
    loader.style.display = 'block';
    title.innerText = "СИГНАЛ УШЕЛ ДРУЗЬЯМ...";

    try {
        const response = await fetch('http://localhost:3000/generate-jazz', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, genre: genre })
        });

        const data = await response.json();

        if (data.audioUrl) {
            playResult(data.audioUrl);
        } else {
            throw new Error("Нет ссылки в ответе");
        }
    } catch (err) {
        alert("Ошибка связи с server.js! Проверь, запущен ли он.");
        ui.style.display = 'grid';
        loader.style.display = 'none';
    }
}

// 3. ФИНАЛ: Слова исчезают, музыка звучит
function playResult(url) {
    const player = document.getElementById('player');
    const vault = document.getElementById('word-vault');
    const loader = document.getElementById('loader');
    const title = document.getElementById('status-title');

    loader.style.display = 'none';
    vault.style.opacity = '0'; // Плавное исчезновение слов
    
    setTimeout(() => {
        vault.style.display = 'none';
        title.innerText = "🔊 КЛИП В ЭФИРЕ";
        player.src = url;
        player.style.display = 'block';
        player.play();
    }, 1000);
}
</script>
</body>
</html>
