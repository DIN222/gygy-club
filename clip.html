
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | HARMONY v5.0.0</title>
    <style>
        body { background: #050505; color: #ffd700; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .deck { border: 3px double #ffd700; padding: 40px; text-align: center; background: #000; box-shadow: 0 0 60px rgba(255,215,0,0.15); border-radius: 10px; }
        .led { width: 12px; height: 12px; background: #300; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .led.active { background: #f00; box-shadow: 0 0 10px #f00; }
        .btn { background: #ffd700; color: #000; border: none; padding: 20px 60px; font-weight: 900; font-size: 1.5rem; cursor: pointer; transition: 0.2s; margin-top: 30px; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #ffd700; }
        .status-text { font-size: 0.7rem; opacity: 0.6; margin-top: 15px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="deck">
        <div id="led-indicator" class="led"></div>
        <span style="letter-spacing: 5px;">GY-GY AUDIO DECK</span>
        <h1 id="track-name" style="margin: 20px 0;">SILENCE...</h1>
        
        <button class="btn" id="mainBtn" onclick="initOrchestra()">СТАРТ ГАРМОНИИ</button>
        
        <div class="status-text" id="status">WAITING FOR COMMAND</div>
    </div>

<script>
const GY_HARMONY = {
    ctx: new (window.AudioContext || window.webkitAudioContext)(),
    loops: {},
    sources: {
        // Мы берем профессиональные петли с надежного CDN
        drums: 'https://cdn.pixabay.com/download/audio/2022/03/10/audio_5170d10c8d.mp3', // Jazz Drums
        piano: 'https://cdn.pixabay.com/download/audio/2024/02/14/audio_985b9b8b6a.mp3', // Lo-Fi Piano Harmony
        bass: 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0c6ff2486.mp3'   // Smooth Bass
    },

    async load() {
        document.getElementById('status').innerText = "ЗАГРУЗКА МУЗЫКАНТОВ...";
        for (let key in this.sources) {
            const res = await fetch(this.sources[key]);
            const buf = await res.arrayBuffer();
            this.loops[key] = await this.ctx.decodeAudioData(buf);
        }
        document.getElementById('status').innerText = "ОРКЕСТР В ЗДАНИИ";
    },

    playLoop(name, startTime) {
        const source = this.ctx.createBufferSource();
        source.buffer = this.loops[name];
        source.loop = true;
        
        const gain = this.ctx.createGain();
        gain.gain.value = 0.6;
        
        source.connect(gain);
        gain.connect(this.ctx.destination);
        source.start(startTime);
        return gain;
    }
};

let playing = false;
async function initOrchestra() {
    if (playing) return;
    
    document.getElementById('mainBtn').innerText = "ЗАГРУЗКА...";
    await GY_HARMONY.load();
    
    GY_HARMONY.ctx.resume();
    const now = GY_HARMONY.ctx.currentTime;
    
    // Запускаем все слои одновременно - это дает идеальную ГАРМОНИЮ
    GY_HARMONY.playLoop('drums', now);
    GY_HARMONY.playLoop('piano', now);
    GY_HARMONY.playLoop('bass', now);
    
    document.getElementById('track-name').innerText = "LIVE JAZZ SESSION";
    document.getElementById('led-indicator').classList.add('active');
    document.getElementById('mainBtn').style.display = 'none';
    document.getElementById('status').innerText = "HARMONY STATUS: PERFECT";
    playing = true;
}
</script>
</body>
</html>
