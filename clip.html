<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CLIP v2.0.0 🔒</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER: ПОСТОЯННЫЕ АТРИБУТЫ 🔒 */
        header { height: 70px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 10px; gap: 8px; z-index: 1000; flex-shrink: 0; position: relative; }
        .nav-fix { width: 40px; height: 40px; border: var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-weight: bold; font-size: 1.1rem; flex-shrink: 0; }
        .logo-gy { font-size: 1.1rem; font-weight: 900; color: var(--gold); letter-spacing: 1px; flex-shrink: 0; margin-left: auto; margin-right: 5px; }
        #google_translate_element { transform: scale(0.8); transform-origin: left center; min-width: 130px; }

        /* WORKSPACE 🔒 */
        #workspace { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; }
        .clip-card { width: 100%; max-width: 400px; border: 1px solid #333; padding: 20px; border-radius: 4px; background: rgba(255,215,0,0.02); }
        .v-text { font-size: 1.2rem; line-height: 1.6; text-align: center; color: #fff; white-space: pre-wrap; margin-bottom: 20px; outline: none; }

        /* CONTROLS 🔒 */
        .music-bar { display: flex; gap: 10px; width: 100%; max-width: 400px; margin-bottom: 10px; }
        .btn-tool { flex: 1; border: var(--border); background: #000; color: var(--gold); padding: 12px; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
        .btn-tool:hover { box-shadow: 0 0 10px var(--gold); }

        /* FOOTER ACTIONS 🔒 */
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: 1px solid #222; background: #000; flex-shrink: 0; z-index: 1001; }
        .btn-action { flex: 1; height: 50px; border: var(--border); background: #000; color: var(--gold); font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .btn-action:hover { box-shadow: 0 0 15px rgba(255,215,0,0.2); }

        /* POPUP MENU 🔒 */
        .pop-menu { display: none; position: absolute; background: #000; border: var(--border); z-index: 10000; box-shadow: 0 0 20px rgba(255,215,0,0.2); width: 200px; bottom: 85px; left: 10px; }
        .m-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.8rem; color: #fff; }
        .m-item:hover { border-left: 5px solid var(--gold); color: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="nav-fix" onclick="window.history.back()">❮</div>
    <div id="google_translate_element"></div>
    <div class="logo-gy">GY-GY</div>
    <div class="nav-fix" onclick="window.location.href='box_page.html'">❯</div>
</header>

<div id="workspace">
    <div class="clip-card">
        <div id="clipText" class="v-text" contentEditable="true">Здесь будет ваш текст для клипа...</div>
    </div>
    
    <div class="music-bar">
        <button class="btn-tool" onclick="toggleM('musicMenu', event)">🎵 Стиль Музыки: <span id="curMusic">Lo-Fi</span></button>
    </div>
</div>

<div id="musicMenu" class="pop-menu">
    <div class="m-item" onclick="setMusic('Lo-Fi', 'Расслабленный бит')">🎹 Lo-Fi</div>
    <div class="m-item" onclick="setMusic('Techno', 'Энергичный ритм')">⚡ Techno</div>
    <div class="m-item" onclick="setMusic('Jazz', 'Мягкий саксофон')">🎷 Jazz</div>
    <div class="m-item" onclick="setMusic('Phonk', 'Агрессивный бас')">🚗 Phonk</div>
    <div class="m-item" onclick="setMusic('Rock', 'Гитарный драйв')">🎸 Rock</div>
</div>

<footer>
    <button class="btn-action" onclick="saveClip()">💾 Сохранить</button>
    <button class="btn-action" onclick="shareClip()">🔗 Переслать</button>
</footer>

<script>
    let selectedMusic = "Lo-Fi";

    // Инициализация: подтягиваем последний стих со стены, если он есть
    window.onload = () => {
        const lastVerse = localStorage.getItem('last_verse');
        if (lastVerse) document.getElementById('clipText').innerText = lastVerse;
    };

    function toggleM(id, e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById(id);
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function setMusic(name, desc) {
        selectedMusic = name;
        document.getElementById('curMusic').innerText = name;
        document.getElementById('musicMenu').style.display = 'none';
        console.log(`Выбран стиль: ${name} (${desc})`);
    }

    function saveClip() {
        const text = document.getElementById('clipText').innerText;
        let box = JSON.parse(localStorage.getItem('gy_box') || '[]');
        box.push({ 
            text: text, 
            style: `CLIP [${selectedMusic}]`, 
            timestamp: new Date().toLocaleString() 
        });
        localStorage.setItem('gy_box', JSON.stringify(box));
        alert("Клип зафиксирован в BOX! 🔒");
    }

    function shareClip() {
        const text = document.getElementById('clipText').innerText;
        const msg = `${text}\n\n(Style: ${selectedMusic})`;
        if (navigator.share) {
            navigator.share({ title: 'GY-GY Clip', text: msg });
        } else {
            navigator.clipboard.writeText(msg).then(() => alert("Текст скопирован для пересылки!"));
        }
    }

    window.onclick = () => document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'ru'},'google_translate_element');}</script>
</body>
</html>
