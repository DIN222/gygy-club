<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CLIP v33.5.39 🔒</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER FIX 🔒 */
        header { 
            height: 65px; 
            display: flex; 
            align-items: center; 
            border-bottom: var(--border); 
            background: #000; 
            padding: 0 10px; 
            gap: 10px; 
            z-index: 1000; 
            flex-shrink: 0; 
        }

        .nav-btn { width: 40px; height: 40px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-size: 1.2rem; flex-shrink: 0; }
        .logo-gy { font-size: 1rem; font-weight: 900; color: var(--gold); letter-spacing: 1px; padding: 0 10px; border-right: 1px solid #222; flex-shrink: 0; }

        /* SCROLL TOOLS 🔒 */
        .scroll-tools { display: flex; align-items: center; gap: 8px; overflow-x: auto; flex-grow: 1; scrollbar-width: none; }
        .scroll-tools::-webkit-scrollbar { display: none; }

        .t-btn { height: 40px; padding: 0 15px; border: 1px solid #333; background: #000; color: #fff; font-size: 0.65rem; text-transform: uppercase; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .t-btn:hover { border-color: var(--gold); color: var(--gold); }
        .t-btn b { color: var(--gold); margin-right: 5px; }

        /* WORKSPACE 🔒 */
        #workspace { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; }
        .editor-container { flex-grow: 1; border: 1px solid #111; padding: 20px; background: rgba(255,215,0,0.01); display: flex; flex-direction: column; position: relative; }
        .v-text { flex-grow: 1; font-size: 1.5rem; line-height: 1.5; text-align: center; color: #fff; border: none; background: transparent; outline: none; resize: none; font-family: inherit; }

        /* PROGRESS LOG 🔒 */
        #genLog { font-size: 0.75rem; color: #888; border-top: 1px solid #222; padding-top: 15px; margin-top: 10px; display: none; }
        .progress-bar { width: 0%; height: 2px; background: var(--gold); transition: 0.5s; margin-bottom: 10px; box-shadow: 0 0 10px var(--gold); }

        footer { padding: 10px; background: #000; flex-shrink: 0; }
        .run-btn { width: 100%; height: 60px; border: var(--border); background: #000; color: var(--gold); font-weight: 900; cursor: pointer; text-transform: uppercase; }

        .pop-menu { display: none; position: absolute; background: #000; border: var(--border); z-index: 10000; width: 220px; top: 60px; left: 100px; }
        .m-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.8rem; }
        .m-item:hover { border-left: 5px solid var(--gold); color: var(--gold); }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.href='verses.html'">❮</div>
    <div class="logo-gy">GY-GY</div>
    
    <div class="scroll-tools">
        <button class="t-btn" onclick="toggleM('musicMenu', event)"><b>🎹</b> <span id="curMusic">LO-FI</span></button>
        <button class="t-btn" onclick="saveToBox()"><b>📦</b> В BOX</button>
        <button class="t-btn" onclick="location.href='music_box.html'"><b>🎵</b> ФОНОТЕКА</button>
        <button class="t-btn" onclick="downloadAsFile()"><b>📥</b> ФАЙЛ</button>
        <button class="t-btn" onclick="shareClip()"><b>🔗</b> SHARE</button>
    </div>
    <div class="nav-btn" onclick="location.href='box_page.html'">❯</div>
</header>

<div id="workspace">
    <div class="editor-container">
        <textarea id="clipText" class="v-text" placeholder="Текст вашего шедевра..."></textarea>
        <div id="genLog">
            <div class="progress-bar" id="pBar"></div>
            <div id="logStatus">Инициализация...</div>
        </div>
    </div>
</div>

<footer>
    <button class="run-btn" id="genBtn" onclick="runClipGen()">🔥 ГЕНЕРИРОВАТЬ МЕДИА-ПЛАН</button>
</footer>

<div id="musicMenu" class="pop-menu">
    <div class="m-item" onclick="setMusic('LO-FI', 'Chill beats, cozy')">🎹 LO-FI</div>
    <div class="m-item" onclick="setMusic('ROCK', 'Heavy guitar, drive')">🎸 ROCK</div>
    <div class="m-item" onclick="setMusic('RAP', 'Street hip-hop, bass')">🎤 RAP</div>
    <div class="m-item" onclick="setMusic('BLUES', 'Soulful harmonica')">🎷 BLUES</div>
</div>

<script>
    let selectedMusic = "LO-FI";
    let musicStyleRaw = "Lofi hip hop";

    window.onload = () => {
        const last = localStorage.getItem('last_verse');
        if (last) document.getElementById('clipText').value = last;
    };

    function toggleM(id, e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById(id);
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function setMusic(name, raw) {
        selectedMusic = name; musicStyleRaw = raw;
        document.getElementById('curMusic').innerText = name;
        document.getElementById('musicMenu').style.display = 'none';
    }

    async function runClipGen() {
        const text = document.getElementById('clipText').value.trim();
        const btn = document.getElementById('genBtn');
        const log = document.getElementById('genLog');
        const pBar = document.getElementById('pBar');
        const status = document.getElementById('logStatus');

        if (!text) { alert("Введите текст!"); return; }

        btn.disabled = true;
        log.style.display = "block";
        
        // Визуальная симуляция работы движка 🔒
        status.innerText = "> Подключаем аудио-движок Suno/Udio..."; pBar.style.width = "30%";
        await new Promise(r => setTimeout(r, 800));
        
        status.innerText = "> Рендеринг визуального стиля: " + selectedMusic; pBar.style.width = "60%";

        try {
            const cleanKey = (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).replace(/[^a-zA-Z0-9_-]/g, "");
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${BEUVRY_CONFIG.MODELS_PRIORITY[0]}:generateContent?key=${cleanKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Напиши детальный сценарий клипа (видео-ряд и описание звука) в стиле ${musicStyleRaw} для текста: ${text}. Выдай ответ кратко и по делу.` }] }] })
            });
            const d = await r.json();
            pBar.style.width = "100%";
            status.innerHTML = `<b style="color:var(--gold)">ПЛАН ГЕНЕРАЦИИ ГОТОВ:</b><br><br>${d.candidates[0].content.parts[0].text}`;
            btn.innerText = "ГОТОВО ✅";
        } catch (e) {
            status.innerText = "ОШИБКА СЕТИ ❌";
        }
        
        setTimeout(() => { btn.disabled = false; btn.innerText = "🔥 ГЕНЕРИРОВАТЬ МЕДИА-ПЛАН"; }, 5000);
    }

    function saveToBox() {
        const text = document.getElementById('clipText').value;
        let box = JSON.parse(localStorage.getItem('gy_box') || '[]');
        box.push({ text, style: `CLIP [${selectedMusic}]`, timestamp: new Date().toLocaleString() });
        localStorage.setItem('gy_box', JSON.stringify(box));
        alert("Сохранено в BOX! 🔒");
    }

    function downloadAsFile() {
        const blob = new Blob([document.getElementById('clipText').value], {type:'text/plain'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `clip.txt`; a.click();
    }

    function shareClip() {
        if (navigator.share) navigator.share({ text: document.getElementById('clipText').value });
    }

    window.onclick = () => document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
</script>
</body>
</html>
