
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | АВТОНОМНАЯ ГАРМОНИЯ</title>
    <style>
        body { background: #000; color: #ffd700; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #ffd700; padding: 50px; text-align: center; box-shadow: 0 0 40px #332a00; }
        .btn { background: #ffd700; color: #000; border: none; padding: 20px 40px; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        .vibes { margin-top: 20px; font-size: 0.8rem; letter-spacing: 3px; color: #888; }
    </style>
</head>
<body>

    <div class="box">
        <h1>КЛУБ GY-GY</h1>
        <p>ГАРМОНИЯ v5.1 (OFFLINE)</p>
        <button class="btn" onclick="playMusic()">ВКЛЮЧИТЬ МУЗЫКУ</button>
        <div class="vibes" id="v">STANDBY</div>
    </div>

<script>
// Шеф, это МУЗЫКАЛЬНЫЙ ГЕНЕТИЧЕСКИЙ КОД. 
// Мы используем FM-синтез, чтобы воссоздать звук Родос-пианино и джазового баса программно.
const AudioBox = {
    ctx: null,
    init() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    
    // Создаем мягкий джазовый аккорд (Гармония II-V-I)
    playChord(freqs, time, dur) {
        freqs.forEach(f => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle'; // Мягкий тембр пианино
            osc.frequency.setValueAtTime(f, time);
            
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.1, time + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
            
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(time); osc.stop(time + dur);
        });
    },

    playBass(f, time, dur) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine'; // Глубокий бас
        osc.frequency.setValueAtTime(f, time);
        gain.gain.setValueAtTime(0.2, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(time); osc.stop(time + dur);
    }
};

let step = 0;
function playMusic() {
    AudioBox.init();
    AudioBox.ctx.resume();
    document.getElementById('v').innerText = "LIVE HARMONY SESSION";

    // Джазовая сетка: II (Dm7) -> V (G7) -> I (Cmaj7)
    const chords = [
        [293.66, 349.23, 440.00, 523.25], // Dm7
        [392.00, 493.88, 587.33, 698.46], // G7
        [261.63, 329.63, 392.00, 493.88]  // Cmaj7
    ];
    const bass = [146.83, 196.00, 130.81];

    setInterval(() => {
        const t = AudioBox.ctx.currentTime;
        const chordIdx = Math.floor(step / 4) % 3;
        
        // Ритмический рисунок (Свинг)
        if (step % 4 === 0) {
            AudioBox.playChord(chords[chordIdx], t, 2.5);
            AudioBox.playBass(bass[chordIdx], t, 1.5);
        }
        
        // Добавляем "синкопу" (легкое нажатие клавиш в слабую долю)
        if (step % 4 === 2 && Math.random() > 0.5) {
            AudioBox.playChord(chords[chordIdx], t, 0.5);
        }
        
        step++;
    }, 500); // Темп джаза
}
</script>
</body>
</html>
