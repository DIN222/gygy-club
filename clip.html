
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY CLUB | CLIP STUDIO v.1.6</title>
    <style>
        :root { --gold: #ffd700; --black: #000; --h-unit: 42px; }
        body { background: var(--black); color: var(--gold); font-family: monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 10px 20px; 
            border-bottom: 1px solid var(--gold);
            z-index: 20;
        }
        .header-left { display: flex; gap: 15px; align-items: center; }
        .header-right { display: flex; justify-content: flex-end; }

        .ui-box { 
            height: var(--h-unit); 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 15px; 
            background: transparent; 
            color: var(--gold); 
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .ui-box:hover { background: rgba(255, 215, 0, 0.1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        
        .arrow { font-size: 24px; width: 60px; font-weight: bold; }
        .avatar { width: var(--h-unit); padding: 0; font-size: 10px; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 6px; }

        #studio-mirror { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 40px;
            background: #000;
            position: relative;
        }

        #received-verse {
            border: 1px double var(--gold);
            padding: 30px;
            max-width: 600px;
            text-align: center;
            font-size: 20px;
            line-height: 1.6;
            color: #fff;
            background: rgba(0,0,0,0.8);
            white-space: pre-line;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 1);
            z-index: 10;
        }

        .render-pulse { animation: pulse 2s infinite; color: #ff4500; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #visual-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            transition: 1s;
        }

        footer { padding: 20px; border-top: 1px solid #222; background: var(--black); z-index: 20; }
        .control-row { display: flex; gap: 15px; max-width: 1000px; margin: 0 auto; }
        .btn-action { flex: 1; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        audio { width: 100%; max-width: 400px; filter: invert(1) hue-rotate(180deg) brightness(1.5); margin-top: 10px; display: none; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="ui-box arrow" onclick="location.href='verses.html'">⟵</button>
        <div class="ui-box" style="border:none">RU/EN</div>
        <div class="ui-box avatar">ID:01</div>
        <div class="ui-box" style="cursor:default; background: rgba(255,215,0,0.1)">STUDIO MODE</div>
    </div>
    
    <div class="logo">GY-GY</div>
    
    <div class="header-right">
        <button class="ui-box arrow" onclick="location.href='techpark.html'">⟶</button>
    </div>
</header>

<main id="studio-mirror">
    <div id="visual-canvas"></div>
    
    <div id="received-verse">Загрузка данных...</div>
    
    <div id="audio-module" style="z-index: 10; text-align: center;">
        <div id="status-line" style="font-size: 11px; color: #666; margin-bottom: 5px;">[ ИНИЦИАЛИЗАЦИЯ ОБЛАКА... ]</div>
        <audio id="clip-audio" controls>
            <source src="" type="audio/mpeg">
        </audio>
    </div>
</main>

<footer>
    <div class="control-row">
        <button class="ui-box btn-action" onclick="alert('💾 Сохранено')">SAVE</button>
        <button class="ui-box btn-action" onclick="alert('✈️ В Telegram')">SEND</button>
        <button class="ui-box btn-action" onclick="alert('⭐ В Хит-Парад')">HIT</button>
        <button class="ui-box btn-action" style="border-color: #555; color: #555;">BOX</button>
    </div>
</footer>

<script>
    window.onload = function() {
        const verse = localStorage.getItem('currentVerse');
        const cloudImg = localStorage.getItem('lastCloudImg'); // Проверяем картинку из облака
        
        const display = document.getElementById('received-verse');
        const canvas = document.getElementById('visual-canvas');
        
        if (verse && verse.trim() !== "") {
            display.innerText = verse;
            
            // Если в памяти есть ссылка на ИИ-картинку — ставим её, иначе градиент
            if (cloudImg) {
                canvas.style.backgroundImage = `url('${cloudImg}')`;
            } else {
                canvas.style.background = "radial-gradient(circle, #1a0000 0%, #000 100%)";
            }
            
            startAIVisualization();
        } else {
            display.innerHTML = "<span class='render-pulse'>ОЖИДАНИЕ ТЕКСТА ИЗ VERSES...</span>";
        }
    };

    function startAIVisualization() {
        const statusLine = document.getElementById('status-line');
        const audio = document.getElementById('clip-audio');

        statusLine.innerHTML = "<span class='render-pulse'>[ МОДУЛЬ VEO: СИНХРОНИЗАЦИЯ ВИЗУАЛА... ]</span>";
        
        setTimeout(() => {
            statusLine.innerHTML = "<span style='color: var(--gold)'>[ МОДУЛЬ LYRIA: ПОТОК ПОДКЛЮЧЕН ]</span>";
            audio.style.display = "inline-block"; 
            console.log("✅ Студия готова.");
        }, 3000);
    }
</script>

</body>
</html>
