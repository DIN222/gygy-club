
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY v5.0: ABSURD STUDIO</title>
    <style>
        :root { --gold: #ffcf00; --gold-dark: #b8860b; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { border-bottom: 2px solid var(--gold); padding: 10px; background: #050505; }
        .nav-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-nav { background: none; border: 1px solid var(--gold-dark); color: var(--gold); padding: 5px 15px; cursor: pointer; border-radius: 5px; }
        
        #google_translate_element { border: 1px solid var(--gold-dark); padding: 2px; border-radius: 5px; min-width: 100px; height: 25px; }
        
        .studio-zone { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .poem-paper { border-left: 3px solid var(--gold); padding-left: 15px; font-style: italic; color: #ddd; white-space: pre-wrap; }
        
        .counter { color: var(--gold-dark); font-size: 12px; text-align: right; margin-top: 5px; }

        .input-zone { padding: 15px; background: #080808; border-top: 1px solid #222; }
        textarea { width: 100%; background: #111; border: 1px solid var(--gold-dark); color: #fff; padding: 10px; box-sizing: border-box; resize: none; border-radius: 5px; height: 80px; }
        
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-main { flex: 1; padding: 10px; border: none; background: var(--gold); color: #000; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .btn-main:disabled { background: #333; color: #666; }
        .btn-alt { flex: 1; padding: 10px; border: 1px solid var(--gold); background: none; color: var(--gold); border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <div class="nav-box">
            <button class="btn-nav" id="backBtn">«</button>
            <div id="google_translate_element"></div>
            <button class="btn-nav" onclick="location.reload()">↺</button>
        </div>
        <div style="text-align: center; color: var(--gold); letter-spacing: 5px; font-weight: bold;">GY-GY v5.0</div>
    </header>

    <div class="studio-zone">
        <div id="poemDisplay" class="poem-paper">Начните свой абсурдный стих...</div>
        <div class="counter" id="stanzaCount">Куплетов: 0 / 4</div>
    </div>

    <div class="input-zone">
        <textarea id="poemInput" placeholder="Введите куплет..."></textarea>
        <div class="actions">
            <button class="btn-main" id="addBtn">ДОБАВИТЬ КУПЛЕТ</button>
            <button class="btn-alt" id="publishBtn" disabled>ОПУБЛИКОВАТЬ</button>
        </div>
        <button class="btn-alt" id="clipBtn" style="width: 100%; margin-top: 10px; display: none;">СДЕЛАТЬ КЛИП →</button>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage:'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let stanzas = [];
        const maxStanzas = 4;

        const input = document.getElementById('poemInput');
        const display = document.getElementById('poemDisplay');
        const counter = document.getElementById('stanzaCount');
        const addBtn = document.getElementById('addBtn');
        const publishBtn = document.getElementById('publishBtn');
        const clipBtn = document.getElementById('clipBtn');

        // КНОПКА НАЗАД (Честный возврат)
        document.getElementById('backBtn').onclick = () => {
            if (window.history.length > 1) history.back();
        };

        // ЛОГИКА ДОБАВЛЕНИЯ
        addBtn.onclick = () => {
            const text = input.value.trim();
            if (text && stanzas.length < maxStanzas) {
                stanzas.push(text);
                input.value = "";
                updatePoem();
            }
        };

        function updatePoem() {
            display.innerText = stanzas.join('\n\n');
            counter.innerText = `Куплетов: ${stanzas.length} / ${maxStanzas}`;
            
            if (stanzas.length >= 1) {
                publishBtn.disabled = false;
                clipBtn.style.display = 'block';
            }
            if (stanzas.length >= maxStanzas) {
                addBtn.disabled = true;
                input.disabled = true;
                input.placeholder = "Лимит достигнут.";
            }
        }

        // ПУБЛИКАЦИЯ В ЖУРНАЛ
        publishBtn.onclick = () => {
            const date = new Date().toLocaleString();
            let journal = JSON.parse(localStorage.getItem('absurd_journal') || "[]");
            journal.push({ date: date, text: stanzas.join('\n\n') });
            localStorage.setItem('absurd_journal', JSON.stringify(journal));
            alert("СТИХ СОХРАНЕН В ЖУРНАЛЕ!");
            location.reload(); // Начинаем новый стих
        };

        // ПЕРЕХОД К КЛИПУ (Вторая страница)
        clipBtn.onclick = () => {
            localStorage.setItem('current_poem', stanzas.join('\n\n'));
            alert("ПЕРЕХОД В МАСТЕРСКУЮ КЛИПОВ...");
            // Здесь будет переход: window.location.href = 'clips.html';
        };
    </script>

</body>
</html>
