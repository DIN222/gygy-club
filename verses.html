
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CORE v33.4.10 LANG-FIX</title>
    <script src="config.js"></script>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; }
        
        /* HEADER - ВСЕГДА ВИДЕН */
        header { height: 70px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 10px; position: relative; z-index: 1000; flex-shrink: 0; gap: 10px; }
        .nav-fix { width: 35px; height: 35px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-weight: bold; }
        
        /* ПАНЕЛЬ ЯЗЫКОВ */
        #google_translate_element { min-width: 140px; overflow: hidden; height: 35px; border: 1px solid #333; background: #000; display: flex; align-items: center; justify-content: center; }
        .goog-te-gadget-simple { background-color: transparent !important; border: none !important; color: var(--gold) !important; }

        /* АВАТАР */
        .user-box { display: flex; align-items: center; gap: 10px; }
        .avatar-circle { 
            width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gold); 
            background: url('https://api.dicebear.com/7.x/bottts/svg?seed=Beuvry&backgroundColor=000000') center/cover;
        }

        .btn-act-trigger { color: var(--gold); font-size: 0.7rem; cursor: pointer; padding: 8px; border: 1px solid #444; background: #222; white-space: nowrap; }

        #wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle, #111, #000); }
        .bubble { padding: 12px; max-width: 80%; border: 1px solid #333; border-radius: 4px; line-height: 1.4; }
        .u-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255,215,0,0.03); color: #fff; }
        .a-msg { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }

        /* POPUP MENUS */
        .pop-menu { display: none; position: absolute; background: #111; border: var(--border); z-index: 99999; width: 200px; }
        .act-menu { top: 75px; right: 10px; }
        .mode-menu { bottom: 85px; left: 10px; }
        .m-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.8rem; color: #fff; text-transform: uppercase; }
        .m-item:hover { background: var(--gold); color: #000; }

        /* FOOTER */
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: var(--border); background: #000; z-index: 1001; }
        .btn-mode { width: 50px; height: 50px; border: 1px solid var(--gold); background: #111; color: var(--gold); font-size: 1.5rem; cursor: pointer; }
        #in { flex-grow: 1; background: #000; border: 1px solid #333; color: var(--gold); padding: 15px; outline: none; font-size: 1rem; }
        .btn-send { width: 60px; height: 50px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; color: #000; }
    </style>
</head>
<body>

<header>
    <div class="nav-fix" onclick="location.href='ai_room_core_v8.html'">❮</div>
    <div id="google_translate_element"></div> <div class="user-box">
        <div class="avatar-circle"></div>
    </div>
    <div class="btn-act-trigger" onclick="toggleM('actMenu', event)">ДЕЙСТВИЯ ▾</div>
    <div class="nav-fix" style="margin-left:auto" onclick="location.href='box_page.html'">❯</div>
</header>

<div id="wall">
    <div class="bubble a-msg">v33.4.9: Языковая панель и Аватар в строю. Код ID скрыт. Жду 4 слова.</div>
</div>

<div id="actMenu" class="pop-menu act-menu">
    <div class="m-item" onclick="clearWall()">🗑 Очистить стену</div>
    <div class="m-item" onclick="alert('В BOX!')">📦 В сборник</div>
</div>

<div id="modeMenu" class="pop-menu mode-menu">
    <div class="m-item" onclick="setMode('ø Абсурд', 'абсурд, 4 строки')">ø Абсурд</div>
    <div class="m-item" onclick="setMode('§ Быт', 'ирония, 4 строки')">§ Быт</div>
    <div class="m-item" onclick="setMode('† Прожарка', 'стеб, 4 строки')">† Прожарка</div>
    <div class="m-item" onclick="setMode('¶ Сатира', 'сатира, 4 строки')">¶ Сатира</div>
    <div class="m-item" onclick="setMode('‡ Хлестко', 'уан-лайнер, 1 строка')">‡ Хлестко</div>
</div>

<footer>
    <button class="btn-mode" onclick="toggleM('modeMenu', event)">▲</button>
    <input type="text" id="in" placeholder="Стиль: § Быт..." autocomplete="off">
    <button id="go" class="btn-send">ОК</button>
</footer>

<script>
    let curDesc = "ирония, 4 строки";
    let curName = "§ Быт";

    function toggleM(id, e) {
        if(e) e.stopPropagation();
        const menu = document.getElementById(id);
        const isVisible = menu.style.display === 'block';
        document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
        menu.style.display = isVisible ? 'none' : 'block';
    }

    function setMode(name, desc) {
        curName = name; curDesc = desc;
        document.getElementById('in').placeholder = `Режим: ${name}...`;
        document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
    }

    async function callAI(text) {
        try {
            const key = (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).replace(/["'\s]/g, "");
            // Используем v1beta/models/gemini-1.5-flash-latest - это самый стабильный путь в 2026-м
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${key}`;
            
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `${BEUVRY_CONFIG.PROMPT}\nСтиль: ${curDesc}. Слова: ${text}` }] }] })
            });
            
            const d = await r.json();
            if (d.error) return `❌ ${d.error.message}`;
            return d.candidates[0].content.parts[0].text.trim();
        } catch (e) { return "❌ Ошибка связи."; }
    }

    const wall = document.getElementById('wall');
    const input = document.getElementById('in');
    const btn = document.getElementById('go');

    btn.onclick = async () => {
        const val = input.value.trim(); if(!val || btn.disabled) return;
        btn.disabled = true;
        const uMsg = document.createElement('div'); uMsg.className = 'bubble u-msg'; uMsg.innerText = val;
        wall.appendChild(uMsg); input.value = ""; wall.scrollTop = wall.scrollHeight;

        const res = await callAI(val);
        const aMsg = document.createElement('div'); aMsg.className = 'bubble a-msg';
        aMsg.innerHTML = `<small style="color:var(--gold); font-size:0.6rem">${curName}</small><br>` + res.replace(/\n/g, '<br>');
        wall.appendChild(aMsg);
        btn.disabled = false; wall.scrollTop = wall.scrollHeight;
    };

    input.onkeypress = (e) => { if(e.key === 'Enter') btn.click(); };
    function clearWall() { wall.innerHTML = ""; }
    window.onclick = () => document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
</script>

</body>
</html>
