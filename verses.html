<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v6.5.0 Snarky</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Статичный Хедер */
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 15px; box-sizing: border-box; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .btn-top { width: 42px; height: 42px; border: var(--border); color: var(--gold); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; }
        .logo-gy { font-weight: 900; font-size: 1.4rem; letter-spacing: 5px; position: absolute; left: 50%; transform: translateX(-50%); }
        
        /* Скролл-зона */
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        
        /* Сообщения */
        .msg { padding: 15px; max-width: 85%; font-size: 1.1rem; line-height: 1.4; border-radius: 2px; position: relative; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; color: #eee; background: rgba(255, 255, 255, 0.08); text-align: right; }

        /* Выпадающее меню ⋮ */
        .menu-wrap { position: relative; margin-top: 8px; }
        .dots-btn { cursor: pointer; font-size: 1.4rem; opacity: 0.6; padding: 5px; }
        .dots-btn:hover { opacity: 1; }
        .drop-menu { display: none; position: absolute; right: 0; top: 100%; background: #111; border: var(--border); z-index: 2000; width: 170px; box-shadow: 0 10px 30px #000; }
        .drop-menu div { padding: 12px; font-size: 0.8rem; border-bottom: 1px solid #222; cursor: pointer; text-align: left; }
        .drop-menu div:hover { background: var(--gold); color: #000; }

        /* Футер */
        footer { height: 90px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: 1px solid #333; background: #000; z-index: 1000; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 15px; outline: none; font-size: 1rem; }
        .btn-up { width: 55px; height: 55px; background: var(--gold); border: none; font-size: 2.2rem; cursor: pointer; color: #000; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="btn-top">«</a>
    <div class="logo-gy">GY-GY</div>
    <div style="display:flex; gap:8px;">
        <div class="btn-top" onclick="showBox()">BOX</div>
        <div class="btn-top">RU</div>
    </div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">Система 6.5.0: Юмор включен, нуар под контролем. Жги, шеф!</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Твои 4 слова..." autocomplete="off">
    <button id="send-btn" class="btn-up">↑</button>
</footer>

<script>
    const MODELS = ['gemini-3.1-flash-lite-preview', 'gemini-2.5-flash-lite', 'gemini-2.0-flash', 'gemma-3-27b-it'];
    
    function getApiKey() { return localStorage.getItem('user_gemini_key') || (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2 : ""); }

    async function callAI(text, modelIdx = 0) {
        if (modelIdx >= MODELS.length) return "Даже роботы устали от твоих слов. Дай нам минуту.";
        const key = getApiKey();
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODELS[modelIdx]}:generateContent?key=${key}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PROMPT : "Пиши ироничный нуар.") + "\nСлова: " + text }] }] })
            });
            const d = await r.json();
            if (d.error) return await callAI(text, modelIdx + 1);
            return d.candidates[0].content.parts[0].text;
        } catch (e) { return await callAI(text, modelIdx + 1); }
    }

    function addMessageWithMenu(text, isAi = true) {
        const div = document.createElement('div');
        div.className = `msg ${isAi ? 'ai-msg' : 'user-msg'}`;
        div.innerHTML = isAi ? text.replace(/\n/g, '<br>') : text;

        if (isAi) {
            const wrap = document.createElement('div');
            wrap.className = 'menu-wrap';
            wrap.innerHTML = `<div class="dots-btn">⋮</div>
                <div class="drop-menu">
                    <div onclick="saveToBox(\`${text}\`)">★ В СБОРНИК</div>
                    <div onclick="alert('Генерирую Veo-клип...')">🎬 СДЕЛАТЬ КЛИП</div>
                    <div onclick="copyTxt(\`${text}\`)">🔗 ДРУГУ</div>
                    <div onclick="this.closest('.msg').remove()" style="color:red">✖ УДАЛИТЬ</div>
                </div>`;
            
            wrap.querySelector('.dots-btn').onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.drop-menu').forEach(m => m.style.display = 'none');
                wrap.querySelector('.drop-menu').style.display = 'block';
            };
            div.appendChild(wrap);
        }
        
        wall.appendChild(div);
        wall.scrollTop = wall.scrollHeight;
    }

    window.saveToBox = (t) => {
        let b = JSON.parse(localStorage.getItem('gy_collection') || "[]");
        b.push(t); localStorage.setItem('gy_collection', JSON.stringify(b));
        alert('Стих в BOX-е. Не потеряй.');
    };

    window.copyTxt = (t) => { navigator.clipboard.writeText(t); alert('Скопировано!'); };

    window.showBox = () => {
        let b = JSON.parse(localStorage.getItem('gy_collection') || "[]");
        alert(b.length ? "В Сборнике " + b.length + " шедевров." : "BOX пуст, как кошелек поэта.");
    };

    const input = document.getElementById('user-in');
    const btn = document.getElementById('send-btn');
    const wall = document.getElementById('chat-wall');

    async function send() {
        const val = input.value.trim();
        if (!val || btn.disabled) return;
        btn.disabled = true;
        addMessageWithMenu(val, false);
        input.value = "";

        const aiRes = await callAI(val);
        addMessageWithMenu(aiRes, true);
        btn.disabled = false;
    }

    btn.onclick = send;
    input.onkeypress = (e) => { if(e.key==='Enter') send(); };
    document.onclick = () => document.querySelectorAll('.drop-menu').forEach(m => m.style.display='none');
</script>
</body>
</html>
