
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY v5.7: THE ARCHIVE</title>
    <style>
        :root { --gold: #ffcf00; --orange-neon: #ff8c00; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .control-panel {
            display: flex; align-items: center; border-bottom: 1px solid #222;
            padding: 0 15px; background: #050505; height: 60px; gap: 10px;
        }

        .nav-arrow { color: var(--gold); font-size: 28px; background: none; border: none; cursor: pointer; font-weight: bold; }
        .tools-row { display: flex; align-items: center; gap: 15px; flex: 1; overflow-x: auto; scrollbar-width: none; }
        
        /* ЯЗЫКОВАЯ ПАНЕЛЬ (Делаем видимой для работы) */
        #google_translate_element { min-width: 100px; height: 30px; border: 1px solid var(--gold); border-radius: 4px; overflow: hidden; }
        
        .tool-item { color: var(--gold); text-transform: uppercase; font-size: 11px; font-weight: 900; cursor: pointer; background: none; border: none; white-space: nowrap; }
        .logo-end { margin-left: auto; color: var(--gold); font-weight: 900; letter-spacing: 2px; font-size: 14px; }
        .user-avatar { width: 30px; height: 30px; border: 1px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0; }

        /* ЭКРАНЫ AI ROOM (Оранжевый Неон) */
        #ai-room { 
            display: none; height: 100vh; width: 100vw; 
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            flex-direction: column; align-items: center; justify-content: center; gap: 30px;
        }
        .neon-screen {
            color: var(--orange-neon); font-size: 24px; font-weight: 900;
            text-shadow: 0 0 10px var(--orange-neon), 0 0 20px var(--orange-neon);
            cursor: pointer; letter-spacing: 5px; transition: 0.3s;
        }
        .neon-screen:hover { color: #fff; }

        /* СТУДИЯ СТИХОВ */
        #studio { display: flex; flex-direction: column; height: 100vh; }
        .studio-zone { flex: 1; overflow-y: auto; padding: 40px 20px; text-align: center; }
        .poem-paper { font-size: 22px; line-height: 1.6; font-style: italic; white-space: pre-wrap; }
        
        /* ВВОД В СТРОКУ */
        .input-bar { display: flex; padding: 15px; background: #080808; border-top: 1px solid #222; gap: 10px; }
        #poemInput { flex: 1; background: none; border: none; border-bottom: 1px solid #444; color: #fff; font-size: 16px; outline: none; }
        .btn-ok { color: var(--gold); background: none; border: 1px solid var(--gold); padding: 5px 15px; cursor: pointer; font-weight: 900; }

        #road-sign { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid var(--gold); background: #000; color: var(--gold); padding: 20px; display: none; z-index: 2000; }
    </style>
</head>
<body>

    <div id="road-sign">🛑 ТУПИК</div>

    <div id="ai-room">
        <div class="neon-screen" onclick="enterStudio()">VERSES</div>
        <div class="neon-screen">TECHPARK</div>
        <div style="color: #333; font-size: 10px;">[ СТОЛ / КРЕСЛО / ЭКРАНЫ ]</div>
    </div>

    <div id="studio">
        <header class="control-panel">
            <button class="nav-arrow" onclick="exitToRoom()">«</button>
            <div class="tools-row">
                <div id="google_translate_element"></div>
                <div class="user-avatar" id="userIcon">ID</div>
                <button class="tool-item" onclick="alert('В ЭФИРЕ...')">В ЭФИР</button>
                <button class="tool-item" onclick="shareFriend()">SHARE</button>
                <button class="tool-item" id="clipBtn">КЛИП</button>
            </div>
            <div class="logo-end">GY-GY</div>
            <button class="nav-arrow" onclick="showSign()">»</button>
        </header>

        <div class="studio-zone">
            <div id="poemDisplay" class="poem-paper">Начните свой абсурд...</div>
        </div>

        <div class="input-bar">
            <input type="text" id="poemInput" placeholder="ВАШ ИМПУЛЬС..." autocomplete="off">
            <button class="btn-ok" id="addBtn">OK</button>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage:'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE, autoDisplay: false}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let stanzas = [];

        // Переключение экранов
        function exitToRoom() {
            document.getElementById('studio').style.display = 'none';
            document.getElementById('ai-room').style.display = 'flex';
        }

        function enterStudio() {
            document.getElementById('ai-room').style.display = 'none';
            document.getElementById('studio').style.display = 'flex';
        }

        function showSign() {
            const s = document.getElementById('road-sign');
            s.style.display = 'block';
            setTimeout(() => s.style.display = 'none', 1500);
        }

        // Аватар
        window.onload = () => {
            document.getElementById('userIcon').innerText = 'ID-' + Math.floor(Math.random()*999);
        };

        // Добавление строк
        document.getElementById('addBtn').onclick = () => {
            const inp = document.getElementById('poemInput');
            if(inp.value.trim()) {
                stanzas.push(inp.value.trim());
                inp.value = "";
                document.getElementById('poemDisplay').innerText = stanzas.join('\n\n');
            }
        };

        // Телеграм (открытие в новом окне)
        function shareFriend() {
            const text = stanzas.join('\n\n');
            if (!text) return alert("ПУСТО");
            const url = `https://t.me/share/url?url=GY-GY&text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
