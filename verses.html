
<!DOCTYPE html><html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.9.1</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 10px; box-sizing: border-box; justify-content: space-between; position: relative; }
        .btn-header { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: var(--border); color: var(--gold); background: none; cursor: pointer; font-size: 1.5rem; }
        .logo-gy { font-weight: 900; font-size: 1.2rem; letter-spacing: 3px; position: absolute; left: 50%; transform: translateX(-50%); }
        .lang-btn { border: var(--border); padding: 5px 10px; font-size: 0.8rem; }
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px; max-width: 80%; font-size: 1.1rem; border-radius: 2px; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; color: #eee; background: rgba(255, 255, 255, 0.1); text-align: right; }
        footer { height: 85px; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-top: 1px solid #333; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 14px; outline: none; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); border: none; font-size: 1.8rem; cursor: pointer; }
        #key-guard { position: fixed; top: 70px; left: 10px; right: 10px; background: #111; border: 2px solid red; padding: 15px; z-index: 999; display: none; }
    </style></head><body>

<header>
    <div class="btn-header" onclick="location.href='ai_room_core_v8.html'">«</div>
    <div class="logo-gy">GY-GY</div>
    <div class="lang-btn">RU</div>
</header>

<div id="key-guard">
    <div style="color: red; font-weight: bold; margin-bottom: 10px;">КЛЮЧ ЗАБЛОКИРОВАН ИЛИ УТЕК</div>
    <input type="password" id="new-key" placeholder="Вставьте новый API Key..." style="width:100%; background:#000; border:1px solid var(--gold); color:var(--gold); padding:10px;">
    <button onclick="activateNewKey()" style="width:100%; margin-top:10px; background:var(--gold); border:none; padding:10px; cursor:pointer;">ОБНОВИТЬ СИСТЕМУ</button>
</div>

<div id="chat-wall">
    <div class="msg user-msg">v5.9.1. Система защиты от утечек активна.</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Буря мгла..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
</footer>

<script>
    let ACTIVE_KEY = localStorage.getItem('safe_gemini_key');
    
    // Если в конфиге есть фрагменты, пробуем их склеить (но они могут быть забанены)
    if (!ACTIVE_KEY && typeof BEUVRY_CONFIG !== 'undefined') {
        ACTIVE_KEY = BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2;
    }

    function activateNewKey() {
        const k = document.getElementById('new-key').value.trim();
        if(k) {
            localStorage.setItem('safe_gemini_key', k);
            ACTIVE_KEY = k;
            document.getElementById('key-guard').style.display = 'none';
            alert("Ключ обновлен локально!");
        }
    }

    async function aiAction(t) {
        const wall = document.getElementById('chat-wall');
        const m = document.createElement('div');
        m.className = 'msg ai-msg'; m.innerHTML = "<i>...</i>";
        wall.appendChild(m);

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${ACTIVE_KEY}`;

        try {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PROMPT : "") + "\nТема: " + t }] }] })
            });
            const d = await r.json();
            if (d.error) {
                if (d.error.message.includes("leaked") || d.error.message.includes("API key not valid")) {
                    document.getElementById('key-guard').style.display = 'block';
                }
                m.innerHTML = "Ошибка: " + d.error.message;
            } else {
                m.innerHTML = d.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            }
        } catch (e) { m.innerHTML = "Сбой сети."; }
        wall.scrollTop = wall.scrollHeight;
    }

    function send() {
        const i = document.getElementById('user-in');
        if(i.value.trim()){
            const m = document.createElement('div'); m.className = 'msg user-msg'; m.innerText = i.value;
            document.getElementById('chat-wall').appendChild(m);
            aiAction(i.value); i.value = "";
        }
    }
</script></body></html>
