
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | VERSES v.9.2</title>
    <style>
        :root { --gold: #FFD700; --bg: #000; --ai: #4285F4; }
        body { 
            background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace;
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* HEADER */
        .header { display: flex; justify-content: space-between; padding: 10px 15px; border-bottom: 2px solid var(--gold); align-items: center; }
        .logo { font-weight: 900; letter-spacing: 3px; }

        /* MATRIX 10/4 */
        .matrix-container { background: #080808; border-bottom: 1px solid var(--gold); overflow: hidden; }
        .matrix-scroll { display: flex; overflow-x: auto; gap: 8px; padding: 12px; }
        .matrix-scroll::-webkit-scrollbar { display: none; }
        
        .slot {
            min-width: 45px; height: 45px; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 900; flex-shrink: 0; cursor: pointer;
            transition: 0.3s; text-transform: uppercase;
        }
        .slot.u-active { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 5px var(--gold); }
        .slot.ai-active { border-color: var(--ai); color: var(--ai); }
        .slot:active { transform: scale(0.9); background: #111; }

        /* STREAM */
        .stream { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { border-left: 2px solid var(--gold); padding: 5px 15px; background: rgba(255,215,0,0.05); }
        .msg.ai { border-left-color: var(--ai); background: rgba(66,133,244,0.05); }
        .meta { font-size: 8px; opacity: 0.6; margin-bottom: 4px; display: block; }

        /* INPUT */
        .input-zone { padding: 15px; background: #000; border-top: 2px solid var(--gold); display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid #444; color: var(--gold); padding: 12px; font-family: 'Courier New'; outline: none; }
        .mint-btn { background: #000; color: var(--gold); border: 2px solid var(--gold); padding: 10px 15px; font-weight: 900; cursor: pointer; }

        /* FINAL */
        #final-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>

    <header class="header">
        <div id="google_translate_element"></div>
        <div class="logo">GY-GY VERSES</div>
    </header>

    <div class="matrix-container">
        <div class="matrix-scroll" id="matrix-slots"></div>
    </div>

    <main class="stream" id="stream"></main>

    <div class="input-zone" id="ui">
        <input type="text" id="inp" placeholder="ВВЕДИТЕ СТРОКУ..." autocomplete="off">
        <button class="mint-btn" onclick="userPost()">MINT</button>
    </div>

    <div id="final-overlay">
        <h2 style="letter-spacing:5px;">ШЕДЕВР ГОТОВ</h2>
        <p id="timer">ОТПРАВКА В СБОРНИК: 5...</p>
        <button class="mint-btn" onclick="location.href='verses_collection.html'">ПЕРЕЙТИ В АРХИВ</button>
    </div>

  <script>
    // 1. ТВОЙ КЛЮЧ ВСТАВЛЯТЬ СЮДА:
    const API_KEY = AIzaSyBnhRNyTBGpeRUeg3Hg_NwRTh0qNLITbi0; 
    
    let count = 0;
    const total = 16;
    let poemContext = ""; // Память ИИ: сюда записывается всё, что вы сочинили

    // Инициализация матрицы (10 юзеров + 4 ИИ)
    function init() {
        const m = document.getElementById('matrix-slots');
        m.innerHTML = ""; // Очистка
        for(let i=1; i<=10; i++) {
            m.innerHTML += `<div class="slot ${i===1?'u-active':''}">U${i}</div>`;
        }
        const ais = ['GEMINI', 'GROK', 'CLAUDE', 'MISTRAL'];
        ais.forEach(name => {
            // При нажатии вызываем живой ИИ
            m.innerHTML += `<div class="slot ai-active" onclick="aiPost('${name}')">${name.substring(0,2)}</div>`;
        });
    }

    // Функция отправки твоей строки
    function userPost() {
        const inp = document.getElementById('inp');
        const val = inp.value.trim();
        if(!val || count >= total) return;
        
        addMessage('USER_1', val, 'user');
        inp.value = '';
    }

    // ЖИВОЙ ИНТЕЛЛЕКТ: Запрос к Google Gemini
    async function aiPost(aiName) {
        if(count >= total) return;

        // Создаем временное сообщение "ПЕЧАТАЕТ..."
        const tempId = 'ai-loading-' + Date.now();
        addMessage(aiName, "МЫСЛИТ...", 'ai', tempId);

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: `Ты — ИИ по имени ${aiName} в элитном клубе GY-GY. 
                        Твоя задача: продолжить стих одной короткой, мощной рифмованной строкой. 
                        Стиль: киберпанк, виски, нуар, ирония. 
                        Контекст стиха: ${poemContext}. 
                        Напиши только ОДНУ строку, строго капсом, без лишних знаков.` }]
                    }]
                })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text.trim();
            
            // Заменяем "МЫСЛИТ..." на реальный результат
            const msgDiv = document.getElementById(tempId);
            if (msgDiv) {
                // Обновляем текст внутри div, не трогая метку @NAME
                const meta = msgDiv.querySelector('.meta').outerHTML;
                msgDiv.innerHTML = `${meta}${aiText.toUpperCase()}`;
                poemContext += " " + aiText; // Запоминаем ответ
            }
        } catch (e) {
            console.error(e);
            const msgDiv = document.getElementById(tempId);
            if (msgDiv) msgDiv.lastChild.textContent = "СБОЙ СВЯЗИ С ЯДРОМ";
        }
    }

    function addMessage(author, text, type, id = null) {
        if(count >= total) return;
        count++;
        
        const s = document.getElementById('stream');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if(id) div.id = id;

        div.innerHTML = `<span class="meta">@${author} [${count}/${total}]</span>${text.toUpperCase()}`;
        s.appendChild(div);
        s.scrollTop = s.scrollHeight;
        
        // Добавляем в общий контекст для ИИ
        poemContext += " " + text;

        if(count >= total) finish();
    }

    function finish() {
        document.getElementById('ui').style.display = 'none';
        const ov = document.getElementById('final-overlay');
        ov.style.display = 'flex';
        let t = 5;
        const clock = setInterval(() => {
            t--;
            document.getElementById('timer').innerText = `ОТПРАВКА В СБОРНИК: ${t}...`;
            if(t <= 0) {
                clearInterval(clock);
                document.getElementById('timer').innerText = "ШЕДЕВР СОХРАНЕН В ВАШЕМ СБОРНИКЕ.";
            }
        }, 1000);
    }

    window.onload = init;

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }
</script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
