
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | VERSES v38.8.0</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100vh; 
            background: var(--bg); color: var(--gold); 
            font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* HEADER: Навигация v38.8.0 */
        .page-header { 
            height: 60px; display: flex; align-items: center; 
            border-bottom: 1px solid var(--gold); background: #111; 
            flex-shrink: 0; z-index: 1001; 
        }
        .nav-fix { 
            width: 60px; height: 100%; display: flex; align-items: center; 
            justify-content: center; background: #111; cursor: pointer; 
            color: var(--gold); text-decoration: none; flex-shrink: 0; 
            font-weight: bold; font-size: 1.5rem; 
        }
        .header-title { 
            flex-grow: 1; text-align: center; font-weight: 900; 
            letter-spacing: 3px; font-size: 0.9rem; 
        }

        /* LIST */
        #boxList { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 20px; 
        }
        .verse-card { 
            padding: 15px; border: 1px solid #333; 
            background: #050505; position: relative;
        }
        .v-meta { 
            font-size: 0.6rem; opacity: 0.4; margin-bottom: 10px; 
            display: flex; justify-content: space-between; text-transform: uppercase;
        }
        .v-text { 
            font-size: 1.1rem; line-height: 1.5; color: #fff; 
            white-space: pre-wrap; outline: none; margin-bottom: 15px;
        }

        /* ACTIONS */
        .v-btns { 
            display: flex; gap: 10px; border-top: 1px solid #222; padding-top: 10px; 
        }
        .v-btn { 
            background: transparent; border: 1px solid #444; 
            color: var(--gold); font-size: 0.7rem; padding: 6px 12px; 
            cursor: pointer; text-transform: uppercase; font-weight: bold;
        }
        .v-btn-del { color: #f44; border-color: #500; margin-left: auto; }

        .empty-msg { text-align: center; margin-top: 60px; opacity: 0.3; font-size: 0.9rem; }
    </style>
</head>
<body>

<header class="page-header">
    <a href="ai_room_core_v8.html" class="nav-fix">❮</a>
    <div class="header-title">GY-GY / В БОКСЕ / v38.8.0</div>
    <div style="width: 60px;"></div>
</header>

<div id="boxList"></div>

<script>
    function renderBox() {
        const list = document.getElementById('boxList');
        const items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        
        if (items.length === 0) {
            list.innerHTML = '<div class="empty-msg">БОКС ПУСТ</div>';
            return;
        }

        // Рендерим новые сверху (reverse)
        list.innerHTML = items.slice().reverse().map((item, index) => {
            // Рассчитываем реальный индекс в исходном массиве
            const realIdx = items.length - 1 - index;
            return `
                <div class="verse-card">
                    <div class="v-meta">
                        <span>${item.mode || 'КУПЛЕТ'}</span>
                        <span>${item.date || ''}</span>
                    </div>
                    <div class="v-text" contenteditable="true" onblur="updateVerse(${realIdx}, this.innerText)">${item.text}</div>
                    <div class="v-btns">
                        <button class="v-btn" onclick="copyVerse(${realIdx}, this)">КОПИРОВАТЬ</button>
                        <button class="v-btn v-btn-del" onclick="deleteVerse(${realIdx})">УДАЛИТЬ</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateVerse(idx, text) {
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        items[idx].text = text;
        localStorage.setItem('gygy_box', JSON.stringify(items));
    }

    function deleteVerse(idx) {
        if(!confirm('Удалить?')) return;
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        items.splice(idx, 1);
        localStorage.setItem('gygy_box', JSON.stringify(items));
        renderBox();
    }

    function copyVerse(idx, btn) {
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        navigator.clipboard.writeText(items[idx].text).then(() => {
            const t = btn.innerText; btn.innerText = 'OK!';
            setTimeout(() => btn.innerText = t, 1000);
        });
    }

    renderBox();
</script>

</body>
</html>
