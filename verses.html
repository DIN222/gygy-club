<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY CLUB | AI Room: Verses8.7</title>
    <style>
        body {
            background-color: #000; /* Чистый черный — основа */
            color: #ffd700; /* Золото — свет сути */
            font-family: 'Courier New', monospace;
            margin: 0;
            overflow: hidden;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ: ГЕНЕРАТОР ИСКР */
        #idea-panel {
            width: 100%;
            height: 60px;
            background: #0a0a0a;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .vector-btn {
            background: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 5px 15px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .vector-btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 15px #ffd700;
        }

        #idea-display {
            flex-grow: 1;
            text-align: center;
            font-style: italic;
            color: #888;
            transition: opacity 0.5s;
        }

        /* ОСНОВНАЯ ЗОНА: КУПЛЕТЫ */
        #workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 60px);
        }

        #verse-input {
            width: 60%;
            height: 200px;
            background: #050505;
            border: 1px solid #222;
            color: #fff;
            padding: 20px;
            font-size: 18px;
            resize: none;
            outline: none;
            box-shadow: inset 0 0 10px #000;
        }

        #verse-input:focus {
            border-color: #ffd700;
        }

        .status-bar {
            margin-top: 20px;
            font-size: 14px;
            color: #444;
        }

        /* ЭФФЕКТ ГЛУБИНЫ */
        .depth-mode {
            text-shadow: 0 0 8px #ffd700;
            animation: breathe 4s infinite;
        }

        @keyframes breathe {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="idea-panel">
        <button class="vector-btn" onclick="getSpark('impulse')">⚡ Импульс</button>
        <div id="idea-display">Выберите вектор, чтобы высечь искру...</div>
        <div>
            <button class="vector-btn" onclick="getSpark('depth')">🌀 Глубина</button>
            <button class="vector-btn" onclick="getSpark('gy-gy')">🃏 ГИ-ГИ</button>
        </div>
    </div>

    <div id="workspace">
        <textarea id="verse-input" placeholder="Пиши здесь... или лови искру сверху."></textarea>
        <div class="status-bar">Статус: <span id="current-mode">Ожидание...</span></div>
        <button class="vector-btn" style="margin-top:20px;" onclick="generateClip()">🎬 СОЗДАТЬ КЛИП</button>
    </div>

    <script>
        const ideas = {
            impulse: [
                "Твой стакан наполовину полон амбициями, которые не влезают в этот город!",
                "Падаешь? Нет, парень, ты ЛЕТИШЬ! Опиши этот ветер.",
                "Ритм сердца — это твой главный бит сегодня. Не сбивайся."
            ],
            depth: [
                "На черном видна только суть. Что осталось в твоем осадке?",
                "Тишина весит больше слов. Попробуй измерить её вечность...",
                "Глубина — это не дно, это свобода без гравитации."
            ],
            'gy-gy': [
                "Если рифма не идет — добавь коня. Конь всегда выведет.",
                "Оптимист даже в пропасти ищет Wi-Fi. А что ищешь ты?",
                "Твой виски так долго стоял, что уже сам начал писать стихи."
            ]
        };

        function getSpark(vector) {
            const display = document.getElementById('idea-display');
            const mode = document.getElementById('current-mode');
            const input = document.getElementById('verse-input');
            
            // Анимация затухания
            display.style.opacity = 0;
            
            setTimeout(() => {
                const list = ideas[vector];
                const randomIdea = list[Math.floor(Math.random() * list.length)];
                display.innerText = randomIdea;
                display.style.opacity = 1;
                
                // Настройка режима
                mode.innerText = vector.toUpperCase();
                if (vector === 'depth') {
                    display.className = 'depth-mode';
                } else {
                    display.className = '';
                }
            }, 300);
        }

        function generateClip() {
            alert('Запуск Lyria 3 и Veo... Готовим клип на основе твоей Сути!');
        }
    </script>
</body>
</html>
