<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | VERSES v4.1 CLOUD-GEN</title>
    <style>
        :root { --gold: #d4af37; --neon: #00f2ff; }
        body { 
            margin: 0; background: #000; color: var(--gold); 
            font-family: 'Courier New', monospace; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        .terminal-header {
            padding: 15px 30px; border-bottom: 1px solid var(--gold);
            display: flex; justify-content: space-between; font-size: 12px;
            background: rgba(212,175,55,0.05);
        }

        #poetry-stream {
            flex: 1; padding: 40px; overflow-y: auto;
            display: flex; flex-direction: column-reverse; 
        }

        .live-stanza {
            margin-bottom: 30px; padding: 20px;
            border-left: 3px solid var(--neon);
            background: rgba(0, 242, 255, 0.02);
            animation: glitch 0.3s ease;
        }

        @keyframes glitch {
            0% { transform: skew(10deg); opacity: 0; }
            100% { transform: skew(0deg); opacity: 1; }
        }

        .v-line { font-size: 20px; font-weight: 900; line-height: 1.4; text-transform: uppercase; white-space: pre-wrap; }
        .v-meta { font-size: 10px; color: var(--neon); margin-bottom: 10px; letter-spacing: 2px; }

        .gen-panel {
            padding: 40px; background: #050505;
            display: flex; justify-content: center; gap: 30px;
            border-top: 1px solid rgba(212,175,55,0.2);
        }

        .trigger-btn {
            background: none; border: 2px solid var(--neon); color: var(--neon);
            padding: 20px 40px; cursor: pointer; font-weight: 900;
            letter-spacing: 5px; transition: 0.2s;
        }
        .trigger-btn:hover:not(:disabled) { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); }
        .trigger-btn:disabled { opacity: 0.5; cursor: wait; border-color: #555; color: #555; }
    </style>
</head>
<body>

    <div class="terminal-header">
        <div>MODULE: GEN_CORE_v4.1_CLOUD</div>
        <div id="status-indicator">STATUS: READY_FOR_UPLINK</div>
        <div onclick="location.href='ai_room_core_v8.html'" style="cursor:pointer;">[ EXIT_TO_CORE ]</div>
    </div>

    <main id="poetry-stream"></main>

    <footer class="gen-panel">
        <button id="btn-dark" class="trigger-btn" onclick="synthesize('DARK')">DARK GEN</button>
        <button id="btn-gold" class="trigger-btn" style="border-color: var(--gold); color: var(--gold);" onclick="synthesize('GOLD')">GOLD GEN</button>
    </footer>

    <script>
        // 🔗 ВСТАВЬ СЮДА ССЫЛКУ НА СВОЙ WORKER
        const CLOUD_URL = "https://gygy-club.2work21955.workers.dev"; 

        async function synthesize(style) {
            const stream = document.getElementById('poetry-stream');
            const status = document.getElementById('status-indicator');
            const btns = document.querySelectorAll('.trigger-btn');

            // Блокируем кнопки и меняем статус
            btns.forEach(b => b.disabled = true);
            status.innerText = "STATUS: CLOUD_SYNTHESIS_IN_PROGRESS...";

            // Создаем временный блок ожидания
            const tempID = "gen-" + Date.now();
            const loadingHtml = `
                <div class="live-stanza" id="${tempID}" style="border-color: #444; opacity: 0.6;">
                    <div class="v-meta">GEN_TIMESTAMP: ${new Date().toLocaleTimeString()} | MODE: ${style}</div>
                    <div class="v-line" style="color: #666">УСТАНОВКА СВЯЗИ С ОБЛАКОМ GY-GY...<br>СКАНИРОВАНИЕ НЕЙРОНОВ...</div>
                </div>`;
            stream.prepend(document.createRange().createContextualFragment(loadingHtml));

            try {
                const response = await fetch(CLOUD_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        mode: style, 
                        userPrompt: "напиши стих о киберпанке и клубе Гы-Гы" 
                    })
                });

                const data = await response.json();
                const stanza = document.getElementById(tempID);

                if (data.status === "success") {
                    stanza.style.opacity = "1";
                    stanza.style.borderColor = (style === 'GOLD') ? '#d4af37' : '#00f2ff';
                    stanza.innerHTML = `
                        <div class="v-meta">ORIGIN: CLOUD_CORE_v1.1 | MODE: ${style}</div>
                        <div class="v-line" style="color: ${style === 'GOLD' ? '#d4af37' : '#00f2ff'}">${data.text}</div>
                    `;
                } else {
                    throw new Error("API_REJECTED");
                }

            } catch (err) {
                const stanza = document.getElementById(tempID);
                stanza.innerHTML = `<div class="v-meta" style="color:red">ERROR: UPLINK_FAILED</div><div class="v-line" style="color:red">ОШИБКА ОБЛАКА. ПРОВЕРЬТЕ GEMINI_KEY.</div>`;
            } finally {
                // Возвращаем кнопки в строй
                btns.forEach(b => b.disabled = false);
                status.innerText = "STATUS: READY_FOR_UPLINK";
            }
        }
    </script>
</body>
</html>
