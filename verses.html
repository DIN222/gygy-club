
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY: MATRIX v4.5.12</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        #matrix-slots { display: flex; gap: 8px; padding: 15px; background: #000; border-bottom: 1px solid #333; align-items: center; min-height: 50px; }
        .slot { min-width: 45px; height: 45px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666; cursor: pointer; transition: 0.3s; }
        .u-active { border-color: #fff; color: #fff; box-shadow: 0 0 10px #fff; }
        .ai-active { border-color: #00f2ff; color: #00f2ff; font-weight: bold; }
        .reset-btn { border-color: #ff0055; color: #ff0055; margin-left: auto; font-weight: bold; }
        #stream { height: calc(100vh - 160px); overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 10px; border-left: 3px solid #444; background: rgba(255,255,255,0.02); }
        .user { border-left-color: #fff; }
        .ai { border-left-color: #00f2ff; }
        .meta { font-size: 0.7em; opacity: 0.5; margin-bottom: 5px; display: block; }
        #ui { position: fixed; bottom: 0; width: 100%; padding: 20px; background: #000; border-top: 1px solid #333; display: flex; }
        #inp { background: #111; border: 1px solid #444; color: #fff; padding: 10px; width: 85%; outline: none; font-size: 16px; }
    </style>
</head>
<body>

<div id="matrix-slots"></div>
<div id="stream"></div>
<div id="ui"><input type="text" id="inp" placeholder="ВВЕДИТЕ СЛОВА..." autocomplete="off"></div>

<script>
    // 1. КОНФИГУРАЦИЯ БЕЗОПАСНОСТИ
    const part1 = "AIzaSyBFmETf-8mg5iM"; 
    const part2 = "Sjgg4rKNL_k3vwb-YGPE"; 
    const getKey = () => part1 + part2;

    function getGrokKey() {
        let savedKey = localStorage.getItem('GY_GY_GROK_KEY');
        if (!savedKey || savedKey === "null" || savedKey === "") {
            savedKey = prompt("ВВЕДИТЕ ВАШ xAI API KEY (ГРОК):", "");
            if (savedKey) {
                // Чистим от пробелов и кавычек сразу при вводе
                const cleanKey = savedKey.trim().replace(/["']/g, "");
                localStorage.setItem('GY_GY_GROK_KEY', cleanKey);
                return cleanKey;
            }
        }
        return savedKey;
    }

    // 2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    let count = 0;
    const total = 16;
    let poemContext = "";

    const AI_CONFIG = {
        'GEMINI': { color: '#00f2ff', delay: 0, style: 'КИБЕР-СЮРРЕАЛИЗМ' },
        'GROK':   { color: '#ccff00', delay: 4000, style: 'ДЕРЗКИЙ ТРЭШ' }
    };

    // 3. ИНИЦИАЛИЗАЦИЯ ИНТЕРФЕЙСА
    function init() {
        const m = document.getElementById('matrix-slots');
        m.innerHTML = "";
        
        // Рисуем аватарки пользователей
        for(let i=1; i<=10; i++) {
            m.innerHTML += `<div class="slot ${i===1?'u-active':''}">U${i}</div>`;
        }
        
        // Рисуем аватарки ботов
        ['GE', 'GR', 'CL', 'MI'].forEach(name => {
            const div = document.createElement('div');
            div.className = 'slot ai-active';
            div.innerText = name;
            div.onclick = () => aiPost(name === 'GE' ? 'GEMINI' : 'GROK');
            m.appendChild(div);
        });

        // КРАСНАЯ КНОПКА СБРОСА
        const reset = document.createElement('div');
        reset.className = 'slot reset-btn';
        reset.innerText = '[X]';
        reset.title = 'СБРОСИТЬ КЛЮЧИ';
        reset.onclick = () => { 
            if(confirm("ОЧИСТИТЬ ПАМЯТЬ КЛЮЧЕЙ?")) {
                localStorage.removeItem('GY_GY_GROK_KEY'); 
                location.reload(); 
            }
        };
        m.appendChild(reset);

        const input = document.getElementById('inp');
        input.focus();
        input.onkeypress = (e) => { if (e.key === 'Enter') userPost(); };
    }

    // 4. ЛОГИКА ПОСТОВ
    function userPost() {
        const input = document.getElementById('inp');
        const val = input.value.trim();
        if(!val || count >= total) return;
        
        addMessage('АВТОР', val, 'user');
        input.value = ""; 
        
        // Запуск автоматического цикла
        startCycle();
    }

    async function startCycle() {
        await aiPost('GEMINI');
        if (count < total) await aiPost('GROK');
    }

    async function aiPost(aiName) {
        if (count >= total) return;
        const config = AI_CONFIG[aiName] || { delay: 0, style: 'NEON' };
        
        await new Promise(r => setTimeout(r, config.delay));
        
        const tempId = 'ai-' + Date.now();
        addMessage(aiName, "СИНХРОНИЗАЦИЯ...", 'ai', tempId);

        const lines = poemContext.trim().split('\n').filter(Boolean);
        const lastLine = lines.length > 0 ? lines[lines.length - 1] : "БАР";
        
        let url, headers, body;
        
        if (aiName === 'GROK') {
            const key = getGrokKey();
            if(!key) { updateMsg(tempId, "НЕТ КЛЮЧА"); return; }
            url = "https://api.x.ai/v1/chat/completions";
            headers = { "Content-Type": "application/json", "Authorization": `Bearer ${key}` };
            body = JSON.stringify({ 
                model: "grok-2", 
                messages: [
                    { role: "system", content: "ОДНА СТРОКА КАПСОМ. РИФМА." }, 
                    { role: "user", content: `РИФМУЙ К: ${lastLine}` }
                ] 
            });
        } else {
            url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + getKey();
            headers = { "Content-Type": "application/json" };
            body = JSON.stringify({ 
                contents: [{ parts: [{ text: `ТЫ КИБЕР-ПОЭТ. ОДНА СТРОКА КАПСОМ. РИФМА К: ${lastLine}` }] }] 
            });
        }

        try {
            const response = await fetch(url, { method: "POST", headers, body });
            const data = await response.json();
            
            if (data.error) {
                updateMsg(tempId, "XAI ERROR: " + (data.error.message || "ОШИБКА"));
                return;
            }

            let result = "";
            if (aiName === 'GROK') {
                result = data.choices ? data.choices[0].message.content : "ПУСТО";
            } else {
                result = data.candidates ? data.candidates[0].content.parts[0].text : "ОШИБКА GE";
            }

            updateMsg(tempId, result.trim().toUpperCase());
        } catch (e) { 
            updateMsg(tempId, "СЕТЕВАЯ ОШИБКА"); 
        }
    }

    function addMessage(author, text, type, id) {
        count++;
        const s = document.getElementById('stream');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if(id) div.id = id;
        if(author === 'GROK') div.style.borderLeftColor = "#ccff00";
        div.innerHTML = `<span class="meta">@${author} [${count}/${total}]</span>${text.toUpperCase()}`;
        s.appendChild(div);
        s.scrollTop = s.scrollHeight;
        poemContext += text + "\n";
    }

    function updateMsg(id, text) {
        const m = document.getElementById(id);
        if(m) {
            const meta = m.querySelector('.meta').outerHTML;
            m.innerHTML = `${meta}${text}`;
            poemContext = poemContext.replace("СИНХРОНИЗАЦИЯ...", "") + text + "\n";
        }
    }

    window.onload = init;
</script>
</body>
</html>
