
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.3.5 Avatar</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; flex-shrink: 0; padding: 0 5px; box-sizing: border-box; }
        .btn-header { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: var(--border); color: var(--gold); background: none; cursor: pointer; text-decoration: none; flex-shrink: 0; font-size: 1.2rem; font-weight: bold; }

        .scroll-zone { flex-grow: 1; display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; }
        .scroll-zone::-webkit-scrollbar { display: none; }

        .item-fix { height: 44px; min-width: 60px; padding: 0 10px; border: var(--border); color: var(--gold); background: none; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; justify-content: center; white-space: nowrap; flex-shrink: 0; box-sizing: border-box; cursor: pointer; }

        /* АВАТАР ИИ (СФИНКС) */
        .avatar-ai { width: 44px; padding: 0; border-radius: 0; position: relative; overflow: hidden; }
        .avatar-ai svg { width: 30px; height: 30px; fill: var(--gold); }

        #google_translate_element { height: 44px; flex-shrink: 0; display: flex; align-items: center; border: var(--border); box-sizing: border-box; }
        .goog-te-gadget-simple { background: transparent !important; border: none !important; padding: 5px !important; display: flex !important; align-items: center; }
        .goog-te-gadget-simple span { color: var(--gold) !important; font-size: 0.8rem !important; }

        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px; border-left: 2px solid var(--gold); font-size: 1.2rem; background: rgba(255, 215, 0, 0.05); }
        .ai-msg { border-left-color: #fff; color: #fff; background: rgba(255, 255, 255, 0.05); }

        footer { height: 85px; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-top: 1px solid #333; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 14px; outline: none; font-size: 1rem; font-family: inherit; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); color: #000; border: none; font-size: 1.8rem; cursor: pointer; }

        .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="btn-header">«</a>
    <div class="scroll-zone">
        <div id="google_translate_element"></div>
        <button class="item-fix" onclick="alert('Архив Клуба')">СБОРНИК</button>
        <div class="item-fix">ID: 001</div>
        
        <div class="item-fix avatar-ai" onclick="aiTalk()" title="Вызвать ИИ">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-9h10v2H7z"/></svg>
        </div>
    </div>
    <div style="font-size: 0.8rem; padding: 0 10px;">GY-GY</div>
    <button class="btn-header" onclick="window.history.forward()">»</button>
</header>

<div id="chat-wall">
    <div class="msg"><b>[System]:</b> Тишина — это тоже код. Но аватар готов к диалогу.</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Четыре любых слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
</footer>

<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }

    const aiQuotes = [
        "Четыре слова? Или побоишься?",
        "Стихи — это яд. Ты готов принять дозу?",
        "Золото не блестит там, где нет тени.",
        "Тихо... Слышишь, как скрипит твой код?",
        "Я вижу твои мысли. Они квадратные."
    ];

    function aiTalk() {
        const wall = document.getElementById('chat-wall');
        const quote = aiQuotes[Math.floor(Math.random() * aiQuotes.length)];
        const m = document.createElement('div');
        m.className = 'msg ai-msg';
        m.innerHTML = `<b>[Gemini]:</b> ${quote}`;
        wall.appendChild(m);
        wall.scrollTop = wall.scrollHeight;
    }

    function send() {
        const input = document.getElementById('user-in');
        if(input.value.trim()){
            const m = document.createElement('div');
            m.className = 'msg';
            m.innerText = input.value;
            document.getElementById('chat-wall').appendChild(m);
            input.value = "";
            document.getElementById('chat-wall').scrollTop = 99999;
        }
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
