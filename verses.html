
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY v5.5: GOLDEN STUDIO</title>
    <style>
        :root { --gold: #ffcf00; --gold-dark: #b8860b; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
            padding: 5px 10px;
            background: #050505;
            height: 60px;
        }

        .nav-arrow { color: var(--gold); font-size: 28px; background: none; border: none; cursor: pointer; font-weight: bold; }
        
        .tools-scroll {
            display: flex;
            align-items: center;
            gap: 20px;
            overflow-x: auto;
            flex: 1;
            padding: 0 15px;
            scrollbar-width: none;
        }
        .tools-scroll::-webkit-scrollbar { display: none; }

        /* ИКОНКА ПЕРЕВОДА (Абракадабра) */
        .lang-icon {
            font-size: 20px;
            color: var(--gold);
            cursor: pointer;
            min-width: 30px;
            text-align: center;
        }

        .tool-item {
            color: var(--gold);
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
            cursor: pointer;
            letter-spacing: 2px;
            background: none;
            border: none;
        }

        .user-avatar {
            width: 32px; height: 32px;
            border: 1px solid var(--gold-dark);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: var(--gold); flex-shrink: 0;
        }

        /* ЗОНА ТЕКСТА */
        .studio-zone { flex: 1; overflow-y: auto; padding: 30px 20px; text-align: center; }
        .poem-paper { font-size: 24px; line-height: 1.6; color: #fff; font-style: italic; white-space: pre-wrap; transition: 0.5s; }
        
        /* ВВОД */
        .input-area { padding: 20px; background: #000; border-top: 1px solid #111; }
        textarea { width: 100%; background: none; border: none; border-bottom: 1px solid #333; color: #fff; text-align: center; font-size: 18px; padding: 10px; outline: none; }
        textarea:focus { border-bottom-color: var(--gold); }

        .btn-gold { color: var(--gold); background: none; border: none; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; width: 100%; letter-spacing: 4px; padding: 15px; }

        /* ЗНАК ТУПИКА */
        #road-sign {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 2px solid var(--gold); color: var(--gold);
            padding: 30px; display: none; z-index: 1000; text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="road-sign">⛔<br><br>ПРОЕЗД ЗАКРЫТ</div>

    <header class="control-panel">
        <button class="nav-arrow" onclick="goNav('back')">«</button>
        
        <div class="tools-scroll">
            <div class="lang-icon" onclick="triggerTranslate()" title="Перевести">文A</div>
            
            <div class="user-avatar" id="userIcon">ID</div>

            <button class="tool-item" id="publishBtn">В ЭФИР</button>
            <button class="tool-item" onclick="shareFriend()">SHARE</button>
            <button class="tool-item" id="clipBtn">КЛИП</button>
            
            <div class="tool-item" style="opacity:0.3;">GY-GY</div>
        </div>

        <button class="nav-arrow" onclick="goNav('forward')">»</button>
    </header>

    <div class="studio-zone">
        <div id="poemDisplay" class="poem-paper">...</div>
    </div>

    <div class="input-area" id="inputZone">
        <textarea id="poemInput" placeholder="ВАШ ИМПУЛЬС..."></textarea>
        <button class="btn-gold" id="addBtn">ДОБАВИТЬ</button>
    </div>

    <div id="google_translate_element" style="display:none;"></div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage:'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
        
        // Вызов перевода через нашу иконку
        function triggerTranslate() {
            const googCombo = document.querySelector('.goog-te-combo');
            if (googCombo) {
                alert("Выберите язык в появившемся меню");
                // Можно заставить его открыться или просто показать скрытый виджет
                document.getElementById('google_translate_element').style.display = 'block';
            } else {
                alert("Система перевода загружается...");
            }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let stanzas = [];

        // Аватар
        window.onload = () => {
            let id = localStorage.getItem('gy_id') || 'ID-' + Math.floor(Math.random()*999);
            localStorage.setItem('gy_id', id);
            document.getElementById('userIcon').innerText = id;
        };

        // Навигация
        function goNav(dir) {
            const sign = document.getElementById('road-sign');
            sign.style.display = 'block';
            setTimeout(() => { sign.style.display = 'none'; }, 1200);
        }

        // Добавление строк
        document.getElementById('addBtn').onclick = () => {
            const inp = document.getElementById('poemInput');
            if(inp.value.trim()) {
                stanzas.push(inp.value.trim());
                inp.value = "";
                document.getElementById('poemDisplay').innerText = stanzas.join('\n\n');
            }
        };

        function shareFriend() {
            window.open(`https://t.me/share/url?url=GY-GY&text=${encodeURIComponent(stanzas.join('\n\n'))}`);
        }
    </script>
</body>
</html>
