<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v16.0.2 FINAL</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .nav-btn { width: 55px; height: 45px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 2px 2px 0 var(--gold); }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: 5px; position: absolute; left: 50%; transform: translateX(-50%); }
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #000; }
        .msg { padding: 15px; max-width: 85%; font-size: 1.1rem; border: 1px solid #333; }
        .u { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255,215,0,0.05); }
        .a { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }
        footer { height: 100px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 18px; font-size: 1.1rem; outline: none; }
        .go-btn { width: 65px; height: 65px; background: var(--gold); border: none; font-size: 2.5rem; cursor: pointer; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.href='ai_room_core_v8.html'">EXIT</div>
    <div class="logo">GY-GY</div>
    <div class="nav-btn">RU</div>
</header>

<div id="wall">
    <div class="msg a">v16.0.0. Больше никаких оправданий. Либо ИИ шутит, либо мы признаем, что ключ мертв. Пиши.</div>
</div>

<footer>
    <input type="text" id="in" placeholder="Слова..." onkeydown="if(event.key==='Enter') execute()">
    <button id="run" class="go-btn" onclick="execute()">↑</button>
</footer>
<script>
    async function execute() {
        const i = document.getElementById('in');
        const b = document.getElementById('run');
        const v = i.value.trim();
        if (!v || b.disabled) return;
        
        b.disabled = true;
        push(v, false);
        i.value = "";

        const key = (typeof BEUVRY_CONFIG !== 'undefined' ? (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim() : "");
        
        // ИСПОЛЬЗУЕМ МОДЕЛЬ ИЗ ТВОЕГО СПИСКА (v3 Flash Preview)
        const model = "gemini-3-flash-preview";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;

        try {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ 
    contents: [{ parts: [{ text: "Ты — добродушно-насмешливый поэт. Твой стиль: ирония, умение подмечать забавное и несуразное в жизни. Избегай мрачности и депрессии. Напиши 4 строки веселого, подтрунивающего стиха на слова: " + v }] }] 
})
            });

            const d = await r.json();

            if (d.candidates && d.candidates[0].content) {
                // ВОТ ОН, ТОТ САМЫЙ МОМЕНТ!
                push(d.candidates[0].content.parts[0].text, true);
            } else if (d.error) {
                push("❌ ОШИБКА: " + d.error.message, true);
            }
        } catch (e) {
            push("❌ СБОЙ СЕТИ: Проверь соединение.", true);
        }
        b.disabled = false;
        i.focus();
    }

    function push(t, isAi) {
        const w = document.getElementById('wall');
        const d = document.createElement('div');
        d.className = `msg ${isAi ? 'a' : 'u'}`;
        d.innerHTML = t.replace(/\n/g, '<br>');
        w.appendChild(d);
        w.scrollTop = w.scrollHeight;
    }
</script>

</body>
</html>
