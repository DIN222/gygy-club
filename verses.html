
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.2.0</title>
    <style>
        :root {
            --orange-neon: #ff8c00;
            --gold: #ffd700;
            --bg: #000;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ v5.2.0 --- */
        header {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid var(--gold);
            background: #000;
            flex-shrink: 0;
            z-index: 1000;
        }

        .panel-group { display: flex; gap: 8px; align-items: center; }

        .panel-item {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            border: 1px solid var(--gold);
            color: var(--gold);
            background: none;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
            outline: none;
        }

        .nav-arrow { width: 45px; font-size: 1.5rem; }
        
        /* Фирменная иконка 文A */
        .lang-trigger { 
            width: 50px; 
            font-size: 1.2rem; 
            color: var(--orange-neon); 
            border-color: var(--orange-neon);
        }

        .archive-btn { padding: 0 12px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .logo-item { width: 65px; font-size: 0.9rem; border-color: var(--gold); color: var(--gold); }

        /* --- КАСТОМНОЕ МЕНЮ ЯЗЫКОВ --- */
        #lang-menu {
            position: absolute;
            top: 60px;
            left: 63px; 
            background: #000;
            border: 1px solid var(--orange-neon);
            display: none;
            flex-direction: column;
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .lang-option {
            padding: 12px 25px;
            color: var(--gold);
            cursor: pointer;
            border-bottom: 1px solid #222;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: 0.2s;
        }
        .lang-option:hover { background: var(--orange-neon); color: #000; }

        /* --- ПОЛЕ ЧАТА --- */
        #chat-wall {
            flex-grow: 1; 
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 8px 15px;
            border-left: 2px solid var(--orange-neon);
            color: var(--gold);
            font-size: 1.2rem;
            word-wrap: break-word;
        }

        /* --- НИЖНЯЯ СТРОКА ВВОДА --- */
        footer {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            border-top: 1px solid #222;
            flex-shrink: 0;
        }

        #user-input {
            flex-grow: 1; background: #000; border: 1px solid #333;
            color: #fff; padding: 15px; outline: none; font-size: 1rem;
        }

        #send-btn {
            background: var(--orange-neon); color: #000;
            border: none; padding: 15px 20px; font-weight: bold; cursor: pointer;
            text-transform: uppercase;
        }

        /* Скрытие Google-стандарта */
        .goog-te-banner-frame, #google_translate_element { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

<header>
    <div class="panel-group">
        <a href="ai_room_core_v8.html" class="panel-item nav-arrow">«</a>
        
        <button class="panel-item lang-trigger" onclick="toggleLangMenu()">文A</button>

        <button class="panel-item archive-btn" onclick="openArchive()">Сборник</button>
    </div>
    
    <div class="panel-group">
        <div class="panel-item logo-item">GY-GY</div>
        <button class="panel-item nav-arrow" onclick="window.history.forward()">»</button>
    </div>
</header>

<div id="lang-menu">
    <div class="lang-option" onclick="setLanguage('ru')">Русский</div>
    <div class="lang-option" onclick="setLanguage('en')">English</div>
    <div class="lang-option" onclick="setLanguage('de')">Deutsch</div>
    <div class="lang-option" onclick="setLanguage('fr')">Français</div>
    <div class="lang-option" onclick="setLanguage('zh-CN')">简体中文</div>
</div>

<div id="chat-wall">
    <div class="message">Айсберг дно приехал кот,</div>
    <div class="message">Кресло помнит тех, кто не вернулся...</div>
</div>

<footer>
    <input type="text" id="user-input" placeholder="Введите текст..." onkeypress="if(event.key==='Enter') pushMsg()">
    <button id="send-btn" onclick="pushMsg()">В ПЕЧАТЬ</button>
</footer>

<div id="google_translate_element"></div>

<script>
    function pushMsg() {
        const input = document.getElementById('user-input');
        const wall = document.getElementById('chat-wall');
        if(input.value.trim() !== "") {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerText = input.value;
            wall.appendChild(msg);
            input.value = "";
            wall.scrollTop = wall.scrollHeight;
        }
    }

    function toggleLangMenu() {
        const menu = document.getElementById('lang-menu');
        menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    function setLanguage(langCode) {
        const select = document.querySelector('select.goog-te-combo');
        if (select) {
            select.value = langCode;
            select.dispatchEvent(new Event('change'));
        }
        toggleLangMenu();
    }

    function openArchive() {
        const messages = document.querySelectorAll('.message').length;
        alert("В Сборнике зафиксировано " + messages + " строк абсурда.");
    }

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
