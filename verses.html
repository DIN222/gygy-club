<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v9.0.0 HYBRID</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; box-sizing: border-box; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .nav-btn { width: 50px; height: 45px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.75rem; box-shadow: 2px 2px 0 var(--gold); }
        .logo-gy { font-weight: 900; font-size: 1.6rem; letter-spacing: 5px; position: absolute; left: 50%; transform: translateX(-50%); }
        
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(circle, #121212 0%, #000 100%); }
        .msg { padding: 15px; max-width: 85%; font-size: 1.1rem; border: 1px solid #333; position: relative; line-height: 1.4; }
        .u { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255, 215, 0, 0.05); color: #fff; }
        .a { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255, 255, 255, 0.05); text-align: right; }

        footer { height: 100px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 18px; outline: none; font-size: 1.1rem; }
        .btn-go { width: 65px; height: 65px; background: var(--gold); border: none; font-size: 2.5rem; cursor: pointer; color: #000; font-weight: bold; transition: 0.2s; }
        .btn-go:active { transform: scale(0.9); background: #fff; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.reload()">REF</div>
    <div class="logo-gy">GY-GY</div>
    <div style="display:flex; gap:10px;">
        <div class="nav-btn" onclick="alert('BOX: Хранилище стихов')">BOX</div>
        <div class="nav-btn">RU</div>
    </div>
</header>

<div id="wall">
    <div class="msg a">v9.0.0 "Офлайн-Щит". <br>Если Google молчит из-за санкций — я отвечу сам. Жги слова!</div>
</div>

<footer>
    <input type="text" id="in" placeholder="Пиши здесь..." onkeydown="if(event.key==='Enter') doSend()">
    <button id="go" class="btn-go" onclick="doSend()">↑</button>
</footer>

<script>
    // Наша база данных цинизма (Офлайн-режим)
    const BEUVRY_BRAIN = [
        "Твои слова — пустой вокзал,\nТы зря на кнопки нажимал.\nНуар снаружи, мрак внутри,\nНа этот код во все глаза смотри.",
        "Призрак кошки, стакан пустой,\nБеври сегодня явно не твой.\nСуета рассвета, в коде изъян,\nТы здесь актер, а не капитан.",
        "Вечер, бутылка, пьяный поэт,\nВ твоих запросах логики нет.\nGoogle закрылся, VPN — в кусты,\nОстались только я и ты.",
        "Завел простор, заел мотор,\nТехнический в чате идет террор.\nТихо быть — значит просто ждать,\nПока я буду этот код ломать."
    ];

    function push(txt, isAi) {
        const wall = document.getElementById('wall');
        const d = document.createElement('div');
        d.className = `msg ${isAi ? 'a' : 'u'}`;
        d.innerHTML = txt.replace(/\n/g, '<br>');
        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }

    async function callAI(text) {
        const key = (typeof BEUVRY_CONFIG !== 'undefined' ? (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim() : "");
        
        // Попытка №1: Стучимся в Google
        if (key && key.length > 20) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Ты — едкий поэт-комик. 4 строки жесткой ироничной рифмы на слова: " + text }] }] })
                });
                const d = await r.json();
                if (d.candidates) return d.candidates[0].content.parts[0].text;
            } catch (e) { console.warn("Google Blocked or Network Error"); }
        }

        // Попытка №2: Если Google молчит — выдаем свой шедевр
        const randomRhyme = BEUVRY_BRAIN[Math.floor(Math.random() * BEUVRY_BRAIN.length)];
        return "<i>(Автономный модуль Беври)</i>\n" + randomRhyme;
    }

    async function doSend() {
        const i = document.getElementById('in');
        const b = document.getElementById('go');
        const val = i.value.trim();

        if (!val || b.disabled) return;

        b.disabled = true;
        push(val, false);
        i.value = "";

        const res = await callAI(val);
        push(res, true);

        b.disabled = false;
        i.focus();
    }
</script>
</body>
</html>
