
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES v5.4.7</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; flex-shrink: 0; padding: 0 5px; justify-content: space-between; }
        .btn-header { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: var(--border); color: var(--gold); background: none; cursor: pointer; font-size: 1.5rem; }

        .scroll-zone { display: flex; align-items: center; gap: 5px; overflow-x: auto; scrollbar-width: none; margin: 0 5px; }
        .item-fix { height: 40px; padding: 0 10px; border: var(--border); color: var(--gold); background: none; font-size: 0.7rem; font-weight: bold; white-space: nowrap; cursor: pointer; }

        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 10px; max-width: 85%; font-size: 1.1rem; border-radius: 4px; line-height: 1.3; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; color: #fff; background: rgba(255, 255, 255, 0.1); text-align: right; font-style: italic; }

        footer { height: 70px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: 1px solid #333; background: #000; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 12px; outline: none; font-size: 1rem; }
        .btn-up { width: 45px; height: 45px; background: var(--gold); color: #000; border: none; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <button class="btn-header" onclick="window.history.back()">«</button>
    <div class="scroll-zone">
        <button class="item-fix" onclick="alert('Saved')">В СБОРНИК</button>
        <div class="item-fix">ID: 001</div>
        <button class="item-fix" onclick="aiAction('Проверка системы')">AI-TEST</button>
    </div>
    <div style="font-weight: 900; font-size: 0.9rem;">GY-GY</div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">Система v5.4.7 готова. Вводи 4 слова.</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
</footer>

<script>
    // Твой ключ, разбитый на две части
    const P_ONE = "AIzaSyDLQrvoPx4A";
    const P_TWO = "YyfSKD0BWvl3-zc2ROfCa-E";

    async function aiAction(text) {
        const wall = document.getElementById('chat-wall');
        const m = document.createElement('div');
        m.className = 'msg ai-msg';
        m.innerHTML = "<i>Думаю...</i>";
        wall.appendChild(m);
        wall.scrollTop = wall.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${P_ONE + P_TWO}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Ты нуарный поэт. Напиши 4 короткие строчки рифмой на русском языке на эти слова: " + text }] }]
                })
            });
            const data = await response.json();
            if (data.candidates && data.candidates[0]) {
                m.innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            } else {
                m.innerHTML = "Ошибка: Ответ пуст.";
            }
        } catch (e) {
            m.innerHTML = "Ошибка: Стык ключа не удался. Проверь интернет.";
        }
        wall.scrollTop = wall.scrollHeight;
    }

    function send() {
        const input = document.getElementById('user-in');
        if(input.value.trim()){
            const wall = document.getElementById('chat-wall');
            const m = document.createElement('div');
            m.className = 'msg user-msg';
            m.innerText = input.value;
            wall.appendChild(m);
            aiAction(input.value);
            input.value = "";
        }
    }
</script>
</body>
</html>
