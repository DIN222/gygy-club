
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY CLUB v8.0</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html { 
            width: 100%; height: 100%; background: var(--bg); color: var(--gold); 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* HEADER — СИСТЕМА ПЕРЕХОДОВ */
        header { 
            height: 75px; display: flex; align-items: center; justify-content: space-between; 
            border-bottom: var(--border); padding: 0 15px; flex-shrink: 0; 
        }
        .logo-gy { font-size: 1.3rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

        /* СТРЕЛКИ — ТЕПЕРЬ ЭТО ССЫЛКИ */
        .nav-link { 
            width: 50px; height: 50px; border: var(--border); 
            display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: var(--gold); font-size: 1.6rem; font-weight: 900;
            background: #111;
        }

        /* WALL */
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .v-card { border: 1px solid #444; background: #000; padding: 15px; border-left: 5px solid var(--gold); }
        .v-text { font-size: 1.25rem; color: #fff; margin: 10px 0; outline: none; white-space: pre-wrap; line-height: 1.4; }

        .v-ctrl { display: flex; gap: 8px; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
        .v-btn { background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 10px; cursor: pointer; flex: 1; font-weight: 900; font-size: 0.8rem; }

        /* FOOTER (100PX) */
        footer { 
            height: 100px; display: flex; align-items: center; 
            padding: 0 15px; gap: 10px; border-top: var(--border); flex-shrink: 0; 
        }

        /* ИСПРАВЛЕННЫЙ СКРОЛЛ СТИЛЕЙ */
        #s-box { 
            width: 130px; height: 60px; border: 1px solid var(--gold); 
            overflow-x: scroll; display: flex; align-items: center; 
            scroll-snap-type: x mandatory; background: #111; flex-shrink: 0;
            scrollbar-width: none;
        }
        #s-box::-webkit-scrollbar { display: none; }
        
        .s-opt { 
            min-width: 100%; height: 100%; display: flex; 
            align-items: center; justify-content: center; 
            scroll-snap-align: center; font-size: 0.65rem; font-weight: 900; 
            color: var(--gold); text-align: center; padding: 0 5px;
            white-space: normal; line-height: 1.1; flex-shrink: 0;
        }

        #in { flex-grow: 1; height: 60px; background: #000; border: 1px solid #444; color: var(--gold); padding: 0 15px; font-size: 1.1rem; outline: none; }
        .btn-ok { height: 60px; padding: 0 25px; background: var(--gold); color: #000; border: none; font-weight: 900; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="nav-link">&#10094;</a>
    <div class="logo-gy">GY-GY CLUB</div>
    <a href="box_page.html" class="nav-link">&#10095;</a>
</header>

<main id="wall"></main>

<footer>
    <div id="s-box" onscroll="syncStyle()">
        <div class="s-opt">🚀 ШИЗА-ЛЮКС</div>
        <div class="s-opt">🍗 ПРОЖАРКА</div>
        <div class="s-opt">🕺 ДИСКО-ПАНИКА</div>
        <div class="s-opt">👵 БАБУШКА-ХАКЕР</div>
        <div class="s-opt">🛸 ЗОНА 51</div>
        <div class="s-opt">🎩 ЛОРД-АБСУРД</div>
        <div class="s-opt">🧪 КИБЕР-ГОГОЛЬ</div>
        <div class="s-opt">🧟‍♂️ ТРЭШ-ОПТИМИЗМ</div>
        <div class="s-opt">§ БЫТ</div>
    </div>
    <input type="text" id="in" placeholder="Введите текст...">
    <button class="btn-ok" onclick="addCard()">ОК</button>
</footer>

<script>
    let activeStyle = "🚀 ШИЗА-ЛЮКС";
    const sBox = document.getElementById('s-box');

    function syncStyle() {
        const index = Math.round(sBox.scrollLeft / sBox.offsetWidth);
        if (sBox.children[index]) {
            activeStyle = sBox.children[index].innerText;
        }
    }

    function addCard() {
        const input = document.getElementById('in');
        const wall = document.getElementById('wall');
        const val = input.value.trim();
        if(!val) return;

        const card = document.createElement('div');
        card.className = 'v-card';
        card.innerHTML = `
            <div style="font-size:0.7rem; color:#666;">#${val} | ${activeStyle}</div>
            <div class="v-text" contenteditable="true">V8.0 Connected...</div>
            <div class="v-ctrl">
                <button class="v-btn" onclick="copyText(this)">КЛИП</button>
                <button class="v-btn" onclick="translateText(this)">ПЕРЕВЕСТИ</button>
                <button class="v-btn" onclick="this.closest('.v-card').remove()">🗑</button>
            </div>
        `;
        wall.prepend(card);
        input.value = '';
    }

    function copyText(btn) {
        const txt = btn.closest('.v-card').querySelector('.v-text').innerText;
        navigator.clipboard.writeText(txt);
        btn.innerText = "OK";
        setTimeout(() => btn.innerText = "КЛИП", 1000);
    }

    function translateText(btn) {
        const txt = btn.closest('.v-card').querySelector('.v-text').innerText;
        window.open(`https://translate.google.com/?text=${encodeURIComponent(txt)}`, '_blank');
    }

    document.getElementById('in').onkeydown = (e) => { if(e.key==='Enter') addCard(); };
</script>
</body>
</html>
