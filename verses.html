<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v37.3.2 Engineering</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        header { height: 60px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 10px; gap: 10px; flex-shrink: 0; }
        .btn-nav { width: 40px; height: 40px; border: var(--border); display: flex; align-items: center; justify-content: center; color: var(--gold); text-decoration: none; font-size: 1.5rem; }
        
        .scroll-zone { flex-grow: 1; display: flex; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .icon-box { width: 40px; height: 40px; border: var(--border); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1.2rem; }

        /* ОКНО ЧАТА */
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        .verse-block { border: 1px solid #333; background: #050505; padding: 15px; position: relative; }
        .verse-text { font-size: 1.2rem; line-height: 1.4; margin-bottom: 10px; color: #eee; }
        .verse-controls { display: flex; gap: 10px; border-top: 1px solid #222; padding-top: 10px; }
        .v-btn { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 5px 10px; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
        .v-btn:hover { background: var(--gold); color: #000; }

        /* НИЖНЯЯ ПАНЕЛЬ */
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-top: var(--border); background: #000; position: relative; }
        
        /* ВИД ЮМОРА (ВЫПАДАЮЩЕЕ МЕНЮ) */
        .humor-selector { position: relative; }
        .humor-btn { width: 45px; height: 45px; border: var(--border); background: none; color: var(--gold); font-size: 1.2rem; cursor: pointer; }
        .humor-menu { display: none; position: absolute; bottom: 55px; left: 0; background: #000; border: var(--border); z-index: 100; flex-direction: column; }
        .humor-menu button { background: none; border: none; color: var(--gold); padding: 10px; text-align: left; white-space: nowrap; cursor: pointer; width: 150px; border-bottom: 1px solid #222; }
        .humor-menu button:hover { background: var(--gold); color: #000; }

        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 12px; font-size: 1rem; outline: none; }
        .btn-ok { width: 60px; height: 45px; background: var(--gold); color: #000; border: none; font-weight: 900; cursor: pointer; }

        .user-request { color: #888; font-size: 0.9rem; margin-bottom: 5px; }
    </style>
</head>
<body>

<header>
    <a href="verses.html" class="btn-nav">«</a>
    <div class="scroll-zone">
        <div id="google_translate_element"></div>
        <a href="library.html" class="icon-box" title="Сборник">📁</a>
        <div class="item-fix" style="border: var(--border); padding: 8px; font-size: 0.7rem;">ID: 001</div>
    </div>
    <div style="font-weight: 900; letter-spacing: 1px;">GY-GY</div>
</header>

<div id="chat-wall">
    </div>

<footer>
    <div class="humor-selector">
        <button class="humor-btn" onclick="toggleHumor()">▲</button>
        <div id="humor-menu" class="humor-menu">
            <button onclick="setHumor('Черный нуар')">ЧЕРНЫЙ НУАР</button>
            <button onclick="setHumor('Сарказм')">САРКАЗМ</button>
            <button onclick="setHumor('Ирония')">ИРОНИЯ</button>
            <button onclick="setHumor('Цинизм')">ЦИНИЗМ</button>
        </div>
    </div>
    <input type="text" id="user-in" placeholder="Слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-ok" onclick="send()">ОК</button>
</footer>

<script>
    let currentHumor = "Черный нуар";

    function toggleHumor() {
        const menu = document.getElementById('humor-menu');
        menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function setHumor(type) {
        currentHumor = type;
        toggleHumor();
        alert("Режим: " + type);
    }

    async function aiAction(text) {
        const wall = document.getElementById('chat-wall');
        const block = document.createElement('div');
        block.className = 'verse-block';
        block.innerHTML = `<div class="user-request">Вы: ${text} (${currentHumor})</div><div class="verse-text"><i>Генерация...</i></div>`;
        wall.appendChild(block);
        wall.scrollTop = wall.scrollHeight;

        const _K = "AIzaSyDLQrvoPx4A" + "YyfSKD0BWvl3-zc2ROfCa-E";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${_K}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Ты нуарный поэт. Режим юмора: ${currentHumor}. Напиши 4 строки рифмой на русском: ${text}` }] }]
                })
            });
            const data = await response.json();
            const verse = data.candidates[0].content.parts[0].text;
            
            block.innerHTML = `
                <div class="user-request">Вы: ${text} (${currentHumor})</div>
                <div class="verse-text">${verse.replace(/\n/g, '<br>')}</div>
                <div class="verse-controls">
                    <button class="v-btn" onclick="alert('Сохранено в библиотеку')">Сохранить</button>
                    <button class="v-btn" onclick="this.parentElement.parentElement.remove()">Удалить</button>
                </div>
            `;
        } catch (e) {
            block.innerHTML = "Ошибка связи.";
        }
        wall.scrollTop = wall.scrollHeight;
    }

    function send() {
        const input = document.getElementById('user-in');
        if(input.value.trim()){
            aiAction(input.value);
            input.value = "";
        }
    }

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
