
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.3.3</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
        header { 
            height: 60px; display: flex; align-items: center; 
            border-bottom: var(--border); background: #000; flex-shrink: 0; 
        }

        /* Квадратные кнопки-якоря одинакового размера */
        .btn-square {
            width: 50px; height: 50px; 
            display: flex; align-items: center; justify-content: center; 
            border: var(--border); color: var(--gold); 
            background: none; cursor: pointer; text-decoration: none;
            flex-shrink: 0; margin: 0 5px; font-size: 1.2rem; font-weight: bold;
        }

        .scroll-container { 
            flex-grow: 1; display: flex; align-items: center; 
            gap: 8px; overflow-x: auto; padding: 0 5px; 
            scrollbar-width: none; 
        }
        .scroll-container::-webkit-scrollbar { display: none; }

        /* Элементы внутри скролла тоже приводим к общему знаменателю */
        .panel-item {
            height: 40px; min-width: 50px; padding: 0 10px;
            border: var(--border); color: var(--gold);
            background: none; font-size: 0.7rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap; flex-shrink: 0;
        }

        /* Google Translate - прячем текст, оставляем только Dropdown */
        #google_translate_element { height: 40px; overflow: hidden; border: var(--border); }
        .goog-te-gadget-simple { 
            background: transparent !important; border: none !important; 
            padding: 8px !important; height: 100%; display: flex !important; align-items: center;
        }
        .goog-te-gadget-simple span { color: var(--gold) !important; font-size: 0.8rem !important; }

        .logo-box { border: none; font-size: 0.8rem; padding: 0 10px; }

        /* --- ЧАТ --- */
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px; border-left: 2px solid var(--gold); font-size: 1.1rem; line-height: 1.4; }

        /* --- НИЖНЯЯ ПАНЕЛЬ --- */
        footer { height: 85px; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-top: 1px solid #222; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 14px; outline: none; font-size: 1rem; }
        .footer-btn { height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-up { width: 48px; background: var(--gold); color: #000; border: none; font-size: 1.5rem; }
        .btn-arch { background: none; color: var(--gold); border: var(--border); padding: 0 15px; font-size: 0.7rem; text-transform: uppercase; }

        .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="btn-square">«</a>

    <div class="scroll-container">
        <div id="google_translate_element"></div>
        
        <button class="panel-item" onclick="alert('Архив')">СБОРНИК</button>
        <div class="panel-item">ID:001</div>
        <div class="panel-item">AVATAR</div>
    </div>

    <div class="logo-box">GY-GY</div>
    <button class="btn-square" onclick="window.history.forward()">»</button>
</header>

<div id="chat-wall">
    <div class="msg">Геометрия выровнена. Жду контент.</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Четыре любых слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="footer-btn btn-up" onclick="send()">↑</button>
    <button class="footer-btn btn-arch" onclick="alert('В Сборнике')">В СБОРНИК</button>
</footer>

<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ru',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }

    function send() {
        const input = document.getElementById('user-in');
        if(input.value.trim()){
            const m = document.createElement('div');
            m.className = 'msg';
            m.innerText = input.value;
            document.getElementById('chat-wall').appendChild(m);
            input.value = "";
            document.getElementById('chat-wall').scrollTop = 99999;
        }
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
