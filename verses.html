<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v8.0.0 VIP</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; box-sizing: border-box; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .nav-btn { width: 50px; height: 45px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.75rem; box-shadow: 2px 2px 0 var(--gold); }
        .logo-gy { font-weight: 900; font-size: 1.6rem; letter-spacing: 5px; position: absolute; left: 50%; transform: translateX(-50%); cursor: pointer; }
        
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(circle, #151515 0%, #000 100%); }
        .msg { padding: 15px; max-width: 85%; font-size: 1.1rem; border: 1px solid #333; position: relative; line-height: 1.4; }
        .u { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255, 215, 0, 0.05); color: #fff; }
        .a { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255, 255, 255, 0.05); text-align: right; }

        .opt { cursor: pointer; font-size: 1.5rem; margin-top: 10px; opacity: 0.5; transition: 0.3s; }
        .opt:hover { opacity: 1; color: var(--gold); }

        footer { height: 100px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 18px; outline: none; font-size: 1.1rem; }
        .btn-go { width: 65px; height: 65px; background: var(--gold); border: none; font-size: 2.5rem; cursor: pointer; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.reload()">REF</div>
    <div class="logo-gy">GY-GY</div>
    <div style="display:flex; gap:10px;">
        <div class="nav-btn" onclick="alert('BOX v2.0 в разработке...')">BOX</div>
        <div class="nav-btn">RU</div>
    </div>
</header>

<div id="wall">
    <div class="msg a">v8.0.0 "VIP Guest" запущена. <br>Google кивнул, Беври налил. Жду твои 4 слова для обстрела.</div>
</div>

<footer>
    <input type="text" id="in" placeholder="Пиши, шеф..." onkeydown="if(event.key==='Enter') doSend()">
    <button id="go" class="btn-go" onclick="doSend()">↑</button>
</footer>

<script>
    const API_VERSIONS = ['v1beta', 'v1'];
    const MODELS = ['gemini-1.5-flash', 'gemini-pro', 'gemini-2.0-flash-exp'];

    function push(txt, isAi) {
        const wall = document.getElementById('wall');
        const d = document.createElement('div');
        d.className = `msg ${isAi ? 'a' : 'u'}`;
        d.innerHTML = txt.replace(/\n/g, '<br>');
        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }

    async function callGoogle(text) {
        if (typeof BEUVRY_CONFIG === 'undefined') return "❌ Ошибка: config.js не найден.";
        const key = (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim();
        
        for (let ver of API_VERSIONS) {
            for (let mod of MODELS) {
                try {
                    const url = `https://generativelanguage.googleapis.com/${ver}/models/${mod}:generateContent?key=${key}`;
                    const r = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "Ты — едкий нуарный комик. Твоя задача: высмеять ситуацию, используя иронию и сарказм. Напиши 4 строки жесткой рифмы на слова: " + text }] }]
                        })
                    });
                    const d = await r.json();
                    if (d.candidates && d.candidates[0].content) return d.candidates[0].content.parts[0].text;
                } catch (e) { console.warn(`Skip ${mod} on ${ver}`); }
            }
        }
        return "❌ Все модели в ауте. Даже VIP-статус не помог. Проверь VPN.";
    }

    async function doSend() {
        const i = document.getElementById('in');
        const b = document.getElementById('go');
        if (!i.value.trim() || b.disabled) return;
        
        b.disabled = true;
        push(i.value, false);
        const res = await callGoogle(i.value);
        push(res, true);
        
        i.value = ""; b.disabled = false; i.focus();
    }
</script>
</body>
</html>
