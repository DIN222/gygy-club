
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY v6.2: THE ORIGIN</title>
    <style>
        :root { --gold: #ffcf00; --gold-dark: #b8860b; --orange: #ff8c00; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ПАНЕЛЬ ИНСТРУМЕНТОВ */
        header { border-bottom: 2px solid var(--gold); padding: 5px 10px; background: #050505; display: flex; align-items: center; gap: 10px; }
        .btn-nav { background: none; border: 1px solid var(--gold-dark); color: var(--gold); padding: 5px 10px; cursor: pointer; font-weight: bold; }
        .tools-row { display: flex; align-items: center; gap: 15px; flex: 1; overflow-x: auto; scrollbar-width: none; }
        .tools-row::-webkit-scrollbar { display: none; }
        .tool-link { color: var(--gold); font-size: 11px; text-transform: uppercase; cursor: pointer; font-weight: bold; background: none; border: none; white-space: nowrap; }
        #google_translate_element { min-width: 40px; height: 20px; overflow: hidden; }

        /* ИНТЕРЬЕР AI ROOM */
        #ai-room { flex: 1; display: flex; align-items: center; justify-content: center; gap: 40px; background: radial-gradient(circle at center, #111, #000); }
        .neon-screen { 
            width: 140px; height: 200px; border: 1px solid #222; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--orange); font-weight: 900; font-size: 20px;
            text-shadow: 0 0 10px var(--orange); cursor: pointer; letter-spacing: 3px;
        }

        /* СТУДИЯ СТИХОВ (Изначально скрыта) */
        #studio { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .studio-zone { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .line { border-left: 3px solid var(--gold); padding-left: 15px; font-style: italic; color: #ddd; font-size: 18px; line-height: 1.4; }
        .user-line { border-left: none; border-right: 3px solid #444; text-align: right; color: #888; }
        
        .input-zone { padding: 15px; background: #080808; border-top: 1px solid #222; }
        .input-bar { display: flex; gap: 10px; }
        input { flex: 1; background: #111; border: 1px solid var(--gold-dark); color: #fff; padding: 12px; outline: none; }
        .btn-ok { background: var(--gold); color: #000; font-weight: bold; border: none; padding: 0 25px; cursor: pointer; }

        #road-sign { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid var(--gold); background: #000; color: var(--gold); padding: 20px; display: none; z-index: 100; text-align: center; }
    </style>
</head>
<body>

    <div id="road-sign">⛔ ТУПИК</div>

    <header>
        <button class="btn-nav" onclick="goBack()">«</button>
        <div class="tools-row">
            <div id="google_translate_element"></div>
            <div id="userID" style="color:var(--gold-dark); font-size:10px;">ID-000</div>
            <button class="tool-link" onclick="publish()">В ЭФИР</button>
            <button class="tool-link" onclick="share()">SHARE</button>
            <button class="tool-link" id="clipBtn" style="display:none; color:#fff;">КЛИП</button>
        </div>
        <div style="color: var(--gold); font-weight: bold; letter-spacing: 2px;">GY-GY</div>
        <button class="btn-nav" onclick="showSign()">»</button>
    </header>

    <div id="ai-room">
        <div class="neon-screen" onclick="enterStudio()">VERSES</div>
        <div class="neon-screen" style="opacity:0.2">TECHPARK</div>
    </div>

    <div id="studio">
        <div class="studio-zone" id="chat">
            <div class="line">Кресло ждет. Начни первый куплет...</div>
        </div>
        <div class="input-zone">
            <div class="input-bar">
                <input type="text" id="poemInput" placeholder="Введите строку..." autocomplete="off">
                <button class="btn-ok" id="addBtn">OK</button>
            </div>
            <div style="color:var(--gold-dark); font-size:10px; margin-top:5px;" id="counter">Куплетов: 0 / 4</div>
        </div>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage:'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let stanzas = [];
        const maxStanzas = 4;

        function enterStudio() {
            document.getElementById('ai-room').style.display = 'none';
            document.getElementById('studio').style.display = 'flex';
        }

        function goBack() {
            if (document.getElementById('studio').style.display === 'flex') {
                document.getElementById('studio').style.display = 'none';
                document.getElementById('ai-room').style.display = 'flex';
            }
        }

        function showSign() {
            const s = document.getElementById('road-sign');
            s.style.display = 'block';
            setTimeout(() => s.style.display = 'none', 1200);
        }

        // ЛОГИКА СОАВТОРСТВА
        document.getElementById('addBtn').onclick = () => {
            const input = document.getElementById('poemInput');
            const chat = document.getElementById('chat');
            const val = input.value.trim();

            if (val && stanzas.length < maxStanzas) {
                // Твоя строка
                addMsg(val, 'user-line');
                stanzas.push(val);
                input.value = "";

                // Моя рифма
                setTimeout(() => {
                    let reply = "Абсурд принят... Что дальше?";
                    let lowerVal = val.toLowerCase();
                    if (lowerVal.includes('айсберг') || lowerVal.includes('кот')) {
                        reply = "Кот приехал — айсберг в рот.";
                    } else if (lowerVal.includes('дно')) {
                        reply = "На дне коту тепло и темно.";
                    }
                    addMsg(reply, '');
                    updateUI();
                }, 600);
            }
        };

        function addMsg(txt, cls) {
            const d = document.createElement('div');
            d.className = 'line ' + cls;
            d.innerText = txt;
            document.getElementById('chat').appendChild(d);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }

        function updateUI() {
            document.getElementById('counter').innerText = `Куплетов: ${stanzas.length} / ${maxStanzas}`;
            if (stanzas.length >= 1) document.getElementById('clipBtn').style.display = 'block';
            if (stanzas.length >= maxStanzas) {
                document.getElementById('addBtn').disabled = true;
                document.getElementById('poemInput').placeholder = "Лимит достигнут.";
            }
        }

        function share() {
            const text = stanzas.join('\n\n');
            window.open(`https://t.me/share/url?url=GY-GY&text=${encodeURIComponent(text)}`, '_blank');
        }

        window.onload = () => {
            document.getElementById('userID').innerText = 'ID-' + Math.floor(Math.random()*999);
        };
    </script>
</body>
</html>
