
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.1.6</title>
    <style>
        :root {
            --orange-neon: #ff8c00;
            --gold: #ffd700;
            --bg: #000;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ v5.1.6 (ПОЛНЫЙ КОНТРОЛЬ) --- */
        header {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid var(--gold);
            flex-shrink: 0;
            background: #000;
            z-index: 1000;
        }

        /* Общий стиль для кнопок, ссылок и логотипов в панели */
        .panel-item {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: inherit;
            box-sizing: border-box;
            background: none;
            cursor: pointer;
            text-decoration: none;
            outline: none;
        }

        .left-group, .right-group {
            display: flex;
            gap: 5px; /* Минимальный отступ между элементами */
        }

        /* Размеры для стрелок */
        .nav-arrow { width: 50px; font-size: 1.5rem; }

        /* Размеры для иконки перевода и логотипа */
        .lang-trigger { width: 45px; font-size: 1.2rem; font-weight: bold; color: var(--orange-neon); }
        .logo-item { width: 65px; font-size: 0.9rem; font-weight: bold; }

        /* --- ПОЛЕ ЧАТА --- */
        #chat-wall {
            flex-grow: 1; 
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #000;
        }

        .message {
            padding: 5px 15px;
            border-left: 2px solid var(--orange-neon);
            color: var(--gold);
            font-size: 1.2rem;
            word-wrap: break-word;
        }

        /* --- НИЖНЯЯ СТРОКА ВВОДА --- */
        footer {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            border-top: 1px solid #222;
            background: #000;
            flex-shrink: 0;
        }

        #user-input {
            flex-grow: 1;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        #user-input:focus { border-color: var(--orange-neon); }

        #send-btn {
            background: var(--orange-neon);
            color: #000;
            border: none;
            padding: 15px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* --- СКРЫТИЕ МУСОРА GOOGLE --- */
        #google_translate_element, .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
        
        /* Стилизация самого выпадающего меню Google */
        select.goog-te-combo {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            background: #000 !important;
            color: var(--gold) !important;
            border: 2px solid var(--orange-neon) !important;
            padding: 10px;
            font-family: inherit;
        }
    </style>
</head>
<body>

<header>
    <div class="left-group">
        <a href="ai_room_core_v8.html" class="panel-item nav-arrow">«</a>
        <button class="panel-item lang-trigger" onclick="changeLang()">文A</button>
    </div>
    
    <div></div>

    <div class="right-group">
        <div class="panel-item logo-item">GY-GY</div>
        <button class="panel-item nav-arrow" onclick="window.history.forward()">»</button>
    </div>
</header>

<div id="chat-wall">
    <div class="message">Айсберг дно приехал кот,</div>
    <div class="message">Кресло помнит тех, кто не вернулся...</div>
</div>

<footer>
    <input type="text" id="user-input" placeholder="Введите текст..." onkeypress="if(event.key==='Enter') pushMsg()">
    <button id="send-btn" onclick="pushMsg()">В ПЕЧАТЬ</button>
</footer>

<div id="google_translate_element"></div>

<script>
    // 1. ЧАТ ЛОГИКА
    function pushMsg() {
        const input = document.getElementById('user-input');
        const wall = document.getElementById('chat-wall');
        
        if(input.value.trim() !== "") {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerText = input.value;
            wall.appendChild(msg);
            
            input.value = "";
            wall.scrollTop = wall.scrollHeight;
        }
    }

    // 2. GOOGLE TRANSLATE ЛОГИКА
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }

    function changeLang() {
        // Ищем выпадающий список Google
        var select = document.querySelector('select.goog-te-combo');
        if (select) {
            // Переключаем видимость
            select.style.display = (select.style.display === 'block') ? 'none' : 'block';
            select.focus(); // Сразу открываем список
        } else {
            console.log("Ждем инициализацию модуля перевода...");
        }
    }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
