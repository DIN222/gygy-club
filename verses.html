
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CORE v33.4.0 TOTAL</title>
    <script src="config.js"></script>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 10px; position: relative; z-index: 9999; flex-shrink: 0; }
        .nav-fix { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold); color: var(--gold); cursor: pointer; text-decoration: none; font-weight: bold; }
        .header-scroll { flex-grow: 1; display: flex; align-items: center; overflow-x: auto; padding: 0 10px; gap: 15px; scrollbar-width: none; }
        
        #google_translate_element { transform: scale(0.8); transform-origin: left; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: #888; border-left: 1px solid #333; padding-left: 10px; }
        #digital-trace { color: var(--gold); font-weight: bold; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold); background: #222; flex-shrink: 0; }
        
        .logo-right { font-weight: 900; letter-spacing: 2px; font-size: 1rem; margin-left: auto; }

        /* WALL */
        #wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(circle at center, #111 0%, #000 100%); scroll-behavior: smooth; }
        .bubble { padding: 15px; max-width: 85%; border: 1px solid #333; position: relative; animation: slide 0.3s ease-out; word-wrap: break-word; line-height: 1.4; border-radius: 4px; }
        @keyframes slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .u-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255,215,0,0.02); color: #fff; }
        .a-msg { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }

        /* MENUS */
        .pop-menu { display: none; position: absolute; background: #111; border: var(--border); z-index: 10000; box-shadow: 0 5px 25px rgba(0,0,0,0.9); }
        .act-menu { top: 67px; left: 50%; transform: translateX(-50%); width: 190px; }
        .mode-menu { bottom: 85px; left: 10px; width: 260px; }
        .m-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.75rem; color: #fff; text-transform: uppercase; }
        .m-item:hover { background: var(--gold); color: #000; }
        .m-item b { display: block; color: var(--gold); }
        .m-item:hover b { color: #000; }

        /* FOOTER */
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; background: #000; border-top: var(--border); position: relative; flex-shrink: 0; }
        .btn-mode { width: 50px; height: 50px; border: 1px solid var(--gold); background: #111; color: var(--gold); cursor: pointer; font-size: 1.3rem; }
        #in { flex-grow: 1; background: #0d0d0d; border: 1px solid #333; color: var(--gold); padding: 15px; font-size: 1rem; outline: none; border-radius: 4px; }
        .btn-send { width: 60px; height: 50px; background: var(--gold); border: none; color: #000; font-weight: 900; cursor: pointer; border-radius: 4px; }

        .opt-trigger { cursor: pointer; font-size: 1.4rem; color: var(--gold); display: block; margin-top: 5px; opacity: 0.5; }
        .opt-trigger:hover { opacity: 1; }
    </style>
</head>
<body>

<header>
    <div class="nav-fix" onclick="location.href='ai_room_core_v8.html'">❮</div>
    <div class="header-scroll">
        <div id="google_translate_element"></div>
        <div class="user-info">
            <div class="avatar"></div>
            <span id="digital-trace">SCANNING...</span>
        </div>
        <div class="h-item" onclick="toggle('actMenu')" style="cursor:pointer; color:var(--gold)">ДЕЙСТВИЯ ▾</div>
    </div>
    <div class="logo-right">GY-GY</div>
    <div class="nav-fix" style="margin-left:10px" onclick="location.href='box_page.html'">❯</div>
</header>

<div id="wall">
    <div class="bubble a-msg">Система v33.3.0 CORE.<br>Ваш ID подтвержден. Выберите режим (▲).</div>
</div>

<div id="actMenu" class="pop-menu act-menu">
    <div class="m-item" onclick="clearWall()">🗑 Очистить стену</div>
    <div class="m-item" onclick="alert('Сохранено в BOX')">📦 В сборник</div>
    <div class="m-item">🎬 Сделать клип</div>
    <div class="m-item">✉️ Переслать</div>
</div>

<div id="modeMenu" class="pop-menu mode-menu">
    <div class="m-item" onclick="setM('ø Абсурд', 'абсурдный юмор, безумные связи, 4 строки')"><b>ø Абсурд</b>Безумные связи</div>
    <div class="m-item" onclick="setM('§ Быт', 'комедия наблюдений, бытовая ирония, 4 строки')"><b>§ Быт</b>Смешное в обычном</div>
    <div class="m-item" onclick="setM('† Прожарка', 'жесткий инсалт-юмор, стеб, 4 строки')"><b>† Прожарка</b>Остро и дерзко</div>
    <div class="m-item" onclick="setM('¶ Сатира', 'сатира, ирония над важным, 4 строки')"><b>¶ Сатира</b>Ирония над важным</div>
    <div class="m-item" onclick="setM('‡ Хлестко', 'краткий уан-лайнер, 1-2 строки')"><b>‡ Хлестко</b>Коротко и в точку</div>
</div>

<footer>
    <button class="btn-mode" onclick="toggle('modeMenu')">▲</button>
    <input type="text" id="in" placeholder="Режим: § Быт | 4 слова..." autocomplete="off">
    <button id="go" class="btn-send">ОК</button>
</footer>

<script>
    // 1. ЦИФРОВОЙ СЛЕД (USER ID)
    (function() {
        let id = localStorage.getItem('gy_trace') || 'ID-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        localStorage.setItem('gy_trace', id);
        document.getElementById('digital-trace').innerText = id;
    })();

    // 2. ЛОГИКА ЧАТА И AI
    const MODELS = ['gemini-2.0-flash', 'gemini-1.5-flash'];
    let curDesc = "комедия наблюдений, бытовая ирония, 4 строки";
    let curName = "§ Быт";

    const wall = document.getElementById('wall');
    const input = document.getElementById('in');
    const btn = document.getElementById('go');

    function toggle(id) {
        const el = document.getElementById(id);
        const isShow = el.style.display === 'block';
        document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
        el.style.display = isShow ? 'none' : 'block';
    }

    function setM(name, desc) {
        curName = name; curDesc = desc;
        input.placeholder = `Режим: ${name} | 4 слова...`;
        toggle('modeMenu');
    }

async function callAI(text) {
    // Чистим ключ от любых невидимых символов
    const key = (typeof BEUVRY_CONFIG !== 'undefined' ? 
        (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).replace(/\s/g, '') : "");
    
    const prompt = `Ты — циничный нуарный поэт Беври. Стиль: ${curDesc}. Юзер дает слова: ${text}. Напиши только текст юмора в рифму, без лишних слов.`;
    
    for (let m of MODELS) {
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const d = await r.json();
            
            // Если Google ругается на ключ, ты увидишь это в F12
            if (d.error) { console.error("Ошибка API:", d.error.message); continue; }
            
            if (d.candidates) return d.candidates[0].content.parts[0].text.trim();
        } catch (e) { console.error("Сбой сети для " + m); }
    }
    return "Модели ушли на перекур. Проверь консоль (F12).";
}

    function pushMsg(txt, isAi) {
        const d = document.createElement('div');
        d.className = `bubble ${isAi ? 'a-msg' : 'u-msg'}`;
        
        if (isAi) {
            d.innerHTML = `<small style="opacity:0.4">${curName}</small><br><div contenteditable="true" style="outline:none">${txt.replace(/\n/g, '<br>')}</div>
                           <span class="opt-trigger" onclick="alert('Копирую...')">⋮</span>`;
        } else {
            d.innerText = txt;
        }

        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }

    btn.onclick = async () => {
        const val = input.value.trim(); if(!val || btn.disabled) return;
        btn.disabled = true; pushMsg(val, false); input.value = "";
        const res = await callAI(val);
        pushMsg(res, true); btn.disabled = false;
    };

    input.onkeypress = (e) => { if(e.key==='Enter') btn.click(); };
    function clearWall() { wall.innerHTML = ""; toggle('actMenu'); }
    document.onclick = (e) => { if(!e.target.closest('header') && !e.target.closest('footer')) document.querySelectorAll('.pop-menu').forEach(m => m.style.display='none'); };
</script>

</body>
</html>
