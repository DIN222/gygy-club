<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v11.0.3 REBORN</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 70px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; box-sizing: border-box; justify-content: space-between; position: sticky; top: 0; z-index: 9999; }
        .nav-btn { width: 55px; height: 50px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; box-shadow: 3px 3px 0 var(--gold); }
        .logo-center { font-weight: 900; font-size: 1.6rem; letter-spacing: 6px; position: absolute; left: 50%; transform: translateX(-50%); text-shadow: 2px 2px 0 #333; }
        
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: #000; }
        .bubble { padding: 15px; max-width: 85%; font-size: 1.1rem; border: 1px solid #333; position: relative; }
        .u { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255,215,0,0.05); color: #fff; }
        .a { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }

        footer { height: 100px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; z-index: 1000; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 18px; outline: none; font-size: 1.1rem; }
        .btn-send { width: 65px; height: 65px; background: var(--gold); border: none; font-size: 2.5rem; cursor: pointer; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.href='ai_room_core_v8.html'">EXIT</div>
    <div class="logo-center">GY-GY</div>
    <div style="display:flex; gap:10px;">
        <div class="nav-btn" onclick="alert('BOX: Тут будут шедевры')">BOX</div>
        <div class="nav-btn">RU</div>
    </div>
</header>

<div id="wall">
    <div class="bubble a">v11.0.0: Кнопки на месте, связь восстановлена. <br>Жду 4 слова. Прорвемся?</div>
</div>

<footer>
    <input type="text" id="in" placeholder="Слова..." onkeydown="if(event.key==='Enter') send()">
    <button id="go" class="btn-send" onclick="send()">↑</button>
</footer>

<script>
    async function send() {
        const input = document.getElementById('in');
        const btn = document.getElementById('go');
        const val = input.value.trim();

        if (!val || btn.disabled) return;
        btn.disabled = true;
        push(val, false);
        input.value = "";

        const key = (typeof BEUVRY_CONFIG !== 'undefined' ? (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim() : "");
        
        // Список актуальных моделей 2026 года для перебора
        const models = [
            'gemini-1.5-flash', 
            'gemini-1.5-pro', 
            'gemini-2.0-flash-exp', 
            'gemini-pro'
        ];

        let success = false;

        for (let modelName of models) {
            if (success) break;
            try {
                // Используем v1beta как самую гибкую версию
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`;
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Ты — циничный нуарный комик. Выдай 4 строки едкой рифмы на слова: " + val }] }]
                    })
                });

                const d = await r.json();

                if (d.candidates && d.candidates[0].content) {
                    push(d.candidates[0].content.parts[0].text, true);
                    success = true;
                } else {
                    console.warn(`Модель ${modelName} не ответила, пробую следующую...`);
                }
            } catch (e) {
                console.error(`Ошибка связи с ${modelName}`);
            }
        }

        if (!success) {
            push("❌ Шеф, Google сегодня в коме. Ни одна модель не отозвалась. Попробуй через 5 минут или проверь ключ в config.js.", true);
        }

        btn.disabled = false;
        input.focus();
    }

    function push(txt, isAi) {
        const wall = document.getElementById('wall');
        const d = document.createElement('div');
        d.className = `bubble ${isAi ? 'a' : 'u'}`;
        d.innerHTML = txt.replace(/\n/g, '<br>');
        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }
</script>
</body>
</html>
