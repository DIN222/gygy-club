
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | VERSES v38.7.0</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        * { box-sizing: border-box; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100vh; 
            background: var(--bg); color: var(--gold); 
            font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* HEADER: Навигация Назад/Вперед */
        .page-header { 
            height: 60px; display: flex; align-items: center; 
            border-bottom: var(--border); background: #111; 
            flex-shrink: 0; z-index: 1001; 
        }
        .nav-fix { 
            width: 50px; height: 100%; display: flex; align-items: center; 
            justify-content: center; background: #111; cursor: pointer; 
            color: var(--gold); text-decoration: none; flex-shrink: 0; 
            font-weight: bold; font-size: 1.4rem; 
        }
        .header-title { 
            flex-grow: 1; text-align: center; font-weight: 900; 
            letter-spacing: 2px; font-size: 0.9rem; text-transform: uppercase;
        }

        /* LIST */
        #boxList { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 15px; 
        }
        .verse-card { 
            padding: 15px; border: 1px solid #333; 
            background: rgba(255,255,255,0.03); position: relative;
        }
        .v-meta { 
            font-size: 0.6rem; opacity: 0.5; margin-bottom: 8px; 
            display: flex; justify-content: space-between;
        }
        .v-text { 
            font-size: 1rem; line-height: 1.4; color: #fff; 
            white-space: pre-wrap; outline: none;
        }

        /* ACTIONS */
        .v-btns { 
            display: flex; gap: 10px; margin-top: 12px; 
            border-top: 1px solid #222; padding-top: 10px; 
        }
        .v-btn { 
            background: transparent; border: 1px solid #444; 
            color: var(--gold); font-size: 0.65rem; padding: 5px 10px; 
            cursor: pointer; text-transform: uppercase;
        }
        .v-btn:hover { border-color: var(--gold); }
        .v-btn-del { color: #f44; border-color: #600; }

        .empty-msg { text-align: center; margin-top: 50px; opacity: 0.5; }
    </style>
</head>
<body>

<header class="page-header">
    <a href="ai_room_core_v8.html" class="nav-fix">❮</a>
    
    <div class="header-title">GY-GY / В БОКСЕ</div>

    <a href="#" class="nav-fix" onclick="alert('Дальше пока нечего смотреть, шеф!')">❯</a>
</header>

<div id="boxList">
    </div>

<script>
    function renderBox() {
        const list = document.getElementById('boxList');
        const items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        
        if (items.length === 0) {
            list.innerHTML = '<div class="empty-msg">В боксе пока пусто...</div>';
            return;
        }

        list.innerHTML = items.map((item, index) => `
            <div class="verse-card" data-id="${index}">
                <div class="v-meta">
                    <span>${item.mode || 'ЮМОР'}</span>
                    <span>${item.date || ''}</span>
                </div>
                <div class="v-text" contenteditable="true" onblur="updateVerse(${index}, this.innerText)">${item.text}</div>
                <div class="v-btns">
                    <button class="v-btn" onclick="copyVerse(${index})">Копировать</button>
                    <button class="v-btn" onclick="shareVerse(${index})">Переслать</button>
                    <button class="v-btn v-btn-del" onclick="deleteVerse(${index})">Удалить</button>
                </div>
            </div>
        `).join('');
    }

    function updateVerse(index, newText) {
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        items[index].text = newText;
        localStorage.setItem('gygy_box', JSON.stringify(items));
    }

    function deleteVerse(index) {
        if (!confirm('Удалить из бокса?')) return;
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        items.splice(index, 1);
        localStorage.setItem('gygy_box', JSON.stringify(items));
        renderBox();
    }

    function copyVerse(index) {
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        navigator.clipboard.writeText(items[index].text);
        alert('Скопировано!');
    }

    function shareVerse(index) {
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        if (navigator.share) {
            navigator.share({ title: 'GY-GY Verse', text: items[index].text });
        }
    }

    // Запуск при загрузке
    renderBox();
</script>

</body>
</html>
