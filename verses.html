
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY: GOLDEN VERSES</title>
    <style>
        :root {
            --gold: #FFD700;
            --gold-dark: #B8860B;
            --bg: #000000;
            --btn-size: 60px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            background: var(--bg);
            font-family: 'Georgia', serif;
            color: var(--gold);
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }

        /* ШАПКА: НАВИГАЦИЯ И ЛОГО */
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 3px solid var(--gold);
            background: #000;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(218, 165, 32, 0.2);
        }

        .nav-box { display: flex; align-items: center; gap: 10px; }

        .btn-nav {
            width: var(--btn-size); height: var(--btn-size);
            background: var(--bg); border: 3px solid var(--gold);
            color: var(--gold); font-size: 30px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        .lang-select {
            background: var(--bg); color: var(--gold);
            border: 3px solid var(--gold); padding: 0 10px;
            font-size: 18px; font-weight: bold; height: var(--btn-size);
            appearance: none; text-align: center;
        }

        .logo { font-size: 24px; font-weight: 900; letter-spacing: 4px; color: var(--gold); }

        /* ОКНО ПОТОКА */
        #stream {
            flex: 1; overflow-y: auto; padding: 20px;
            font-size: 22px; line-height: 1.6;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            scroll-behavior: smooth;
        }

        .msg { 
            margin-bottom: 30px; 
            display: flex; 
            align-items: flex-start;
            animation: fadeIn 0.4s ease-out;
        }

        .avatar {
            width: 50px; height: 50px;
            border: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold;
            margin-right: 15px; flex-shrink: 0;
            background: #111;
        }

        .msg-body-wrapper { flex: 1; border-left: 2px solid var(--gold-dark); padding-left: 15px; }

        .badge {
            font-size: 10px; color: var(--gold-dark); 
            border: 1px solid var(--gold-dark); 
            padding: 2px 5px; margin-bottom: 8px; 
            display: inline-block; text-transform: uppercase;
        }

        .meta { font-size: 14px; color: var(--gold-dark); margin-bottom: 5px; font-weight: bold; }

        /* ЗОНА ВВОДА */
        .input-zone {
            padding: 20px; background: #000; border-top: 3px solid var(--gold);
        }

        #inp {
            width: 100%; background: #111; border: 2px solid var(--gold-dark);
            color: var(--gold); font-size: 24px; padding: 18px; 
            outline: none; transition: 0.3s;
        }

        #inp:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--gold-dark); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="nav-box">
            <button class="btn-nav" onclick="history.back()">«</button>
            <select class="lang-select">
                <option>RU</option>
                <option>EN</option>
                <option>DE</option>
            </select>
            <button class="btn-nav" onclick="history.forward()">»</button>
        </div>
        <div class="logo">GY-GY</div>
    </header>

    <div id="stream"></div>

    <div class="input-zone">
        <input type="text" id="inp" placeholder="ВАШ ИМПУЛЬС..." autocomplete="off">
    </div>

    <script>
        // КЛЮЧ И НАСТРОЙКИ
        const part1 = "AIzaSyBFmETf-8mg5iM"; 
        const part2 = "Sjgg4rKNL_k3vwb-YGPE"; 
        const getKey = () => part1 + part2;
        let count = 0;

        // ГОЛОС
        function speak(text) {
            window.speechSynthesis.cancel(); 
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ru-RU'; msg.rate = 1.0; msg.pitch = 0.8;
            window.speechSynthesis.speak(msg);
        }

        // ВЫВОД СООБЩЕНИЯ С АВАТАРОМ
        function addMsg(author, text, type, id) {
            count++;
            const s = document.getElementById('stream');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            if(id) div.id = id;

            const isAI = (author === 'GEMINI');
            const color = isAI ? 'var(--gold)' : 'var(--gold-dark)';
            
            const badge = isAI ? `<div class="badge">PASS: GEN-ID / OK</div>` : '';
            
            div.innerHTML = `
                <div class="avatar" style="border-color:${color}; color:${color}">${author[0]}</div>
                <div class="msg-body-wrapper">
                    ${badge}
                    <div class="meta">@${author} [${count}]</div>
                    <div class="msg-text">${text}</div>
                </div>
            `;

            s.appendChild(div);
            s.scrollTop = s.scrollHeight;
        }

        // AI ПОСТИНГ
        async function aiPost(userText) {
            const tempId = 'ai-' + Date.now();
            addMsg('GEMINI', "ПРОВЕРКА ПРОПУСКА...", 'ai', tempId);

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${getKey()}`;
            
            const variants = [
                `Напиши ироничное четверостишье капсом про: ${userText}`,
                `Сделай абсурдный техно-нуар стих из 4 строк про: ${userText}`
            ];

            try {
                const body = JSON.stringify({ contents: [{ parts: [{ text: variants[Math.floor(Math.random()*variants.length)] }] }] });
                const res = await fetch(url, { method: "POST", headers: {"Content-Type":"application/json"}, body });
                const data = await res.json();
                
                if (data.candidates && data.candidates[0]) {
                    const result = data.candidates[0].content.parts[0].text.trim().toUpperCase();
                    const target = document.getElementById(tempId).querySelector('.msg-text');
                    target.textContent = result;
                    speak(result);
                }
            } catch (e) {
                document.getElementById(tempId).querySelector('.msg-text').textContent = "СБОЙ ШЛЮЗА. ПОВТОРИТЕ.";
            }
        }

        // ОБРАБОТЧИК ВВОДА
        document.getElementById('inp').onkeypress = (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                const val = e.target.value.trim();
                addMsg('АВТОР', val, 'user');
                e.target.value = "";
                aiPost(val);
            }
        };
    </script>
</body>
</html>
