
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.4.4 Fixed</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* ШАПКА */
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; flex-shrink: 0; padding: 0 5px; }
        
        /* Кнопка возврата - ТЕПЕРЬ РАБОТАЕТ КАК НАЗАД */
        .btn-header { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: var(--border); color: var(--gold); background: none; cursor: pointer; flex-shrink: 0; font-size: 1.2rem; }

        .scroll-zone { flex-grow: 1; display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; }
        .scroll-zone::-webkit-scrollbar { display: none; }

        /* Кнопки в панели одинаковые */
        .item-fix { height: 44px; min-width: 60px; border: var(--border); color: var(--gold); background: none; font-size: 0.7rem; font-weight: bold; display: flex; align-items: center; justify-content: center; white-space: nowrap; flex-shrink: 0; cursor: pointer; text-transform: uppercase; }

        #google_translate_element { height: 44px; border: var(--border); display: flex; align-items: center; overflow: hidden; }

        /* ЧАТ */
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { padding: 12px; max-width: 80%; font-size: 1.2rem; line-height: 1.4; border-radius: 2px; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); color: var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; color: #eee; background: rgba(255, 255, 255, 0.08); font-style: italic; text-align: right; }

        /* ФУТЕР */
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-top: 1px solid #333; background: #000; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 14px; outline: none; font-size: 1rem; font-family: inherit; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); color: #000; border: none; font-size: 1.8rem; cursor: pointer; font-weight: 900; }

        .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

<header>
    <div class="btn-header" onclick="window.history.back()">«</div>
    
    <div class="scroll-zone">
        <div id="google_translate_element"></div>
        <button class="item-fix" onclick="alert('В Сборник!')">В СБОРНИК</button>
        <div class="item-fix">ID: 001</div>
        <div class="item-fix avatar-ai" onclick="aiAction('Проверка связи')">
            <svg viewBox="0 0 24 24" style="width:28px; height:28px; fill:var(--gold);"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-9h10v2H7z"/></svg>
        </div>
    </div>
    
    <div style="font-size: 0.8rem; padding: 0 10px; font-weight: 900;">GY-GY</div>
    <div class="btn-header" onclick="window.history.forward()">»</div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">Система v5.4.4 онлайн. Русский ввод активен.</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Текст здесь..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
</footer>

<script src="config.js"></script>
<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ru', // Принудительный русский
            includedLanguages: 'ru,en,fr,de',
            autoDisplay: false
        }, 'google_translate_element');
    }

    async function aiAction(text) {
        const wall = document.getElementById('chat-wall');
        const m = document.createElement('div');
        m.className = 'msg ai-msg';
        m.innerHTML = "<i>Генерация...</i>";
        wall.appendChild(m);
        wall.scrollTop = wall.scrollHeight;

        const KEY_READY = BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${BEUVRY_CONFIG.MODEL}:generateContent?key=${KEY_READY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `${BEUVRY_CONFIG.PROMPT} Слова: ${text}` }] }]
                })
            });
            const data = await response.json();
            const result = data.candidates[0].content.parts[0].text;
            m.innerHTML = result.replace(/\n/g, '<br>');
        } catch (e) {
            m.innerHTML = "Стык ключа не удался.";
        }
        wall.scrollTop = wall.scrollHeight;
    }

    function send() {
        const input = document.getElementById('user-in');
        const val = input.value.trim();
        if(val) {
            const wall = document.getElementById('chat-wall');
            const m = document.createElement('div');
            m.className = 'msg user-msg';
            m.innerText = val;
            wall.appendChild(m);
            aiAction(val);
            input.value = "";
        }
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
