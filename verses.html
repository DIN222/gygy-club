<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY CLUB | VERSES v.2.4</title>
    <style>
        /* УВЕЛИЧЕННЫЕ КОНСТАНТЫ */
        :root { 
            --gold: #ffd700; 
            --black: #000; 
            --h-unit: 55px; /* Увеличено для лучшей читаемости */
        }
        
        body { 
            background: var(--black); 
            color: var(--gold); 
            font-family: monospace; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* HEADER STRUCTURE */
        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 10px 15px; 
            border-bottom: 2px solid var(--gold);
        }
        .header-left { display: flex; gap: 12px; align-items: center; }
        .header-right { display: flex; justify-content: flex-end; }

        /* UI ELEMENTS: УВЕЛИЧЕННЫЙ ШРИФТ */
        .ui-box { 
            height: var(--h-unit); 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 20px; 
            background: transparent; 
            color: var(--gold); 
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.2s;
            font-size: 18px; /* Крупнее */
            font-weight: bold;
        }
        .ui-box:hover { background: rgba(255, 215, 0, 0.1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        
        .arrow { font-size: 32px; width: 80px; font-weight: bold; }
        .avatar { width: var(--h-unit); padding: 0; font-size: 12px; }
        .logo { font-size: 32px; font-weight: bold; letter-spacing: 8px; cursor: default; }

        /* WALL */
        #wall { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 25px; }
        .card { border: 1px solid #333; padding: 20px; background: #050505; max-width: 800px; margin: 0 auto; width: 95%; }
        .card:hover { border-color: var(--gold); }
        .content { color: #fff; min-height: 80px; outline: none; margin-bottom: 15px; white-space: pre-line; font-size: 20px; }

        /* REMOTE */
        .remote { display: flex; gap: 20px; border-top: 1px solid #222; padding-top: 15px; font-size: 13px; }
        .remote-btn { cursor: pointer; color: #777; transition: 0.2s; text-transform: uppercase; }
        .remote-btn:hover { color: var(--gold); }

        /* FOOTER: НА ВСЮ ШИРИНУ */
        footer { padding: 15px; border-top: 1px solid #222; background: var(--black); }
        .input-row { 
            display: flex; 
            gap: 15px; 
            width: 100%; /* Растяжка на весь экран */
            max-width: 100%; 
            height: var(--h-unit); 
        }
        input, select { 
            background: #000; 
            border: 1px solid var(--gold); 
            color: #fff; 
            padding: 0 15px; 
            font-family: inherit; 
            font-size: 18px; /* Крупнее */
            flex: 1; 
            outline: none; 
        }
        select { flex: 0.2; min-width: 120px; cursor: pointer; }
        .btn-ok { width: 120px; font-size: 22px; background: rgba(255,215,0,0.05); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="ui-box arrow" onclick="location.href='ai_room_core_v8.html'">⟵</button>
        <div class="ui-box" style="border:none">RU/EN</div>
        <div class="ui-box avatar">ID:01</div>
        <button class="ui-box" onclick="setIdea()">ГЕНЕРАТОР</button>
    </div>
    
    <div class="logo">GY-GY</div>
    
    <div class="header-right">
        <button class="ui-box arrow" onclick="location.href='clip.html'">⟶</button>
    </div>
</header>

<main id="wall">
    <div class="card" id="v1">
        <div class="content" contenteditable="true">v.2.4: Широкий формат.
Размер элементов увеличен до 55px.
Нижняя панель занимает 100% ширины.</div>
        <div class="remote">
            <span class="remote-btn" onclick="bridge('CLIP', 'v1')">🎬 CLIP</span>
            <span class="remote-btn" onclick="bridge('TG', 'v1')">✈️ TELEGRAM</span>
            <span class="remote-btn" onclick="bridge('ARCHIVE', 'v1')">🏛️ ARCHIVE</span>
            <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#aa0000">❌ DEL</span>
        </div>
    </div>
</main>

<footer>
    <div class="input-row">
        <select id="style">
            <option>НУАР-ДЖАЗ</option>
            <option>ГИ-ГИ</option>
            <option>ОПТИМИЗМ</option>
        </select>
        <input type="text" id="words" placeholder="Введите 4 слова для синтеза...">
        <button class="ui-box btn-ok" onclick="createVerse()">OK</button>
    </div>
</footer>

<script>
    function bridge(action, id) {
        const text = document.querySelector(`#${id} .content`).innerText;
        if(action === 'CLIP') {
            localStorage.setItem('currentVerse', text);
            location.href = 'clip.html'; 
        }
        if(action === 'ARCHIVE') alert("В архив!");
        if(action === 'TG') window.open("https://t.me/share/url?url=" + encodeURIComponent(text));
    }

    function createVerse() {
        const val = document.getElementById('words').value;
        if(!val) return;
        const id = 'v' + Date.now();
        const card = document.createElement('div');
        card.className = 'card';
        card.id = id;
        const aiText = `Синтез: ${val}\n\nВ Клубе тесно не будет,\nШирота на весь экран.\nПусть никто не забудет\nНаш стилистический план.`;
        card.innerHTML = `
            <div class="content" contenteditable="true">${aiText}</div>
            <div class="remote">
                <span class="remote-btn" onclick="bridge('CLIP', '${id}')">🎬 CLIP</span>
                <span class="remote-btn" onclick="bridge('TG', '${id}')">✈️ TG</span>
                <span class="remote-btn" onclick="bridge('ARCHIVE', '${id}')">🏛️ ARCHIVE</span>
                <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#aa0000">❌ DEL</span>
            </div>`;
        document.getElementById('wall').appendChild(card);
        document.getElementById('words').value = '';
        document.getElementById('wall').scrollTop = document.getElementById('wall').scrollHeight;
    }

    function setIdea() { 
        const ideas = ["Звезды", "Реголит", "Ширина", "Драйв"];
        document.getElementById('words').value = ideas.join(' ');
    }
</script>

</body>
</html>
