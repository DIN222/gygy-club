
<!DOCTYPE html><html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.9.0 Renaissance</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Возвращаем фирменный хедер */
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 10px; box-sizing: border-box; justify-content: space-between; position: relative; }
        .btn-header { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: var(--border); color: var(--gold); background: none; cursor: pointer; font-size: 1.5rem; }
        .logo-gy { font-weight: 900; font-size: 1.2rem; letter-spacing: 3px; position: absolute; left: 50%; transform: translateX(-50%); }
        .lang-btn { border: var(--border); padding: 5px 10px; font-size: 0.8rem; cursor: pointer; }

        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { padding: 12px; max-width: 80%; font-size: 1.1rem; line-height: 1.4; border-radius: 2px; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; color: #eee; background: rgba(255, 255, 255, 0.1); font-style: italic; text-align: right; }
        
        footer { height: 85px; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-top: 1px solid #333; background: #000; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 14px; outline: none; font-size: 1rem; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); color: #000; border: none; font-size: 1.8rem; cursor: pointer; font-weight: 900; }
    </style></head><body>

<header>
    <div class="btn-header" onclick="location.href='ai_room_core_v8.html'">«</div>
    <div class="logo-gy">GY-GY</div>
    <div class="lang-btn" onclick="alert('Switching Language...')">RU</div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">v5.9.0. Атрибуты клуба восстановлены. Пытаюсь прорваться через Gemini 2.0...</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Ночь лед стекло пистолет..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
</footer>

<script>
    let FINAL_KEY = "";
    let SYSTEM_PROMPT = "Ты нуарный поэт Беври. 4 стиха.";

    if (typeof BEUVRY_CONFIG !== 'undefined') {
        FINAL_KEY = BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2;
        SYSTEM_PROMPT = BEUVRY_CONFIG.PROMPT || SYSTEM_PROMPT;
    }

    async function aiAction(t) {
        const w = document.getElementById('chat-wall');
        const m = document.createElement('div');
        m.className = 'msg ai-msg'; m.innerHTML = "<i>...</i>";
        w.appendChild(m); w.scrollTop = w.scrollHeight;
        
        // ПЕРЕХОД НА 2.0 FLASH — это должно решить проблему "not found"
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${FINAL_KEY}`;

        try {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: SYSTEM_PROMPT + "\nТекст: " + t }] }] })
            });
            const d = await r.json();
            if (d.error) {
                m.innerHTML = "Ошибка: " + d.error.message;
            } else {
                m.innerHTML = d.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            }
        } catch (e) { m.innerHTML = "Сбой сети."; }
        w.scrollTop = w.scrollHeight;
    }

    function send() {
        const i = document.getElementById('user-in');
        if(i.value.trim()){
            const m = document.createElement('div');
            m.className = 'msg user-msg'; m.innerText = i.value;
            document.getElementById('chat-wall').appendChild(m);
            aiAction(i.value); i.value = "";
        }
    }
</script></body></html>
