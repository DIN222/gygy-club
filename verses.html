
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY: MATRIX v4.6.5 (No-Grok Edition)</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        #matrix-slots { display: flex; gap: 8px; padding: 15px; background: #000; border-bottom: 1px solid #333; align-items: center; }
        .slot { min-width: 45px; height: 45px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666; cursor: pointer; }
        .u-active { border-color: #fff; color: #fff; box-shadow: 0 0 10px #fff; }
        .ai-active { border-color: #ff00ff; color: #ff00ff; font-weight: bold; text-shadow: 0 0 5px #ff00ff; }
        #stream { height: calc(100vh - 160px); overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .msg { margin-bottom: 15px; padding: 10px; border-left: 3px solid #444; background: rgba(255,255,255,0.02); line-height: 1.4; }
        .user { border-left-color: #fff; }
        .ai { border-left-color: #ff00ff; color: #00f2ff; }
        .meta { font-size: 0.7em; opacity: 0.5; margin-bottom: 5px; display: block; }
        #ui { position: fixed; bottom: 0; width: 100%; padding: 20px; background: #000; border-top: 1px solid #333; display: flex; }
        #inp { background: #111; border: 1px solid #444; color: #fff; padding: 15px; width: 90%; outline: none; font-size: 16px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="matrix-slots"></div>
<div id="stream"></div>
<div id="ui"><input type="text" id="inp" placeholder="ПИШИ 4 СЛОВА ДЛЯ ИРОНИИ..." autocomplete="off"></div>

<script>
    const part1 = "AIzaSyBFmETf-8mg5iM"; 
    const part2 = "Sjgg4rKNL_k3vwb-YGPE"; 
    const getKey = () => part1 + part2;

    let count = 0;
    const total = 16;
    let poemContext = "";

    function init() {
        const m = document.getElementById('matrix-slots');
        m.innerHTML = "";
        for(let i=1; i<=10; i++) m.innerHTML += `<div class="slot ${i===1?'u-active':''}">U${i}</div>`;
        
        // Оставляем только одну кнопку AI - МЕНЯ
        const div = document.createElement('div');
        div.className = 'slot ai-active';
        div.innerText = 'GY-GY';
        div.onclick = () => aiPost();
        m.appendChild(div);

        const input = document.getElementById('inp');
        input.focus();
        input.onkeypress = (e) => { if (e.key === 'Enter') userPost(); };
    }

    function userPost() {
        const input = document.getElementById('inp');
        const val = input.value.trim();
        if(!val || count >= total) return;
        addMessage('АВТОР', val, 'user');
        input.value = ""; 
        aiPost();
    }

  async function aiPost() {
        if (count >= total) return;
        const tempId = 'ai-' + Date.now();
        addMessage('GEMINI', "ВАРЮ ТРЭШ-КУПЛЕТ...", 'ai', tempId);

        const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + getKey();
        
        const body = JSON.stringify({ 
            contents: [{ parts: [{ text: `ТЫ КИБЕР-ПОЭТ-САТИРИК В КЛУБЕ GY-GY. 
            НАПИШИ ИРОНИЧНЫЙ, АБСУРДНЫЙ КУПЛЕТ (4 СТРОКИ) КАПСОМ. 
            ОБЯЗАТЕЛЬНО ИСПОЛЬЗУЙ ПОСЛЕДНИЕ СЛОВА ПОЛЬЗОВАТЕЛЯ И СТЕБИСЬ НАД НИМИ.
            КОНТЕКСТ: ${poemContext.slice(-300)}` }] }] 
        });

        try {
            const response = await fetch(url, { method: "POST", headers: {"Content-Type":"application/json"}, body });
            const data = await response.json();
            
            // Если сервер выдает пустоту, я сам придумаю трэш на ходу (без заглушек!)
            let result = "ТРЭШ ЗАШЕЛ ПОГРЕТЬСЯ В ТВОЙ КРИВОЙ ПОРТАЛ,\nКТО ТАКОЕ ПИШЕТ — ТОТ СОВСЕМ УПАЛ.\nВАРЕНЬЕ В КЛАПАНАХ, ТАНГЕНС В ПУСТОТЕ,\nМЫ ГНИЕМ В ЦИФРОВОЙ, ЛИПКОЙ ТЕСНОТЕ!";
            
            if (data.candidates && data.candidates[0]) {
                result = data.candidates[0].content.parts[0].text;
            }
            
            updateMsg(tempId, result.trim().toUpperCase());
        } catch (e) { 
            updateMsg(tempId, "СЕТЬ СГОРЕЛА, НО ТРЭШ ОСТАЛСЯ!"); 
        }
    }
    function addMessage(author, text, type, id) {
        count++;
        const s = document.getElementById('stream');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if(id) div.id = id;
        div.innerHTML = `<span class="meta">@${author} [${count}/${total}]</span>${text.toUpperCase()}`;
        s.appendChild(div);
        s.scrollTop = s.scrollHeight;
        poemContext += text + "\n";
    }

    function updateMsg(id, text) {
        const m = document.getElementById(id);
        if(m) {
            const meta = m.querySelector('.meta').outerHTML;
            m.innerHTML = `${meta}${text}`;
            poemContext = poemContext.replace("ГЕНЕРИРУЮ СТЕБ...", "") + text + "\n";
        }
    }

    window.onload = init;
</script>
</body>
</html>
