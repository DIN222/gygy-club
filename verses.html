<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CORE v37.1</title>
    <script src="config.js"></script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateInit"></script>
    
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        .page-header { height: 60px; display: flex; align-items: center; border-bottom: var(--border); background: #111; position: relative; z-index: 1000; }
        .nav-fix { width: 50px; height: 100%; display: flex; align-items: center; justify-content: center; background: #111; cursor: pointer; font-weight: bold; font-size: 1.2rem; text-decoration: none; color: var(--gold); flex-shrink: 0; }
        .header-scroll { flex-grow: 1; display: flex; align-items: center; overflow-x: auto; white-space: nowrap; padding: 0 10px; gap: 15px; scrollbar-width: none; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--gold); background: #222; flex-shrink: 0; }
        .logo-right { font-weight: 900; letter-spacing: 2px; padding: 0 10px; font-size: 0.9rem; flex-shrink: 0; }
        
        /* Анимация логотипа при загрузке */
        .loading .logo-right { animation: pulse 1s infinite alternate; color: #fff; text-shadow: 0 0 10px var(--gold); }
        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

        /* WALL */
        #wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px; max-width: 85%; border: 1px solid #333; line-height: 1.4; font-size: 1.1rem; position: relative; }
        .u { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255,215,0,0.03); color: #fff; }
        .a { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }
        
        .style-label { display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; opacity: 0.5; }
        .edit-zone { outline: none; }
        
        .bubble-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        .c-btn { background: #111; border: 1px solid var(--gold); color: var(--gold); font-size: 0.6rem; padding: 4px 8px; cursor: pointer; border-radius: 2px; display: none; }
        .bubble:hover .c-btn { display: block; }

        /* FOOTER */
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; background: #000; border-top: 1px solid #222; position: relative; }
        .btn-mode { width: 50px; height: 50px; border: 1px solid #444; background: #111; color: var(--gold); cursor: pointer; font-size: 1.2rem; border-radius: 4px; }
        #in { flex-grow: 1; background: #0d0d0d; border: 1px solid #333; color: var(--gold); padding: 15px; font-size: 1rem; outline: none; border-radius: 4px; }
        .btn-ok { padding: 0 20px; height: 50px; background: var(--gold); border: none; color: #000; font-weight: 900; cursor: pointer; border-radius: 4px; }

        /* POPUP MENUS */
        .pop-menu { display: none; position: absolute; background: #111; border: var(--border); z-index: 2000; box-shadow: 0 5px 20px #000; }
        .act-menu { top: 62px; left: 50%; transform: translateX(-50%); width: 180px; }
        .mode-menu { bottom: 85px; left: 10px; width: 220px; }
        .m-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.8rem; color: #fff; }
        .m-item:hover { background: #222; color: var(--gold); }
    </style>
</head>
<body id="mainBody">

<header class="page-header">
    <a href="index.html" class="nav-fix">❮</a>
    <div class="header-scroll">
        <div id="google_translate_element"></div>
        <div class="avatar"></div>
        <div class="h-item" onclick="toggle('actMenu')" style="cursor:pointer">ДЕЙСТВИЯ ▾</div>
    </div>
    <a href="verses.html" class="nav-fix">📦</a>
    <div class="logo-right" id="mainLogo">GY-GY</div>
    <a href="verses.html" class="nav-fix">❯</a>
</header>

<div id="wall"></div>

<div id="actMenu" class="pop-menu act-menu">
    <div class="m-item" onclick="clearWall()">🗑 Удалить всё</div>
    <div class="m-item" onclick="alert('Используйте кнопку В БОКС под стихом')">📦 В сборник</div>
    <div class="m-item" onclick="alert('Функция в разработке')">🎬 Сделать клип</div>
    <div class="m-item" onclick="shareText()">✉️ Переслать</div>
</div>

<div id="modeMenu" class="pop-menu mode-menu">
    <div class="m-item" onclick="setM('ø Абсурд', 'абсурдный юмор, 4 строки')">ø Абсурд</div>
    <div class="m-item" onclick="setM('§ Быт', 'комедия наблюдений, 4 строки')">§ Быт</div>
    <div class="m-item" onclick="setM('† Прожарка', 'инсалт-комедия, 4 строки')">† Прожарка</div>
    <div class="m-item" onclick="setM('¶ Сатира', 'сатирическая ирония, 4 строки')">¶ Сатира</div>
    <div class="m-item" onclick="setM('‡ Хлестко', 'остро, 1-2 строки')">‡ Хлестко</div>
</div>

<footer>
    <button class="btn-mode" onclick="toggle('modeMenu')">▲</button>
    <input type="text" id="in" placeholder="Режим: § Быт | 4 слова..." onkeydown="if(event.key==='Enter') startSend()">
    <button id="okBtn" class="btn-ok" onclick="startSend()">ОК</button>
</footer>

<script>
    let curDesc = "комедия наблюдений, 4 строки";
    let curName = "§ Быт";

    // Инициализация Google Translate
    function googleTranslateInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
    }

    function toggle(id) {
        const el = document.getElementById(id);
        const isShow = el.style.display === 'block';
        document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
        el.style.display = isShow ? 'none' : 'block';
    }

    function setM(name, desc) {
        curName = name; curDesc = desc;
        document.getElementById('in').placeholder = `Режим: ${name} | 4 слова...`;
        toggle('modeMenu');
    }

    function push(txt, isAi, mode = "") {
        const wall = document.getElementById('wall');
        const d = document.createElement('div');
        d.className = `bubble ${isAi ? 'a' : 'u'}`;
        if (isAi) {
            d.innerHTML = `
                <span class="style-label">${mode}</span>
                <div class="edit-zone" contenteditable="true" data-style="${mode}">${txt.replace(/\n/g, '<br>')}</div>
                <div class="bubble-btns">
                    <button class="c-btn" onclick="copyText(this)">КОПИРОВАТЬ</button>
                    <button class="c-btn" onclick="saveOne(this)">В БОКС</button>
                </div>`;
        } else { d.innerText = txt; }
        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }

    // Главная функция отправки
    async function startSend() {
        const input = document.getElementById('in');
        const val = input.value.trim();
        if (!val) return;
        
        push(val, false);
        input.value = "";
        document.getElementById('mainBody').classList.add('loading');

        const key = (typeof BEUVRY_CONFIG !== 'undefined' ? (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim() : "");
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${key}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Стиль: ${curDesc}. Слова: ${val}` }] }] })
            });
            const data = await response.json();
            if (data.candidates) {
                push(data.candidates[0].content.parts[0].text, true, curName);
            }
        } catch (e) {
            push("❌ Ошибка соединения. Проверьте ключ API.", true);
        }
        document.getElementById('mainBody').classList.remove('loading');
    }

    function copyText(btn) {
        const text = btn.parentElement.parentElement.querySelector('.edit-zone').innerText;
        navigator.clipboard.writeText(text);
        btn.innerText = "ОК!"; setTimeout(() => btn.innerText = "КОПИРОВАТЬ", 1000);
    }

    function saveOne(btn) {
        const parent = btn.parentElement.parentElement;
        const text = parent.querySelector('.edit-zone').innerText;
        const mode = parent.querySelector('.edit-zone').getAttribute('data-style');
        let items = JSON.parse(localStorage.getItem('gygy_box') || '[]');
        items.push({ text: text, mode: mode, date: new Date().toLocaleString() });
        localStorage.setItem('gygy_box', JSON.stringify(items));
        btn.innerText = "ЕСТЬ!"; setTimeout(() => btn.innerText = "В БОКС", 1000);
    }

    function shareText() {
        const bubbles = document.querySelectorAll('.a .edit-zone');
        if (bubbles.length > 0) {
            const text = bubbles[bubbles.length-1].innerText;
            if (navigator.share) navigator.share({title: 'GY-GY', text: text});
            else alert("Скопируйте текст вручную");
        }
    }

    function clearWall() { document.getElementById('wall').innerHTML = ""; toggle('actMenu'); }
</script>

</body>
</html>
