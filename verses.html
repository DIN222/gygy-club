<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v6.9.0 FINAL</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 70px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; box-sizing: border-box; justify-content: space-between; position: sticky; top: 0; z-index: 9999; }
        .nav-btn { width: 50px; height: 50px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; box-shadow: 3px 3px 0 var(--gold); }
        .logo-center { font-weight: 900; font-size: 1.6rem; letter-spacing: 6px; position: absolute; left: 50%; transform: translateX(-50%); text-shadow: 2px 2px 0 #ff0000; }
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: #000; }
        .bubble { padding: 15px; max-width: 80%; font-size: 1.1rem; border: 1px solid #333; position: relative; margin-bottom: 10px; }
        .u-msg { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255,215,0,0.1); color: #fff; }
        .a-msg { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255,255,255,0.1); text-align: right; }
        footer { height: 100px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 18px; outline: none; font-size: 1.1rem; }
        .btn-send { width: 65px; height: 65px; background: var(--gold); border: none; font-size: 2.5rem; cursor: pointer; color: #000; }
        .btn-send:disabled { opacity: 0.3; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.href='ai_room_core_v8.html'">EXIT</div>
    <div class="logo-center">GY-GY</div>
    <div style="display:flex; gap:10px;">
        <div class="nav-btn" onclick="alert('BOX: Тут будут шедевры')">BOX</div>
        <div class="nav-btn">RU</div>
    </div>
</header>

<div id="wall">
    <div class="bubble u-msg">v6.9.0: Стрелка должна ожить. <br>Жду 4 слова для стеба.</div>
</div>

<footer>
    скотчь стакан мороз обман
Все модели на перекуре. Попробуй через минуту.
скотчь стакан мороз обман
Все модели на перекуре. Попробуй через минуту.
    <input type="text" id="in" placeholder="Пиши..." onkeypress="if(event.key==='Enter') send()">
    <button id="go" class="btn-send" onclick="send()">↑</button>
</footer>

<script>
    const MODELS = ['gemma-3-27b-it', 'gemini-3.1-flash-lite-preview', 'gemini-2.0-flash'];

    async function callAI(text) {
        const key = (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2 : "");
        for (let m of MODELS) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Ты циничный поэт-юморист. Стебись над словами юзера в 4 строчки нуара.\nСлова: " + text }] }] })
                });
                const d = await r.json();
                if (d.candidates) return d.candidates[0].content.parts[0].text;
            } catch (e) { console.warn(m + " курит"); }
        }
        return "Все модели на перекуре. Попробуй через минуту.";
    }

    function push(txt, isAi) {
        const wall = document.getElementById('wall');
        const d = document.createElement('div');
        d.className = `bubble ${isAi ? 'a-msg' : 'u-msg'}`;
        d.innerHTML = txt.replace(/\n/g, '<br>');
        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }

    async function send() {
        const input = document.getElementById('in');
        const btn = document.getElementById('go');
        const val = input.value.trim();

        if (!val || btn.disabled) return;

        btn.disabled = true;
        push(val, false);
        input.value = "";

        const res = await callAI(val);
        push(res, true);
        
        btn.disabled = false;
        input.focus();
    }
</script>
</body>
</html>
