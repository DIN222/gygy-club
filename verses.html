
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.1.4</title>
    <style>
        :root {
            --orange-neon: #ff8c00;
            --gold: #ffd700;
            --bg: #000;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ: ЧИСТАЯ НАВИГАЦИЯ --- */
        header {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid var(--gold);
            flex-shrink: 0;
            background: #000;
        }

        .nav-btn {
            background: none; 
            border: 1px solid var(--gold);
            color: var(--gold); 
            cursor: pointer;
            width: 50px;
            height: 40px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        /* --- ПОЛЕ ЧАТА: СТРОКИ АБСУРДА --- */
        #chat-wall {
            flex-grow: 1; 
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #000;
        }

        .message {
            padding: 5px 15px;
            border-left: 2px solid var(--orange-neon);
            color: var(--gold);
            font-size: 1.2rem;
            word-wrap: break-word;
        }

        /* --- НИЖНЯЯ СТРОКА ВВОДА --- */
        footer {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            border-top: 1px solid #222;
            background: #000;
            flex-shrink: 0;
        }

        #user-input {
            flex-grow: 1;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        #user-input:focus {
            border-color: var(--orange-neon);
        }

        #send-btn {
            background: var(--orange-neon);
            color: #000;
            border: none;
            padding: 15px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<header>
    <button class="nav-btn" onclick="window.history.back()">«</button>
    
    <div></div> <button class="nav-btn" onclick="window.history.forward()">»</button>
</header>

<div id="chat-wall">
    <div class="message">Айсберг дно приехал кот,</div>
    <div class="message">Кресло помнит тех, кто не вернулся...</div>
</div>

<footer>
    <input type="text" id="user-input" placeholder="Введите текст..." onkeypress="if(event.key==='Enter') pushMsg()">
    <button id="send-btn" onclick="pushMsg()">В ПЕЧАТЬ</button>
</footer>

<script>
    function pushMsg() {
        const input = document.getElementById('user-input');
        const wall = document.getElementById('chat-wall');
        
        if(input.value.trim() !== "") {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerText = input.value;
            wall.appendChild(msg);
            
            input.value = "";
            wall.scrollTop = wall.scrollHeight;
        }
    }
</script>

</body>
</html>
