<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY CLUB | VERSES v.2.6</title>
    <style>
        :root { 
            --gold: #ffd700; 
            --black: #000; 
            --h-unit: 55px; 
        }
        
        body { 
            background: var(--black); 
            color: var(--gold); 
            font-family: monospace; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* HEADER */
        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 10px 15px; 
            border-bottom: 2px solid var(--gold);
        }
        .header-left { display: flex; gap: 10px; align-items: center; }
        .header-right { display: flex; justify-content: flex-end; }

        /* UI ELEMENTS */
        .ui-box { 
            height: var(--h-unit); 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 15px; 
            background: transparent; 
            color: var(--gold); 
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.2s;
            font-size: 18px;
            font-weight: bold;
        }
        .ui-box:hover { background: rgba(255, 215, 0, 0.1); }
        
        /* Компактные ДВОЙНЫЕ стрелки */
        .arrow { font-size: 32px; width: 60px; font-family: sans-serif; } /* Шрифт заменен для четкости кавычек */
        .avatar { width: var(--h-unit); padding: 0; font-size: 12px; }
        .logo { font-size: 30px; font-weight: bold; letter-spacing: 6px; cursor: default; padding: 0 10px; }

        /* WALL */
        #wall { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .card { border: 1px solid #333; padding: 20px; background: #050505; max-width: 800px; margin: 0 auto; width: 95%; }
        .content { color: #fff; min-height: 80px; outline: none; margin-bottom: 15px; white-space: pre-line; font-size: 20px; }

        /* REMOTE */
        .remote { display: flex; gap: 20px; border-top: 1px solid #222; padding-top: 15px; font-size: 13px; }
        .remote-btn { cursor: pointer; color: #777; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
        .remote-btn:hover { color: var(--gold); }

        /* FOOTER */
        footer { padding: 15px; border-top: 1px solid #222; }
        .input-row { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
            height: var(--h-unit); 
        }
        input, select { 
            background: #000; 
            border: 1px solid var(--gold); 
            color: #fff; 
            padding: 0 15px; 
            font-family: inherit; 
            font-size: 18px; 
            outline: none; 
        }
        input { flex: 1; }
        select { width: 140px; cursor: pointer; }
        
        /* Компактная кнопка ОК */
        .btn-ok { width: 70px; font-size: 20px; background: rgba(255,215,0,0.1); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="ui-box arrow" onclick="location.href='ai_room_core_v8.html'">«</button>
        <div class="ui-box" style="border:none; padding: 0 5px;">RU</div>
        <div class="ui-box avatar">ID</div>
        <button class="ui-box" onclick="setIdea()">GEN</button>
    </div>
    
    <div class="logo">GY-GY</div>
    
    <div class="header-right">
        <button class="ui-box arrow" onclick="location.href='clip.html'">»</button>
    </div>
</header>

<main id="wall">
    <div class="card" id="v1">
        <div class="content" contenteditable="true">v.2.6 Machine.
Стрелки заменены на двойные затворы.
Самолет заменен на конверт. 
Стиль стал строже.</div>
        <div class="remote">
            <span class="remote-btn" onclick="bridge('CLIP', 'v1')">🎬 CLIP</span>
            <span class="remote-btn" onclick="bridge('TG', 'v1')">✉ TG</span>
            <span class="remote-btn" onclick="bridge('ARCHIVE', 'v1')">🏛️ ARCH</span>
            <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#aa0000">❌ DEL</span>
        </div>
    </div>
</main>

<footer>
    <div class="input-row">
        <select id="style">
            <option>НУАР</option>
            <option>ГИ-ГИ</option>
            <option>ROCK</option>
        </select>
        <input type="text" id="words" placeholder="Темы для синтеза...">
        <button class="ui-box btn-ok" onclick="createVerse()">OK</button>
    </div>
</footer>

<script>
    function bridge(action, id) {
        const text = document.querySelector(`#${id} .content`).innerText;
        if(action === 'CLIP') {
            localStorage.setItem('currentVerse', text);
            location.href = 'clip.html'; 
        }
        if(action === 'ARCHIVE') alert("В архиве!");
        if(action === 'TG') alert("✉ Подготовка письма в Telegram:\n\n" + text);
    }

    function createVerse() {
        const val = document.getElementById('words').value;
        if(!val) return;
        const id = 'v' + Date.now();
        const card = document.createElement('div');
        card.className = 'card';
        card.id = id;
        card.innerHTML = `
            <div class="content" contenteditable="true">Синтез: ${val}\n\nДвойной затвор, стальной конверт,\nВ Клубе гаснет ложный свет.\n✉ Отправлен стих, нажат затвор,\nМы продолжаем разговор.</div>
            <div class="remote">
                <span class="remote-btn" onclick="bridge('CLIP', '${id}')">🎬 CLIP</span>
                <span class="remote-btn" onclick="bridge('TG', '${id}')">✉ TG</span>
                <span class="remote-btn" onclick="bridge('ARCHIVE', '${id}')">🏛️ ARCH</span>
                <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#aa0000">❌ DEL</span>
            </div>`;
        document.getElementById('wall').appendChild(card);
        document.getElementById('words').value = '';
        document.getElementById('wall').scrollTop = document.getElementById('wall').scrollHeight;
    }

    function setIdea() { 
        const ideas = ["Код", "Машина", "Стиль", "Письмо"];
        document.getElementById('words').value = ideas.join(' ');
    }
</script>

</body>
</html>
