
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY v5.8: THE MONOLITH</title>
    <style>
        :root { --gold: #ffcf00; --orange-neon: #ff8c00; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }

        /* ИНТЕРЬЕР AI ROOM */
        #ai-room { 
            height: 100vh; width: 100vw; 
            background: 
                radial-gradient(circle at 50% 120%, #1a1a1a 0%, #000 70%),
                linear-gradient(to bottom, #050505 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
        }

        /* Кресло и Стол (Визуальные якоря) */
        .interior-element { position: absolute; opacity: 0.1; pointer-events: none; }
        .chair { bottom: 10%; width: 200px; height: 150px; border: 2px solid var(--gold); border-radius: 40% 40% 10% 10%; }

        .neon-display {
            color: var(--orange-neon); font-size: 28px; font-weight: 900;
            text-shadow: 0 0 15px var(--orange-neon);
            cursor: pointer; letter-spacing: 8px; margin: 20px; transition: 0.4s;
            text-decoration: none; border-bottom: 1px transparent;
        }
        .neon-display:hover { color: #fff; text-shadow: 0 0 25px #fff; border-bottom: 1px solid var(--gold); }

        /* ИНТЕРФЕЙС СТУДИИ */
        #studio { display: none; flex-direction: column; height: 100vh; background: #000; }
        
        header { 
            display: flex; align-items: center; border-bottom: 1px solid #222; 
            padding: 5px 15px; background: #050505; height: 60px;
        }

        .nav-btn { color: var(--gold); font-size: 24px; background: none; border: none; cursor: pointer; }
        .tools-row { display: flex; align-items: center; gap: 15px; flex: 1; padding: 0 15px; overflow-x: auto; }
        .tool { color: var(--gold); font-size: 11px; font-weight: 900; background: none; border: none; cursor: pointer; letter-spacing: 1px; }

        .stream-zone { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { padding: 10px; border-left: 2px solid var(--gold); max-width: 80%; line-height: 1.5; font-style: italic; }
        .msg.user { align-self: flex-end; border-left: none; border-right: 2px solid #555; text-align: right; color: #888; }

        .input-bar { display: flex; padding: 15px; background: #080808; border-top: 1px solid #222; gap: 10px; }
        input { flex: 1; background: none; border: none; border-bottom: 1px solid #333; color: #fff; font-size: 16px; outline: none; }
        .btn-ok { color: var(--gold); font-weight: 900; background: none; border: 1px solid var(--gold); padding: 5px 20px; cursor: pointer; }

        #road-sign { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid var(--gold); background: #000; color: var(--gold); padding: 20px; display: none; z-index: 999; }
    </style>
</head>
<body>

    <div id="road-sign">🛑 ТУПИК</div>

    <div id="ai-room">
        <div class="interior-element chair"></div>
        <div class="neon-display" onclick="toggleView('studio')">VERSES</div>
        <div class="neon-display" onclick="alert('TECHPARK В РАЗРАБОТКЕ')">TECHPARK</div>
        <div style="color: #222; margin-top: 40px; font-size: 10px; letter-spacing: 5px;">ARCHIVE ACCESS</div>
    </div>

    <div id="studio">
        <header>
            <button class="nav-btn" onclick="toggleView('room')">«</button>
            <div class="tools-row">
                <div class="tool" style="border: 1px solid var(--gold); padding: 4px;">文A</div>
                <div id="userID" style="color:var(--gold); font-size:10px;">ID-000</div>
                <button class="tool" onclick="publish()">В ЭФИР</button>
                <button class="tool" onclick="share()">SHARE</button>
                <button class="tool">КЛИП</button>
            </div>
            <div style="color:var(--gold); font-weight:900; margin-left:auto;">GY-GY</div>
            <button class="nav-btn" onclick="showSign()">»</button>
        </header>

        <div class="stream-zone" id="stream">
            <div class="msg">Я жду твой импульс... Каким будет первый куплет?</div>
        </div>

        <div class="input-bar">
            <input type="text" id="inp" placeholder="НАПИШИТЕ СТРОКУ..." autocomplete="off">
            <button class="btn-ok" onclick="send()">OK</button>
        </div>
    </div>

    <script>
        let stanzas = 0;

        function toggleView(view) {
            document.getElementById('ai-room').style.display = view === 'room' ? 'flex' : 'none';
            document.getElementById('studio').style.display = view === 'studio' ? 'flex' : 'none';
        }

        function showSign() {
            const s = document.getElementById('road-sign');
            s.style.display = 'block';
            setTimeout(() => s.style.display = 'none', 1200);
        }

        function send() {
            const inp = document.getElementById('inp');
            const stream = document.getElementById('stream');
            if (!inp.value.trim() || stanzas >= 4) return;

            // Сообщение пользователя
            let uMsg = document.createElement('div');
            uMsg.className = 'msg user';
            uMsg.innerText = inp.value;
            stream.appendChild(uMsg);

            // Мой абсурдный ответ (ИИ)
            setTimeout(() => {
                let aiMsg = document.createElement('div');
                aiMsg.className = 'msg';
                aiMsg.innerText = generateAbsurdResponse(inp.value);
                stream.appendChild(aiMsg);
                stream.scrollTop = stream.scrollHeight;
                stanzas++;
                if(stanzas >= 4) {
                    aiMsg.innerText += "\n\n(Лимит 4 куплетов достигнут. Время Опубликовать или начать Поэму?)";
                }
            }, 600);

            inp.value = "";
        }

        function generateAbsurdResponse(input) {
            const endings = [
                "Тень упала на оранжевый стол.",
                "Механический соловей проглотил ключ.",
                "Цифровой шелк рвется там, где тонко.",
                "Кресло помнит тех, кто не вернулся.",
                "В Беври сейчас идет дождь из байтов.",
                "Абсурд — это единственная логика GY-GY."
            ];
            return "Твой импульс принят... " + endings[Math.floor(Math.random() * endings.length)];
        }

        window.onload = () => {
            document.getElementById('userID').innerText = 'ID-' + Math.floor(Math.random()*999);
        };
    </script>
</body>
</html>
