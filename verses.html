
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CORE v33.4.3 TOTAL</title>
    <script src="config.js"></script>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 10px; position: relative; z-index: 1000; flex-shrink: 0; }
        .nav-fix { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold); color: var(--gold); cursor: pointer; text-decoration: none; font-weight: bold; }
        .header-scroll { flex-grow: 1; display: flex; align-items: center; overflow-x: auto; padding: 0 10px; gap: 15px; scrollbar-width: none; }
        
        #google_translate_element { transform: scale(0.8); transform-origin: left; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: #888; border-left: 1px solid #333; padding-left: 10px; }
        #digital-trace { color: var(--gold); font-weight: bold; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold); background: #222; }
        
        #wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        .bubble { padding: 15px; max-width: 85%; border: 1px solid #333; position: relative; animation: slide 0.3s ease-out; word-wrap: break-word; }
        @keyframes slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .u-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255,215,0,0.02); color: #fff; }
        .a-msg { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }

        .pop-menu { display: none; position: absolute; background: #111; border: var(--border); z-index: 9999; box-shadow: 0 5px 25px rgba(0,0,0,0.9); }
        .act-menu { top: 67px; left: 50%; transform: translateX(-50%); width: 190px; }
        .mode-menu { bottom: 85px; left: 10px; width: 260px; }
        .m-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.75rem; color: #fff; text-transform: uppercase; text-align: left; }
        .m-item:hover { background: var(--gold); color: #000; }
        .m-item b { display: block; color: var(--gold); }

        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; background: #000; border-top: var(--border); position: relative; z-index: 1001; }
        .btn-mode { width: 50px; height: 50px; border: 1px solid var(--gold); background: #111; color: var(--gold); cursor: pointer; font-size: 1.3rem; }
        #in { flex-grow: 1; background: #0d0d0d; border: 1px solid #333; color: var(--gold); padding: 15px; font-size: 1rem; outline: none; }
        .btn-send { width: 60px; height: 50px; background: var(--gold); border: none; color: #000; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="nav-fix" onclick="location.href='ai_room_core_v8.html'">❮</div>
    <div class="header-scroll">
        <div id="google_translate_element"></div>
        <div class="user-info"><div class="avatar"></div> <span id="digital-trace">SCANNING...</span></div>
        <div onclick="toggleMenu('actMenu')" style="cursor:pointer; color:var(--gold); font-size:0.7rem; margin-left:10px">ДЕЙСТВИЯ ▾</div>
    </div>
    <div style="font-weight:900; letter-spacing:2px; margin-left:auto">GY-GY</div>
    <div class="nav-fix" style="margin-left:10px" onclick="location.href='box_page.html'">❯</div>
</header>

<div id="wall">
    <div class="bubble a-msg">Система v33.3.0 CORE. <br>Ключ и меню активны. Жду 4 слова.</div>
</div>

<div id="actMenu" class="pop-menu act-menu">
    <div class="m-item" onclick="clearWall()">🗑 Очистить стену</div>
    <div class="m-item" onclick="alert('В BOX!')">📦 В сборник</div>
</div>

<div id="modeMenu" class="pop-menu mode-menu">
    <div class="m-item" onclick="setM('ø Абсурд', 'абсурдный юмор, 4 строки')"><b>ø Абсурд</b>Безумные связи</div>
    <div class="m-item" onclick="setM('§ Быт', 'бытовая ирония, 4 строки')"><b>§ Быт</b>Обычное</div>
    <div class="m-item" onclick="setM('† Прожарка', 'жесткий стеб, 4 строки')"><b>† Прожарка</b>Остро</div>
    <div class="m-item" onclick="setM('¶ Сатира', 'сатира, 4 строки')"><b>¶ Сатира</b>Ирония</div>
    <div class="m-item" onclick="setM('‡ Хлестко', 'уан-лайнер, 1-2 строки')"><b>‡ Хлестко</b>Точно</div>
</div>

<footer>
    <button class="btn-mode" onclick="toggleMenu('modeMenu')">▲</button>
    <input type="text" id="in" placeholder="§ Быт | 4 слова..." autocomplete="off">
    <button id="go" class="btn-send">ОК</button>
</footer>

<script>
    (function() {
        let id = localStorage.getItem('gy_trace') || 'ID-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        localStorage.setItem('gy_trace', id);
        document.getElementById('digital-trace').innerText = id;
    })();

    let curDesc = "бытовая ирония, 4 строки";
    let curName = "§ Быт";

    function toggleMenu(id) {
        const el = document.getElementById(id);
        const isVisible = el.style.display === 'block';
        document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
        el.style.display = isVisible ? 'none' : 'block';
    }

    function setM(name, desc) {
        curName = name; curDesc = desc;
        document.getElementById('in').placeholder = `Режим: ${name}...`;
        toggleMenu('modeMenu');
    }

    async function callAI(text) {
        const p1 = (typeof BEUVRY_CONFIG !== 'undefined') ? BEUVRY_CONFIG.PART_1 : "";
        const p2 = (typeof BEUVRY_CONFIG !== 'undefined') ? BEUVRY_CONFIG.PART_2 : "";
        const key = (p1 + p2).replace(/["'\s]/g, "");
        const model = (typeof BEUVRY_CONFIG !== 'undefined') ? BEUVRY_CONFIG.MODEL : "gemini-1.5-flash";
        const basePrompt = (typeof BEUVRY_CONFIG !== 'undefined') ? BEUVRY_CONFIG.PROMPT : "";

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `${basePrompt}\nРежим: ${curDesc}. Слова: ${text}` }] }] })
            });
            const d = await r.json();
            if (d.candidates) return d.candidates[0].content.parts[0].text.trim();
        } catch (e) { console.error(e); }
        return "🚬 Модели на перекуре. Проверь ключ.";
    }

    const wall = document.getElementById('wall');
    const input = document.getElementById('in');
    const btn = document.getElementById('go');

    btn.onclick = async () => {
        const val = input.value.trim(); if(!val || btn.disabled) return;
        btn.disabled = true; 
        const uDiv = document.createElement('div'); uDiv.className = 'bubble u-msg'; uDiv.innerText = val;
        wall.appendChild(uDiv); input.value = ""; wall.scrollTop = wall.scrollHeight;
        
        const res = await callAI(val);
        const aDiv = document.createElement('div'); aDiv.className = 'bubble a-msg'; 
        aDiv.innerHTML = `<small style="opacity:0.4">${curName}</small><br>${res.replace(/\n/g, '<br>')}`;
        wall.appendChild(aDiv); btn.disabled = false; wall.scrollTop = wall.scrollHeight;
    };

    input.onkeypress = (e) => { if(e.key==='Enter') btn.click(); };
    function clearWall() { document.getElementById('wall').innerHTML = ""; toggleMenu('actMenu'); }
    document.onclick = (e) => { if(!e.target.closest('header') && !e.target.closest('footer')) document.querySelectorAll('.pop-menu').forEach(m => m.style.display='none'); };
</script>
</body>
</html>
