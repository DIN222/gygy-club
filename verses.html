<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY CLUB | VERSES v.2.3</title>
    <style>
        :root { --gold: #ffd700; --black: #000; --h-unit: 42px; }
        body { background: var(--black); color: var(--gold); font-family: monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        /* HEADER STRUCTURE */
        header { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 10px 20px; 
            border-bottom: 1px solid var(--gold);
        }
        .header-left { display: flex; gap: 15px; align-items: center; }
        .header-right { display: flex; justify-content: flex-end; }

        /* UI ELEMENTS */
        .ui-box { 
            height: var(--h-unit); 
            border: 1px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 15px; 
            background: transparent; 
            color: var(--gold); 
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .ui-box:hover { background: rgba(255, 215, 0, 0.1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        
        .arrow { font-size: 24px; width: 60px; font-weight: bold; }
        .avatar { width: var(--h-unit); padding: 0; font-size: 10px; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 6px; cursor: default; }

        /* WALL */
        #wall { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .card { border: 1px solid #333; padding: 15px; background: #050505; max-width: 600px; margin: 0 auto; width: 100%; }
        .card:hover { border-color: var(--gold); }
        .content { color: #fff; min-height: 60px; outline: none; margin-bottom: 10px; white-space: pre-line; font-size: 16px; }

        /* REMOTE */
        .remote { display: flex; gap: 15px; border-top: 1px solid #222; padding-top: 10px; font-size: 11px; }
        .remote-btn { cursor: pointer; color: #666; transition: 0.2s; }
        .remote-btn:hover { color: var(--gold); }

        /* FOOTER */
        footer { padding: 20px; border-top: 1px solid #222; background: var(--black); }
        .input-row { display: flex; gap: 10px; max-width: 800px; margin: 0 auto; height: var(--h-unit); }
        input, select { background: #000; border: 1px solid var(--gold); color: #fff; padding: 0 10px; font-family: inherit; flex: 1; outline: none; }
        select { flex: 0.3; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="ui-box arrow" onclick="location.href='ai_room_core_v8.html'">⟵</button>
        <div class="ui-box" style="border:none">RU/EN</div>
        <div class="ui-box avatar">ID:01</div>
        <button class="ui-box" onclick="setIdea()">ГЕНЕРАТОР</button>
    </div>
    
    <div class="logo">GY-GY</div>
    
    <div class="header-right">
        <button class="ui-box arrow" onclick="location.href='clip.html'">⟶</button>
    </div>
</header>

<main id="wall">
    <div class="card" id="v1">
        <div class="content" contenteditable="true">Протокол v.2.3 запущен. 
Отредактируйте текст и отправьте его в CLIP или АРХИВ. 
Стрелки подключены к шлюзам.</div>
        <div class="remote">
            <span class="remote-btn" onclick="bridge('CLIP', 'v1')">🎬 CLIP</span>
            <span class="remote-btn" onclick="bridge('TG', 'v1')">✈️ TELEGRAM</span>
            <span class="remote-btn" onclick="bridge('ARCHIVE', 'v1')">🏛️ ARCHIVE</span>
            <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#aa0000">❌ DEL</span>
        </div>
    </div>
</main>

<footer>
    <div class="input-row">
        <select id="style">
            <option>НУАР-ДЖАЗ</option>
            <option>ГИ-ГИ</option>
            <option>ОПТИМИЗМ</option>
        </select>
        <input type="text" id="words" placeholder="Введите 4 слова для синтеза...">
        <button class="ui-box" style="width:80px; font-weight:bold;" onclick="createVerse()">OK</button>
    </div>
</footer>

<script>
    // Логика передачи данных между экранами
    function bridge(action, id) {
        const text = document.querySelector(`#${id} .content`).innerText;
        
        if(action === 'CLIP') {
            localStorage.setItem('currentVerse', text);
            console.log("Данные переданы в CLIP:", text);
            location.href = 'clip.html'; 
        }
        
        if(action === 'ARCHIVE') {
            alert("Куплет сохранен в архив 'Чердак'");
        }
        
        if(action === 'TG') {
            window.open("https://t.me/share/url?url=" + encodeURIComponent(text));
        }
    }

    // Создание новой карточки на стене
    function createVerse() {
        const val = document.getElementById('words').value;
        if(!val) return;
        const id = 'v' + Date.now();
        const card = document.createElement('div');
        card.className = 'card';
        card.id = id;
        
        // Имитация синтеза
        const aiText = `Слова импульса: ${val}\n\nВ Клубе гаснут огни,\nКони пьют свой нектар.\nМы в системе одни,\nЛовим творческий дар.`;
        
        card.innerHTML = `
            <div class="content" contenteditable="true">${aiText}</div>
            <div class="remote">
                <span class="remote-btn" onclick="bridge('CLIP', '${id}')">🎬 CLIP</span>
                <span class="remote-btn" onclick="bridge('TG', '${id}')">✈️ TG</span>
                <span class="remote-btn" onclick="bridge('ARCHIVE', '${id}')">🏛️ ARCHIVE</span>
                <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#aa0000">❌ DEL</span>
            </div>`;
        document.getElementById('wall').appendChild(card);
        document.getElementById('words').value = '';
        document.getElementById('wall').scrollTop = document.getElementById('wall').scrollHeight;
    }

    function setIdea() { 
        const ideas = ["Луна", "Джаз", "Копыто", "Синтез", "Вакуум", "Роза"];
        const random = () => ideas[Math.floor(Math.random() * ideas.length)];
        document.getElementById('words').value = `${random()} ${random()} ${random()} ${random()}`; 
    }
</script>

</body>
</html>
