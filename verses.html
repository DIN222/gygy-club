
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY v5.3: CONTROL PANEL</title>
    <style>
        :root { --orange: #ff8c00; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ВЕРХНЯЯ ПАНЕЛЬ ИНСТРУМЕНТОВ */
        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
            padding: 5px;
            background: #050505;
            height: 50px;
        }

        .nav-arrow { 
            color: var(--orange); 
            font-size: 24px; 
            background: none; 
            border: none; 
            cursor: pointer; 
            padding: 0 10px;
            font-weight: bold;
        }

        /* Контейнер для инструментов со скроллом для мобилок */
        .tools-scroll {
            display: flex;
            align-items: center;
            gap: 15px;
            overflow-x: auto;
            scrollbar-width: none; /* Скрываем скроллбар */
            padding: 0 10px;
            flex: 1;
        }
        .tools-scroll::-webkit-scrollbar { display: none; }

        .tool-item {
            color: var(--orange);
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 900;
            white-space: nowrap;
            cursor: pointer;
            letter-spacing: 1px;
            background: none;
            border: none;
        }

        /* АВАТАР */
        .user-avatar {
            width: 30px;
            height: 30px;
            border: 1px solid var(--orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
        }

        /* ЯЗЫКОВАЯ ПАНЕЛЬ (Гугл-мини) */
        #google_translate_element { min-width: 40px; overflow: hidden; }
        .goog-te-gadget-simple { background: none !important; border: none !important; color: var(--orange) !important; }

        /* ЗОНА ТВОРЧЕСТВА */
        .studio-zone { flex: 1; overflow-y: auto; padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .poem-paper { font-size: 22px; line-height: 1.4; color: #eee; font-style: italic; white-space: pre-wrap; }
        
        /* ВВОД */
        .input-area { padding: 20px; background: #000; border-top: 1px solid #111; }
        textarea { width: 100%; background: none; border: none; border-bottom: 1px solid #333; color: #fff; text-align: center; font-size: 18px; padding: 10px; outline: none; margin-bottom: 10px; }
        textarea:focus { border-bottom-color: var(--orange); }

        .btn-add { color: var(--orange); background: none; border: none; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; width: 100%; letter-spacing: 5px; padding: 10px; }
        
        /* СИГНАЛЬНЫЙ ЗНАК */
        #road-sign {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border: 2px solid red;
            display: none;
            z-index: 1000;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

    <div id="road-sign">⛔<br><span style="font-size:14px; color:red;">ПРОЕЗД ЗАКРЫТ</span></div>

    <header class="control-panel">
        <button class="nav-arrow" onclick="goNav('back')">«</button>
        
        <div class="tools-scroll">
            <div id="google_translate_element"></div>
            
            <div class="user-avatar" id="userIcon">ID</div>

            <button class="tool-item" id="publishBtn">В ЭФИР</button>
            <button class="tool-item" onclick="shareFriend()">SHARE</button>
            <button class="tool-item" id="clipBtn">КЛИП</button>
            
            <div class="tool-item" style="color:#fff; opacity:0.5;">GY-GY</div>
        </div>

        <button class="nav-arrow" onclick="goNav('forward')">»</button>
    </header>

    <div class="studio-zone">
        <div id="poemDisplay" class="poem-paper">...</div>
        <div style="color: #444; font-size: 10px; margin-top: 20px;" id="countText">КУПЛЕТОВ: 0</div>
    </div>

    <div class="input-area">
        <textarea id="poemInput" placeholder="ИМПУЛЬС..."></textarea>
        <button class="btn-add" id="addBtn">ДОБАВИТЬ</button>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage:'ru', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        let stanzas = [];
        
        // НАВИГАЦИЯ СО ЗНАКОМ
        function goNav(dir) {
            const sign = document.getElementById('road-sign');
            if (dir === 'back') {
                if (window.history.length > 1) history.back();
                else showSign("⛔ ПРОЕЗД ЗАКРЫТ");
            } else {
                // Вперед обычно некуда, если мы только зашли
                showSign("🛑 ТУПИК");
            }
        }

        function showSign(text) {
            const sign = document.getElementById('road-sign');
            sign.innerHTML = text;
            sign.style.display = 'block';
            setTimeout(() => { sign.style.display = 'none'; }, 1500);
        }

        // ЛОГИКА СТИХА
        const input = document.getElementById('poemInput');
        const display = document.getElementById('poemDisplay');
        const addBtn = document.getElementById('addBtn');

        addBtn.onclick = () => {
            const text = input.value.trim();
            if (text) {
                stanzas.push(text);
                input.value = "";
                display.innerText = stanzas.join('\n\n');
                document.getElementById('countText').innerText = `КУПЛЕТОВ: ${stanzas.length}`;
            }
        };

        // ТЕЛЕГРАМ ШЕРИНГ
        function shareFriend() {
            const text = stanzas.join('\n\n');
            if (!text) return alert("ПУСТО");
            window.open(`https://t.me/share/url?url=GY-GY&text=${encodeURIComponent(text)}`, '_blank');
        }

        // ОСТАЛЬНЫЕ КНОПКИ (ЗАГЛУШКИ)
        document.getElementById('publishBtn').onclick = () => alert("СОХРАНЕНО В ЖУРНАЛ");
        document.getElementById('clipBtn').onclick = () => alert("ПЕРЕХОД В МАСТЕРСКУЮ...");

    </script>
</body>
</html>
