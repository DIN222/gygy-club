
<!DOCTYPE html><html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.5.9</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; flex-shrink: 0; padding: 0 5px; box-sizing: border-box; }
        .btn-header { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: var(--border); color: var(--gold); background: none; cursor: pointer; flex-shrink: 0; font-size: 1.5rem; }
        .scroll-zone { flex-grow: 1; display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; }
        .item-fix { height: 44px; min-width: 80px; border: var(--border); color: var(--gold); background: none; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; justify-content: center; white-space: nowrap; flex-shrink: 0; cursor: pointer; text-transform: uppercase; }
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { padding: 12px; max-width: 80%; font-size: 1.2rem; line-height: 1.4; border-radius: 2px; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; color: #eee; background: rgba(255, 255, 255, 0.1); font-style: italic; text-align: right; }
        footer { height: 85px; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-top: 1px solid #333; background: #000; flex-shrink: 0; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 14px; outline: none; font-size: 1rem; font-family: inherit; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); color: #000; border: none; font-size: 1.8rem; cursor: pointer; font-weight: 900; }
        .btn-action { height: 50px; padding: 0 15px; border: var(--border); color: var(--gold); background: none; font-size: 0.7rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #google_translate_element { height: 44px; border: var(--border); display: flex; align-items: center; overflow: hidden; }
    </style></head><body>
<header>
    <div class="btn-header" onclick="location.href='ai_room_core_v8.html'">«</div>
    <div class="scroll-zone">
        <div id="google_translate_element"></div>
        <button class="item-fix" onclick="alert('Архив...')">СБОРНИК</button>
        <div class="item-fix">ID: 001</div>
        <div class="item-fix" onclick="aiAction('Проверка связи')">
            <svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:var(--gold);"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-9h10v2H7z"/></svg>
        </div>
    </div>
    <div style="font-size: 0.8rem; padding: 0 10px; font-weight: 900;">GY-GY</div>
</header>
<div id="chat-wall"><div class="msg user-msg">v5.5.9. Модель прописана по стандарту Google.</div></div>
<footer>
    <input type="text" id="user-in" placeholder="Введите 4 слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
    <button class="btn-action" onclick="alert('Сохранено')">В СБОРНИК</button>
</footer>
<script>
    async function aiAction(t) {
        const w = document.getElementById('chat-wall');
        const m = document.createElement('div');
        m.className = 'msg ai-msg'; m.innerHTML = "<i>...</i>";
        w.appendChild(m); w.scrollTop = w.scrollHeight;
        
        const k = "AIzaSyDLQrvoPx4AYyfSKD0BWvl3-zc2ROfCa-E"; 
        
        // ШЕФ, ЭТО ПРАВИЛЬНЫЙ ФОРМАТ ПО ДОКУМЕНТАЦИИ:
        const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + k;

        try {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Ты нуарный поэт Беври. Коротко и жестко ответь 4-стишием на русском на: " + t }] }] })
            });
            const d = await r.json();
            if (d.error) {
                m.innerHTML = "Ошибка: " + d.error.message;
            } else if (d.candidates) {
                m.innerHTML = d.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            }
        } catch (e) { m.innerHTML = "Сбой сети."; }
        w.scrollTop = w.scrollHeight;
    }
    function send() {
        const i = document.getElementById('user-in');
        if(i.value.trim()){
            const w = document.getElementById('chat-wall');
            const m = document.createElement('div');
            m.className = 'msg user-msg'; m.innerText = i.value;
            w.appendChild(m); aiAction(i.value); i.value = "";
        }
    }
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body></html>
