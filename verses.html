
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY v4.36: GOLDEN AUTH</title>
   <style>
    :root {
        --gold: #FFD700;
        --gold-dark: #B8860B;
        --bg: #000000;
        --btn-size: 60px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0; padding: 0;
        background: var(--bg);
        font-family: 'Georgia', serif;
        color: var(--gold);
        display: flex; flex-direction: column;
        height: 100vh; overflow: hidden;
        top: 0px !important;
    }

    /* ШАПКА */
    header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 15px;
        border-bottom: 3px solid var(--gold);
        background: #000;
        z-index: 1000;
    }

    .nav-box { display: flex; align-items: center; gap: 8px; flex: 1; }

    .btn-nav {
        width: var(--btn-size); height: var(--btn-size);
        background: var(--bg); border: 3px solid var(--gold);
        color: var(--gold); font-size: 30px; font-weight: 900;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
    }

    /* МЯГКАЯ КОРРЕКЦИЯ GOOGLE — ДАЕМ ИКОНКЕ ВЫЙТИ */
    #google_translate_element {
        border: 3px solid var(--gold) !important;
        height: var(--btn-size) !important;
        background: #000 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-width: 80px;
        overflow: visible !important; /* ВАЖНО: разрешаем показ элементов */
    }

    /* Сам виджет внутри нашей рамки */
    .goog-te-gadget-simple {
        background-color: transparent !important;
        border: none !important;
        padding: 5px !important;
        display: flex !important;
        align-items: center !important;
        cursor: pointer;
    }

    /* Возвращаем иконку-планету, если она была скрыта */
    .goog-te-gadget-icon {
        display: inline-block !important;
        width: 24px !important;
        height: 24px !important;
        filter: sepia(100%) saturate(500%) brightness(120%) !important; /* Делаем ЗОЛОТОЙ */
        margin-right: 5px !important;
    }

    /* Текст внутри (RU/EN) */
    .goog-te-menu-value span {
        color: var(--gold) !important;
        font-weight: bold !important;
        font-size: 18px !important;
        text-decoration: none !important;
    }

    /* Прячем только то, что реально мешает — верхние панели */
    .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame { display: none !important; }
    body { top: 0px !important; }

    /* ОСТАЛЬНОЕ ОСТАВЛЯЕМ (ЛОГО И СТРИМ) */
    .logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-align: right; line-height: 1; }

    #stream {
        flex: 1; overflow-y: auto; padding: 20px;
        font-size: 22px; line-height: 1.6;
        background: #000;
    }

    .msg { margin-bottom: 30px; display: flex; animation: fadeIn 0.4s ease-out; }
    .avatar {
        width: 50px; height: 50px; border: 2px solid var(--gold);
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; font-weight: bold; margin-right: 15px; flex-shrink: 0;
    }

    .msg-body-wrapper { flex: 1; border-left: 2px solid var(--gold-dark); padding-left: 15px; }

    .input-zone { padding: 20px; background: #000; border-top: 3px solid var(--gold); }
    #inp {
        width: 100%; background: #111; border: 2px solid var(--gold-dark);
        color: var(--gold); font-size: 24px; padding: 18px; outline: none;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

   <header>
    <div class="nav-box" style="flex: 1;">
        <button class="btn-nav" onclick="goBackOrHome()">«</button>
        
        <div id="google_translate_element" style="min-width: 80px; height: 60px; display: flex; align-items: center; justify-content: center; overflow: visible !important;"></div>
        
        <button class="btn-nav" onclick="history.forward()">»</button>
    </div>
    <div class="logo">GY-GY <br><span style="font-size:10px; color:var(--gold-dark);">v4.3</span></div>
</header>

<div class="input-zone" style="display: flex; gap: 10px;">
    <input type="text" id="inp" placeholder="ВАШ ИМПУЛЬС..." autocomplete="off" style="flex: 1;">
    <button id="sendBtn" class="btn-nav" style="width: 70px; font-size: 24px;">OK</button>
</div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ru',
                includedLanguages: 'en,de,fr,es,zh-CN',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const getKey = () => "AIzaSyBFmETf-8mg5iMSjgg4rKNL_k3vwb-YGPE"; 
        let count = 0;

        function addMsg(author, text, type) {
            count++;
            const s = document.getElementById('stream');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            const isAI = (author === 'GEMINI');
            const color = isAI ? 'var(--gold)' : 'var(--gold-dark)';
            
            div.innerHTML = `
                <div class="avatar" style="border-color:${color}; color:${color}">${author[0]}</div>
                <div class="msg-body-wrapper">
                    ${isAI ? '<div class="badge">PASS: GEN-ID / OK</div>' : ''}
                    <div style="font-size:14px; color:var(--gold-dark); margin-bottom:5px;">@${author} [${count}]</div>
                    <div class="msg-text">${text}</div>
                </div>
            `;
            s.appendChild(div);
            s.scrollTop = s.scrollHeight;
        }

        async function aiPost(userText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${getKey()}`;
            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Напиши 4 строки абсурдного техно-нуара про: ${userText}` }] }] })
                });
                const data = await res.json();
                const result = data.candidates[0].content.parts[0].text.trim().toUpperCase();
                addMsg('GEMINI', result, 'ai');
            } catch (e) { addMsg('GEMINI', "СИСТЕМА ПЕРЕГРУЖЕНА.", 'ai'); }
        }

        document.getElementById('inp').onkeypress = (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                const val = e.target.value.trim();
                addMsg('АВТОР', val, 'user');
                e.target.value = "";
                aiPost(val);
            }
        };
    </script>
</body>
</html>
