<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY CLUB | AI Room: Verses8.8</title>
    <style>
        body {
            background-color: #000; /* На черном видна только суть */
            color: #ffd700; 
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ПОСТОЯННЫЙ ВЕРХНИЙ БЛОК (ШАПКА КЛУБА) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #0a0a0a;
            border-bottom: 2px solid #222;
        }

        .logo-area {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #ffd700;
        }

        .nav-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn-nav {
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 5px 10px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 10px;
        }

        .btn-nav:hover {
            color: #ffd700;
            border-color: #ffd700;
        }

        /* ПАНЕЛЬ ГЕНЕРАТОРА (ВТОРОЙ УРОВЕНЬ) */
        #generator-bar {
            height: 50px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #ffd700;
        }

        .vector-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 4px 12px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 10px;
            font-size: 12px;
        }

        #idea-display {
            flex-grow: 1;
            text-align: center;
            font-style: italic;
            color: #ffd700;
            font-size: 14px;
        }

        /* РАБОЧЕЕ ПРОСТРАНСТВО */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #verse-input {
            width: 70%;
            height: 300px;
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 30px;
            font-size: 20px;
            outline: none;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }

        /* ЭФФЕКТ ГЛУБИНЫ */
        .depth-active {
            text-shadow: 0 0 15px #ffd700;
            transition: 2s ease-in-out;
        }

        /* ПОДВАЛ / СТАТУС */
        footer {
            padding: 10px;
            font-size: 10px;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">GY-GY</div>
        
        <div class="nav-controls">
            <div class="lang-panel">
                <button class="btn-nav">RU</button>
                <button class="btn-nav">EN</button>
            </div>
            <button class="btn-nav" onclick="history.back()">← НАЗАД</button>
        </div>
    </header>

    <div id="generator-bar">
        <button class="vector-btn" onclick="spawnSpark('impulse')">⚡ ИМПУЛЬС</button>
        <div id="idea-display">На черном видна только суть... выбери вектор.</div>
        <button class="vector-btn" onclick="spawnSpark('depth')">🌀 ГЛУБИНА</button>
        <button class="vector-btn" onclick="spawnSpark('gy-gy')">🃏 ГИ-ГИ</button>
    </div>

    <main>
        <textarea id="verse-input" placeholder="Лови искру или пиши свой полет..."></textarea>
        <button class="vector-btn" style="margin-top: 30px; padding: 10px 40px;" onclick="alert('Lyria 3 на связи...')">🎬 СОЗДАТЬ КЛИП</button>
    </main>

    <footer>GY-GY CLUB © 2026 | AI ROOM | VERSES.HTML</footer>

    <script>
        const library = {
            impulse: ["Взлетай сейчас! Пропасть — это просто отсутствие пола.", "Твой стакан полон на 100%, остальное — пена."],
            depth: ["Суть тяжелее слов. Погружайся.", "В тишине слышно, как растет твоя амбиция."],
            'gy-gy': ["Если рифма хромает — подари ей костыль юмора.", "Конь на входе просил передать: пиши веселее!"]
        };

        function spawnSpark(v) {
            const disp = document.getElementById('idea-display');
            const input = document.getElementById('verse-input');
            const spark = library[v][Math.floor(Math.random() * library[v].length)];
            
            disp.innerText = spark;
            
            // Визуальный отклик на "Глубину"
            if(v === 'depth') {
                input.classList.add('depth-active');
            } else {
                input.classList.remove('depth-active');
            }
        }
    </script>
</body>
</html>
