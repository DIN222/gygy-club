
<!DOCTYPE html><html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.7.0 Scanner</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 15px; box-sizing: border-box; justify-content: space-between; }
        .btn-header { width: 44px; height: 44px; border: var(--border); color: var(--gold); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px; border-radius: 2px; font-size: 1.1rem; line-height: 1.4; max-width: 85%; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255, 255, 255, 0.1); text-align: right; font-style: italic; }
        .debug-info { font-size: 0.8rem; color: #888; margin-top: 5px; border-top: 1px dashed #444; padding-top: 5px; }
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: 1px solid #333; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 12px; font-family: inherit; outline: none; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); color: #000; border: none; font-size: 1.5rem; cursor: pointer; font-weight: bold; }
    </style></head><body>

<header>
    <button class="btn-header" onclick="location.href='ai_room_core_v8.html'">«</button>
    <div style="font-weight: 900; letter-spacing: 1px;">GY-GY SCANNER</div>
    <div style="font-size: 0.7rem; opacity: 0.5;">v5.7.0</div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">Система запущена. Ищу ключи в config.js...</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Введите слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
</footer>

<script>
    function getAvailableVars() {
        // Собираем все глобальные переменные, которые НЕ являются стандартными функциями браузера
        const keys = Object.keys(window).filter(key => {
            try {
                return !key.includes('webkit') && !key.includes('window') && typeof window[key] !== 'function';
            } catch(e) { return false; }
        });
        return keys.join(', ');
    }

    async function aiAction(t) {
        const wall = document.getElementById('chat-wall');
        const msg = document.createElement('div');
        msg.className = 'msg ai-msg';
        
        // Пытаемся найти ключ под разными именами
        const keyName = ['GEMINI_KEY', 'API_KEY', 'MY_KEY', 'google_key', 'GEMINI_API_KEY'].find(name => window[name]);
        const ACTIVE_KEY = window[keyName];

        if (!ACTIVE_KEY) {
            msg.innerHTML = `<b>Ключ не найден!</b><br>
                             <div class="debug-info">В config.js найдено: [${getAvailableVars()}]<br>
                             Я искал: GEMINI_KEY, API_KEY, MY_KEY...</div>`;
            wall.appendChild(msg);
            return;
        }

        msg.innerHTML = "<i>Беври зажигает спичку...</i>";
        wall.appendChild(msg);
        wall.scrollTop = wall.scrollHeight;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${ACTIVE_KEY}`;

        try {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Ты нуарный поэт Беври. Ответь только жестким 4-стишием на русском на: " + t }] }] })
            });
            const d = await r.json();
            if (d.error) {
                msg.innerHTML = "Ошибка API: " + d.error.message;
            } else {
                msg.innerHTML = d.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            }
        } catch (e) { msg.innerHTML = "Сбой сети."; }
        wall.scrollTop = wall.scrollHeight;
    }

    function send() {
        const i = document.getElementById('user-in');
        if(i.value.trim()) {
            const m = document.createElement('div');
            m.className = 'msg user-msg'; m.innerText = i.value;
            document.getElementById('chat-wall').appendChild(m);
            aiAction(i.value); i.value = "";
        }
    }
</script>
</body></html>
