
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.3.2</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        header { height: 60px; display: flex; align-items: center; border-bottom: var(--border); background: #000; flex-shrink: 0; z-index: 1000; }
        .anchor-btn { width: 55px; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 1.5rem; cursor: pointer; text-decoration: none; flex-shrink: 0; border: none; background: transparent; }

        .scroll-area { flex-grow: 1; display: flex; align-items: center; gap: 12px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; position: relative; }
        .scroll-area::-webkit-scrollbar { display: none; }

        /* --- МАГИЧЕСКАЯ ИКОНКА --- */
        .google-wrapper {
            position: relative;
            width: 42px; height: 42px;
            border: var(--border);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden;
        }
        .google-wrapper svg { width: 24px; height: 24px; fill: var(--gold); position: absolute; z-index: 1; pointer-events: none; }
        
        /* Прячем настоящий виджет прямо ПОВЕРХ иконки */
        #google_translate_element {
            position: absolute;
            z-index: 2;
            opacity: 0.01; /* Почти прозрачный, но кликабельный */
            transform: scale(3); /* Увеличиваем, чтобы зона клика попала точно в иконку */
            cursor: pointer;
        }

        .btn-item { height: 36px; border: var(--border); color: var(--gold); background: transparent; padding: 0 12px; font-weight: bold; white-space: nowrap; flex-shrink: 0; font-size: 0.8rem; cursor: pointer; }

        .right-zone { display: flex; align-items: center; height: 100%; flex-shrink: 0; background: #000; }
        .logo { font-size: 0.8rem; font-weight: 900; padding: 0 10px; border-left: 1px solid #333; }

        /* ЧАТ */
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-left: 2px solid var(--gold); font-size: 1.2rem; background: rgba(255, 215, 0, 0.03); line-height: 1.4; }

        /* ФУТЕР */
        footer { height: 85px; display: flex; align-items: center; padding: 0 12px; gap: 10px; border-top: 1px solid #222; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 15px; outline: none; font-size: 1rem; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); color: #000; border: none; font-size: 1.8rem; cursor: pointer; }
        .btn-arch { height: 50px; background: transparent; color: var(--gold); border: var(--border); padding: 0 15px; font-size: 0.7rem; cursor: pointer; }

        /* Убираем мусор Google */
        .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="anchor-btn">«</a>
    <div class="scroll-area">
        <div class="google-wrapper">
            <svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
            <div id="google_translate_element"></div>
        </div>
        <button class="btn-item" onclick="alert('Архив пуст')">Сборник</button>
        <div class="btn-item">ID: 001</div>
    </div>
    <div class="right-zone">
        <div class="logo">GY-GY</div>
        <button class="anchor-btn" onclick="window.history.forward()">»»</button>
    </div>
</header>

<div id="chat-wall">
    <div class="msg">Стена готова. Четыре слова — в печать.</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Четыре любых слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
    <button class="btn-arch" onclick="alert('В Сборнике')">В СБОРНИК</button>
</footer>

<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ru',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }

    function send() {
        const input = document.getElementById('user-in');
        if(input.value.trim()){
            const m = document.createElement('div');
            m.className = 'msg';
            m.innerText = input.value;
            document.getElementById('chat-wall').appendChild(m);
            input.value = "";
            document.getElementById('chat-wall').scrollTop = 99999;
        }
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
