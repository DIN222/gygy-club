
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.1.2</title>
    <style>
        :root {
            --orange-neon: #ff8c00;
            --gold: #ffd700;
            --bg: #000;
            --panel-bg: rgba(15, 15, 15, 0.98);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ v5.1.2 (ЧИСТАЯ НАВИГАЦИЯ) --- */
        header {
            height: 60px;
            display: flex;
            justify-content: space-between; /* Стрелки по краям */
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid var(--gold);
            background: var(--panel-bg);
            flex-shrink: 0;
            z-index: 1000;
        }

        .nav-btn {
            background: none; 
            border: 1px solid var(--gold);
            color: var(--gold); 
            cursor: pointer;
            width: 50px;
            height: 40px;
            font-weight: bold;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .nav-btn:hover { background: var(--gold); color: #000; }

        /* --- ПОЛЕ ЧАТА --- */
        #chat-wall {
            flex-grow: 1; 
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #000;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-left: 3px solid var(--orange-neon);
            background: rgba(255, 140, 0, 0.05);
            color: var(--gold);
            font-size: 1.2rem;
        }

        /* --- НИЖНЯЯ СТРОКА ВВОДА --- */
        footer {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            border-top: 1px solid #222;
            background: var(--panel-bg);
            flex-shrink: 0;
        }

        #user-input {
            flex-grow: 1;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 15px;
            font-family: inherit;
            outline: none;
            border-radius: 4px;
        }

        #send-btn {
            background: var(--orange-neon);
            color: #000;
            border: none;
            padding: 15px 20px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<header>
    <button class="nav-btn" onclick="history.back()">«</button>

    <div></div>

    <button class="nav-btn" onclick="history.forward()">»</button>
</header>

<div id="chat-wall">
    <div class="message">Айсберг дно приехал кот,</div>
    <div class="message">Кресло помнит тех, кто не вернулся...</div>
</div>

<footer>
    <input type="text" id="user-input" placeholder="Введите абсурд..." onkeypress="if(event.key==='Enter') pushMsg()">
    <button id="send-btn" onclick="pushMsg()">В ПЕЧАТЬ</button>
</footer>

<script>
    function pushMsg() {
        const input = document.getElementById('user-input');
        const wall = document.getElementById('chat-wall');
        if(input.value.trim() !== "") {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerText = input.value;
            wall.appendChild(msg);
            input.value = "";
            wall.scrollTop = wall.scrollHeight;
        }
    }
</script>

</body>
</html>
