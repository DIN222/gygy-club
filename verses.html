<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v7.3.0 DIAGNOSTIC</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; justify-content: space-between; position: relative; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.4rem; letter-spacing: 5px; position: absolute; left: 50%; transform: translateX(-50%); }
        .nav-btn { width: 45px; height: 45px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
        
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #000; }
        .msg { padding: 12px; max-width: 85%; border: 1px solid #333; position: relative; font-size: 1.1rem; }
        .u { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255,215,0,0.05); }
        .a { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }

        /* Красная панель позора для ошибок */
        #debug-box { background: #300; color: #ff4444; padding: 10px; font-size: 12px; border-top: 1px solid #ff4444; display: none; word-break: break-all; }

        footer { height: 90px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 15px; outline: none; font-size: 1.1rem; }
        .btn-send { width: 60px; height: 60px; background: var(--gold); border: none; font-size: 2rem; cursor: pointer; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.reload()">REF</div>
    <div class="logo">GY-GY</div>
    <div class="nav-btn">RU</div>
</header>

<div id="wall">
    <div class="msg a">v7.3.0: Режим отладки. <br>Если я молчу — смотри на красную полоску внизу.</div>
</div>

<div id="debug-box"></div>

<footer>
    <input type="text" id="in" placeholder="Слова..." onkeypress="if(event.key==='Enter') send()">
    <button id="go" class="btn-send" onclick="send()">↑</button>
</footer>

<script>
    const MODELS = ['gemini-1.5-flash', 'gemini-2.0-flash-exp'];

    function getK() {
        if (typeof BEUVRY_CONFIG === 'undefined') return "ERROR_NO_CONFIG";
        const k = (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim();
        return k || "ERROR_EMPTY_KEY";
    }

    async function callAI(text) {
        const key = getK();
        const dbg = document.getElementById('debug-box');
        dbg.style.display = 'none';

        if (key.includes("ERROR")) {
            dbg.style.display = 'block';
            dbg.innerText = "Критическая ошибка: Файл config.js не найден или пуст!";
            return "Беври потерял ключи от клуба.";
        }

        for (let m of MODELS) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Стебись над словами в 4 строки нуара: " + text }] }] })
                });
                
                const data = await r.json();

                if (data.error) {
                    dbg.style.display = 'block';
                    dbg.innerText = `Google Error (${m}): ${data.error.code} - ${data.error.message}`;
                    continue; 
                }

                if (data.candidates) return data.candidates[0].content.parts[0].text;
            } catch (e) {
                dbg.style.display = 'block';
                dbg.innerText = "Ошибка сети: Не могу достучаться до серверов.";
            }
        }
        return "Все модели на перекуре.";
    }

    function push(txt, isAi) {
        const d = document.createElement('div');
        d.className = `msg ${isAi ? 'a' : 'u'}`;
        d.innerHTML = txt.replace(/\n/g, '<br>');
        document.getElementById('wall').appendChild(d);
        document.getElementById('wall').scrollTop = document.getElementById('wall').scrollHeight;
    }

    async function send() {
        const i = document.getElementById('in');
        const b = document.getElementById('go');
        if (!i.value.trim() || b.disabled) return;

        b.disabled = true;
        push(i.value, false);
        const res = await callAI(i.value);
        push(res, true);
        
        i.value = "";
        b.disabled = false;
        i.focus();
    }
</script>
</body>
</html>
