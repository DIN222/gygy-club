
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY CLUB v7.1</title>
    <style>
        :root { 
            --gold: #ffd700; 
            --bg: #000; 
            --border: 2px solid #ffd700; 
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html { 
            width: 100%; height: 100%; 
            background: var(--bg); color: var(--gold); 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* HEADER */
        header { 
            height: 75px; display: flex; align-items: center; justify-content: space-between; 
            border-bottom: var(--border); padding: 0 15px; flex-shrink: 0; background: #000;
        }
        
        .logo-area { text-align: center; flex-grow: 1; }
        .logo-gy { font-size: 1.3rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .v-tag { font-size: 0.75rem; color: #ff0000; font-weight: 900; }

        .nav-btn { 
            width: 50px; height: 50px; border: var(--border); 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; color: var(--gold); font-size: 1.6rem; font-weight: 900;
            background: #111;
        }
        .nav-btn:active { background: var(--gold); color: #000; }

        /* WALL */
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: #080808; }
        
        .v-card { border: 1px solid #444; background: #000; padding: 15px; border-left: 5px solid var(--gold); position: relative; }
        .v-meta { font-size: 0.7rem; color: #666; margin-bottom: 8px; text-transform: uppercase; }
        .v-text { font-size: 1.25rem; color: #fff; margin: 10px 0; outline: none; white-space: pre-wrap; line-height: 1.5; }

        .v-ctrl { display: flex; gap: 8px; margin-top: 15px; border-top: 1px solid #333; padding-top: 12px; }
        .v-btn { background: #1a1a1a; border: 1px solid var(--gold); color: var(--gold); padding: 12px; cursor: pointer; flex: 1; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; }

        /* FOOTER (100PX) */
        footer { 
            height: 100px; display: flex; align-items: center; 
            padding: 0 15px; gap: 10px; border-top: var(--border); 
            background: #000; flex-shrink: 0; 
        }

        /* СКРОЛЛ СТИЛЕЙ — ВОЗВРАТ ПОЛНЫХ НАЗВАНИЙ */
        #s-box { 
            width: 130px; height: 60px; border: 1px solid var(--gold); 
            overflow-x: scroll; display: flex; align-items: center; 
            scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
            background: #111; flex-shrink: 0;
        }
        #s-box::-webkit-scrollbar { display: none; }
        
        .s-opt { 
            min-width: 128px; 
            height: 100%; display: flex; align-items: center; justify-content: center; 
            scroll-snap-align: center; font-size: 0.65rem; font-weight: 900; 
            color: var(--gold); flex-shrink: 0; text-align: center; padding: 0 5px;
            white-space: normal; line-height: 1.1;
        }

        #in { flex-grow: 1; height: 60px; background: #000; border: 1px solid #444; color: var(--gold); padding: 0 15px; font-size: 1.1rem; outline: none; font-family: inherit; }
        .btn-ok { height: 60px; padding: 0 25px; background: var(--gold); color: #000; border: none; font-weight: 900; cursor: pointer; font-size: 1.1rem; }

    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="window.history.back()">&#10094;</div>
    <div class="logo-area">
        <div class="logo-gy">GY-GY CLUB</div>
        <div class="v-tag">BUILD: v7.1 [FULL_DATA]</div>
    </div>
    <div class="nav-btn" onclick="window.history.forward()">&#10095;</div>
</header>

<main id="wall">
    </main>

<footer>
    <div id="s-box" onscroll="updateCurrentStyle()">
        <div class="s-opt">🚀 ШИЗА-ЛЮКС</div>
        <div class="s-opt">🍗 ПРОЖАРКА</div>
        <div class="s-opt">🕺 ДИСКО-ПАНИКА</div>
        <div class="s-opt">👵 БАБУШКА-ХАКЕР</div>
        <div class="s-opt">🛸 ЗОНА 51</div>
        <div class="s-opt">🎩 ЛОРД-АБСУРД</div>
        <div class="s-opt">🧪 КИБЕР-ГОГОЛЬ</div>
        <div class="s-opt">🧟‍♂️ ТРЭШ-ОПТИМИЗМ</div>
        <div class="s-opt">§ БЫТ</div>
    </div>
    <input type="text" id="in" placeholder="Введите 4 слова..." autocomplete="off">
    <button class="btn-ok" onclick="handleGenerate()">ОК</button>
</footer>

<script>
    let activeStyle = "🚀 ШИЗА-ЛЮКС";
    const wall = document.getElementById('wall');
    const input = document.getElementById('in');
    const sBox = document.getElementById('s-box');

    // Функция обновления стиля при скролле
    function updateCurrentStyle() {
        const index = Math.round(sBox.scrollLeft / sBox.clientWidth);
        if (sBox.children[index]) {
            activeStyle = sBox.children[index].innerText;
        }
    }

    // Основная генерация
    function handleGenerate() {
        const text = input.value.trim();
        if (!text) return;

        const card = document.createElement('div');
        card.className = 'v-card';
        card.innerHTML = `
            <div class="v-meta">#${text} | СТИЛЬ: ${activeStyle}</div>
            <div class="v-text" contenteditable="true">Подключаю нейронные связи для "${activeStyle}"...</div>
            <div class="v-ctrl">
                <button class="v-btn" onclick="copyCard(this)">КЛИП</button>
                <button class="v-btn" onclick="translateCard(this)">ПЕРЕВЕСТИ</button>
                <button class="v-btn" onclick="this.closest('.v-card').remove()">🗑</button>
            </div>
        `;
        wall.prepend(card);
        input.value = '';

        // Имитация ответа (сюда пойдет запрос к Gemini)
        setTimeout(() => {
            card.querySelector('.v-text').innerText = "The logic is pure,\nThe humor is sure,\nGY-GY is the cure,\nThat we all endure!";
        }, 1000);
    }

    // КЛИП
    function copyCard(btn) {
        const txt = btn.closest('.v-card').querySelector('.v-text').innerText;
        navigator.clipboard.writeText(txt).then(() => {
            const old = btn.innerText;
            btn.innerText = "СКОПИРОВАНО";
            setTimeout(() => btn.innerText = old, 1000);
        });
    }

    // ПЕРЕВОД
    function translateCard(btn) {
        const txt = btn.closest('.v-card').querySelector('.v-text').innerText;
        window.open(`https://translate.google.com/?sl=auto&tl=ru&text=${encodeURIComponent(txt)}&op=translate`, '_blank');
    }

    // Enter
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleGenerate();
    });

</script>
</body>
</html>
