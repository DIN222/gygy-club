<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY CLUB — 5.5</title>
    <style>
        :root { 
            --gold: #ffd700; 
            --bg: #000; 
            --border: 1px solid #ffd700; 
        }
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
            color: var(--gold); 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* HEADER — ТЕ САМЫЕ ВЫСОКИЕ КНОПКИ */
        header { 
            height: 70px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: var(--border); 
            padding: 0 10px; 
            flex-shrink: 0; 
            background: #000; 
            z-index: 1000; 
        }
        .logo-gy { 
            font-size: 1.1rem; 
            font-weight: 900; 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }
        .nav-fix { 
            width: 45px; 
            height: 45px; 
            border: var(--border); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: var(--gold); 
            font-weight: 900; 
            font-size: 1.4rem; 
        }

        /* WALL — СТЕНА СОБЫТИЙ */
        #wall { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background: #050505; 
        }
        .v-card { 
            border: 1px solid #333; 
            background: #000; 
            padding: 15px; 
            border-left: 3px solid var(--gold); 
            animation: fadeIn 0.3s; 
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .v-text { 
            font-size: 1.25rem; 
            color: #fff; 
            outline: none; 
            white-space: pre-wrap; 
            margin: 10px 0; 
            line-height: 1.4; 
        }
        
        /* УПРАВЛЕНИЕ КАРТОЧКОЙ */
        .v-ctrl { 
            display: flex; 
            gap: 5px; 
            flex-wrap: wrap; 
            margin-top: 10px; 
            border-top: 1px solid #222; 
            padding-top: 8px; 
        }
        .v-btn { 
            background: none; 
            border: 1px solid #444; 
            color: #888; 
            padding: 10px; 
            cursor: pointer; 
            flex: 1; 
            font-size: 1rem; 
            transition: 0.2s;
        }
        .v-btn.klip { border-color: var(--gold); color: var(--gold); font-weight: 900; }
        .v-btn.trans { border-color: var(--gold); color: #fff; }
        .v-btn:active { background: #222; }

        /* FOOTER — ТВОИ 100PX */
        footer { 
            height: 100px; 
            display: flex; 
            align-items: center; 
            padding: 0 10px; 
            gap: 10px; 
            border-top: var(--border); 
            background: #000; 
            flex-shrink: 0; 
        }

        /* СКРОЛЛ-БОКС */
        .style-scroll-box { 
            width: 110px; 
            height: 52px; 
            border: var(--border); 
            background: #111; 
            overflow-x: scroll; 
            overflow-y: hidden;
            display: flex; 
            align-items: center; 
            scroll-snap-type: x mandatory;
            scrollbar-width: none; 
            flex-shrink: 0;
        }
        .style-scroll-box::-webkit-scrollbar { display: none; }
        
        .s-opt { 
            min-width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            scroll-snap-align: center; 
            font-size: 0.75rem; 
            font-weight: 900; 
            color: var(--gold); 
            text-transform: uppercase; 
            flex-shrink: 0; 
            white-space: nowrap;
        }

        /* ИНПУТ И ОК */
        #in { 
            flex-grow: 1; 
            height: 52px; 
            background: #000; 
            border: 1px solid #333; 
            color: var(--gold); 
            padding: 0 12px; 
            font-size: 1rem; 
            outline: none; 
        }
        .btn-ok { 
            height: 52px; 
            padding: 0 20px; 
            background: var(--gold); 
            color: #000; 
            border: none; 
            font-weight: 900; 
            cursor: pointer; 
        }

    </style>
</head>
<body onload="init()">

<header>
    <div class="nav-fix" id="go-back" onclick="window.history.back()">&#10094;</div>
    <div class="logo-gy">GY-GY CLUB</div>
    <div class="nav-fix" id="go-forward" onclick="window.history.forward()">&#10095;</div>
</header>

<main id="wall"></main>

<footer>
    <div id="s-box" class="style-scroll-box" onscroll="updateStyle()">
        <div class="s-opt">🚀 ШИЗА-ЛЮКС</div>
        <div class="s-opt">🍗 ПРОЖАРКА</div>
        <div class="s-opt">🕺 ДИСКО-ПАНИКА</div>
        <div class="s-opt">👵 БАБУШКА-ХАКЕР</div>
        <div class="s-opt">🛸 ЗОНА 51</div>
        <div class="s-opt">🎩 ЛОРД-АБСУРД</div>
        <div class="s-opt">🧪 КИБЕР-ГОГОЛЬ</div>
        <div class="s-opt">🧟‍♂️ ТРЭШ-ОПТИМИЗМ</div>
        <div class="s-opt">§ БЫТ</div>
    </div>

    <input type="text" id="in" placeholder="Введите 4 слова..." onkeydown="if(event.key==='Enter') generate()">
    
    <button class="btn-ok" onclick="generate()">ОК</button>
</footer>

<script>
    let currentStyle = "🚀 ШИЗА-ЛЮКС";

    // Инициализация
    function init() {
        console.log("Система GY-GY запущена. Объем кода восстановлен.");
    }

    // Обновление стиля при скролле
    function updateStyle() {
        const box = document.getElementById('s-box');
        const index = Math.round(box.scrollLeft / box.clientWidth);
        if (box.children[index]) {
            currentStyle = box.children[index].innerText;
        }
    }

    // Функция КЛИП
    function copyToClipboard(btn) {
        const card = btn.closest('.v-card');
        const text = card.querySelector('.v-text').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const oldText = btn.innerText;
            btn.innerText = "СКОПИРОВАНО!";
            btn.style.color = "#fff";
            setTimeout(() => { 
                btn.innerText = oldText; 
                btn.style.color = "var(--gold)";
            }, 1000);
        });
    }

    // Функция ПЕРЕВОД
    function translateCard(btn) {
        const card = btn.closest('.v-card');
        const text = card.querySelector('.v-text').innerText;
        const url = `https://translate.google.com/?sl=auto&tl=ru&text=${encodeURIComponent(text)}&op=translate`;
        window.open(url, '_blank');
    }

    // Генерация карточки
    async function generate() {
        const input = document.getElementById('in');
        const val = input.value;
        if(!val) return;
        
        const wall = document.getElementById('wall');
        const card = document.createElement('div');
        card.className = 'v-card';
        
        // Прелоадер
        card.innerHTML = `<div class="v-text" style="color:#666;">Замешиваем ингредиенты стиля ${currentStyle}...</div>`;
        wall.prepend(card);
        input.value = '';

        // Эмуляция ответа (здесь будет твой API)
        setTimeout(() => {
            const resultVerse = "The moon is made of cheese,\nI'm begging on my knees,\nThe code has many fleas,\nIn digital degrees!";
            
            card.innerHTML = `
                <div style="font-size:0.7rem; color:#555; margin-bottom:5px;">#${val} | СТИЛЬ: ${currentStyle}</div>
                <div class="v-text" contenteditable="true">${resultVerse}</div>
                <div class="v-ctrl">
                    <button class="v-btn klip" onclick="copyToClipboard(this)">КЛИП</button>
                    <button class="v-btn trans" onclick="translateCard(this)">ПЕРЕВЕСТИ</button>
                    <button class="v-btn" onclick="alert('💾 Сохранено в архив!')">💾</button>
                    <button class="v-btn" onclick="if(confirm('Удалить шедевр?')) this.closest('.v-card').remove()">🗑</button>
                </div>
            `;
        }, 1000);
    }
</script>

</body>
</html>
