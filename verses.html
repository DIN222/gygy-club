<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v7.7.1 RECOVERY</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; justify-content: space-between; position: relative; z-index: 1000; }
        .logo-gy { font-weight: 900; font-size: 1.5rem; letter-spacing: 5px; position: absolute; left: 50%; transform: translateX(-50%); }
        .nav-btn { width: 55px; height: 45px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.7rem; box-shadow: 2px 2px 0 var(--gold); }
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px; max-width: 80%; border: 1px solid #333; position: relative; font-size: 1.1rem; margin-bottom: 5px; }
        .u { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255,215,0,0.05); }
        .a { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }
        footer { height: 100px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; z-index: 1000; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 18px; outline: none; font-size: 1.1rem; }
        .btn-go { width: 65px; height: 65px; background: var(--gold); border: none; font-size: 2.5rem; cursor: pointer; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.reload()">REF</div>
    <div class="logo-gy">GY-GY</div>
    <div class="nav-btn">RU</div>
</header>

<div id="wall">
    <div class="msg a">v7.7.0: Режим «Прямое зажигание». <br>Если стрелка не кликнет — значит, в config.js лишняя запятая или кавычка.</div>
</div>

<footer>
    <input type="text" id="in" placeholder="Слова..." onkeydown="if(event.key==='Enter') doAction()">
    <button id="go" class="btn-go" onclick="doAction()">↑</button>
</footer>
<script>
    const hasConfig = (typeof BEUVRY_CONFIG !== 'undefined');

    function pushMsg(txt, isAi) {
        const wall = document.getElementById('wall');
        const div = document.createElement('div');
        div.className = `msg ${isAi ? 'a' : 'u'}`;
        div.innerHTML = txt.replace(/\n/g, '<br>');
        wall.appendChild(div);
        wall.scrollTop = wall.scrollHeight;
    }

    async function doAction() {
        const input = document.getElementById('in');
        const btn = document.getElementById('go');
        const val = input.value.trim();

        if (!val || btn.disabled) return;

        btn.disabled = true;
        pushMsg(val, false);
        input.value = "";

        if (!hasConfig) {
            pushMsg("❌ ОШИБКА: Файл config.js не подгружен!", true);
            btn.disabled = false; return;
        }

        const key = (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim();
        
        // Самый стабильный эндпоинт для Free Tier в 2026-м
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${key}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Ты — циничный нуарный комик. Высмей ситуацию в 4 строки жесткой рифмы. Тон: ироничный. Слова: " + val }] }]
                })
            });
            
            const data = await response.json();

            if (data.error) {
                // Если и gemini-pro не зашла, значит Google требует gemini-1.5-flash без добавок
                pushMsg(`Google капризничает: ${data.error.message}`, true);
            } else if (data.candidates && data.candidates[0].content) {
                pushMsg(data.candidates[0].content.parts[0].text, true);
            } else {
                pushMsg("❌ Пустой ответ. Попробуй другие слова.", true);
            }
        } catch (e) {
            pushMsg("❌ Ошибка соединения. Проверь сеть.", true);
        }

        btn.disabled = false;
        input.focus();
    }
</script>
</body>
</html>
