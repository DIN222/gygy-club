<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY BEUVRY | v6.3.0</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--gold); 
            font-family: 'Courier New', monospace; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        header { 
            height: 65px; display: flex; align-items: center; 
            border-bottom: var(--border); background: #000; 
            padding: 0 20px; box-sizing: border-box; 
            justify-content: space-between; position: relative; 
            z-index: 10;
        }

        .btn-back { 
            width: 44px; height: 44px; display: flex; align-items: center; 
            justify-content: center; border: var(--border); 
            color: var(--gold); background: none; cursor: pointer; 
            font-size: 1.5rem; text-decoration: none;
        }

        .logo-gy { 
            font-weight: 900; font-size: 1.3rem; letter-spacing: 4px; 
            position: absolute; left: 50%; transform: translateX(-50%); 
        }

        .lang-panel { 
            border: var(--border); padding: 5px 10px; 
            font-size: 0.8rem; font-weight: bold; cursor: default;
        }

        #chat-wall { 
            flex-grow: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 20px;
            scroll-behavior: smooth;
        }

        .msg { 
            padding: 15px; max-width: 85%; font-size: 1.1rem; 
            line-height: 1.4; border-radius: 2px; position: relative; 
        }

        .user-msg { 
            align-self: flex-start; border-left: 3px solid var(--gold); 
            background: rgba(255, 215, 0, 0.05); 
        }

        .ai-msg { 
            align-self: flex-end; border-right: 3px solid #fff; 
            color: #eee; background: rgba(255, 255, 255, 0.1); 
            text-align: right; font-style: italic;
        }

        footer { 
            height: 90px; display: flex; align-items: center; 
            padding: 0 15px; gap: 10px; border-top: 1px solid #333;
            background: #000; box-sizing: border-box;
        }

        #user-in { 
            flex-grow: 1; background: #000; border: var(--border); 
            color: var(--gold); padding: 15px; outline: none; 
            font-size: 1rem; border-radius: 0;
        }

        .btn-up { 
            width: 55px; height: 55px; background: var(--gold); 
            color: #000; border: none; font-size: 2rem; 
            cursor: pointer; display: flex; align-items: center; 
            justify-content: center; font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-up:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Скрытая кнопка для смены ключа, если вдруг понадобится */
        .key-trigger { 
            position: absolute; bottom: 100px; right: 10px; 
            font-size: 0.5rem; color: #333; cursor: pointer; 
        }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="btn-back">«</a>
    <div class="logo-gy">GY-GY</div>
    <div class="lang-panel">RU</div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">Система v6.3.0 готова к работе. <br>Введите 4 слова для Беври.</div>
</div>

<div class="key-trigger" onclick="let k=prompt('API KEY:'); if(k)localStorage.setItem('user_gemini_key', k)">.</div>

<footer>
    <input type="text" id="user-in" placeholder="Ночь лед стекло пистолет..." autocomplete="off">
    <button id="send-btn" class="btn-up">↑</button>
</footer>

<script>
    // Список моделей из твоего актуального дампа (от новых к стабильным)
    const MODELS = [
        'gemini-3.1-flash-lite-preview', 
        'gemini-2.5-flash-lite', 
        'gemini-2.0-flash',
        'gemma-3-27b-it'
    ];

    const input = document.getElementById('user-in');
    const btn = document.getElementById('send-btn');
    const wall = document.getElementById('chat-wall');

    function getApiKey() {
        return localStorage.getItem('user_gemini_key') || 
               (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2 : "");
    }

    async function callAI(text, modelIdx = 0) {
        if (modelIdx >= MODELS.length) return "Сейчас в клубе слишком людно. Попробуйте войти чуть позже.";
        
        const key = getApiKey();
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODELS[modelIdx]}:generateContent?key=${key}`;
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PROMPT : "Пиши нуар.") + "\nТема: " + text }] }]
                })
            });
            
            const data = await response.json();

            // Если модель перегружена (503) или лимит (429) - идем к следующей модели
            if (data.error && (data.error.code === 503 || data.error.code === 429)) {
                console.warn(`Model ${MODELS[modelIdx]} busy. Trying next...`);
                return await callAI(text, modelIdx + 1);
            }
            
            if (data.error) return "Ошибка: " + data.error.message;
            if (data.candidates && data.candidates[0].content) {
                return data.candidates[0].content.parts[0].text;
            }
            return "Беври задумался и не ответил. Попробуйте другие слова.";

        } catch (e) {
            console.error(e);
            return await callAI(text, modelIdx + 1);
        }
    }

    async function handleSend() {
        const val = input.value.trim();
        if (!val || btn.disabled) return;

        // Визуальная блокировка
        btn.disabled = true;
        
        // Добавляем сообщение пользователя
        const uDiv = document.createElement('div');
        uDiv.className = 'msg user-msg';
        uDiv.innerText = val;
        wall.appendChild(uDiv);

        // Заглушка для ответа
        const aiDiv = document.createElement('div');
        aiDiv.className = 'msg ai-msg';
        aiDiv.innerHTML = "<i>...</i>";
        wall.appendChild(aiDiv);
        
        wall.scrollTop = wall.scrollHeight;
        input.value = "";
        input.focus();

        const result = await callAI(val);
        aiDiv.innerHTML = result.replace(/\n/g, '<br>');
        
        btn.disabled = false;
        wall.scrollTop = wall.scrollHeight;
    }

    // Слушатели событий
    btn.addEventListener('click', handleSend);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
</script>

</body>
</html>
