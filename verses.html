
<!DOCTYPE html><html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.8.0 Assembler</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 60px; display: flex; align-items: center; border-bottom: var(--border); padding: 0 15px; justify-content: space-between; }
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px; border-radius: 2px; font-size: 1.1rem; line-height: 1.4; max-width: 85%; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255, 255, 255, 0.1); text-align: right; font-style: italic; }
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: 1px solid #333; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 12px; outline: none; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); border: none; font-size: 1.5rem; cursor: pointer; }
    </style></head><body>

<header>
    <div onclick="location.href='ai_room_core_v8.html'" style="cursor:pointer">«</div>
    <div style="font-weight: 900; letter-spacing: 2px;">BEUVRY NOIR</div>
    <div id="status" style="font-size: 0.7rem;">READY</div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">Конфигурация BEUVRY_CONFIG обнаружена. Собираю ключ...</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Введите 4 слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
</footer>

<script>
    // Сборка фрагментированного ключа
    let FINAL_KEY = "";
    let MODEL_NAME = "gemini-1.5-flash";
    let SYSTEM_PROMPT = "Отвечай стихами.";

    if (typeof BEUVRY_CONFIG !== 'undefined') {
        FINAL_KEY = BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2;
        MODEL_NAME = BEUVRY_CONFIG.MODEL || MODEL_NAME;
        SYSTEM_PROMPT = BEUVRY_CONFIG.PROMPT || SYSTEM_PROMPT;
        document.getElementById('status').innerText = "● ONLINE";
        document.getElementById('status').style.color = "green";
    } else {
        document.getElementById('status').innerText = "● CONFIG ERROR";
        document.getElementById('status').style.color = "red";
    }

    async function aiAction(t) {
        const wall = document.getElementById('chat-wall');
        const m = document.createElement('div');
        m.className = 'msg ai-msg'; m.innerHTML = "<i>...</i>";
        wall.appendChild(m);
        wall.scrollTop = wall.scrollHeight;

        // Прямой запрос через v1beta для стабильности
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${FINAL_KEY}`;

        try {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: SYSTEM_PROMPT + "\nПользователь сказал: " + t }] }] })
            });
            const d = await r.json();
            if (d.error) {
                m.innerHTML = "Ошибка: " + d.error.message;
            } else {
                m.innerHTML = d.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            }
        } catch (e) { m.innerHTML = "Сбой сети."; }
        wall.scrollTop = wall.scrollHeight;
    }

    function send() {
        const i = document.getElementById('user-in');
        if(i.value.trim()){
            const m = document.createElement('div');
            m.className = 'msg user-msg'; m.innerText = i.value;
            document.getElementById('chat-wall').appendChild(m);
            aiAction(i.value); i.value = "";
        }
    }
</script></body></html>
