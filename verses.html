<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | ВЕРЛИБР-МАШИНА v5.0</title>
    <style>
        :root { --gold: #d4af37; --neon: #00f2ff; --bg: #0a0a0a; }
        body { 
            margin: 0; background: var(--bg); color: var(--gold); 
            font-family: 'Courier New', monospace; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* --- СТАНДАРТНЫЕ АТРИБУТЫ КЛУБА --- */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; border-bottom: 2px solid var(--gold);
            background: #000; box-shadow: 0 0 15px rgba(212,175,55,0.3);
        }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 5px; color: var(--gold); text-shadow: 2px 2px #555; }
        .lang-panel span { cursor: pointer; margin-left: 10px; font-size: 12px; border: 1px solid var(--gold); padding: 2px 5px; }
        .back-btn { cursor: pointer; color: var(--neon); font-weight: bold; text-decoration: underline; }

        /* --- ТЕРМИНАЛ ГЕНЕРАЦИИ --- */
        #poetry-stream {
            flex: 1; padding: 40px; overflow-y: auto;
            display: flex; flex-direction: column-reverse; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        .live-stanza {
            margin-bottom: 30px; padding: 25px;
            border-left: 5px solid var(--neon);
            background: rgba(0, 242, 255, 0.03);
            position: relative;
        }

        .v-line { font-size: 22px; font-weight: 900; line-height: 1.4; text-transform: uppercase; }
        .v-meta { font-size: 10px; color: var(--neon); margin-bottom: 10px; opacity: 0.7; }

        /* --- ПАНЕЛЬ УПРАВЛЕНИЯ --- */
        .gen-panel {
            padding: 30px; background: #000;
            display: flex; justify-content: center; gap: 20px;
            border-top: 1px solid var(--gold);
        }

        .trigger-btn {
            background: #000; border: 3px solid var(--neon); color: var(--neon);
            padding: 15px 30px; cursor: pointer; font-weight: 900;
            text-transform: uppercase; transition: 0.3s;
        }
        .trigger-btn:hover { background: var(--neon); color: #000; transform: scale(1.05); }
        .gold-btn { border-color: var(--gold); color: var(--gold); }
        .gold-btn:hover { background: var(--gold); color: #000; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="back-btn" onclick="location.href='ai_room_core_v8.html'">← [ НАЗАД_В_ЯДРО ]</div>
        <div class="logo">GY-GY</div>
        <div class="lang-panel">
            <span>RU</span><span style="opacity:0.5">EN</span><span style="opacity:0.5">ZH</span>
        </div>
    </header>

    <main id="poetry-stream">
        <div style="text-align:center; opacity:0.5;">[ СИСТЕМА ГОТОВА К ГЫ-ГЫКАНИЮ ]</div>
    </main>

    <footer class="gen-panel">
        <button class="trigger-btn" onclick="synthesize('DARK')">МРАЧНЫЙ КИБЕР-ГЫ</button>
        <button class="trigger-btn gold-btn" onclick="synthesize('GOLD')">ЗОЛОТОЙ БАНАН</button>
    </footer>

    <script>
        // ТУТ ВСТАВЬ СВОЮ ССЫЛКУ ИЗ WORKER
        const CLOUD_URL = "https://gygy-club.2work21955.workers.dev"; 

        async function synthesize(style) {
            const stream = document.getElementById('poetry-stream');
            
            // Визуальный эффект ожидания
            const tempID = "gen-" + Date.now();
            const loading = `<div class="live-stanza" id="${tempID}" style="border-color:#555">
                <div class="v-line">НЕЙРОНЫ ШЕВЕЛЯТСЯ... ЖДИ...</div>
            </div>`;
            stream.prepend(document.createRange().createContextualFragment(loading));

            try {
                const response = await fetch(CLOUD_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: style, userPrompt: "юмор, киберпанк, клуб гы-гы" })
                });
                const data = await response.json();
                
                const stanza = document.getElementById(tempID);
                if(data.status === "success") {
                    stanza.style.borderColor = (style === 'GOLD') ? '#d4af37' : '#00f2ff';
                    stanza.innerHTML = `
                        <div class="v-meta">ID: ${tempID} | STYLE: ${style}</div>
                        <div class="v-line" style="color:${(style === 'GOLD') ? '#d4af37' : '#00f2ff'}">${data.text}</div>
                    `;
                }
            } catch (e) {
                document.getElementById(tempID).innerHTML = "ОШИБКА: ОБЛАКО УШЛО НА ПЕРЕРЫВ.";
            }
        }
    </script>
</body>
</html>
