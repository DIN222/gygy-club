
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY v4.3.5: RECOVERY</title>
    <style>
        :root { --gold: #FFD700; --gold-dark: #B8860B; --bg: #000; --btn: 60px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg); font-family: 'Georgia', serif; color: var(--gold); display: flex; flex-direction: column; height: 100vh; overflow: hidden; top: 0px !important; }

        header { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 3px solid var(--gold); background: #000; z-index: 1000; }
        .nav-box { display: flex; align-items: center; gap: 8px; flex: 1; }
        .btn-nav { width: var(--btn); height: var(--btn); background: #000; border: 3px solid var(--gold); color: var(--gold); font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        #google_translate_element { min-width: 85px; height: var(--btn); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; background: #000; overflow: visible !important; }
        .goog-te-gadget-simple { background: transparent !important; border: none !important; padding: 0 !important; display: flex !important; align-items: center !important; }
        .goog-te-gadget-icon { filter: sepia(100%) saturate(500%) brightness(120%); margin-right: 5px; }
        .goog-te-menu-value span { color: var(--gold) !important; font-weight: bold; font-size: 16px; }
        .goog-te-banner-frame { display: none !important; }

        .logo { font-size: 18px; font-weight: 900; text-align: right; line-height: 1; margin-left: 10px; }

        #stream { flex: 1; overflow-y: auto; padding: 20px; font-size: 20px; background: #000; }
        .msg { margin-bottom: 25px; display: flex; animation: fadeIn 0.3s ease; }
        .avatar { width: 45px; height: 45px; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 12px; flex-shrink: 0; }
        .msg-body { flex: 1; border-left: 2px solid var(--gold-dark); padding-left: 12px; }
        .meta { font-size: 12px; color: var(--gold-dark); margin-bottom: 4px; }

        .input-zone { padding: 15px; background: #000; border-top: 3px solid var(--gold); display: flex; gap: 10px; }
        #inp { flex: 1; background: #111; border: 2px solid var(--gold-dark); color: var(--gold); font-size: 20px; padding: 15px; outline: none; }
        #sendBtn { width: 70px; height: var(--btn); background: var(--gold); color: #000; border: none; font-weight: 900; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="nav-box">
            <button class="btn-nav" id="backBtn">«</button>
            <div id="google_translate_element"></div>
            <button class="btn-nav" onclick="history.forward()">»</button>
        </div>
        <div class="logo">GY-GY <br><span style="font-size:10px; color:var(--gold-dark);">v4.3.1</span></div>
    </header>

    <div id="stream"></div>

    <div class="input-zone">
        <input type="text" id="inp" placeholder="ВАШ ИМПУЛЬС..." autocomplete="off">
        <button id="sendBtn">OK</button>
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage:'ru', includedLanguages:'en,de,fr', layout: google.translate.TranslateElement.InlineLayout.SIMPLE, autoDisplay: false}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
        // --- СИСТЕМА РАЗДЕЛЕННОГО КЛЮЧА v4.3.2 ---
        const part1 = "AIzaSyC7l5KTkISjAKH1"; 
        const part2 = "25uuGRYCtUjxOArl0r8"; 
        
        const getFullKey = () => part1.trim() + part2.trim();
        let count = 0;

        // ЧЕСТНЫЙ ВОЗВРАТ НАЗАД
        document.getElementById('backBtn').onclick = () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                console.log("v4.3.2: Тупик навигации.");
            }
        };

        // ФУНКЦИЯ ДОБАВЛЕНИЯ СООБЩЕНИЯ
        function addMsg(author, text) {
            count++;
            const s = document.getElementById('stream');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `
                <div class="avatar">${author[0]}</div>
                <div class="msg-body">
                    <div class="meta">@${author} [${count}]</div>
                    <div style="text-transform: uppercase;">${text}</div>
                </div>`;
            s.appendChild(div);
            s.scrollTop = s.scrollHeight;
        }

        // ЗАПРОС К GEMINI
        async function aiPost(userText) {
            const fullUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${getFullKey()}`;
            try {
                const res = await fetch(fullUrl, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: `Напиши 4 строки короткого, жесткого техно-нуара про: ${userText}` }] }] 
                    })
                });
                const data = await res.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const result = data.candidates[0].content.parts[0].text.trim();
                    addMsg('GEMINI', result);
                } else {
                    addMsg('GEMINI', "ОШИБКА: ПРОВЕРЬТЕ КВОТУ ИЛИ КЛЮЧ.");
                }
            } catch (e) { 
                addMsg('GEMINI', "СБОЙ СЕТИ. ПОВТОРИТЕ."); 
            }
        }

        // ОБРАБОТКА ОТПРАВКИ
        const handleSend = () => {
            const input = document.getElementById('inp');
            if (input.value.trim()) {
                const val = input.value.trim();
                addMsg('АВТОР', val);
                input.value = "";
                aiPost(val);
            }
        };

        // ПРИВЯЗКА КНОПОК
        document.getElementById('sendBtn').onclick = handleSend;
        document.getElementById('inp').onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };

        // ПИНОК GOOGLE TRANSLATE
        window.addEventListener('load', () => {
            setTimeout(() => { 
                if(!document.querySelector('.goog-te-gadget-simple')) {
                    if (typeof googleTranslateElementInit === 'function') googleTranslateElementInit();
                }
            }, 3000);
        });
    </script>
</body>
</html>
