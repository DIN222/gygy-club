
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GY-GY | VERSES v.9.54</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #000; --ai: #8A2BE2; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--gold); font-family: 'Share Tech Mono', monospace;
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* HEADER */
        .header { 
            display: flex; justify-content: space-between; padding: 15px; 
            border-bottom: 1px solid var(--gold); align-items: center; background: #050505;
        }
        .logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 2px; font-style: italic; }

        /* NEURAL LINK BUTTON */
        .sync-btn {
            font-family: 'Share Tech Mono', monospace; font-size: 10px;
            border: 1px solid var(--gold); padding: 5px 10px; cursor: pointer;
            background: transparent; color: var(--gold); transition: 0.3s;
        }
        .sync-btn.active { background: var(--gold); color: #000; box-shadow: 0 0 10px var(--gold); }

        /* MATRIX */
        .matrix-container { background: #0a0a0a; border-bottom: 1px solid #222; }
        .matrix-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 12px; scrollbar-width: none; }
        .slot {
            min-width: 45px; height: 45px; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; flex-shrink: 0; transition: 0.3s; color: #444;
        }
        .slot.u-active { border-color: var(--gold); color: var(--gold); }
        .slot.ai-active { border-color: var(--ai); color: var(--ai); cursor: pointer; }

        /* STREAM */
        .stream { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { border-left: 2px solid var(--gold); padding: 8px 15px; background: rgba(212, 175, 55, 0.02); }
        .msg.ai { border-left-color: var(--ai); background: rgba(138, 43, 226, 0.02); }
        .msg.system { border-left-color: #555; opacity: 0.7; font-size: 12px; }
        .meta { font-size: 9px; opacity: 0.5; margin-bottom: 4px; display: block; }

        /* INPUT */
        .input-zone { padding: 20px; background: #000; border-top: 1px solid var(--gold); display: flex; gap: 10px; }
        input { flex: 1; background: #0a0a0a; border: 1px solid #333; color: var(--gold); padding: 12px; font-family: 'Share Tech Mono'; outline: none; }
        .mint-btn { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 10px 20px; cursor: pointer; }

        #final-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="club-header" style="display: flex; justify-content: space-between; padding: 10px; background: rgba(0,0,0,0.8); border-bottom: 1px solid #0f0; font-family: monospace;">
    <div class="left-nav">
        <a href="index.html" style="color: #0f0; text-decoration: none;">◄ BACK</a>
    </div>
    <div class="center-logo" style="color: #0f0; font-weight: bold; letter-spacing: 5px;">
        GY-GY CLUB
    </div>
    <div class="right-lang">
        <span style="color: #0f0; cursor: pointer; border: 1px solid #0f0; padding: 2px 5px;">EN</span>
        <span style="color: #0f0; margin-left: 10px; cursor: pointer; opacity: 0.5;">RU</span>
        <span style="color: #0f0; margin-left: 10px; cursor: pointer; opacity: 0.5;">FR</span>
    </div>
</div>
    <header class="header">
        <button id="neural-link" class="sync-btn" onclick="toggleSync()">VERSES LINK: OFF</button>
        <div class="logo">GY-GY</div>
    </header>

    <div class="matrix-container">
        <div id="matrix-slots" class="matrix-scroll"></div>
    </div>

    <main class="stream" id="stream">
        <div class="msg system"><span class="meta">@SYSTEM</span>ЯДРО АКТИВИРОВАНО. ОЖИДАНИЕ ПЕРВОЙ СТРОКИ...</div>
    </main>

    <div class="input-zone" id="ui">
        <input type="text" id="inp" placeholder="ПИШИТЕ ЗДЕСЬ..." onkeypress="if(event.key==='Enter') userPost()">
        <button class="mint-btn" onclick="userPost()">MINT</button>
    </div>

    <div id="final-overlay">
        <h2 style="font-family:'Playfair Display';">ШЕДЕВР СОХРАНЕН</h2>
        <button class="mint-btn" onclick="location.reload()">НОВАЯ СЕССИЯ</button>
    </div>
<script>
 // 1. КОНФИГУРАЦИЯ
    const part1 = "AIzaSyBFmETf-8mg5iM"; 
    const part2 = "Sjgg4rKNL_k3vwb-YGPE"; 
    const getKey = () => part1 + part2;

    let count = 0;
    const total = 16;
    let poemContext = "";

    // 1. ИНИЦИАЛИЗАЦИЯ
    function init() {
        console.log("GY-GY CORE: START");
        initMatrix();
        const input = document.getElementById('inp');
        if(input) {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') userPost();
            });
        }
    }

    function initMatrix() {
        const m = document.getElementById('matrix-slots');
        if(!m) return;
        m.innerHTML = "";
        for(let i=1; i<=10; i++) m.innerHTML += `<div class="slot ${i===1?'u-active':''}">U${i}</div>`;
        
        ['GE', 'GR', 'CL', 'MI'].forEach(name => {
            const div = document.createElement('div');
            div.className = 'slot ai-active';
            div.innerText = name;
            div.onclick = () => aiPost(name === 'GE' ? 'GEMINI' : name);
            m.appendChild(div);
        });
    }

    // 2. ЛОГИКА МИНТА
    function userPost() {
        const input = document.getElementById('inp');
        if(!input) return;
        const val = input.value.trim();
        
        if(!val) return; 
        if(count >= total) {
            alert("MATRIX FULL [16/16]");
            return;
        }

        addMessage('USER_1', val, 'user');
        input.value = ""; 
    }

  // --- [СТАРТ] 3. БЛОК ЛОГИКИ ИИ v4.3 ---

async function aiPost(aiName) {
    if (count >= total) return;
    
    // Генерируем уникальный ID для текущего сообщения
    const tempId = 'ai-' + Date.now();
    addMessage(aiName, "СИНХРОНИЗАЦИЯ (v2.5)...", 'ai', tempId);

    // Подготовка контекста: берем только последнюю осмысленную строку
    const lines = poemContext.trim().split('\n').filter(Boolean);
    const lastLine = lines.length > 0 ? lines.pop() : "БАР";
    
    // API URL для Gemini 2.5 Flash (актуально для Beuvry 2026)
    const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + getKey();

    try {
        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{ 
                    parts: [{ 
                        text: `ТЫ КИБЕР-ПОЭТ КЛУБА GY-GY. ДОБАВЬ ОДНУ СТРОКУ В РИФМУ. СТИЛЬ: ТЕМНЫЙ НЕОН. ТОЛЬКО КАПСОМ. РИФМУЙ К: ${lastLine}` 
                    }] 
                }]
            })
        });

        const data = await response.json();

        // Проверка на системные ошибки Google
        if (data.error) {
            updateMsg(tempId, "SYSTEM ERROR: " + data.error.message);
            return;
        }

        // Извлекаем текст ответа
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (text) {
            updateMsg(tempId, text.trim().toUpperCase());
        } else {
            updateMsg(tempId, "ОТВЕТ ПУСТ");
        }
    } catch (e) {
        updateMsg(tempId, "СЕТЕВАЯ ОШИБКА");
        console.error("AI_POST_ERROR:", e);
    }
}

// --- [ПЕРЕХОД] ФУНКЦИЯ ОБНОВЛЕНИЯ ТЕКСТА ---

function updateMsg(id, text) {
    const el = document.getElementById(id);
    if (el) {
        // Если пришла ошибка лимита — пишем коротко
        if (text.includes("QUOTA EXCEEDED")) {
            el.innerText = "ПАУЗА: ЛИМИТ ЗАПРОСОВ ИСЧЕРПАН. ПОДОЖДИТЕ 30 СЕК.";
            el.style.color = "#ff0000"; // Делаем текст ошибки красным
            return;
        }

        const clean = text.replace(/СИНХРОНИЗАЦИЯ|V2\.5|SYSTEM|ERROR|ПОЭТ|КЛУБА/gi, '').trim();
        el.innerText = clean;

        if (clean && !clean.includes("ОШИБКА") && !clean.includes("ПУСТ")) {
            poemContext += clean + '\n';
        }
    }
}

// --- [ЗАВЕРШЕНИЕ] 4. ОТРИСОВКА И ИНТЕРФЕЙС ---

function addMessage(name, text, type, id) {
    const chat = document.getElementById('chat');
    const msg = document.createElement('div');
    msg.className = 'message ' + type;
    if (id) msg.id = id;
    
    // Порядковый номер строки [X/16] для регламента v4.3
    const index = ++count;
    msg.innerHTML = `<span class="meta">${name} [${index}/16]</span><br>${text}`;
    
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight; // Автопрокрутка вниз
}
    // 4. ОТРИСОВКА
    function addMessage(author, text, type, id = null) {
        if(count >= total && type !== 'system') return;
        if(type !== 'system') count++;
        
        const s = document.getElementById('stream');
        if(!s) return;
        
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        if(id) div.id = id;
        div.innerHTML = `<span class="meta">@${author} [${count}/${total}]</span>${text.toUpperCase()}`;
        
        s.appendChild(div);
        s.scrollTop = s.scrollHeight;
        poemContext += " " + text;

        if(count >= total) {
            const ui = document.getElementById('ui'); if(ui) ui.style.display = 'none';
            const final = document.getElementById('final-overlay'); if(final) final.style.display = 'flex';
        }
    }

    function updateMsg(id, text) {
        const m = document.getElementById(id);
        if(m) {
            const meta = m.querySelector('.meta').outerHTML;
            m.innerHTML = `${meta}${text.toUpperCase()}`;
            poemContext += " " + text;
        }
    }

    window.onload = init;
</script>
</body>
</html>
