
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY v4.33: GOLDEN AUTH</title>
   <style>
    :root {
        --gold: #FFD700;
        --gold-dark: #B8860B;
        --bg: #000000;
        --btn-size: 60px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0; padding: 0;
        background: var(--bg);
        font-family: 'Georgia', serif;
        color: var(--gold);
        display: flex; flex-direction: column;
        height: 100vh; overflow: hidden;
        top: 0px !important;
    }

    /* ШАПКА */
    header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 15px;
        border-bottom: 3px solid var(--gold);
        background: #000;
        z-index: 1000;
    }

    .nav-box { display: flex; align-items: center; gap: 8px; flex: 1; }

    .btn-nav {
        width: var(--btn-size); height: var(--btn-size);
        background: var(--bg); border: 3px solid var(--gold);
        color: var(--gold); font-size: 30px; font-weight: 900;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
    }

    /* ЖЕСТКАЯ КОРРЕКЦИЯ GOOGLE */
    #google_translate_element {
        border: 3px solid var(--gold) !important;
        height: var(--btn-size) !important;
        background: #000 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        overflow: hidden !important;
        min-width: 80px;
    }

    /* Убираем мусор Google внутри виджета */
    .goog-te-gadget-simple {
        background-color: transparent !important;
        border: none !important;
        padding: 0 !important;
        display: flex !important;
        align-items: center !important;
    }

    .goog-te-gadget-simple img {
        display: inline-block !important;
        filter: sepia(100%) saturate(500%) brightness(100%) hue-rotate(10deg) !important;
        width: 24px !important;
        height: 24px !important;
    }

    /* Скрываем текст "Выбрать язык", оставляя только стрелочку или код */
    .goog-te-menu-value span:first-child { display: none !important; }
    .goog-te-menu-value span:nth-child(3) { color: var(--gold) !important; font-size: 18px; font-weight: 900; }
    .goog-te-menu-value img { display: none !important; }

    /* Удаляем всплывающие панели Google сверху */
    .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame { display: none !important; }
    .goog-tooltip, .goog-tooltip:hover { display: none !important; }
    .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }

    .logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-align: right; line-height: 1; }

    /* ОКНО ПОТОКА */
    #stream {
        flex: 1; overflow-y: auto; padding: 20px;
        font-size: 22px; line-height: 1.6;
        background: #000;
    }

    .msg { margin-bottom: 30px; display: flex; animation: fadeIn 0.4s ease-out; }
    .avatar {
        width: 50px; height: 50px; border: 2px solid var(--gold);
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; font-weight: bold; margin-right: 15px; flex-shrink: 0;
    }

    .msg-body-wrapper { flex: 1; border-left: 2px solid var(--gold-dark); padding-left: 15px; }

    .input-zone { padding: 20px; background: #000; border-top: 3px solid var(--gold); }
    #inp {
        width: 100%; background: #111; border: 2px solid var(--gold-dark);
        color: var(--gold); font-size: 24px; padding: 18px; outline: none;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

    <header>
        <div class="nav-box">
            <button class="btn-nav" onclick="history.back()">«</button>
            
            <div id="google_translate_element"></div>
            
            <button class="btn-nav" onclick="history.forward()">»</button>
        </div>
        <div class="logo">GY-GY <br><span style="font-size:10px; color:var(--gold-dark);">v4.3</span></div>
    </header>

    <div id="stream"></div>

    <div class="input-zone">
        <input type="text" id="inp" placeholder="ВАШ ИМПУЛЬС..." autocomplete="off">
    </div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ru',
                includedLanguages: 'en,de,fr,es,zh-CN',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const getKey = () => "AIzaSyBFmETf-8mg5iMSjgg4rKNL_k3vwb-YGPE"; 
        let count = 0;

        function addMsg(author, text, type) {
            count++;
            const s = document.getElementById('stream');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            const isAI = (author === 'GEMINI');
            const color = isAI ? 'var(--gold)' : 'var(--gold-dark)';
            
            div.innerHTML = `
                <div class="avatar" style="border-color:${color}; color:${color}">${author[0]}</div>
                <div class="msg-body-wrapper">
                    ${isAI ? '<div class="badge">PASS: GEN-ID / OK</div>' : ''}
                    <div style="font-size:14px; color:var(--gold-dark); margin-bottom:5px;">@${author} [${count}]</div>
                    <div class="msg-text">${text}</div>
                </div>
            `;
            s.appendChild(div);
            s.scrollTop = s.scrollHeight;
        }

        async function aiPost(userText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${getKey()}`;
            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Напиши 4 строки абсурдного техно-нуара про: ${userText}` }] }] })
                });
                const data = await res.json();
                const result = data.candidates[0].content.parts[0].text.trim().toUpperCase();
                addMsg('GEMINI', result, 'ai');
            } catch (e) { addMsg('GEMINI', "СИСТЕМА ПЕРЕГРУЖЕНА.", 'ai'); }
        }

        document.getElementById('inp').onkeypress = (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                const val = e.target.value.trim();
                addMsg('АВТОР', val, 'user');
                e.target.value = "";
                aiPost(val);
            }
        };
    </script>
</body>
</html>
