
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY | VERSES v.9.6 REAL-AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #000; --ai: #8A2BE2; --user-border: #d4af37; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: var(--gold); font-family: 'Share Tech Mono', monospace;
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* HEADER */
        .header { 
            display: flex; justify-content: space-between; padding: 15px; 
            border-bottom: 1px solid var(--gold); align-items: center; background: #050505;
        }
        .logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 3px; font-style: italic; }

        /* MATRIX 10/4 */
        .matrix-container { background: #0a0a0a; border-bottom: 1px solid #222; z-index: 10; }
        .matrix-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 15px; scrollbar-width: none; }
        .matrix-scroll::-webkit-scrollbar { display: none; }
        
        .slot {
            min-width: 50px; height: 50px; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; flex-shrink: 0; cursor: default;
            transition: 0.3s; color: #444;
        }
        .slot.u-active { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2); }
        .slot.ai-active { border-color: var(--ai); color: var(--ai); cursor: pointer; }
        .slot.ai-active:hover { background: rgba(138, 43, 226, 0.1); transform: translateY(-2px); }

        /* STREAM */
        .stream { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: linear-gradient(to bottom, #000, #050505); }
        .msg { border-left: 2px solid var(--gold); padding: 8px 15px; background: rgba(212, 175, 55, 0.03); animation: slideIn 0.3s ease-out; }
        .msg.ai { border-left-color: var(--ai); background: rgba(138, 43, 226, 0.03); }
        .meta { font-size: 10px; opacity: 0.5; margin-bottom: 5px; display: block; letter-spacing: 1px; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* INPUT */
        .input-zone { padding: 20px; background: #000; border-top: 1px solid var(--gold); display: flex; gap: 10px; align-items: center; }
        input { 
            flex: 1; background: #0a0a0a; border: 1px solid #333; color: var(--gold); 
            padding: 15px; font-family: 'Share Tech Mono'; outline: none; font-size: 16px;
        }
        input:focus { border-color: var(--gold); }
        .mint-btn { 
            background: transparent; color: var(--gold); border: 1px solid var(--gold); 
            padding: 14px 25px; font-weight: 900; cursor: pointer; text-transform: uppercase;
            transition: 0.3s;
        }
        .mint-btn:hover { background: var(--gold); color: #000; }

        /* FINAL OVERLAY */
        #final-overlay { 
            display: none; position: fixed; inset: 0; background: #000; z-index: 1000; 
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        #google_translate_element { transform: scale(0.8); transform-origin: left; }
    </style>
</head>
<body oncontextmenu="return false;">

    <header class="header">
        <div id="google_translate_element"></div>
        <div class="logo">GY-GY VERSES</div>
    </header>

    <div class="matrix-container">
        <div class="matrix-scroll" id="matrix-slots">
            </div>
    </div>

    <main class="stream" id="stream">
        <div class="msg">
            <span class="meta">@SYSTEM</span>
            ДОБРО ПОЖАЛОВАТЬ В ЯДРО. ВВЕДИТЕ ПЕРВУЮ СТРОКУ, ЧТОБЫ НАЧАТЬ...
        </div>
    </main>

    <div class="input-zone" id="ui">
        <input type="text" id="inp" placeholder="ВАША СТРОКА..." autocomplete="off">
        <button class="mint-btn" onclick="userPost()">MINT</button>
    </div>

    <div id="final-overlay">
        <h1 style="font-family:'Playfair Display'; font-style:italic; font-size:40px;">ШЕДЕВР ГОТОВ</h1>
        <p id="timer" style="letter-spacing:2px; opacity:0.7;">СОХРАНЕНИЕ В АРХИВ: 5...</p>
        <button class="mint-btn" style="margin-top:30px;" onclick="location.href='verses_collection.html'">В СБОРНИК</button>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const API_KEY = "ВСТАВЬ_СВОЙ_КЛЮЧ_ЗДЕСЬ"; 
        let count = 0;
        const total = 16;
        let poemContext = ""; 

        // Инициализация матрицы
        function initMatrix() {
            const container = document.getElementById('matrix-slots');
            container.innerHTML = ""; 

            // 10 Пользователей
            for(let i = 1; i <= 10; i++) {
                const s = document.createElement('div');
                s.className = `slot ${i===1?'u-active':''}`;
                s.innerText = `U${i}`;
                container.appendChild(s);
            }

            // 4 ИИ
            const ais = [
                { id: 'GEMINI', code: 'GE' },
                { id: 'GROK', code: 'GR' },
                { id: 'CLAUDE', code: 'CL' },
                { id: 'MISTRAL', code: 'MI' }
            ];

            ais.forEach(ai => {
                const s = document.createElement('div');
                s.className = 'slot ai-active';
                s.innerText = ai.code;
                s.onclick = (AIzaSyBnhRNyTBGpeRUeg3Hg_NwRTh0qNLITbi0) => aiPost(ai.id);
                container.appendChild(s);
            });
        }

        // Отправка сообщения пользователем
        function userPost() {
            const input = document.getElementById('inp');
            const text = input.value.trim();
            if(!text || count >= total) return;

            addMessage('USER_1', text, 'user');
            input.value = "";
        }

        // Запрос к Real AI
        async function aiPost(aiName) {
            if(count >= total) return;

            const tempId = 'loading-' + Date.now();
            addMessage(aiName, "ГЕНЕРАЦИЯ СМЫСЛА...", 'ai', tempId);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Ты — ИИ по имени ${aiName} в элитном клубе GY-GY. 
                            Продолжи стих одной короткой, рифмованной, дерзкой строкой. 
                            Стиль: киберпанк, виски, деньги, нуар. 
                            Контекст стиха: ${poemContext}. 
                            Напиши только ОДНУ строку, только КАПСОМ, без знаков препинания.` }]
                        }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text.trim();
                
                // Обновляем временное сообщение
                const msgDiv = document.getElementById(tempId);
                const meta = msgDiv.querySelector('.meta').outerHTML;
                msgDiv.innerHTML = `${meta}${aiResponse.toUpperCase()}`;
                
                poemContext += " " + aiResponse;

            } catch (err) {
                console.error(err);
                document.getElementById(tempId).lastChild.textContent = "СБОЙ СИСТЕМЫ. ПОПРОБУЙТЕ СНОВА.";
            }
        }

        function addMessage(author, text, type, id = null) {
            if(count >= total) return;
            count++;

            const stream = document.getElementById('stream');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            if(id) div.id = id;

            div.innerHTML = `<span class="meta">@${author} [${count}/${total}]</span>${text.toUpperCase()}`;
            stream.appendChild(div);
            stream.scrollTop = stream.scrollHeight;

            poemContext += " " + text;

            if(count >= total) triggerFinish();
        }

        function triggerFinish() {
            document.getElementById('ui').style.display = 'none';
            const overlay = document.getElementById('final-overlay');
            overlay.style.display = 'flex';

            let seconds = 5;
            const timer = setInterval(() => {
                seconds--;
                document.getElementById('timer').innerText = `СОХРАНЕНИЕ В АРХИВ: ${seconds}...`;
                if(seconds <= 0) {
                    clearInterval(timer);
                    document.getElementById('timer').innerText = "СТИХОТВОРЕНИЕ ВПИСАНО В ИСТОРИЮ.";
                }
            }, 1000);
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
        }

        window.onload = initMatrix;
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
