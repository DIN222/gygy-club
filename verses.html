<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | VERSES v34.6</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER 🔒 КОНСТАНТА */
        header { height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: var(--border); padding: 0 10px; flex-shrink: 0; background: #000; z-index: 1000; }
        .nav-fix { width: 45px; height: 45px; border: var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-weight: 900; font-size: 1.4rem; }
        .logo-gy { font-size: 1.1rem; font-weight: 900; letter-spacing: 2px; }

        /* WALL */
        #wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: #050505; }
        .v-card { border: 1px solid #333; background: #000; padding: 15px; border-left: 3px solid var(--gold); }
        .v-text { font-size: 1.2rem; color: #fff; outline: none; white-space: pre-wrap; margin: 10px 0; line-height: 1.4; }
        .v-ctrl { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; border-top: 1px solid #222; padding-top: 8px; }
        .v-btn { background: none; border: 1px solid #444; color: #888; padding: 6px; cursor: pointer; flex: 1; font-size: 0.8rem; }
        .v-btn.klip { border-color: var(--gold); color: var(--gold); font-weight: 900; }

        /* FOOTER ПУЛЬТ */
        footer { height: 100px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: var(--border); background: #000; flex-shrink: 0; }
        
        /* КОНТЕЙНЕР СТИЛЕЙ */
        .style-section { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .style-label { font-size: 0.6rem; color: #666; letter-spacing: 1px; }
        
        /* СКРОЛЛ-КНОПКА */
        .style-scroll-box { 
            width: 100px; height: 50px; border: var(--border); 
            background: #111; overflow-x: auto; overflow-y: hidden;
            display: flex; align-items: center; scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }
        .style-scroll-box::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome/Safari */
        
        .s-opt { 
            min-width: 100%; height: 100%; display: flex; 
            align-items: center; justify-content: center; 
            scroll-snap-align: center; font-size: 0.75rem; 
            font-weight: 900; color: var(--gold); text-transform: uppercase;
            flex-shrink: 0;
        }

        #in { flex-grow: 1; height: 50px; background: #000; border: 1px solid #333; color: var(--gold); padding: 0 12px; outline: none; }
        .btn-ok { height: 50px; padding: 0 15px; background: var(--gold); color: #000; border: none; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="nav-fix">❮</a>
    <div class="lang-trigger" onclick="openTranslate()" title="Translate">
        文<sub>A</sub>
        <div id="google_translate_element" style="position:absolute; opacity:0; pointer-events:none;"></div>
    </div>
    <div class="logo-gy">GY-GY</div>
    <a href="box_page.html" class="nav-fix">❯</a>
</header>

<div id="wall">
    <div class="v-card" id="status-msg" style="border-left: 1px solid #333; color: #555; font-size: 0.8rem;">
        Система готова. Если видишь "Сбой сети" — проверь, запущен ли Localhost и лежит ли config.js в той же папке.
    </div>
</div>

<footer>
    <div class="style-section">
        <div class="style-label">СТИЛИ</div>
        <div class="style-scroll-box" id="s-box" onwheel="handleWheel(event)" onscroll="updateStyle()">
            <div class="s-opt">§ БЫТ</div>
            <div class="s-opt">ø АБСУРД</div>
            <div class="s-opt">† ПРОЖАРКА</div>
            <div class="s-opt">¶ САТИРА</div>
            <div class="s-opt">🌫 НУАР</div>
            <div class="s-opt">🎸 РОК</div>
            <div class="s-opt">⌛ КЛАССИКА</div>
            <div class="s-opt">‡ ХЛЕСТКО</div>
        </div>
    </div>

    <input type="text" id="in" placeholder="4 слова..." onkeydown="if(event.key==='Enter') generate()">
    <button class="btn-ok" onclick="generate()">ОК</button>
</footer>

<script>
    // 1. ПОДДЕРЖКА МЫШИ ДЛЯ СТИЛЕЙ
    function handleWheel(e) {
        e.preventDefault();
        document.getElementById('s-box').scrollLeft += e.deltaY;
    }

    // 2. ВЫЗОВ ПЕРЕВОДЧИКА
    function openTranslate() {
        const sel = document.querySelector('.goog-te-combo');
        if (sel) {
            sel.style.opacity = "1";
            sel.style.pointerEvents = "auto";
            // Имитируем клик или фокус, чтобы пользователь выбрал язык
            alert("Выберите язык в появившемся меню Google");
        } else {
            // Если виджет еще не подгрузился
            const script = document.createElement('script');
            script.src = "//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
            document.body.appendChild(script);
        }
    }

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
    }

    // 3. ГЕНЕРАЦИЯ С ПРОВЕРКОЙ CONFIG
    async function generate() {
        if (typeof BEUVRY_CONFIG === 'undefined') {
            alert("Критическая ошибка: Файл config.js не найден!");
            return;
        }

        const input = document.getElementById('in');
        const val = input.value.trim();
        if (!val) return;

        const wall = document.getElementById('wall');
        const cardId = "v-" + Date.now();
        const card = document.createElement('div');
        card.className = 'v-card';
        card.id = cardId;
        card.innerHTML = `<div class="v-text">Сварка ритма (${currentStyle})...</div>`;
        wall.appendChild(card);
        input.value = "";
        wall.scrollTop = wall.scrollHeight;

        try {
            const cleanKey = (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).replace(/[^a-zA-Z0-9_-]/g, "");
            const model = BEUVRY_CONFIG.MODELS_PRIORITY[0];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Напиши 4 строки юмористического стиха на русском. Тема (4 слова): ${val}. Стиль: ${currentStyle}. Только текст.` }] }]
                })
            });

            const data = await response.json();

            if (data.error) {
                card.innerHTML = `<div style="color:red">API Error: ${data.error.message}</div>`;
                return;
            }

            const resultText = data.candidates[0].content.parts[0].text.trim();
            card.innerHTML = `
                <div style="font-size:0.6rem; color:#444;">#${val.split(' ').join(' #')} | ${currentStyle}</div>
                <div class="v-text" contenteditable="true">${resultText}</div>
                <div class="v-ctrl">
                    <button class="v-btn" onclick="saveTxt('${cardId}')">💾</button>
                    <button class="v-btn" onclick="alert('Shared')">✈</button>
                    <button class="v-btn" onclick="alert('Public')">📢</button>
                    <button class="v-btn klip" onclick="toKlip('${cardId}')">🎬 KLIP</button>
                    <button class="v-btn" onclick="document.getElementById('${cardId}').remove()">🗑</button>
                </div>
            `;
        } catch (e) {
            card.innerHTML = `<div style="color:red">Сбой сети. Проверь консоль браузера (F12). Возможно, блокировка CORS или путь к config.js.</div>`;
        }
        wall.scrollTop = wall.scrollHeight;
    }
</script>

</body>
</html>
