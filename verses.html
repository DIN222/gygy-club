<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CORE v33.5.17</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER_CORE 🔒 */
        header { height: 70px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 10px; gap: 8px; z-index: 1000; flex-shrink: 0; position: relative; }
        
        /* ЭЛЕМЕНТЫ НАВИГАЦИИ 🔒 */
        .nav-fix { width: 40px; height: 40px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-weight: bold; font-size: 1.1rem; flex-shrink: 0; }
        
        /* ЛОГОТИП СПРАВА (ВИЗУАЛЬНО ЧИСТЫЙ) 🔒 */
        .logo-gy { font-size: 1.1rem; font-weight: 900; color: var(--gold); letter-spacing: 1px; flex-shrink: 0; margin-left: auto; margin-right: 5px; }
        
        /* ЯЗЫКОВОЙ БЛОК 🔒 */
        .header-center { flex-grow: 1; display: flex; align-items: center; min-width: 0; }
        
        /* КНОПКА ДЕЙСТВИЯ 🔒 */
        .btn-act { color: var(--gold); font-size: 0.65rem; cursor: pointer; border: 1px solid var(--gold); padding: 8px 10px; background: #222; text-transform: uppercase; flex-shrink: 0; white-space: nowrap; margin-left: 5px; }

        #wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .bubble { padding: 12px; max-width: 85%; border: 1px solid #333; border-radius: 4px; line-height: 1.4; font-size: 1rem; }
        .u { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255,215,0,0.05); color: #fff; }
        .a { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255,255,255,0.05); text-align: right; outline: none; }

        /* FOOTER_CORE 🔒 */
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: 1px solid #222; background: #000; flex-shrink: 0; position: relative; }
        
        /* КНОПКА ВИДЫ ЮМОРА 🔒 */
        .btn-mode { width: 50px; height: 50px; border: 1px solid #444; background: #111; color: var(--gold); cursor: pointer; font-size: 1.2rem; z-index: 10; }
        
        #in { flex-grow: 1; background: #0d0d0d; border: 1px solid #333; color: var(--gold); padding: 15px; font-size: 1rem; outline: none; }
        .btn-ok { height: 50px; padding: 0 20px; background: var(--gold); border: none; color: #000; font-weight: 900; cursor: pointer; }

        .pop-menu { display: none; position: absolute; background: #111; border: var(--border); z-index: 9999; box-shadow: 0 0 25px #000; }
        #actMenu { top: 75px; right: 10px; width: 180px; }
        #modeMenu { bottom: 85px; left: 10px; width: 250px; }
        .m-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.8rem; color: #fff; text-transform: uppercase; }
        .m-item b { display: block; color: var(--gold); margin-bottom: 2px; }
        .m-item:hover { background: var(--gold); color: #000; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="nav-fix">❮</a>
    
    <div class="header-center">
        <div id="google_translate_element"></div>
    </div>
    
    <div class="btn-act" onclick="toggleM('actMenu', event)">ДЕЙСТВИЯ ▾</div>
    
    <div class="logo-gy">GY-GY</div>
    
    <a href="box_page.html" class="nav-fix">❯</a>

    <div id="actMenu" class="pop-menu">
        <div class="m-item" onclick="clearWall()">🗑 Очистить стену</div>
        <div class="m-item" onclick="alert('BOX OK')">📦 В сборник</div>
        <div class="m-item">🎬 Сделать клип</div>
        <div class="m-item">✉️ Переслать</div>
    </div>
</header>

<div id="wall">
    <div class="bubble a">Система v33.5.14 готова. Все замки переведены в невидимый режим (только в коде) 🔒.</div>
</div>

<footer>
    <button class="btn-mode" onclick="toggleM('modeMenu', event)">▲</button>
    <input type="text" id="in" placeholder="Стиль: § Быт..." onkeydown="if(event.key==='Enter') send()">
    <button class="btn-ok" onclick="send()">ОК</button>

    <div id="modeMenu" class="pop-menu">
        <div class="m-item" onclick="setM('ø Абсурд', 'абсурдный юмор, 4 строки')"><b>ø Абсурд</b>Безумные связи</div>
        <div class="m-item" onclick="setM('§ Быт', 'комедия наблюдений, 4 строки')"><b>§ Быт</b>Обычное смешное</div>
        <div class="m-item" onclick="setM('† Прожарка', 'инсалт-комедия, остро, 4 строки')"><b>† Прожарка</b>Дерзко и едко</div>
        <div class="m-item" onclick="setM('¶ Сатира', 'сатирический взгляд, 4 строки')"><b>¶ Сатира</b>Ирония над важным</div>
        <div class="m-item" onclick="setM('‡ Хлестко', 'краткий уан-лайнер, 1-2 строки')"><b>‡ Хлестко</b>Коротко в точку</div>
    </div>
</footer>

<script>
    let curName = "§ Быт";
    let curDesc = "комедия наблюдений, ровно 4 строки";

    function toggleM(id, e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById(id);
        const allMenus = document.querySelectorAll('.pop-menu');
        const isCurrentlyVisible = menu.style.display === 'block';
        allMenus.forEach(m => m.style.display = 'none');
        menu.style.display = isCurrentlyVisible ? 'none' : 'block';
    }

    function setM(name, desc) {
        curName = name; curDesc = desc;
        document.getElementById('in').placeholder = `Режим: ${name}...`;
        document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
    }

    function clearWall() { document.getElementById('wall').innerHTML = ""; }

/* 🔒 РЕЖИМ ПРЯМОГО ПРОБОЯ v33.5.18 - v1beta */
async function send() {
    const input = document.getElementById('in');
    const wall = document.getElementById('wall');
    const val = input.value.trim();
    if (!val) return;

    // Отображаем ваш ввод
    const uMsg = document.createElement('div');
    uMsg.className = 'bubble u';
    uMsg.innerText = val;
    wall.appendChild(uMsg);
    input.value = "";
    wall.scrollTop = wall.scrollHeight;

    // Склейка и очистка ключа
    const rawKey = BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2;
    const cleanKey = rawKey.replace(/[^a-zA-Z0-9_-]/g, "").trim();
    
    // Используем v1beta — это критично для Gemini 1.5 Flash
    const targetModel = "gemini-1.5-flash"; 
    const fullPrompt = BEUVRY_CONFIG.PROMPT + `\n[РИФМА: СТРОГО. СТИЛЬ: ${curDesc}]\nСЛОВА: ${val}`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${cleanKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: fullPrompt }] }]
            })
        });

        const data = await response.json();

        if (data.error) {
            throw new Error(`${data.error.message} (Код: ${data.error.code})`);
        }

        if (data.candidates && data.candidates[0].content) {
            const res = data.candidates[0].content.parts[0].text.trim();
            const aMsg = document.createElement('div');
            aMsg.className = 'bubble a';
            aMsg.contentEditable = "true";
            aMsg.innerHTML = `<small style="opacity:0.4">v1beta | ${targetModel}</small><br>${res.replace(/\n/g, '<br>')}`;
            wall.appendChild(aMsg);
        }
    } catch (e) {
        console.error("Ошибка v1beta:", e);
        const errMsg = document.createElement('div');
        errMsg.className = 'bubble a';
        errMsg.innerHTML = `<span style="color:red">ДОСТУП ОТКЛОНЕН:</span><br><small>${e.message}</small>`;
        wall.appendChild(errMsg);
    }
    wall.scrollTop = wall.scrollHeight;
}

    window.onclick = () => document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
    }
</script>

</body>
</html>
