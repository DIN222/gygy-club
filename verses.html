
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.2.7 Anchor</title>
    <style>
        :root {
            --gold: #ffd700;
            --bg: #000;
            --border: 1px solid #ffd700;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--gold);
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ: ФИКСИРОВАННЫЕ КРАЯ --- */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            border-bottom: var(--border);
            background: #000;
            flex-shrink: 0;
            z-index: 1000;
        }

        /* Кнопки-якоря */
        .anchor-btn {
            width: 55px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            color: var(--gold);
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
        }

        /* Центральная зона скролла */
        .scroll-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            padding: 0 10px;
            scrollbar-width: none;
        }
        .scroll-container::-webkit-scrollbar { display: none; }

        .panel-item {
            height: 36px;
            border: var(--border);
            color: var(--gold);
            background: none;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.8rem;
        }

        /* Правый блок (Лого + Стрелка) */
        .right-anchor {
            display: flex;
            align-items: center;
            border-left: 1px solid #222;
            height: 100%;
        }

        .logo-text {
            font-size: 0.8rem;
            font-weight: 900;
            padding: 0 10px;
            border-right: 1px solid #222;
        }

        /* --- GOOGLE STYLE --- */
        #google_translate_element { display: inline-block; }
        select.goog-te-combo {
            background: #000 !important;
            color: var(--gold) !important;
            border: var(--border) !important;
            font-family: inherit;
            outline: none;
            font-size: 0.8rem;
        }

        /* --- ЧАТ --- */
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 8px 15px; border-left: 2px solid var(--gold); font-size: 1.2rem; }

        /* --- НИЖНЯЯ ПАНЕЛЬ --- */
        footer {
            height: 85px; display: flex; align-items: center;
            padding: 0 12px; gap: 8px; border-top: 1px solid #222; flex-shrink: 0;
        }

        #user-input {
            flex-grow: 1; background: #000; border: var(--border);
            color: var(--gold); padding: 14px; outline: none; font-size: 1rem;
        }

        .footer-btn {
            height: 48px; cursor: pointer; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            text-transform: uppercase;
        }

        .btn-up { width: 48px; background: var(--gold); color: #000; border: none; font-size: 1.6rem; }
        .btn-to-archive { background: none; color: var(--gold); border: var(--border); padding: 0 12px; font-size: 0.7rem; }

        /* Скрываем мусор */
        .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="anchor-btn">«</a>

    <div class="scroll-container">
        <div id="google_translate_element"></div>
        <button class="panel-item" onclick="openArchive()">Сборник</button>
        <div class="panel-item">ID: 007</div>
        <div class="panel-item">AVATAR</div>
    </div>

    <div class="right-anchor">
        <div class="logo-text">GY-GY</div>
        <button class="anchor-btn" onclick="window.history.forward()">»</button>
    </div>
</header>

<div id="chat-wall">
    <div class="message">Четыре слова — это код...</div>
</div>

<footer>
    <input type="text" id="user-input" placeholder="Четыре любых слова..." onkeypress="if(event.key==='Enter') pushMsg()">
    <button class="footer-btn btn-up" onclick="pushMsg()">↑</button>
    <button class="footer-btn btn-to-archive" onclick="saveToArchive()">В СБОРНИК</button>
</footer>

<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ru',
            includedLanguages: 'en,de,fr,zh-CN',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
        }, 'google_translate_element');
    }

    function pushMsg() {
        const input = document.getElementById('user-input');
        const wall = document.getElementById('chat-wall');
        if(input.value.trim() !== "") {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerText = input.value;
            wall.appendChild(msg);
            input.value = "";
            wall.scrollTop = wall.scrollHeight;
        }
    }

    function saveToArchive() {
        const val = document.getElementById('user-input').value;
        if(val) {
            console.log("Сохранено в архив: " + val);
            document.getElementById('user-input').value = "";
        }
    }

    function openArchive() { alert("Архив Клуба"); }
</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
