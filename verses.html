<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY CLUB | VERSES v.1.1</title>
    <style>
        :root {
            --gold: #ffd700;
            --bg-dark: #000000;
            --card-bg: #0a0a0a;
            --gray: #444;
            --text-white: #e0e0e0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--gold);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. ВЕРХНЯЯ ПАНЕЛЬ */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid var(--gray);
            background: var(--card-bg);
        }

        .nav-group { display: flex; align-items: center; gap: 20px; }
        .logo { font-weight: bold; font-size: 22px; letter-spacing: 3px; }
        .nav-btn { cursor: pointer; font-size: 20px; transition: 0.3s; }
        .nav-btn:hover { color: #fff; }
        
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar-box {
            width: 45px;
            height: 45px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            overflow: hidden;
        }

        .btn-idea {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }

        /* 2. ЦЕНТРАЛЬНАЯ СТЕНА */
        #wall {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            scroll-behavior: smooth;
        }

        .verse-card {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid #222;
            padding: 20px;
            position: relative;
            transition: border 0.3s;
        }

        .verse-card:hover { border-color: var(--gold); }

        .verse-content {
            color: var(--text-white);
            font-size: 16px;
            line-height: 1.6;
            min-height: 80px;
            margin-bottom: 15px;
            white-space: pre-line;
            outline: none; /* Для редактирования */
        }

        /* МИКРО-ПУЛЬТ */
        .micro-remote {
            display: flex;
            gap: 15px;
            border-top: 1px solid #222;
            padding-top: 10px;
            font-size: 12px;
        }

        .remote-btn {
            cursor: pointer;
            color: var(--gray);
            transition: 0.3s;
        }

        .remote-btn:hover { color: var(--gold); }
        .btn-del:hover { color: #ff4d4d; }

        /* 3. НИЖНЯЯ ПАНЕЛЬ */
        footer {
            background: var(--card-bg);
            border-top: 1px solid var(--gray);
            padding: 20px;
        }

        .input-area {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 15px;
        }

        select, input[type="text"] {
            background: #000;
            border: 1px solid var(--gray);
            color: var(--text-white);
            padding: 12px;
            font-family: inherit;
        }

        input[type="text"] { flex: 1; }
        
        .btn-ok {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 0 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .version-tag {
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 9px;
            color: #333;
        }
    </style>
</head>
<body>

<header>
    <div class="nav-group">
        <div class="nav-btn">⟵</div>
        <div class="logo">GY-GY</div>
        <div class="nav-btn">⟶</div>
    </div>
    <div class="user-info">
        <button class="btn-idea" onclick="triggerIdea()">Генератор идей</button>
        <div style="font-size: 12px;">RU | EN</div>
        <div class="avatar-box">ID:001</div>
    </div>
</header>

<main id="wall">
    <div class="verse-card">
        <div class="verse-content" contenteditable="true">
            И-го-го! Ядро готово к резонансу. 
            Введите 4 слова, и мы создадим искру.
        </div>
        <div class="version-tag">v.1.1</div>
    </div>
</main>

<footer>
    <div class="input-area">
        <select id="styleSelector">
            <option value="noir">НУАР-ДЖАЗ</option>
            <option value="opti">ОПТИМИЗМ</option>
            <option value="gygy">ГИ-ГИ</option>
        </select>
        <input type="text" id="wordInput" placeholder="Введите 4 слова...">
        <button class="btn-ok" onclick="processWords()">OK</button>
    </div>
</footer>

<script>
    function processWords() {
        const input = document.getElementById('wordInput');
        const wall = document.getElementById('wall');
        const style = document.getElementById('styleSelector').value;

        if (input.value.trim() === "") return;

        // Создаем новую карточку по Уставу
        const card = document.createElement('div');
        card.className = 'verse-card';
        
        // Имитация ответа ИИ (в будущем здесь будет запрос к API)
        const text = `На входе: ${input.value}\nСтиль: ${style}\n\nСтихи родятся здесь,\nВ нуарной тишине.\nКопыта бьют о жесть,\nИстина — в вине.`;

        card.innerHTML = `
            <div class="verse-content" contenteditable="true">${text}</div>
            <div class="micro-remote">
                <div class="remote-btn" onclick="sendTo('clip')">🎬 CLIP</div>
                <div class="remote-btn" onclick="sendTo('tg')">✈️ TELEGRAM</div>
                <div class="remote-btn" onclick="sendTo('archive')">🏛️ TO ARCHIVE</div>
                <div class="remote-btn btn-del" onclick="this.closest('.verse-card').remove()">❌ DELETE</div>
            </div>
            <div class="version-tag">v.1.1</div>
        `;

        wall.appendChild(card);
        input.value = "";
        wall.scrollTop = wall.scrollHeight;
    }

    function triggerIdea() {
        const ideas = ["Реголит", "Джаз", "Струна", "Холод"];
        document.getElementById('wordInput').value = ideas.join(' ');
    }

    function sendTo(dest) {
        alert("Устав в действии: Передача объекта в " + dest.toUpperCase());
        // Здесь будет логика редиректа или API-вызова
    }
</script>

</body>
</html>
