<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY BEUVRY | v6.4.0 Director</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; padding: 0 15px; box-sizing: border-box; justify-content: space-between; position: relative; z-index: 100; }
        .btn-top { width: 40px; height: 40px; border: var(--border); color: var(--gold); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 0.8rem; }
        .logo-gy { font-weight: 900; font-size: 1.3rem; letter-spacing: 4px; position: absolute; left: 50%; transform: translateX(-50%); }
        
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 25px; }
        .msg { padding: 15px; max-width: 85%; font-size: 1.1rem; line-height: 1.4; border-radius: 2px; position: relative; transition: all 0.3s; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; color: #eee; background: rgba(255, 255, 255, 0.08); text-align: right; }
        
        /* Меню действий */
        .actions-trigger { cursor: pointer; font-size: 1.5rem; opacity: 0.5; margin-top: 10px; display: inline-block; }
        .actions-trigger:hover { opacity: 1; }
        .sub-menu { display: none; position: absolute; right: 0; bottom: -110px; background: #111; border: var(--border); z-index: 10; width: 150px; text-align: left; }
        .sub-menu div { padding: 10px; font-size: 0.8rem; border-bottom: 1px solid #222; cursor: pointer; }
        .sub-menu div:hover { background: var(--gold); color: #000; }

        footer { height: 90px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: 1px solid #333; background: #000; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 15px; outline: none; font-size: 1rem; }
        .btn-up { width: 55px; height: 55px; background: var(--gold); border: none; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="btn-top">«</a>
    <div class="logo-gy">GY-GY</div>
    <div style="display:flex; gap:5px;">
        <div class="btn-top" onclick="alert('Сборник пока пуст')">BOX</div>
        <div class="btn-top">RU</div>
    </div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">v6.4.0: Режим «Режиссер». Жду слова.</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Ваш сюжет..." autocomplete="off">
    <button id="send-btn" class="btn-up">↑</button>
</footer>

<script>
    const MODELS = ['gemini-3.1-flash-lite-preview', 'gemini-2.5-flash-lite', 'gemini-2.0-flash'];
    const input = document.getElementById('user-in');
    const btn = document.getElementById('send-btn');
    const wall = document.getElementById('chat-wall');

    function getApiKey() { return localStorage.getItem('user_gemini_key') || (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2 : ""); }

    async function callAI(text, modelIdx = 0) {
        if (modelIdx >= MODELS.length) return "Беври ушел за кулисы. Попробуйте позже.";
        const key = getApiKey();
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODELS[modelIdx]}:generateContent?key=${key}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PROMPT : "Нуар.") + "\nТема: " + text }] }] })
            });
            const d = await r.json();
            if (d.error && (d.error.code === 503 || d.error.code === 429)) return await callAI(text, modelIdx + 1);
            return d.candidates[0].content.parts[0].text;
        } catch (e) { return await callAI(text, modelIdx + 1); }
    }

    function createMenu(parent, text) {
        const trigger = document.createElement('div');
        trigger.className = 'actions-trigger';
        trigger.innerText = '...';
        
        const menu = document.createElement('div');
        menu.className = 'sub-menu';
        menu.innerHTML = `
            <div onclick="saveToBox('${text.replace(/'/g, "\\'")}')">★ В СБОРНИК</div>
            <div onclick="alert('Готовим клип...')">🎬 КЛИП</div>
            <div onclick="navigator.clipboard.writeText('${text.replace(/'/g, "\\'")}'); alert('Скопировано!')">🔗 ДРУГУ</div>
            <div onclick="this.closest('.msg').remove()" style="color:red">✖ УДАЛИТЬ</div>
        `;
        
        trigger.onclick = (e) => {
            e.stopPropagation();
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        };
        
        parent.appendChild(trigger);
        parent.appendChild(menu);
    }

    window.saveToBox = (txt) => {
        let box = JSON.parse(localStorage.getItem('gy_collection') || "[]");
        box.push({text: txt, date: new Date().toLocaleString()});
        localStorage.setItem('gy_collection', JSON.stringify(box));
        alert('Сохранено в BOX!');
    };

    async function handleSend() {
        const val = input.value.trim();
        if (!val || btn.disabled) return;
        btn.disabled = true;

        const uM = document.createElement('div'); uM.className = 'msg user-msg'; uM.innerText = val;
        wall.appendChild(uM);
        
        const aiM = document.createElement('div'); aiM.className = 'msg ai-msg'; aiM.innerHTML = "<i>...</i>";
        wall.appendChild(aiM);
        
        input.value = "";
        const res = await callAI(val);
        aiM.innerHTML = res.replace(/\n/g, '<br>');
        createMenu(aiM, res);
        
        btn.disabled = false;
        wall.scrollTop = wall.scrollHeight;
    }

    btn.addEventListener('click', handleSend);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
    document.addEventListener('click', () => { document.querySelectorAll('.sub-menu').forEach(m => m.style.display='none'); });
</script>
</body>
</html>
