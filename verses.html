
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | CORE v33.4.0</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        .page-header { height: 60px; display: flex; align-items: center; border-bottom: var(--border); background: #111; position: relative; z-index: 1000; flex-shrink: 0; }
        .nav-fix { width: 50px; height: 100%; display: flex; align-items: center; justify-content: center; background: #111; cursor: pointer; font-weight: bold; font-size: 1.2rem; text-decoration: none; color: var(--gold); flex-shrink: 0; }
        .header-scroll { flex-grow: 1; display: flex; align-items: center; overflow-x: auto; white-space: nowrap; padding: 0 10px; gap: 20px; scrollbar-width: none; }
        .logo-right { font-weight: 900; letter-spacing: 2px; padding-right: 10px; font-size: 0.9rem; flex-shrink: 0; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gold); background: #333; flex-shrink: 0; }

        /* PROGRESS BAR */
        #progress { position: absolute; bottom: 0; left: 0; height: 2px; background: var(--gold); width: 0%; transition: width 0.3s; }

        /* WALL */
        #wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .bubble { padding: 12px; max-width: 85%; border: 1px solid #333; line-height: 1.4; font-size: 1.1rem; position: relative; border-radius: 4px; }
        .u { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255,215,0,0.03); color: #fff; }
        .a { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }

        .style-label { display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; opacity: 0.5; user-select: none; }
        .edit-zone { outline: none; white-space: pre-wrap; }
        .copy-btn { position: absolute; bottom: -10px; right: 10px; background: #111; border: 1px solid var(--gold); color: var(--gold); font-size: 0.6rem; padding: 2px 6px; cursor: pointer; border-radius: 2px; display: none; z-index: 10; }
        .bubble:hover .copy-btn { display: block; }

        /* FOOTER */
        footer { height: 80px; display: flex; align-items: center; padding: 0 10px; gap: 10px; background: #000; border-top: 1px solid #222; position: relative; flex-shrink: 0; }
        .btn-mode { width: 50px; height: 50px; border: 1px solid #444; background: #111; color: var(--gold); cursor: pointer; font-size: 1.2rem; border-radius: 4px; }
        #in { flex-grow: 1; background: #0d0d0d; border: 1px solid #333; color: var(--gold); padding: 15px; font-size: 1rem; outline: none; border-radius: 4px; }
        .btn-ok { padding: 0 20px; height: 50px; background: var(--gold); border: none; color: #000; font-weight: 900; cursor: pointer; border-radius: 4px; }

        /* MENUS */
        .pop-menu { display: none; position: absolute; background: #111; border: var(--border); z-index: 2000; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        .act-menu { top: 62px; left: 50%; transform: translateX(-50%); width: 180px; }
        .mode-menu { bottom: 85px; left: 10px; width: 260px; }
        .m-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.8rem; color: #fff; }
        .m-item:hover { background: #222; color: var(--gold); }
        .m-item b { display: block; color: var(--gold); }
    </style>
</head>
<body>

<header class="page-header">
    <a href="ai_room_core_v8.html" class="nav-fix">❮</a>
    <div class="header-scroll">
        <div class="h-item">🌐 <span>RU</span></div>
        <div class="h-item"><div class="avatar"></div></div>
        <div class="h-item" onclick="toggle('actMenu')" style="cursor:pointer">ДЕЙСТВИЯ ▾</div>
    </div>
    <div class="logo-right">GY-GY</div>
    <a href="box_page.html" class="nav-fix">❯</a>
    <div id="progress"></div>
</header>

<div id="wall"></div>

<div id="actMenu" class="pop-menu act-menu">
    <div class="m-item" onclick="clearWall()">🗑 Удалить</div>
    <div class="m-item" onclick="saveToBox()">📦 В сборник</div>
    <div class="m-item">🎬 Сделать клип</div>
    <div class="m-item">✉️ Переслать</div>
</div>

<div id="modeMenu" class="pop-menu mode-menu">
    <div class="m-item" onclick="setM('ø Абсурд', 'абсурдный юмор, ровно 4 строки')"><b>ø Абсурд</b>Безумные связи</div>
    <div class="m-item" onclick="setM('§ Быт', 'комедия наблюдений, ровно 4 строки')"><b>§ Быт</b>Смешное в обычном</div>
    <div class="m-item" onclick="setM('† Прожарка', 'инсалт-комедия, ровно 4 строки')"><b>† Прожарка</b>Остро и дерзко</div>
    <div class="m-item" onclick="setM('¶ Сатира', 'сатирический взгляд, ровно 4 строки')"><b>¶ Сатира</b>Ирония над важным</div>
    <div class="m-item" onclick="setM('‡ Хлестко', 'максимально краткий уан-лайнер, 1 или 2 строки')"><b>‡ Хлестко</b>Коротко и в точку</div>
</div>

<footer>
    <button class="btn-mode" onclick="toggle('modeMenu')">▲</button>
    <input type="text" id="in" placeholder="Режим: § Быт | 4 слова..." onkeydown="if(event.key==='Enter') send()">
    <button id="okBtn" class="btn-ok" onclick="send()">ОК</button>
</footer>
<script>
    let curDesc = "комедия наблюдений, ровно 4 строки";
    let curName = "§ Быт";

    function toggle(id) {
        const el = document.getElementById(id);
        const isShow = el.style.display === 'block';
        document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
        el.style.display = isShow ? 'none' : 'block';
    }

    function setM(name, desc) {
        curName = name; curDesc = desc;
        document.getElementById('in').placeholder = `Режим: ${name} | 4 слова...`;
        document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
    }

    function push(txt, isAi, mode = "") {
        const wall = document.getElementById('wall');
        const d = document.createElement('div');
        d.className = `bubble ${isAi ? 'a' : 'u'}`;
        if (isAi) {
            d.innerHTML = `<span class="style-label">${mode}</span>
            <div class="edit-zone" contenteditable="true">${txt.replace(/\n/g, '<br>')}</div>
            <button class="copy-btn" onclick="copyText(this)">КОПИРОВАТЬ</button>`;
        } else { d.innerText = txt; }
        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }

    function copyText(btn) {
        const text = btn.parentElement.querySelector('.edit-zone').innerText;
        navigator.clipboard.writeText(text);
        btn.innerText = "OK!"; setTimeout(() => btn.innerText = "КОПИРОВАТЬ", 1000);
    }

    // ТРИЗ: Адаптивный мотор связи
    async function callAI(text) {
        const k = (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).replace(/["'\s]/g, "");
        const models = BEUVRY_CONFIG.MODELS_PRIORITY || ["gemini-1.5-flash-latest", "gemini-1.5-flash", "gemini-1.5-flash-8b"];
        
        for (let m of models) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${k}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `${BEUVRY_CONFIG.PROMPT}\nСтиль: ${curName} (${curDesc}). Слова: ${text}` }] }] })
                });
                
                const d = await r.json();
                if (d.candidates && d.candidates[0].content) {
                    return d.candidates[0].content.parts[0].text.trim();
                }
                if (d.error) console.warn(`Модель ${m} ответила ошибкой: ${d.error.message}`);
            } catch (e) { console.error(`Сбой на модели ${m}`); }
        }
        return "🚬 Все каналы связи заблокированы. Проверь лимиты или ключ.";
    }

    async function send() {
        const input = document.getElementById('in');
        const val = input.value.trim();
        if (!val) return;
        
        const okBtn = document.getElementById('okBtn');
        okBtn.disabled = true;
        push(val, false);
        input.value = "";
        
        const bar = document.getElementById('progress');
        bar.style.width = "100%";
        
        const result = await callAI(val);
        push(result, true, curName);
        
        okBtn.disabled = false;
        setTimeout(() => { bar.style.width = "0%"; }, 500);
    }

    function clearWall() { document.getElementById('wall').innerHTML = ""; toggle('actMenu'); }
    function saveToBox() { alert("Сохранено!"); toggle('actMenu'); }
    
    // Закрытие меню при клике по стене
    window.onclick = (e) => {
        if (!e.target.closest('header') && !e.target.closest('footer') && !e.target.closest('.pop-menu')) {
            document.querySelectorAll('.pop-menu').forEach(m => m.style.display = 'none');
        }
    }
</script>

</body>
</html>
