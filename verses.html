
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ROOM CORE | v8.1.8 (Internal 4.3)</title>
    <style>
        :root {
            --orange-neon: #ff8c00;
            --neon-glow: 0 0 15px rgba(255, 140, 0, 0.8), 0 0 30px rgba(255, 69, 0, 0.5);
            --gold: #ffd700;
            --bg: #000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ (GOLD v4.3) --- */
        header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px 25px;
            box-sizing: border-box;
            border-bottom: 1px solid var(--gold);
            background: rgba(10, 10, 10, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .nav-group { display: flex; align-items: center; gap: 20px; }
        
        .btn-nav {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            cursor: pointer;
            padding: 5px 12px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-nav:hover { background: var(--gold); color: #000; }

        .lang-trigger {
            cursor: pointer;
            color: var(--orange-neon);
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: var(--neon-glow);
            transition: 0.3s;
        }
        .lang-trigger:hover { transform: scale(1.1); filter: brightness(1.3); }

        /* --- ГЛАВНЫЙ ЭКРАН С ТЕЛЕВИЗОРАМИ --- */
        .viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('OIG2_vintage_tv_room_v2.png') no-repeat center center;
            background-size: contain;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-label {
            position: absolute;
            color: var(--orange-neon);
            text-shadow: var(--neon-glow);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-transform: lowercase;
            /* Адаптивный размер шрифта */
            font-size: clamp(18px, 2.5vw, 45px);
        }

        #verses-zone { top: 45%; left: 28%; width: 15%; height: 12%; }
        #techpark-zone { top: 45%; left: 43.5%; width: 15%; height: 12%; }

        .screen-label:hover {
            filter: brightness(1.5);
            transform: scale(1.1);
            text-shadow: 0 0 30px var(--orange-neon);
        }

        /* --- НИЖНЯЯ ПАНЕЛЬ ДАННЫХ --- */
        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }

        #digital-trace { color: var(--orange-neon); font-weight: bold; }

        /* --- СКРЫТИЕ ГРЯЗИ GOOGLE --- */
        .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
        body { top: 0 !important; }
        #google_translate_element { display: none; }
        
        select.goog-te-combo {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            background: #111 !important;
            color: var(--gold) !important;
            border: 2px solid var(--orange-neon) !important;
            padding: 8px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>

<header>
    <div class="nav-group">
        <button class="btn-nav" onclick="history.back()">«</button>
        <div class="lang-trigger" onclick="changeLang()">文A</div>
    </div>
    <div style="color: var(--gold); letter-spacing: 5px; font-weight: bold;">GY-GY v5.0</div>
    <button class="btn-nav" onclick="location.reload()">↺</button>
</header>

<div class="viewport">
    <a href="verses.html" class="screen-label" id="verses-zone">verses</a>
    <a href="techpark.html" class="screen-label" id="techpark-zone">techpark</a>
</div>

<footer>
    <div>AI ROOM CORE | BEUVRY STATION</div>
    <div style="text-align: right;">
        VER: 4.3 (Build 8.1.8)<br>
        TRACE_ID: <span id="digital-trace">...</span>
    </div>
</footer>

<div id="google_translate_element"></div>

<script>
    // Инициализация перевода
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }

    // Вызов меню языков
    function changeLang() {
        var select = document.querySelector('select.goog-te-combo');
        if (select) {
            select.style.display = (select.style.display === 'block') ? 'none' : 'block';
            select.focus();
        } else {
            console.log("Ждем лингво-модуль...");
        }
    }

    // Генерация ID
    (function() {
        let id = localStorage.getItem('gy_trace') || 'ID-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        localStorage.setItem('gy_trace', id);
        document.getElementById('digital-trace').innerText = id;
    })();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
