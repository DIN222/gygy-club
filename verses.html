<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY CLUB | VERSES v.3.0</title>
    <style>
        :root { 
            --gold: #ffd700; 
            --black: #000; 
            --h-unit: 60px; /* Увеличено для удобства нажатия (было 42) */
            --font-main: 18px; /* Крупный шрифт для телефона */
        }
        
        body { 
            background: var(--black); 
            color: var(--gold); 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* HEADER: Адаптивная сетка */
        header { 
            display: flex;
            flex-wrap: wrap; /* Чтобы на совсем узких экранах блоки могли переноситься */
            justify-content: space-between; 
            align-items: center; 
            padding: 10px; 
            border-bottom: 2px solid var(--gold);
            gap: 10px;
        }

        .header-left { display: flex; gap: 8px; flex: 1; }
        .header-right { display: flex; justify-content: flex-end; }

        /* UI ELEMENTS: Крупные и четкие */
        .ui-box { 
            height: var(--h-unit); 
            border: 2px solid var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 15px; 
            background: transparent; 
            color: var(--gold); 
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            font-size: var(--font-main);
            font-weight: bold;
        }

        .arrow { width: 70px; font-size: 30px; }
        .logo { 
            font-size: 32px; 
            font-weight: bold; 
            letter-spacing: 4px; 
            margin: 0 10px;
            text-align: center;
        }

        /* WALL: Прокрутка контента */
        #wall { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        .card { 
            border: 1px solid #444; 
            padding: 20px; 
            background: #080808; 
            width: 95%; 
            margin: 0 auto; 
            box-sizing: border-box;
        }
        
        .content { 
            color: #fff; 
            min-height: 80px; 
            outline: none; 
            margin-bottom: 15px; 
            white-space: pre-line; 
            font-size: 20px; /* Крупный текст куплетов */
        }

        .remote { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            border-top: 1px solid #333; 
            padding-top: 15px; 
        }
        
        .remote-btn { 
            cursor: pointer; 
            color: #888; 
            font-size: 14px; 
            text-transform: uppercase;
            padding: 5px 0;
        }

        /* FOOTER: На всю ширину */
        footer { 
            padding: 15px; 
            border-top: 2px solid #333; 
            background: var(--black); 
        }

        .input-stack { 
            display: flex; 
            flex-direction: column; /* Элементы друг под другом для мобилы */
            gap: 12px; 
            width: 100%; 
        }

        input, select { 
            background: #000; 
            border: 2px solid var(--gold); 
            color: #fff; 
            height: var(--h-unit); 
            padding: 0 15px; 
            font-family: inherit; 
            font-size: var(--font-main);
            width: 100%; 
            box-sizing: border-box;
            outline: none;
        }

        .btn-ok { 
            background: var(--gold); 
            color: #000; 
            font-weight: bold; 
            width: 100%; 
        }

    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="ui-box arrow" onclick="location.href='ai_room_core_v8.html'">⟵</button>
        <div class="ui-box" style="border:none; padding: 0 5px;">RU/EN</div>
        <button class="ui-box" style="flex: 1;" onclick="setIdea()">ГЕНЕРАТОР</button>
    </div>
    
    <div class="logo">GY-GY</div>
    
    <div class="header-right">
        <button class="ui-box arrow" onclick="location.href='clip.html'">⟶</button>
    </div>
</header>

<main id="wall">
    <div class="card" id="v1">
        <div class="content" contenteditable="true">Шеф, это v.3.0. 
Кнопки стали крупнее. 
Теперь удобно даже в перчатках!</div>
        <div class="remote">
            <span class="remote-btn" onclick="bridge('CLIP', 'v1')">🎬 CLIP</span>
            <span class="remote-btn" onclick="bridge('TG', 'v1')">✈️ TELEGRAM</span>
            <span class="remote-btn" onclick="bridge('ARCHIVE', 'v1')">🏛️ ARCHIVE</span>
            <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#ff4444">❌ DELETE</span>
        </div>
    </div>
</main>

<footer>
    <div class="input-stack">
        <select id="style">
            <option>НУАР-ДЖАЗ</option>
            <option>ГИ-ГИ</option>
            <option>ОПТИМИЗМ</option>
        </select>
        <input type="text" id="words" placeholder="Введите 4 слова...">
        <button class="ui-box btn-ok" onclick="createVerse()">СИНТЕЗИРОВАТЬ ОК</button>
    </div>
</footer>

<script>
    function bridge(action, id) {
        const text = document.querySelector(`#${id} .content`).innerText;
        if(action === 'CLIP') {
            localStorage.setItem('currentVerse', text);
            location.href = 'clip.html'; 
        }
    }

    function createVerse() {
        const val = document.getElementById('words').value;
        if(!val) return;
        const id = 'v' + Date.now();
        const card = document.createElement('div');
        card.className = 'card';
        card.id = id;
        
        card.innerHTML = `
            <div class="content" contenteditable="true">Синтез по теме: ${val}\n\nКони в вакууме скачут,\nДжаз играет на Луне.\nРоботы от счастья плачут\nВ этой звездной тишине.</div>
            <div class="remote">
                <span class="remote-btn" onclick="bridge('CLIP', '${id}')">🎬 CLIP</span>
                <span class="remote-btn" onclick="bridge('TG', '${id}')">✈️ TG</span>
                <span class="remote-btn" onclick="bridge('ARCHIVE', '${id}')">🏛️ ARCHIVE</span>
                <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#ff4444">❌ DELETE</span>
            </div>`;
        document.getElementById('wall').appendChild(card);
        document.getElementById('words').value = '';
        document.getElementById('wall').scrollTo(0, document.getElementById('wall').scrollHeight);
    }

    function setIdea() { 
        document.getElementById('words').value = "Джаз Комета Клуб Копыто"; 
    }
</script>

</body>
</html>
