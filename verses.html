
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY v6.0: THE CORE</title>
    <style>
        :root { --gold: #ffcf00; --orange: #ff8c00; --bg: #000; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; }

        /* ЭКРАНЫ И КОМНАТА */
        #room { 
            display: flex; height: 100vh; width: 100vw; 
            background: linear-gradient(to bottom, #050505, #000);
            position: relative; align-items: center; justify-content: center;
        }

        /* Геометрия пространства */
        .floor { position: absolute; bottom: 0; width: 100%; height: 20%; background: #080808; border-top: 1px solid #1a1a1a; }
        
        .screen-left, .screen-right {
            width: 35%; height: 60%; border: 1px solid #222;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10, 10, 10, 0.9); box-shadow: 0 0 20px rgba(0,0,0,1);
        }

        .neon-btn {
            color: var(--orange); font-size: clamp(20px, 5vw, 40px); font-weight: 900;
            text-shadow: 0 0 15px var(--orange); cursor: pointer;
            letter-spacing: 5px; text-decoration: none; transition: 0.3s;
        }
        .neon-btn:hover { color: #fff; text-shadow: 0 0 30px var(--gold); transform: scale(1.1); }

        /* ИНТЕРФЕЙС СТУДИИ */
        #studio { display: none; flex-direction: column; height: 100vh; background: #000; }
        
        header { 
            display: flex; align-items: center; border-bottom: 1px solid #222; 
            padding: 10px; background: #050505; height: 60px; justify-content: space-between;
        }

        .nav-link { color: var(--gold); font-size: 24px; text-decoration: none; cursor: pointer; font-weight: bold; padding: 0 10px; }
        
        .tools { display: flex; gap: 15px; align-items: center; }
        .tool-text { color: var(--gold); font-size: 10px; font-weight: 900; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; }

        /* ЧАТ */
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .line { padding: 10px; border-left: 2px solid var(--gold); font-size: 18px; max-width: 85%; }
        .user { align-self: flex-end; border-left: none; border-right: 2px solid #444; text-align: right; color: #888; }

        /* ВВОД */
        .input-bar { display: flex; padding: 15px; background: #080808; border-top: 1px solid #222; gap: 10px; }
        input { flex: 1; background: none; border: none; border-bottom: 1px solid #333; color: #fff; font-size: 18px; outline: none; }
        .ok-btn { color: var(--gold); border: 1px solid var(--gold); background: none; padding: 5px 20px; font-weight: 900; cursor: pointer; }

        #sign { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid var(--gold); background: #000; color: var(--gold); padding: 20px; display: none; z-index: 100; text-align: center; font-weight: 900; }
    </style>
</head>
<body>

    <div id="sign">⛔<br>ТУПИК</div>

    <div id="room">
        <div class="floor"></div>
        <div class="screen-left">
            <div class="neon-btn" onclick="openStudio()">VERSES</div>
        </div>
        <div style="width: 10%;"></div> <div class="screen-right">
            <div class="neon-btn" style="opacity:0.3">TECHPARK</div>
        </div>
    </div>

    <div id="studio">
        <header>
            <div class="nav-link" onclick="closeStudio()">«</div>
            <div class="tools">
                <div class="tool-text" id="langBtn">文A</div>
                <div class="tool-text" id="uid">ID-000</div>
                <div class="tool-text">В ЭФИР</div>
                <div class="tool-text">SHARE</div>
                <div class="tool-text" style="color:#fff">КЛИП</div>
            </div>
            <div style="color:var(--gold); font-weight:900; letter-spacing:2px;">GY-GY</div>
            <div class="nav-link" onclick="alert('ТУПИК')">»</div>
        </header>

        <div id="chat">
            <div class="line">Кресло готово. Жду твой куплет...</div>
        </div>

        <div class="input-bar">
            <input type="text" id="msgInp" placeholder="ИМПУЛЬС..." autocomplete="off">
            <button class="ok-btn" onclick="send()">OK</button>
        </div>
    </div>

    <script>
        let count = 0;

        function openStudio() {
            document.getElementById('room').style.display = 'none';
            document.getElementById('studio').style.display = 'flex';
        }

        function closeStudio() {
            document.getElementById('room').style.display = 'flex';
            document.getElementById('studio').style.display = 'none';
        }

        function send() {
            const inp = document.getElementById('msgInp');
            const chat = document.getElementById('chat');
            const val = inp.value.trim().toLowerCase();

            if (!val || count >= 8) return;

            // Твоё
            addMsg(inp.value, 'user');
            
            // Моё (Рифма)
            setTimeout(() => {
                let reply = "Абсурд принят. Жду продолжения...";
                if (val.includes('айсберг') || val.includes('кот')) {
                    reply = "Кот приехал — айсберг в рот.";
                } else if (val.includes('дно')) {
                    reply = "На дне коту тепло и темно.";
                }
                
                addMsg(reply, '');
                count += 2;
                if (count >= 8) addMsg("--- 4 КУПЛЕТА ЕСТЬ. В ЭФИР? ---", 'tool-text');
            }, 600);

            inp.value = "";
        }

        function addMsg(txt, cls) {
            const d = document.createElement('div');
            d.className = 'line ' + cls;
            d.innerText = txt;
            const c = document.getElementById('chat');
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        window.onload = () => {
            document.getElementById('uid').innerText = 'ID-' + Math.floor(Math.random()*999);
        };
    </script>
</body>
</html>
