<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | VERSES v3.0 LIVE-GEN</title>
    <style>
        :root { --gold: #d4af37; --neon: #00f2ff; }
        body { 
            margin: 0; background: #000; color: var(--gold); 
            font-family: 'Courier New', monospace; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        .terminal-header {
            padding: 15px 30px; border-bottom: 1px solid var(--gold);
            display: flex; justify-content: space-between; font-size: 12px;
            background: rgba(212,175,55,0.05);
        }

        #poetry-stream {
            flex: 1; padding: 40px; overflow-y: auto;
            display: flex; flex-direction: column-reverse; /* Новое всегда сверху */
        }

        .live-stanza {
            margin-bottom: 30px; padding: 20px;
            border-left: 3px solid var(--neon);
            background: rgba(0, 242, 255, 0.02);
            animation: glitch 0.3s ease;
        }

        @keyframes glitch {
            0% { transform: skew(10deg); opacity: 0; }
            100% { transform: skew(0deg); opacity: 1; }
        }

        .v-line { font-size: 22px; font-weight: 900; line-height: 1.6; text-transform: uppercase; }
        .v-meta { font-size: 10px; color: var(--neon); margin-bottom: 10px; letter-spacing: 2px; }

        .gen-panel {
            padding: 40px; background: #050505;
            display: flex; justify-content: center; gap: 30px;
            border-top: 1px solid rgba(212,175,55,0.2);
        }

        .trigger-btn {
            background: none; border: 2px solid var(--neon); color: var(--neon);
            padding: 20px 40px; cursor: pointer; font-weight: 900;
            letter-spacing: 5px; transition: 0.2s;
        }
        .trigger-btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); }
    </style>
</head>
<body>

    <div class="terminal-header">
        <div>MODULE: GEN_CORE_v3.0</div>
        <div>STATUS: REAL_TIME_COMPILING</div>
        <div onclick="location.href='ai_room_core_v8.html'" style="cursor:pointer;">[ EXIT_TO_CORE ]</div>
    </div>

    <main id="poetry-stream"></main>

    <footer class="gen-panel">
        <button class="trigger-btn" onclick="synthesize('DARK')">DARK GEN</button>
        <button class="trigger-btn" style="border-color: var(--gold); color: var(--gold);" onclick="synthesize('GOLD')">GOLD GEN</button>
    </footer>

    <script>
        // СЛОВАРНЫЕ МАТРИЦЫ (Тут нет готовых фраз, только "кирпичи")
        const matrix = {
            subjects: ["Кибер-конь", "Бинарный шум", "Неоновый лорд", "Код Gemini", "Дверь в пустоту", "Матрица Гы-Гы", "Синтетик-банан", "Цифровой нерв"],
            actions: ["взламывает", "шифрует", "сжигает", "рисует", "пульсирует в", "крадет", "возводит", "ломает"],
            objects: ["память зеркал", "старые сны", "пульс серверов", "золото линз", "бездну частот", "скрипты бытия", "неон в баре", "логи души"],
            final: ["навечно.", "в потоке.", "сейчас.", "вне схем.", "без прав.", "в огне.", "под бит.", "v3.0."]
        };

        function synthesize(style) {
            const stream = document.getElementById('poetry-stream');
            const stanza = document.createElement('div');
            stanza.className = 'live-stanza';
            if(style === 'GOLD') stanza.style.borderColor = '#d4af37';

            // Алгоритм живой сборки (каждый раз новая структура)
            const linesCount = 4;
            let poemHTML = `<div class="v-meta">GEN_TIMESTAMP: ${Date.now()} | MODE: ${style}</div>`;

            for (let i = 0; i < linesCount; i++) {
                const s = matrix.subjects[Math.floor(Math.random() * matrix.subjects.length)];
                const a = matrix.actions[Math.floor(Math.random() * matrix.actions.length)];
                const o = matrix.objects[Math.floor(Math.random() * matrix.objects.length)];
                const f = matrix.final[Math.floor(Math.random() * matrix.final.length)];
                
                // Перемешиваем структуру предложения для каждой строки
                const structures = [
                    `${s} ${a} ${o}`,
                    `${a} ${o} — ${f}`,
                    `${o} и ${s} ${f}`,
                    `${s} ${f}`
                ];
                
                const lineText = structures[Math.floor(Math.random() * structures.length)];
                poemHTML += `<div class="v-line" style="color: ${style === 'GOLD' ? '#d4af37' : '#00f2ff'}">${lineText}</div>`;
            }

            stanza.innerHTML = poemHTML;
            stream.prepend(stanza); // Новое сверху

            // Звуковой эффект синтеза (если аудио прикручено)
            // playSynthesizeTick();
        }
    </script>
</body>
</html>
