
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY | VERSES TERMINAL</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --gold: #ffd700;
        }

        body, html {
            margin: 0; padding: 0;
            background: #000;
            color: var(--neon-blue);
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex; flex-direction: column;
        }

        /* Обязательные атрибуты клуба */
        .top-bar {
            padding: 20px;
            display: flex; justify-content: space-between;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
        }

        .brand-logo { color: var(--gold); font-weight: bold; letter-spacing: 3px; }

        /* Терминал */
        #terminal-output {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .input-area {
            padding: 20px;
            background: rgba(0, 242, 255, 0.05);
            display: flex;
            border-top: 1px solid rgba(0, 242, 255, 0.2);
        }

        input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 1.2rem;
            outline: none;
        }

        .cursor { color: var(--neon-blue); margin-right: 10px; }

        .btn-back {
            background: none; border: 1px solid #fff; color: #fff;
            padding: 5px 15px; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div id="google_translate_element"></div>
    <div class="brand-logo">GY-GY | VERSES</div>
</div>

<div id="terminal-output">СИСТЕМА ГОТОВА. ВВЕДИТЕ ЗАПРОС...</div>

<div class="input-area">
    <span class="cursor">></span>
    <input type="text" id="user-input" placeholder="Напишите что-нибудь..." onkeypress="handleKeyPress(event)">
</div>

<div style="padding: 20px;">
    <button class="btn-back" onclick="history.back()">← RETURN</button>
</div>

<script>
    // Тот самый мост между HTML и твоим api/chat.js
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const output = document.getElementById('terminal-output');
        const text = input.value;

        if (!text) return;

        // Визуализируем запрос пользователя
        output.innerText += `\n\nВЫ: ${text}\n`;
        input.value = '';
        output.innerText += `ГЕНЕРАЦИЯ ОТВЕТА...`;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: text,
                    user_id: localStorage.getItem('gy_trace') || 'GUEST'
                })
            });

            const data = await response.json();
            
            // Заменяем "Генерация..." на реальный текст
            output.innerText = output.innerText.replace('ГЕНЕРАЦИЯ ОТВЕТА...', `ИИ: ${data.text}`);
        } catch (error) {
            output.innerText = "\nОШИБКА ПРОТОКОЛА. ПРОВЕРЬТЕ API КЛЮЧ.";
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru'}, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
