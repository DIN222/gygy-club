
<!DOCTYPE html><html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.6.9 Core-Link</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #000; flex-shrink: 0; padding: 0 5px; box-sizing: border-box; }
        .btn-header { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: var(--border); color: var(--gold); background: none; cursor: pointer; flex-shrink: 0; font-size: 1.5rem; }
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .msg { padding: 12px; max-width: 80%; font-size: 1.1rem; line-height: 1.4; border-radius: 2px; position: relative; }
        .user-msg { align-self: flex-start; border-left: 3px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .ai-msg { align-self: flex-end; border-right: 3px solid #fff; color: #eee; background: rgba(255, 255, 255, 0.1); font-style: italic; text-align: right; }
        footer { height: 85px; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-top: 1px solid #333; background: #000; flex-shrink: 0; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 14px; outline: none; font-size: 1rem; font-family: inherit; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); color: #000; border: none; font-size: 1.8rem; cursor: pointer; font-weight: 900; }
    </style></head><body>

<header>
    <div class="btn-header" onclick="location.href='ai_room_core_v8.html'">«</div>
    <div style="flex-grow:1; text-align:center; font-weight:900; letter-spacing: 2px;">GY-GY VERSES</div>
    <div style="font-size: 0.7rem; padding: 0 10px; opacity: 0.6;">v5.6.9</div>
</header>

<div id="chat-wall">
    <div class="msg user-msg">Связь с config.js установлена. Беври ждет слов.</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Введите 4 слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
</footer>

<script>
    // Проверяем, есть ли ключ в подключенном config.js
    const API_KEY = (window.GEMINI_KEY) ? window.GEMINI_KEY : "NOT_FOUND";

    async function aiAction(t) {
        const wall = document.getElementById('chat-wall');
        const msg = document.createElement('div');
        msg.className = 'msg ai-msg'; msg.innerHTML = "<i>...</i>";
        wall.appendChild(msg); wall.scrollTop = wall.scrollHeight;
        
        if (API_KEY === "NOT_FOUND") {
            msg.innerHTML = "Ошибка: GEMINI_KEY не найден в config.js";
            return;
        }

        // Используем новейшую модель 2.0 Flash через v1beta
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

        try {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Ты нуарный поэт Беври. Ответь только жестким 4-стишием на русском на: " + t }] }] })
            });
            const d = await r.json();
            
            if (d.error) {
                msg.innerHTML = "Ошибка API: " + d.error.message;
            } else if (d.candidates && d.candidates[0].content) {
                msg.innerHTML = d.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            } else {
                msg.innerHTML = "Беври ушел в себя. Попробуй еще раз.";
            }
        } catch (e) {
            msg.innerHTML = "Сбой сети. Проверь VPN или доступ к Google.";
        }
        wall.scrollTop = wall.scrollHeight;
    }

    function send() {
        const input = document.getElementById('user-in');
        const val = input.value.trim();
        if(val) {
            const wall = document.getElementById('chat-wall');
            const m = document.createElement('div');
            m.className = 'msg user-msg'; m.innerText = val;
            wall.appendChild(m);
            aiAction(val);
            input.value = "";
        }
    }
</script>
</body></html>
