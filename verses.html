<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v7.4.0 REBORN</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 65px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; box-sizing: border-box; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .nav-btn { width: 45px; height: 45px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.7rem; box-shadow: 2px 2px 0 var(--gold); }
        .logo-gy { font-weight: 900; font-size: 1.5rem; letter-spacing: 5px; position: absolute; left: 50%; transform: translateX(-50%); text-shadow: 2px 2px 0 #333; }
        
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: #000; scroll-behavior: smooth; }
        .msg { padding: 15px; max-width: 85%; font-size: 1.1rem; border-radius: 2px; position: relative; border: 1px solid #222; }
        .u { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .a { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255, 255, 255, 0.05); text-align: right; }

        .menu-dots { cursor: pointer; font-size: 1.5rem; margin-top: 8px; opacity: 0.6; }
        .drop-menu { display: none; position: absolute; right: 0; top: 100%; background: #111; border: var(--border); z-index: 2000; width: 170px; }
        .drop-menu div { padding: 12px; font-size: 0.75rem; border-bottom: 1px solid #222; cursor: pointer; text-align: left; }
        .drop-menu div:hover { background: var(--gold); color: #000; }

        footer { height: 90px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 15px; outline: none; font-size: 1.1rem; }
        .btn-up { width: 60px; height: 60px; background: var(--gold); border: none; font-size: 2.2rem; cursor: pointer; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="nav-btn" onclick="location.reload()">REF</div>
    <div class="logo-gy">GY-GY</div>
    <div style="display:flex; gap:8px;">
        <div class="nav-btn" onclick="alert('BOX: Тут будут твои шедевры')">BOX</div>
        <div class="nav-btn">RU</div>
    </div>
</header>

<div id="wall">
    <div class="msg a">v7.4.0: Жду новый ключ в config.js. <br>Как только обновишь — пиши 4 слова. Будем стебаться по-взрослому!</div>
</div>

<footer>
    <input type="text" id="in" placeholder="Новый ключ — новая жизнь..." onkeypress="if(event.key==='Enter') send()">
    <button id="go" class="btn-up" onclick="send()">↑</button>
</footer>
<script>
    const MODELS = ['gemini-1.5-flash', 'gemini-2.0-flash-exp'];

    // Проверка ключа по клику на лого (для тебя, шеф)
    let clickCount = 0;
    document.querySelector('.logo-gy').onclick = () => {
        clickCount++;
        if (clickCount >= 3) {
            const k = (typeof BEUVRY_CONFIG !== 'undefined' ? (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim() : "КЛЮЧ НЕ НАЙДЕН");
            alert(`Диагностика ключа: ${k.substring(0,5)}...${k.slice(-5)}`);
            clickCount = 0;
        }
    };

    async function callAI(text) {
        const key = (typeof BEUVRY_CONFIG !== 'undefined' ? (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).trim() : "");
        
        if (!key || key.length < 10) return "Шеф, ключ пуст или слишком короткий! Проверь config.js.";

        for (let m of MODELS) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Ты — едкий нуарный комик. Стебись над словами юзера в 4 строки рифмы. Тон: жесткий юмор. Слова: " + text }] }] })
                });
                
                const d = await r.json();
                
                if (d.error) {
                    console.error("Ошибка Google:", d.error.message);
                    if (d.error.message.includes("expired")) return "⚠️ Ключ всё еще считается просроченным. Жди или смени ключ.";
                    if (d.error.message.includes("API key not found")) return "⚠️ Google не видит этот ключ. Ошибка в копипасте.";
                    continue;
                }

                if (d.candidates && d.candidates[0].content) {
                    return d.candidates[0].content.parts[0].text;
                }
            } catch (e) { console.error("Сбой сети на " + m); }
        }
        return "Модели всё еще ворчат. Проверь консоль (F12) или новый ключ!";
    }

    // Функция send и push остаются как в v7.4.0
</script>

</body>
</html>
