
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v5.3.0 Gold</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ: ФИКСАЦИЯ И СКРОЛЛ --- */
        header { height: 60px; display: flex; align-items: center; border-bottom: var(--border); background: #000; flex-shrink: 0; z-index: 1000; width: 100%; }
        
        .anchor-btn { width: 55px; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 1.5rem; cursor: pointer; text-decoration: none; flex-shrink: 0; border: none; background: transparent; }

        .scroll-area { flex-grow: 1; display: flex; align-items: center; gap: 12px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; }
        .scroll-area::-webkit-scrollbar { display: none; }

        .btn-item { height: 36px; border: var(--border); color: var(--gold); background: transparent; padding: 0 12px; font-weight: bold; white-space: nowrap; flex-shrink: 0; display: flex; align-items: center; font-size: 0.8rem; cursor: pointer; }

        /* ВИДЖЕТ GOOGLE */
        #google_translate_element { display: inline-block; flex-shrink: 0; }
        .goog-te-gadget-simple { background: transparent !important; border: var(--border) !important; padding: 5px !important; border-radius: 0 !important; }
        .goog-te-gadget-simple span { color: var(--gold) !important; }
        .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
        body { top: 0 !important; }

        .right-zone { display: flex; align-items: center; height: 100%; flex-shrink: 0; background: #000; }
        .logo { font-size: 0.8rem; font-weight: 900; padding: 0 10px; border-left: 1px solid #333; }

        /* --- ЧАТ-СТЕНА --- */
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-left: 2px solid var(--gold); font-size: 1.2rem; background: rgba(255, 215, 0, 0.03); }

        /* --- НИЖНЯЯ ПАНЕЛЬ --- */
        footer { height: 85px; display: flex; align-items: center; padding: 0 12px; gap: 10px; border-top: 1px solid #222; background: #000; }
        #user-in { flex-grow: 1; background: #000; border: var(--border); color: var(--gold); padding: 15px; outline: none; font-family: inherit; font-size: 1rem; }
        .btn-up { width: 50px; height: 50px; background: var(--gold); color: #000; border: none; font-size: 1.8rem; cursor: pointer; font-weight: 900; }
        .btn-arch { height: 50px; background: transparent; color: var(--gold); border: var(--border); padding: 0 15px; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="anchor-btn">«</a>
    <div class="scroll-area">
        <div id="google_translate_element"></div>
        <button class="btn-item" onclick="alert('Сборник пуст')">Сборник</button>
        <div class="btn-item">ID: 777</div>
        <div class="btn-item">AVATAR</div>
    </div>
    <div class="right-zone">
        <div class="logo">GY-GY</div>
        <button class="anchor-btn" onclick="window.history.forward()">»</button>
    </div>
</header>

<div id="chat-wall">
    <div class="msg">Тишина в Беври...</div>
</div>

<footer>
    <input type="text" id="user-in" placeholder="Четыре любых слова..." onkeypress="if(event.key==='Enter') send()">
    <button class="btn-up" onclick="send()">↑</button>
    <button class="btn-arch" onclick="alert('В архиве...')">В СБОРНИК</button>
</footer>

<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ru',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
    }

    function send() {
        const input = document.getElementById('user-in');
        if(input.value.trim()){
            const m = document.createElement('div');
            m.className = 'msg';
            m.innerText = input.value;
            document.getElementById('chat-wall').appendChild(m);
            input.value = "";
            document.getElementById('chat-wall').scrollTop = 99999;
        }
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
