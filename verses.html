<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY CLUB | VERSES v.2.8</title>
    <style>
        :root { --gold: #ffd700; --black: #000; --h-unit: 55px; }
        body { background: var(--black); color: var(--gold); font-family: monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 15px; border-bottom: 2px solid var(--gold); }
        .header-left { display: flex; gap: 10px; align-items: center; }
        .header-right { display: flex; justify-content: flex-end; }
        .ui-box { height: var(--h-unit); border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; padding: 0 15px; background: transparent; color: var(--gold); cursor: pointer; box-sizing: border-box; font-size: 18px; font-weight: bold; }
        .arrow { font-size: 32px; width: 60px; font-family: sans-serif; }
        .logo { font-size: 30px; font-weight: bold; letter-spacing: 6px; padding: 0 10px; }
        #wall { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .card { border: 1px solid #333; padding: 20px; background: #050505; max-width: 800px; margin: 0 auto; width: 95%; transition: 0.3s; }
        .card.loading { border-color: #555; opacity: 0.6; }
        .content { color: #fff; min-height: 80px; outline: none; margin-bottom: 15px; white-space: pre-line; font-size: 20px; }
        .remote { display: flex; gap: 20px; border-top: 1px solid #222; padding-top: 15px; font-size: 13px; }
        .remote-btn { cursor: pointer; color: #777; text-transform: uppercase; }
        .remote-btn:hover { color: var(--gold); }
        footer { padding: 15px; border-top: 1px solid #222; }
        .input-row { display: flex; gap: 10px; width: 100%; height: var(--h-unit); }
        input, select { background: #000; border: 1px solid var(--gold); color: #fff; padding: 0 15px; font-family: inherit; font-size: 18px; outline: none; }
        input { flex: 1; }
        select { width: 140px; }
        .btn-ok { width: 70px; font-size: 20px; background: rgba(255,215,0,0.1); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="ui-box arrow" onclick="location.href='ai_room_core_v8.html'">«</button>
        <div class="ui-box" style="border:none">RU</div>
        <div class="ui-box" style="width:55px; padding:0">ID</div>
        <button class="ui-box" onclick="setIdea()">GEN</button>
    </div>
    <div class="logo">GY-GY</div>
    <div class="header-right">
        <button class="ui-box arrow" onclick="location.href='clip.html'">»</button>
    </div>
</header>

<main id="wall">
    </main>

<footer>
    <div class="input-row">
        <select id="style">
            <option value="noir">НУАР</option>
            <option value="gygy">ГИ-ГИ</option>
            <option value="rock">ROCK</option>
        </select>
        <input type="text" id="words" placeholder="Темы для синтеза...">
        <button class="ui-box btn-ok" id="run-btn" onclick="askAI()">OK</button>
    </div>
</footer>

<script>
 window.addEventListener('message', (event) => {
        if (event.data.type === 'GY_RESULT') {
            finalizeCard(event.data.targetId, event.data.text);
            document.getElementById('run-btn').disabled = false;
        }
        if (event.data.type === 'IDEA_RESULT') {
            document.getElementById('words').value = event.data.text;
        }
    });

    async function askAI() {
        const input = document.getElementById('words');
        const style = document.getElementById('style').value;
        const wall = document.getElementById('wall');
        const btn = document.getElementById('run-btn');
        if (!input.value) return;

        const cardId = 'v' + Date.now();
        const card = document.createElement('div');
        card.className = 'card loading';
        card.id = cardId;
        card.innerHTML = `<div class="content">Синтезирую смыслы: ${input.value}...</div>`;
        wall.appendChild(card);
        wall.scrollTop = wall.scrollHeight;

        btn.disabled = true;
       // Пробуем докричаться до верхушки иерархии (top)
        const target = window.top; 
        target.postMessage({ type: 'GY_GENERATE', prompt: input.value, style: style, targetId: cardId }, '*');
        input.value = '';
    }

    function finalizeCard(id, text) {
        const card = document.getElementById(id);
        if (!card) return;
        card.classList.remove('loading');
        card.innerHTML = `
            <div class="content" contenteditable="true">${text}</div>
            <div class="remote">
                <span class="remote-btn" onclick="bridge('CLIP', '${id}')">🎬 CLIP</span>
                <span class="remote-btn" onclick="bridge('TG', '${id}')">✉ TG</span>
                <span class="remote-btn" onclick="bridge('ARCHIVE', '${id}')">🏛️ ARCH</span>
                <span class="remote-btn" onclick="this.closest('.card').remove()" style="color:#aa0000">❌ DEL</span>
            </div>`;
    }

    function setIdea() { window.parent.postMessage({ type: 'GET_AI_IDEA' }, '*'); } 
    function bridge(action, id) {
        const text = document.querySelector(`#${id} .content`).innerText;
        if(action === 'CLIP') { localStorage.setItem('currentVerse', text); location.href = 'clip.html'; }
    }
</script>

</body>
</html>
