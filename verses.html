
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY VERSES | v37.3.5 REBUILT</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* ВЕРХНИЙ УЗЕЛ (HEADER) */
        header { height: 70px; display: flex; align-items: center; border-bottom: var(--border); padding: 0 10px; gap: 10px; flex-shrink: 0; background: #000; }
        
        /* Кнопка ВОЗВРАТ (verses.html) */
        .btn-nav-back { width: 50px; height: 50px; border: var(--border); display: flex; align-items: center; justify-content: center; color: var(--gold); text-decoration: none; font-size: 2.2rem; font-weight: 900; background: rgba(255, 215, 0, 0.1); }
        
        .scroll-zone { flex-grow: 1; display: flex; align-items: center; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .scroll-zone::-webkit-scrollbar { display: none; }
        
        /* Кнопка СБОРНИК (Иконка 📁) */
        .icon-lib-link { width: 45px; height: 45px; border: var(--border); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1.6rem; color: var(--gold); background: rgba(255, 215, 0, 0.05); }
        
        .user-avatar-box { width: 45px; height: 45px; border: var(--border); border-radius: 50%; background-size: cover; background-position: center; flex-shrink: 0; }
        .user-id-tag { border: 1px solid #444; padding: 4px 8px; font-size: 0.65rem; font-weight: 900; color: #888; white-space: nowrap; }

        /* СТЕНА (ЧАТ) */
        #chat-wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 20px; background: #000; }
        .verse-item { border: 1px solid var(--gold); background: #050505; padding: 15px; position: relative; }
        .verse-content { font-size: 1.3rem; line-height: 1.5; color: #fff; margin: 10px 0; }
        .verse-actions { display: flex; gap: 12px; border-top: 1px solid #333; padding-top: 10px; }
        .action-btn { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; cursor: pointer; font-weight: 900; }

        /* НИЖНИЙ ПУЛЬТ (FOOTER) - ТРИ КНОПКИ + ВВОД */
        footer { height: 95px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: var(--border); background: #000; flex-shrink: 0; }
        
        /* 1. ЮМОР (▲) */
        .btn-humor-toggle { width: 55px; height: 55px; border: var(--border); background: #111; color: var(--gold); font-size: 1.8rem; cursor: pointer; }
        .humor-dropdown { display: none; position: absolute; bottom: 105px; left: 10px; background: #000; border: var(--border); flex-direction: column; z-index: 1000; box-shadow: 0 0 15px var(--gold); }
        .humor-dropdown button { background: none; border: none; color: var(--gold); padding: 15px 25px; text-align: left; cursor: pointer; border-bottom: 1px solid #222; font-weight: 900; }

        /* ПОЛЕ ВВОДА */
        #user-input-field { flex-grow: 1; background: #111; border: var(--border); color: var(--gold); padding: 15px; font-size: 1.1rem; outline: none; font-family: inherit; }

        /* 2. КНОПКА ОК */
        .btn-submit-ok { width: 70px; height: 55px; background: var(--gold); color: #000; border: none; font-weight: 900; font-size: 1.1rem; cursor: pointer; }

        /* 3. КНОПКА СОХРАНИТЬ (💾) */
        .btn-quick-save { width: 55px; height: 55px; border: var(--border); background: #111; color: var(--gold); font-size: 1.6rem; cursor: pointer; }

        #google_translate_element { height: 45px; border: 1px solid #333; display: flex; align-items: center; overflow: hidden; }
    </style>
</head>
<body>

<header>
    <a href="verses.html" class="btn-nav-back">«</a>
    
    <div class="scroll-zone">
        <div id="google_translate_element"></div>
        <a href="library.html" class="icon-lib-link">📁</a>
        <div id="avatar-render" class="user-avatar-box"></div>
        <div class="user-id-tag">ID: <span id="id-display">...</span></div>
    </div>
    
    <div style="font-weight: 900; letter-spacing: 1px; padding-left: 5px;">GY-GY</div>
</header>

<div id="chat-wall">
    <div class="verse-content" style="color: var(--gold); font-size: 1rem;">
        v37.3.5 | Все узлы зафиксированы вручную.
    </div>
</div>

<footer>
    <div style="position: relative;">
        <button class="btn-humor-toggle" onclick="toggleHumorMenu()">▲</button>
        <div id="humor-menu-list" class="humor-dropdown">
            <button onclick="selectHumor('Нуар')">НУАР</button>
            <button onclick="selectHumor('Сарказм')">САРКАЗМ</button>
            <button onclick="selectHumor('Цинизм')">ЦИНИЗМ</button>
        </div>
    </div>
    
    <input type="text" id="user-input-field" placeholder="..." onkeypress="if(event.key==='Enter') executeSend()">
    
    <button class="btn-submit-ok" onclick="executeSend()">ОК</button>
    
    <button class="btn-quick-save" onclick="alert('Записано в Сборник')">💾</button>
</footer>

<script>
    let activeHumor = "Нуар";

    // ИНИЦИАЛИЗАЦИЯ ПОЛЬЗОВАТЕЛЯ (АВАТАР + ID)
    function setupUser() {
        const randomId = Math.floor(Math.random() * 899) + 100;
        document.getElementById('id-display').innerText = randomId;
        document.getElementById('avatar-render').style.backgroundImage = `url('https://api.dicebear.com/7.x/pixel-art/svg?seed=${randomId}')`;
    }
    setupUser();

    function toggleHumorMenu() {
        const m = document.getElementById('humor-menu-list');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function selectHumor(h) {
        activeHumor = h;
        toggleHumorMenu();
    }

    async function aiProcess(text) {
        const wall = document.getElementById('chat-wall');
        const item = document.createElement('div');
        item.className = 'verse-item';
        item.innerHTML = `<div class="verse-content"><i>Сварка...</i></div>`;
        wall.appendChild(item);
        wall.scrollTop = wall.scrollHeight;

        // Прямой монолитный ключ
        const apiKey = "AIzaSyDLQrvoPx4AYyfSKD0BWvl3-zc2ROfCa-E";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Напиши 4-стишие. Тема: ${text}. Юмор: ${activeHumor}` }] }]
                })
            });
            const data = await response.json();
            if (data.candidates && data.candidates[0]) {
                const verseStr = data.candidates[0].content.parts[0].text;
                item.innerHTML = `
                    <div style="color:#666; font-size:0.7rem; text-transform:uppercase;">${text} | ${activeHumor}</div>
                    <div class="verse-content">${verseStr.replace(/\n/g, '<br>')}</div>
                    <div class="verse-actions">
                        <button class="action-btn" onclick="this.innerText='СОХРАНЕНО'">СОХРАНИТЬ</button>
                        <button class="action-btn" style="border-color:#ff4444; color:#ff4444;" onclick="this.parentElement.parentElement.remove()">УДАЛИТЬ</button>
                    </div>
                `;
            } else {
                item.innerHTML = "Ошибка: Стык API не сработал.";
            }
        } catch (e) {
            item.innerHTML = "Сбой сети.";
        }
        wall.scrollTop = wall.scrollHeight;
    }

    function executeSend() {
        const input = document.getElementById('user-input-field');
        if(input.value.trim()){
            aiProcess(input.value);
            input.value = "";
        }
    }

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
