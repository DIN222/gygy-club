<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | VERSES CONSOLE</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 1px solid #ffd700; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: var(--border); padding: 0 10px; flex-shrink: 0; background: #000; z-index: 1000; }
        .nav-fix { width: 45px; height: 45px; border: var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--gold); text-decoration: none; font-weight: 900; font-size: 1.4rem; }
        .logo-gy { font-size: 1.1rem; font-weight: 900; letter-spacing: 2px; }
        .lang-trigger { width: 40px; height: 40px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }

        /* WALL */
        #wall { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: #050505; }
        .v-card { border: 1px solid #333; background: #000; padding: 15px; border-left: 3px solid var(--gold); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .v-text { font-size: 1.25rem; color: #fff; outline: none; white-space: pre-wrap; margin: 10px 0; line-height: 1.4; }
        .v-ctrl { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; border-top: 1px solid #222; padding-top: 8px; }
        .v-btn { background: none; border: 1px solid #444; color: #888; padding: 10px; cursor: pointer; flex: 1; font-size: 1rem; }
        .v-btn.klip { border-color: var(--gold); color: var(--gold); font-weight: 900; }

        /* FOOTER */
        footer { height: 100px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-top: var(--border); background: #000; flex-shrink: 0; position: relative; }
        .style-section { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .style-label { font-size: 0.6rem; color: #666; letter-spacing: 1px; }
        
        .style-scroll-box { 
            width: 100px; height: 52px; border: var(--border); 
            background: #111; overflow-x: auto; overflow-y: hidden;
            display: flex; align-items: center; scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .style-scroll-box::-webkit-scrollbar { display: none; }
        .s-opt { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-size: 0.75rem; font-weight: 900; color: var(--gold); text-transform: uppercase; flex-shrink: 0; }

        #in { flex-grow: 1; height: 52px; background: #000; border: 1px solid #333; color: var(--gold); padding: 0 12px; font-size: 1rem; outline: none; }
        .btn-ok { height: 52px; padding: 0 20px; background: var(--gold); color: #000; border: none; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="nav-fix">❮</a>
    <div class="lang-trigger" onclick="openTranslate()">文<sub>A</sub></div>
    <div class="logo-gy">GY-GY</div>
    <a href="box_page.html" class="nav-fix">❯</a>
</header>

<div id="wall">
    <div id="status-msg" style="color: #444; font-size: 0.8rem; text-align: center;">Система GY-GY готова</div>
</div>

<footer>
    <div class="style-section">
        <div class="style-label">СТИЛИ</div>
        <div class="style-scroll-box" id="s-box" onscroll="updateStyle()">
            <div class="s-opt">§ БЫТ</div><div class="s-opt">ø АБСУРД</div>
            <div class="s-opt">† ПРОЖАРКА</div><div class="s-opt">¶ САТИРА</div>
            <div class="s-opt">🌫 НУАР</div><div class="s-opt">🎸 РОК</div>
            <div class="s-opt">⌛ КЛАССИКА</div><div class="s-opt">‡ ХЛЕСТКО</div>
        </div>
    </div>
    <input type="text" id="in" placeholder="4 слова..." onkeydown="if(event.key==='Enter') generate()">
    <button class="btn-ok" onclick="generate()">ОК</button>
</footer>

<div id="google_translate_element" style="display:none"></div>

<script>
   let currentStyle = "§ БЫТ"; // Убедись, что эта переменная объявлена в начале скрипта

    // Поддержка колесика мыши для выбора стиля
    const sBox = document.getElementById('s-box');
    if(sBox) {
        sBox.addEventListener('wheel', (e) => {
            e.preventDefault();
            sBox.scrollLeft += e.deltaY;
        });
    }

    function updateStyle() {
        const index = Math.round(sBox.scrollLeft / 100);
        const opts = sBox.querySelectorAll('.s-opt');
        if(opts[index]) currentStyle = opts[index].innerText;
    }

    async function generate() {
        if (typeof BEUVRY_CONFIG === 'undefined') {
            alert("config.js не найден!"); return;
        }

        const input = document.getElementById('in');
        const val = input.value.trim();
        if (!val) return;

        const wall = document.getElementById('wall');
        const cardId = "v-" + Date.now();
        const card = document.createElement('div');
        card.className = 'v-card';
        card.id = cardId;
        card.innerHTML = `<div class="v-text">Стиль: ${currentStyle}. Варка...</div>`;
        wall.appendChild(card);
        input.value = "";
        wall.scrollTop = wall.scrollHeight;

        try {
            const cleanKey = (BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2).replace(/[^a-zA-Z0-9_-]/g, "");
            const model = BEUVRY_CONFIG.MODELS_PRIORITY[0];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`;

            // Инструкция теперь учитывает глобальный язык Клуба для генерации
            const clubLang = localStorage.getItem('gy_lang') || 'ru';
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Напиши 4 строки юмористического стиха. Язык: ${clubLang}. Тема: ${val}. Стиль: ${currentStyle}. Только текст.` }] }]
                })
            });

            const data = await response.json();
            if (data.error) {
                card.innerHTML = `<div style="color:red">API Error: ${data.error.message}</div>`;
                return;
            }

            const verse = data.candidates[0].content.parts[0].text.trim();
            
            // СБОРКА КАРТОЧКИ С КНОПКОЙ 文A И СКРЫТЫМ ПОЛЕМ
            card.innerHTML = `
                <div style="font-size:0.6rem; color:#444;">#${val.split(' ').join(' #')} | ${currentStyle}</div>
                <div class="v-text" contenteditable="true">${verse}</div>
                
                <div id="trans-${cardId}" style="display:none; color:#888; font-size:0.9rem; border-top:1px dashed #333; padding-top:8px; margin-top:8px; font-style:italic;"></div>

                <div class="v-ctrl">
                    <button class="v-btn" onclick="saveTxt('${cardId}')" title="Копировать">💾</button>
                    <button class="v-btn" onclick="toggleTranslation('${cardId}')" title="Перевести">文A</button>
                    <button class="v-btn klip" onclick="toKlip('${cardId}')">🎬 KLIP</button>
                    <button class="v-btn" onclick="document.getElementById('${cardId}').remove()">🗑</button>
                </div>
            `;
        } catch (e) {
            card.innerHTML = `<div style="color:red">Сбой. Проверь Localhost.</div>`;
        }
        wall.scrollTop = wall.scrollHeight;
    }

    // НОВАЯ ФУНКЦИЯ УМНОГО ПЕРЕВОДА
    async function toggleTranslation(id) {
        const transDiv = document.getElementById(`trans-${id}`);
        const originalText = document.getElementById(id).querySelector('.v-text').innerText;
        const targetLang = localStorage.getItem('gy_lang') || 'en';

        if (transDiv.style.display === 'block') {
            transDiv.style.display = 'none';
            return;
        }

        if (transDiv.innerText === "") {
            transDiv.innerText = "...";
            transDiv.style.display = 'block';
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURI(originalText)}`);
                const data = await res.json();
                transDiv.innerHTML = `<span style="color:var(--gold)">🌍</span> ` + data[0].map(x => x[0]).join('');
            } catch (e) { transDiv.innerText = "Error translation"; }
        } else {
            transDiv.style.display = 'block';
        }
    }

    function saveTxt(id) {
        const t = document.getElementById(id).querySelector('.v-text').innerText;
        navigator.clipboard.writeText(t);
        alert("Текст скопирован!");
    }

    function toKlip(id) {
        const t = document.getElementById(id).querySelector('.v-text').innerText;
        localStorage.setItem('current_verse', t);
        location.href = 'klip_page.html';
    }
</script>

</body>
</html>
