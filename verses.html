<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GY-GY CLUB | VERSES v.1.2</title>
    <style>
        :root {
            --gold: #ffd700;
            --black: #000000;
            --gray: #222;
        }

        body {
            background-color: var(--black);
            color: var(--gold);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ v.1.2 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid var(--gold); /* Тонкая золотая линия раздела */
            background: var(--black);
        }

        .nav-section { display: flex; align-items: center; gap: 20px; }

        /* Общий стиль золотых рамок */
        .gold-border-btn {
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);
            padding: 5px 15px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .gold-border-btn:hover { opacity: 0.7; }

        .arrow-btn { width: 40px; height: 30px; font-size: 18px; }

        .avatar-frame {
            width: 40px;
            height: 40px;
            border: 1px solid var(--gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            color: var(--gold);
        }

        .lang-switch { font-size: 12px; color: var(--gold); cursor: pointer; }

        /* СТЕНА */
        #wall {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .verse-card {
            border: 1px solid var(--gray);
            padding: 20px;
            background: var(--black);
            max-width: 600px;
            align-self: center;
            width: 100%;
        }
        .verse-card:hover { border-color: var(--gold); }

        .verse-content { color: #fff; outline: none; white-space: pre-line; margin-bottom: 20px; }

        /* ПУЛЬТ КАРТОЧКИ */
        .card-tools { display: flex; gap: 20px; border-top: 1px solid var(--gray); padding-top: 10px; font-size: 11px; }
        .tool { cursor: pointer; color: #666; }
        .tool:hover { color: var(--gold); }

        /* НИЖНИЙ БЛОК */
        footer { padding: 30px; border-top: 1px solid var(--gray); }
        .input-row { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
        
        input, select {
            background: #000;
            border: 1px solid var(--gold);
            color: #fff;
            padding: 10px;
            font-family: inherit;
        }
        input { flex: 1; }

        .version-label { position: fixed; bottom: 5px; right: 10px; font-size: 10px; color: #333; }
    </style>
</head>
<body>

<header>
    <div class="nav-section">
        <button class="gold-border-btn arrow-btn" onclick="goBack()">⟵</button>
        <div class="lang-switch">RU | EN</div>
        <div class="avatar-frame">ID:01</div>
        <button class="gold-border-btn" onclick="getIdea()">ГЕНЕРАТОР ИДЕЙ</button>
    </div>

    <div class="logo-text">GY-GY</div>
    
    <div class="nav-section">
        <button class="gold-border-btn arrow-btn" onclick="goForward()">⟶</button>
    </div>
</header>

<div id="wall">
    <div class="verse-card">
        <div class="verse-content" contenteditable="true">v.1.2: Панель перестроена согласно Уставу. 
        Золото только в рамках. Ожидание 4-х слов...</div>
    </div>
</div>

<footer>
    <div class="input-row">
        <select id="style">
            <option>НУАР-ДЖАЗ</option>
            <option>ОПТИМИЗМ</option>
        </select>
        <input type="text" id="words" placeholder="Введите 4 слова">
        <button class="gold-border-btn" style="padding: 0 30px;" onclick="addVerse()">OK</button>
    </div>
</footer>

<div class="version-label">v.1.2</div>

<script>
    function addVerse() {
        const val = document.getElementById('words').value;
        if(!val) return;
        const wall = document.getElementById('wall');
        const card = document.createElement('div');
        card.className = 'verse-card';
        card.innerHTML = `
            <div class="verse-content" contenteditable="true">Вы ввели: ${val}\nИИ генерирует рифму...\nЗолото в рамках, стиль соблюден.</div>
            <div class="card-tools">
                <span class="tool">🎬 CLIP</span>
                <span class="tool">✈️ TG</span>
                <span class="tool">🏛️ ARCHIVE</span>
                <span class="tool" onclick="this.closest('.verse-card').remove()">❌ DEL</span>
            </div>
        `;
        wall.appendChild(card);
        document.getElementById('words').value = '';
        wall.scrollTop = wall.scrollHeight;
    }

    function getIdea() { document.getElementById('words').value = "Конь Бармен Джаз Ночь"; }
    function goBack() { alert('Возврат на уровень назад'); }
    function goForward() { alert('Переход на Лунную Базу'); }
</script>

</body>
</html>
