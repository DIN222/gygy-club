

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY VERSES | КУЗНИЦА v5.0</title>
    <style>
        :root {
            --orange-neon: #ff8c00;
            --neon-glow: 0 0 15px rgba(255, 140, 0, 0.8), 0 0 30px rgba(255, 69, 0, 0.5);
            --gold: #ffd700;
            --bg: #050505;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        /* --- ЗОЛОТАЯ ПАНЕЛЬ v5.0 --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 25px;
            box-sizing: border-box;
            border-bottom: 1px solid var(--gold);
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .nav-group { display: flex; align-items: center; gap: 20px; }
        
        .btn-nav {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            cursor: pointer;
            padding: 5px 12px;
            font-weight: bold;
            text-decoration: none;
        }

        .lang-trigger {
            cursor: pointer;
            color: var(--orange-neon);
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: var(--neon-glow);
        }

        /* --- РАБОЧАЯ ЗОНА --- */
        .main-stage {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* Экранизация стиха */
        #poem-monitor {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid #222;
            padding: 30px;
            overflow-y: auto;
            color: var(--gold);
            font-size: 1.5rem;
            line-height: 1.4;
            box-shadow: inset 0 0 50px #000;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        /* Поле ввода как в чате Беври */
        .input-area {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            background: #000;
            border: 1px solid var(--orange-neon);
            color: var(--orange-neon);
            padding: 15px;
            font-family: inherit;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            box-shadow: inset 0 0 10px rgba(255, 140, 0, 0.1);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 15px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        #add-stanza { background: var(--orange-neon); color: #000; }
        #open-audio { background: #222; color: var(--gold); border: 1px solid var(--gold); }

        /* СКРЫТЫЙ GOOGLE */
        .goog-te-banner-frame, #goog-gt-tt { display: none !important; }
        body { top: 0 !important; }
        #google_translate_element { display: none; }
        select.goog-te-combo {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            z-index: 10000; background: #000 !important; color: var(--gold) !important;
            border: 2px solid var(--orange-neon) !important; padding: 10px;
        }
    </style>
</head>
<body>

<header>
    <div class="nav-group">
        <a href="index.html" class="btn-nav">« К ТЕЛЕВИЗОРАМ</a>
        <div class="lang-trigger" onclick="changeLang()">文A</div>
    </div>
    <div style="color: var(--gold); letter-spacing: 5px; font-weight: bold;">GY-GY v5.0</div>
    <button class="btn-nav" onclick="location.reload()">↺</button>
</header>

<div class="main-stage">
    <div id="poem-monitor">
        Айсберг дно приехал кот,<br>
        Кресло помнит тех, кто не вернулся...
    </div>

    <div class="input-area">
        <textarea id="poem-input" placeholder="Следующий виток абсурда..."></textarea>
        <div class="controls">
            <button id="add-stanza" class="btn-action" onclick="pushText()">В ПЕЧАТЬ</button>
            <button id="open-audio" class="btn-action" onclick="toggleAudioMenu()">ОЗВУЧИТЬ →</button>
        </div>
    </div>
</div>

<div id="google_translate_element"></div>

<script>
    // 1. ЛОГИКА ТЕКСТА
    function pushText() {
        const input = document.getElementById('poem-input');
        const monitor = document.getElementById('poem-monitor');
        if(input.value.trim() !== "") {
            // Плавное добавление новой строки
            const newLine = document.createElement('div');
            newLine.style.opacity = '0';
            newLine.style.transition = '1s';
            newLine.innerHTML = input.value;
            monitor.appendChild(newLine);
            setTimeout(() => newLine.style.opacity = '1', 10);
            
            input.value = "";
            monitor.scrollTop = monitor.scrollHeight;
        }
    }

    // 2. ПОДГОТОВКА К АУДИО (СЛЕДУЮЩИЙ ШАГ)
    function toggleAudioMenu() {
        alert("Переходим к этапу ОЗВУЧКИ: Голос ИИ или Микрофон?");
        // Здесь мы развернем меню выбора вокала в следующем обновлении
    }

    // 3. ТВОЙ ГУГЛ-ПЕРЕВОДЧИК
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'ru', autoDisplay: false}, 'google_translate_element');
    }

    function changeLang() {
        var select = document.querySelector('select.goog-te-combo');
        if (select) {
            select.style.display = (select.style.display === 'block') ? 'none' : 'block';
            select.focus();
        }
    }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
