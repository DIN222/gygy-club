
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GY-GY | v6.7.0 TOTAL JOKE</title>
    <script src="config.js"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000; --border: 2px solid #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--gold); font-family: 'Courier New', monospace; display: flex; flex-direction: column; overflow: hidden; }
        
        /* ХЕДЕР - ТЕПЕРЬ ТОЧНО С КНОПКАМИ */
        header { height: 70px; display: flex; align-items: center; border-bottom: var(--border); background: #111; padding: 0 15px; box-sizing: border-box; justify-content: space-between; position: sticky; top: 0; z-index: 9999; }
        .nav-btn { width: 50px; height: 50px; border: var(--border); color: var(--gold); background: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 900; font-size: 0.8rem; box-shadow: 3px 3px 0 var(--gold); }
        .nav-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .logo-center { font-weight: 900; font-size: 1.6rem; letter-spacing: 6px; position: absolute; left: 50%; transform: translateX(-50%); text-shadow: 2px 2px 0 #ff0000; }
        
        #wall { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 25px; background: radial-gradient(circle, #111 0%, #000 100%); }
        
        .bubble { padding: 18px; max-width: 80%; font-size: 1.1rem; border: 1px solid #333; position: relative; animation: slide 0.3s ease-out; }
        @keyframes slide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .u-msg { align-self: flex-start; border-left: 4px solid var(--gold); background: rgba(255,215,0,0.05); color: #fff; }
        .a-msg { align-self: flex-end; border-right: 4px solid #fff; background: rgba(255,255,255,0.05); text-align: right; }

        /* МЕНЮ ДЕЙСТВИЙ (ТРИ ТОЧКИ) */
        .opt-trigger { cursor: pointer; font-size: 1.8rem; margin-top: 10px; color: var(--gold); display: inline-block; padding: 0 10px; }
        .opt-menu { display: none; position: absolute; right: 0; top: 100%; background: #ffd700; color: #000; z-index: 10000; width: 180px; font-weight: bold; border: 2px solid #fff; }
        .opt-menu div { padding: 12px; border-bottom: 1px solid #000; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; }
        .opt-menu div:hover { background: #000; color: #ffd700; }

        footer { height: 100px; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-top: var(--border); background: #111; }
        #in { flex-grow: 1; background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 18px; outline: none; font-size: 1.1rem; }
        .btn-send { width: 65px; height: 65px; background: var(--gold); border: none; font-size: 2.5rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <a href="ai_room_core_v8.html" class="nav-btn">EXIT</a>
    <div class="logo-center">GY-GY</div>
    <div style="display:flex; gap:10px;">
        <div class="nav-btn" onclick="alert('BOX: Тут твои шедевры. Пока спим.')">BOX</div>
        <div class="nav-btn">RU</div>
    </div>
</header>

<div id="wall">
    <div class="bubble u-msg">Система v6.7.0. Юмор: 100%. <br>Давай свои слова, попробуй меня рассмешить.</div>
</div>

<footer>
    <input type="text" id="in" placeholder="Пиши сюда, не стесняйся..." autocomplete="off">
    <button id="go" class="btn-send">↑</button>
</footer>

<script>
    const MODELS = ['gemini-3.1-flash-lite-preview', 'gemini-2.5-flash-lite', 'gemini-2.0-flash'];
    const wall = document.getElementById('wall');
    const input = document.getElementById('in');
    const btn = document.getElementById('go');

    async function callAI(text) {
        const key = (typeof BEUVRY_CONFIG !== 'undefined' ? BEUVRY_CONFIG.PART_1 + BEUVRY_CONFIG.PART_2 : "");
        const funnyPrompt = "Ты — циничный нуарный поэт-юморист. Юзер дает 4 слова. Твоя задача: высмеять ситуацию, вставить иронию, но сохранить рифму. Никакого пафоса про 'бесконечную мглу', только стеб над штампами.";
        
        for (let m of MODELS) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${key}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: funnyPrompt + "\nСлова юзера: " + text }] }] })
                });
                const d = await r.json();
                if (d.candidates) return d.candidates[0].content.parts[0].text;
            } catch (e) {}
        }
        return "Модели ушли на перекур. Постучись позже.";
    }

    function pushMsg(txt, isAi) {
        const d = document.createElement('div');
        d.className = `bubble ${isAi ? 'a-msg' : 'u-msg'}`;
        d.innerHTML = txt.replace(/\n/g, '<br>');
        
        if (isAi) {
            const wrap = document.createElement('div');
            wrap.style.textAlign = 'right';
            wrap.innerHTML = `<span class="opt-trigger">⋮</span>
                <div class="opt-menu">
                    <div onclick="alert('В BOX!')">★ В СБОРНИК</div>
                    <div onclick="alert('СХЕМА: Кадр 1 - Крупно лицо. Кадр 2 - Бегство. Кадр 3 - Титры.')">🎬 СДЕЛАТЬ КЛИП</div>
                    <div onclick="navigator.clipboard.writeText(\`${txt}\`);alert('Ок!')">🔗 ПЕРЕСЛАТЬ</div>
                    <div onclick="this.closest('.bubble').remove()" style="color:red">✖ УДАЛИТЬ НАФИГ</div>
                </div>`;
            wrap.querySelector('.opt-trigger').onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.opt-menu').forEach(m => m.style.display='none');
                wrap.querySelector('.opt-menu').style.display='block';
            };
            d.appendChild(wrap);
        }
        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }

    btn.onclick = async () => {
        const val = input.value.trim(); if(!val) return;
        btn.disabled = true; pushMsg(val, false); input.value = "";
        const res = await callAI(val);
        pushMsg(res, true); btn.disabled = false;
    };

    input.onkeypress = (e) => { if(e.key==='Enter') btn.onclick(); };
    document.onclick = () => document.querySelectorAll('.opt-menu').forEach(m => m.style.display='none');
</script>
</body>
</html>
